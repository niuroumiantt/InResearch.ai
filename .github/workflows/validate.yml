name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 口径与数据校验
        run: python3 pipeline/validate.py --strict
      - name: 核验队列可生成
        run: python3 pipeline/verify.py
      - name: 指标回填可运行
        run: python3 pipeline/refresh_indicators.py
      - name: Research registry and continuous reader contracts
        run: |
          python3 pipeline/research.py
          python3 -m unittest discover -s pipeline -p "test_*.py"
