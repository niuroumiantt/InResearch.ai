name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 现行规则与在册文件检查
        run: python3 manage.py governance --check
      - name: 口径与数据校验
        run: python3 manage.py validate --strict
      - name: Visual model identity and adoption contract
        run: python3 manage.py asset-check
      - name: 核验队列可生成
        run: python3 manage.py verify
      - name: 指标回填可运行
        run: python3 manage.py indicators
      - name: Research registry and continuous reader contracts
        run: |
          python3 manage.py registry
          PYTHONPATH=src python3 -m unittest discover -s tests/unit -p "test_*.py"
  browser:
    strategy:
      fail-fast: false
      matrix:
        suites: [core_a, core_b, core_c, server_assembly, rack_assembly, rack_exploded, scene_atlas, campus_overview:views, campus_overview:geometry, campus_overview:navigation, campus_overview:lifecycle, campus_exploded:views, campus_exploded:geometry, campus_exploded:navigation, campus_exploded:lifecycle, model_assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-package-lock --no-save playwright@1.62.1 pngjs@7.0.0
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full browser regression suite
        run: NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules" node tests/run_browser.cjs ${{ matrix.suites }}
  browser-core:
    name: browser (core)
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All complete core shards and model asset suite succeeded
        run: test "${{ needs.browser.result }}" = success
  storage-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Immutable research and persistent runtime across release replacement
        run: python3 tests/container_storage.py
