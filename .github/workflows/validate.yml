name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 现行规则与在册文件检查
        run: python3 pipeline/governance.py --check
      - name: 口径与数据校验
        run: python3 pipeline/validate.py --strict
      - name: 核验队列可生成
        run: python3 pipeline/verify.py
      - name: 指标回填可运行
        run: python3 pipeline/refresh_indicators.py
      - name: Research registry and continuous reader contracts
        run: |
          python3 pipeline/research.py
          python3 -m unittest discover -s pipeline -p "test_*.py"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full browser regression suite
        run: NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules" node tests/run_browser.cjs
