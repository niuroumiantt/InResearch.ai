name: Verify data center publication

on:
  push:
    branches: [main]
    paths:
      - web/pages/research/data-centers-2026.html
      - web/pages/research/data-centers-2026-us.html
      - web/pages/research/data-centers-2026-sea.html
      - web/pages/research/data-centers-2026-cn.html
      - web/pages/research/data-centers-2026-projects.html
      - web/pages/report.html
      - docs/research/2026-10-11/data-centers/project-ledger.json
      - docs/research/2026-10-11/data-centers/chart-data.json
      - scripts/verify_data_center_publication.py
      - .github/workflows/verify-data-center-publication.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-data-center-publication-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify public HTTP and checkout bytes
        run: python3 scripts/verify_data_center_publication.py
