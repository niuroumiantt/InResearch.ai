name: Verify data center publication

on:
  push:
    branches: [main]
    paths:
      - web/pages/research/data-centers-2026.html
      - web/pages/research/data-centers-2026-us.html
      - web/pages/research/data-centers-2026-sea.html
      - web/pages/research/data-centers-2026-cn.html
      - web/pages/research/data-centers-2026-projects.html
      - web/pages/report.html
      - web/components/datacenter-research-ledger.js
      - web/routes.json
      - src/inresearch/interfaces/public.py
      - docs/research/2026-10-11/data-centers/project-ledger.json
      - docs/research/2026-10-11/data-centers/chart-data.json
      - scripts/verify_data_center_publication.py
      - .github/workflows/verify-data-center-publication.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-data-center-publication-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(github.repository == 'niuroumiantt/InResearch.ai' && toJSON(github.event.repository.private) == 'true' && vars.SPARK_CI_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && toJSON(github.event.pull_request.head.repo.fork) == 'false')) && '["self-hosted","Linux","ARM64","spark-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 11
    steps:
      - name: Authorize the dedicated Spark repository before checkout
        if: runner.environment == 'self-hosted'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 /usr/local/lib/ci-prefetch.py --authorize-only
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify public HTTP and checkout bytes
        run: python3 scripts/verify_data_center_publication.py
