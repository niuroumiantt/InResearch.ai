<svg xmlns="http://www.w3.org/2000/svg" width="640" height="970" viewBox="0 0 640 970"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="970" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">有些计算可以等一等，实时业务要继续</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">负荷灵活性，需要工作负载和合同一起落实</text><text x="22" y="140" font-size="27" fill="#07517c" font-weight="700" text-anchor="start">系统紧张时段</text><rect x="22" y="163" width="596" height="133" rx="10" fill="#f0f5fa" stroke="none"/><text x="42" y="209" font-size="27" fill="#07517c" font-weight="700" text-anchor="start">实时服务</text><text x="42" y="258" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">保留必要供电与运行能力</text><rect x="22" y="323" width="260" height="127" rx="10" fill="#fff5e3" stroke="none"/><text x="42" y="365" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">可延后的计算任务</text><text x="42" y="401" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">安排到其他时段</text><path d="M286,384 L332,384" stroke="#07517c" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="344" y="323" width="274" height="127" rx="10" fill="#eaf5ef" stroke="none"/><text x="364" y="365" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">高峰之后</text><text x="364" y="401" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">再执行部分任务</text><text x="22" y="508" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">Google公布的合作：I&amp;M、TVA</text><text x="22" y="547" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">调整部分机器学习工作负载参与需求响应</text><text x="22" y="586" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">能下调多久、通知多久、怎样恢复，</text><text x="22" y="625" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">都要在调度与运行中落实。</text><rect x="22" y="704" width="596" height="188" rx="10" fill="#edf7f3" stroke="none"/><text x="42" y="747" font-size="27" fill="#0d8074" font-weight="700" text-anchor="start">Georgia Power / OpenAI合同</text><text x="42" y="791" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">3200MW新增需求安排</text><text x="42" y="828" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">最高1000MW灵活需求响应承诺</text><text x="42" y="865" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">合同与承诺，不是实测运行曲线</text><text x="22" y="942" font-size="16" fill="#547083" font-weight="400" text-anchor="start">来源：Google 2025-08-04；Georgia Power 2026-08-26</text></g></svg>