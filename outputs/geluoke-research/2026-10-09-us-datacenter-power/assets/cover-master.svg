<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200"><rect width="100%" height="100%" fill="#0B1F3A"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="44" y="64" font-size="23" fill="#E0B45C" font-weight="700">格洛可  GE LUO KE</text><text x="604" y="64" font-size="18" fill="#b7cedf" font-weight="400">2026.10.09</text><text x="44" y="135" font-size="55" fill="white" font-weight="400">美国数据中心</text><text x="44" y="205" font-size="55" fill="white" font-weight="400">的电力现状</text><text x="44" y="282" font-size="30" fill="#E0B45C" font-weight="700">缺口在哪里，谁来补，谁付钱</text><text x="44" y="326" font-size="20" fill="#bdd9ee" font-weight="400">需求 → 地区瓶颈 → 项目 → 合同 → 电源 → 布局</text><rect x="44" y="361" width="712" height="269" rx="12" fill="#132d48" stroke="#318ca1"/><rect x="73" y="408" width="161" height="133" rx="12" fill="#183d5b" stroke="#4dbbd1"/><text x="91" y="445" font-size="27" fill="white" font-weight="700">电源</text><text x="85" y="482" font-size="17" fill="#cde5f4" font-weight="400">电量 / 可靠容量</text><path d="M237,465 L313,465" stroke="#E0B45C" stroke-width="3" fill="none"/><rect x="319" y="408" width="161" height="133" rx="12" fill="#183d5b" stroke="#4dbbd1"/><text x="337" y="445" font-size="27" fill="white" font-weight="700">电网</text><text x="331" y="482" font-size="17" fill="#cde5f4" font-weight="400">输电 / 接入服务</text><path d="M483,465 L559,465" stroke="#E0B45C" stroke-width="3" fill="none"/><rect x="565" y="408" width="161" height="133" rx="12" fill="#183d5b" stroke="#4dbbd1"/><text x="583" y="445" font-size="27" fill="white" font-weight="700">园区</text><text x="577" y="482" font-size="17" fill="#cde5f4" font-weight="400">总负荷 / IT</text><text x="70" y="584" font-size="21" fill="#cde5f4" font-weight="400">工程示意｜资源、网络和负荷必须在同一时间表兑现</text><rect x="44" y="661" width="224" height="105" rx="12" fill="#132d48" stroke="#318ca1"/><text x="57" y="695" font-size="25" fill="#E0B45C" font-weight="700">01  底图与需求</text><text x="57" y="736" font-size="18" fill="white" font-weight="400">三大互联与用电增长</text><rect x="288" y="661" width="224" height="105" rx="12" fill="#132d48" stroke="#318ca1"/><text x="301" y="695" font-size="25" fill="#E0B45C" font-weight="700">02  地区瓶颈</text><text x="301" y="736" font-size="18" fill="white" font-weight="400">缺口落实到接入点</text><rect x="532" y="661" width="224" height="105" rx="12" fill="#132d48" stroke="#318ca1"/><text x="545" y="695" font-size="25" fill="#E0B45C" font-weight="700">03  项目真实性</text><text x="545" y="736" font-size="18" fill="white" font-weight="400">申请与投运分开看</text><rect x="44" y="787" width="224" height="105" rx="12" fill="#132d48" stroke="#318ca1"/><text x="57" y="821" font-size="25" fill="#E0B45C" font-weight="700">04  谁来付钱</text><text x="57" y="862" font-size="18" fill="white" font-weight="400">长期义务与最低付款</text><rect x="288" y="787" width="224" height="105" rx="12" fill="#132d48" stroke="#318ca1"/><text x="301" y="821" font-size="25" fill="#E0B45C" font-weight="700">05  供电路线</text><text x="301" y="862" font-size="18" fill="white" font-weight="400">核电、燃气、风光储</text><rect x="532" y="787" width="224" height="105" rx="12" fill="#132d48" stroke="#318ca1"/><text x="545" y="821" font-size="25" fill="#E0B45C" font-weight="700">06  布局变化</text><text x="545" y="862" font-size="18" fill="white" font-weight="400">电价之外看交付</text><rect x="44" y="936" width="712" height="116" rx="12" fill="#173c52" stroke="#318ca1"/><text x="65" y="976" font-size="29" fill="white" font-weight="700">真正稀缺的，是能按期交付的可靠电力</text><text x="65" y="1018" font-size="23" fill="#bdd9ee" font-weight="400">年度能源 · 峰值容量 · 地方接入 · 成本责任</text><text x="44" y="1101" font-size="20" fill="#bdd9ee" font-weight="400">研究截至2026年10月9日｜六章专题与溯源材料</text><text x="44" y="1150" font-size="23" fill="#E0B45C" font-weight="700">格洛可  ·  算力基础设施研究</text></g></svg>