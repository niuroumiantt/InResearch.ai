<svg xmlns="http://www.w3.org/2000/svg" width="640" height="879" viewBox="0 0 640 879"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="879" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">客户成本会怎样变，要看地区与合同</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">两种不同情景，不能拼成一个全国结论</text><rect x="22" y="125" width="596" height="268" rx="10" fill="#fff4ec" stroke="none"/><text x="42" y="167" font-size="28" fill="#b77916" font-weight="700" text-anchor="start">弗吉尼亚 · JLARC情景研究</text><text x="42" y="226" font-size="42" fill="#b77916" font-weight="700" text-anchor="start">+14—37 美元 / 月</text><text x="42" y="276" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">到2040年，典型Dominion居民客户</text><text x="42" y="311" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">发电与输电相关月成本增量，不变价</text><text x="42" y="346" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">2024年研究估计，并非现时账单涨幅</text><rect x="22" y="420" width="596" height="268" rx="10" fill="#eef7f3" stroke="none"/><text x="42" y="463" font-size="27" fill="#0d8074" font-weight="700" text-anchor="start">佐治亚 · Georgia Power公司预测</text><text x="42" y="522" font-size="42" fill="#0d8074" font-weight="700" text-anchor="start">约9.5 亿美元 / 年</text><text x="42" y="572" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">预计从2029年起，客户整体节省</text><text x="42" y="607" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">大负荷客户组合口径，非单一项目</text><text x="42" y="642" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">2026年公司测算，并非已实现收益</text><text x="22" y="745" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">决定分摊结果的是新增支出、客户收入、</text><text x="22" y="779" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">合同履约与剩余风险，不能只看项目大小。</text><text x="22" y="850" font-size="16" fill="#547083" font-weight="400" text-anchor="start">来源：JLARC 2024报告；Georgia Power 2026-08公告</text></g></svg>