<svg xmlns="http://www.w3.org/2000/svg" width="640" height="908" viewBox="0 0 640 908"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="908" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">电网开始筛选“什么时候真用电”</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">PJM预测与ERCOT接入研究的两种做法</text><rect x="22" y="122" width="596" height="320" rx="10" fill="#f0f7f4" stroke="none"/><text x="42" y="160" font-size="29" fill="#0d8074" font-weight="700" text-anchor="start">PJM：把确定性写入预测</text><text x="42" y="205" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">2026版近期预测</text><text x="42" y="247" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">要求较明确的服务义务或建设承诺</text><text x="42" y="289" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">远期项目承诺较弱时，提高折减</text><text x="42" y="331" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">2032年前预测低于2025版</text><text x="42" y="373" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">还包含电动车、经济因素与负荷调整</text><rect x="22" y="467" width="596" height="320" rx="10" fill="#f0f5fa" stroke="none"/><text x="42" y="505" font-size="29" fill="#07517c" font-weight="700" text-anchor="start">ERCOT：多个大项目一起研究</text><text x="42" y="550" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">2026年6月公布Batch Zero</text><text x="42" y="592" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">符合资格的75MW及以上大负荷</text><text x="42" y="634" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">按共同基准研究相互影响和输电需求</text><text x="42" y="676" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">首批最终输电计划：预计2027年秋季</text><text x="42" y="718" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">研究完成后仍有工程与送电环节</text><text x="22" y="833" font-size="24" fill="#b77916" font-weight="700" text-anchor="start">预测下调≠实际用电下降；研究计划≠已送电。</text><text x="22" y="880" font-size="16" fill="#547083" font-weight="400" text-anchor="start">来源：PJM 2026负荷报告第6页；ERCOT 2026-06-18公告</text></g></svg>