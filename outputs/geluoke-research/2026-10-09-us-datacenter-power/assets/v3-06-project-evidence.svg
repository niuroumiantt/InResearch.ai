<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1038" viewBox="0 0 640 1038"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="1038" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">公告容量，怎样走到电表上的负荷</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">每往前一步，需要不同的可核实证据</text><circle cx="40" cy="145" r="15" fill="#07517c"/><text x="40" y="151" font-size="19" fill="white" font-weight="700" text-anchor="middle">1</text><text x="76" y="152" font-size="28" fill="#07517c" font-weight="700" text-anchor="start">接入意向</text><text x="76" y="189" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">地点、规模、申请主体</text><text x="76" y="223" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">开发意向还可能变化</text><path d="M40,165 L40,247" stroke="#97afbe" stroke-width="2" fill="none" stroke-dasharray="6 5"/><circle cx="40" cy="290" r="15" fill="#07517c"/><text x="40" y="296" font-size="19" fill="white" font-weight="700" text-anchor="middle">2</text><text x="76" y="297" font-size="28" fill="#07517c" font-weight="700" text-anchor="start">系统研究</text><text x="76" y="334" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">接入点、网络影响、扩建范围</text><text x="76" y="368" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">说明为接入需要做哪些工程</text><path d="M40,310 L40,392" stroke="#97afbe" stroke-width="2" fill="none" stroke-dasharray="6 5"/><circle cx="40" cy="435" r="15" fill="#07517c"/><text x="40" y="441" font-size="19" fill="white" font-weight="700" text-anchor="middle">3</text><text x="76" y="442" font-size="28" fill="#07517c" font-weight="700" text-anchor="start">有约束的合同</text><text x="76" y="479" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">分期容量、最低付款、担保</text><text x="76" y="513" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">看客户愿意承担哪些义务</text><path d="M40,455 L40,537" stroke="#97afbe" stroke-width="2" fill="none" stroke-dasharray="6 5"/><circle cx="40" cy="580" r="15" fill="#07517c"/><text x="40" y="586" font-size="19" fill="white" font-weight="700" text-anchor="middle">4</text><text x="76" y="587" font-size="28" fill="#07517c" font-weight="700" text-anchor="start">建设与调试</text><text x="76" y="624" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">设备到货、施工、验收</text><text x="76" y="658" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">工程进展不等同实际负荷</text><path d="M40,600 L40,682" stroke="#97afbe" stroke-width="2" fill="none" stroke-dasharray="6 5"/><circle cx="40" cy="725" r="15" fill="#07517c"/><text x="40" y="731" font-size="19" fill="white" font-weight="700" text-anchor="middle">5</text><text x="76" y="732" font-size="28" fill="#07517c" font-weight="700" text-anchor="start">送电与运行</text><text x="76" y="769" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">首期送电、实际峰值、后续爬坡</text><text x="76" y="803" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">最终看电表和持续业务</text><rect x="22" y="874" width="596" height="91" rx="10" fill="#fff6e6" stroke="none"/><text x="38" y="908" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">申请MW、合同MW、设施MW、IT MW</text><text x="38" y="942" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">记录的是不同对象，不能直接相加。</text><text x="22" y="1011" font-size="16" fill="#547083" font-weight="400" text-anchor="start">来源：PJM与ERCOT流程；作者整理，非全国统一法定程序</text></g></svg>