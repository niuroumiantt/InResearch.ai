<svg xmlns="http://www.w3.org/2000/svg" width="640" height="848" viewBox="0 0 640 848"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="848" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">全年绿电匹配，与每小时有电不同</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">年度能源、时段出力、储能时长分别安排</text><text x="22" y="137" font-size="29" fill="#0d8074" font-weight="700" text-anchor="start">年度采购账</text><rect x="22" y="158" width="282" height="108" rx="10" fill="#e7f3ee" stroke="none"/><text x="42" y="194" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">全年采购绿电量</text><text x="42" y="229" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">按合同进行年度匹配</text><text x="320" y="224" font-size="42" fill="#0d8074" font-weight="700" text-anchor="middle">≈</text><rect x="336" y="158" width="282" height="108" rx="10" fill="#f0f5fa" stroke="none"/><text x="354" y="194" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">全年用电量</text><text x="354" y="229" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">不告诉你哪一小时缺电</text><text x="22" y="334" font-size="29" fill="#07517c" font-weight="700" text-anchor="start">运行时段账</text><text x="22" y="373" font-size="23" fill="#547083" font-weight="400" text-anchor="start">下图是原理示意，不是实测出力曲线。</text><rect x="45" y="415" width="145" height="147" rx="10" fill="#e9eff6" stroke="none"/><rect x="190" y="415" width="260" height="147" rx="10" fill="#fff4d9" stroke="none"/><rect x="450" y="415" width="145" height="147" rx="10" fill="#e9eff6" stroke="none"/><path d="M45,530 L595,530" stroke="#8aa4b5" stroke-width="2" fill="none"/><path d="M45,525 Q180,525 200,500 Q320,345 440,500 Q460,525 595,525" fill="none" stroke="#d99138" stroke-width="5"/><path d="M45,465 L595,465" stroke="#07517c" stroke-width="4" fill="none"/><text x="67" y="590" font-size="25" fill="#07517c" font-weight="700" text-anchor="start">夜间</text><text x="298" y="590" font-size="25" fill="#b77916" font-weight="700" text-anchor="start">白天</text><text x="490" y="590" font-size="25" fill="#07517c" font-weight="700" text-anchor="start">夜间</text><text x="22" y="645" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">蓝线：持续用电需求；橙线：太阳能出力示意</text><text x="22" y="684" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">低出力时段要由其他电源、电网或储能补齐</text><text x="22" y="723" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">储能MW看功率，MWh看能量，两者缺一不可</text><text x="22" y="820" font-size="16" fill="#547083" font-weight="400" text-anchor="start">机制依据：IEA 2026报告、NERC；未给出特定项目实测值</text></g></svg>