<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="38" font-size="28" fill="#0B1F3A" font-weight="700">01  三大互联，不等于七家公司</text><text x="24" y="72" font-size="18" fill="#19354c" font-weight="400">物理层 → 市场调度层 → 园区合同层</text><text x="24" y="116" font-size="23" fill="#0B1F3A" font-weight="700">① 物理层：各互联内部同步</text><rect x="24" y="135" width="172" height="116" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="36" y="170" font-size="23" fill="#0B1F3A" font-weight="700">西部互联</text><text x="36" y="208" font-size="17" fill="#19354c" font-weight="400">与加拿大相连</text><rect x="234" y="135" width="172" height="116" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="246" y="170" font-size="23" fill="#0B1F3A" font-weight="700">东部互联</text><text x="246" y="208" font-size="17" fill="#19354c" font-weight="400">与加拿大相连</text><rect x="444" y="135" width="172" height="116" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="456" y="170" font-size="23" fill="#0B1F3A" font-weight="700">ERCOT互联</text><text x="456" y="208" font-size="17" fill="#19354c" font-weight="400">得州大部分地区</text><text x="24" y="290" font-size="23" fill="#19354c" font-weight="400">互联之间存在有限直流联络</text><text x="24" y="324" font-size="23" fill="#19354c" font-weight="400">不能把全国富余电力随意调到园区</text><path d="M310,315 L310,347" stroke="#3987e5" stroke-width="3" fill="none"/><text x="24" y="390" font-size="23" fill="#0B1F3A" font-weight="700">② 市场与调度层：七家RTO/ISO</text><rect x="24" y="410" width="592" height="118" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="444" font-size="21" fill="#19354c" font-weight="400">PJM · MISO · SPP · CAISO</text><text x="42" y="476" font-size="21" fill="#19354c" font-weight="400">NYISO · ISO-NE · ERCOT</text><text x="42" y="508" font-size="21" fill="#19354c" font-weight="400">FERC大负荷改革针对其管辖的六家</text><path d="M310,540 L310,569" stroke="#3987e5" stroke-width="3" fill="none"/><text x="24" y="608" font-size="23" fill="#0B1F3A" font-weight="700">③ 园区合同层：电力公司与客户</text><rect x="24" y="628" width="592" height="115" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="664" font-size="23" fill="#19354c" font-weight="400">接入点 · 扩建费用 · 交付日期</text><text x="42" y="698" font-size="23" fill="#19354c" font-weight="400">服务等级 · 最低付款 · 信用担保</text><text x="24" y="780" font-size="16" fill="#19354c" font-weight="400">工程示意，非精确地理边界。</text><text x="24" y="806" font-size="16" fill="#19354c" font-weight="400">来源：EIA电力输送说明；FERC RTO/ISO页面</text><text x="24" y="832" font-size="16" fill="#19354c" font-weight="400">制度状态截至2026-10-09。</text></g></svg>