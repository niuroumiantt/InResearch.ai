<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="950" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">两地都是85%，收的却不是同一笔钱</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">固定网络/容量付款，与实际电能费分开</text><rect x="22" y="125" width="596" height="305" rx="10" fill="#f2f6f8" stroke="none"/><text x="42" y="164" font-size="27" fill="#07517c" font-weight="700" text-anchor="start">弗吉尼亚 Dominion / GS-5</text><text x="42" y="218" font-size="30" fill="#07517c" font-weight="700" text-anchor="start">85% 输电与配电成本</text><rect x="42" y="238" width="408.0" height="20" rx="3" fill="#07517c" stroke="none"/><rect x="450.0" y="238" width="72.0" height="20" rx="0" fill="#dae4e9" stroke="none"/><text x="42" y="299" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">每月最低承担比例，与实际用电量无关</text><text x="42" y="332" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">新合同：2027-01-01起，至少14年义务</text><text x="42" y="365" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">2016年前已开始服务者有豁免</text><text x="42" y="398" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">信用不足新客户：担保最高60%最低费用</text><rect x="22" y="460" width="596" height="305" rx="10" fill="#f2f6f8" stroke="none"/><text x="42" y="499" font-size="27" fill="#0d8074" font-weight="700" text-anchor="start">俄亥俄 AEP Ohio</text><text x="42" y="553" font-size="30" fill="#0d8074" font-weight="700" text-anchor="start">85% 合同容量相关付款</text><rect x="42" y="573" width="408.0" height="20" rx="3" fill="#0d8074" stroke="none"/><rect x="450.0" y="573" width="72.0" height="20" rx="0" fill="#dae4e9" stroke="none"/><text x="42" y="634" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">新大型数据中心的最低付款义务</text><text x="42" y="667" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">期限最长12年</text><text x="42" y="700" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">2025-07-09决定；行业在同年11月上诉</text><text x="22" y="822" font-size="26" fill="#b77916" font-weight="700" text-anchor="start">85%不是“85%的未使用电量”。</text><text x="22" y="858" font-size="26" fill="#b77916" font-weight="700" text-anchor="start">条款保护的是为客户预留的网络/容量费用。</text><text x="22" y="923" font-size="16" fill="#547083" font-weight="400" text-anchor="start">来源：SCC 2026-02-24说明第2页；Ohio Consumers’ Counsel</text></g></svg>