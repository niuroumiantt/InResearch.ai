<svg xmlns="http://www.w3.org/2000/svg" width="640" height="891" viewBox="0 0 640 891"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="38" font-size="28" fill="#0B1F3A" font-weight="700">04  同样85%，两地收费对象不同</text><text x="24" y="72" font-size="18" fill="#19354c" font-weight="400">大型客户规则｜合同义务与适用条件一起看</text><rect x="24" y="111" width="592" height="274" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="149" font-size="25" fill="#0B1F3A" font-weight="700">弗吉尼亚 · Dominion / GS-5</text><text x="42" y="193" font-size="22" fill="#19354c" font-weight="400">新客户：最低14年服务与付款义务</text><text x="42" y="229" font-size="22" fill="#19354c" font-weight="400">适用于2027-01-01及以后签约</text><text x="42" y="265" font-size="22" fill="#19354c" font-weight="400">最低85%：每月输电与配电成本</text><text x="42" y="301" font-size="22" fill="#19354c" font-weight="400">2016年前已开始服务客户有豁免</text><text x="42" y="337" font-size="22" fill="#19354c" font-weight="400">信用不足：担保最高60%最低费用</text><rect x="24" y="410" width="592" height="205" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="452" font-size="25" fill="#0B1F3A" font-weight="700">俄亥俄 · AEP Ohio</text><text x="42" y="495" font-size="22" fill="#19354c" font-weight="400">新大型数据中心：至少85%合同容量</text><text x="42" y="531" font-size="22" fill="#19354c" font-weight="400">相关付款义务；期限最长12年</text><text x="42" y="567" font-size="22" fill="#19354c" font-weight="400">2025-07-09决定；行业后续提起上诉</text><rect x="24" y="646" width="592" height="111" rx="12" fill="#fff7e6" stroke="#ead4a5"/><text x="42" y="682" font-size="23" fill="#19354c" font-weight="400">最低网络/容量付款</text><text x="42" y="716" font-size="23" fill="#19354c" font-weight="400">不能改写成85%未使用电能费</text><text x="24" y="800" font-size="16" fill="#19354c" font-weight="400">来源：Virginia SCC 2026-02-24说明PDF第2页；</text><text x="24" y="826" font-size="16" fill="#19354c" font-weight="400">Ohio Consumers’ Counsel案件24-0508页面。</text><text x="24" y="852" font-size="16" fill="#19354c" font-weight="400">适用客户、豁免及诉讼状态以原规则为准。</text></g></svg>