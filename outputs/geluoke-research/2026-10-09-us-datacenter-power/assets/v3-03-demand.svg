<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="840" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">需求已经增长，未来仍是一个区间</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">美国数据中心全年用电量｜TWh</text><text x="22" y="163" font-size="26" fill="#18364a" font-weight="400" text-anchor="start">2014</text><rect x="150" y="140" width="41.56666666666667" height="32" rx="4" fill="#3e83ba" stroke="none"/><text x="198.56666666666666" y="166" font-size="26" fill="#07517c" font-weight="700" text-anchor="start">58</text><text x="150" y="205" font-size="23" fill="#547083" font-weight="400" text-anchor="start">历史估算</text><text x="22" y="258" font-size="26" fill="#18364a" font-weight="400" text-anchor="start">2023</text><rect x="150" y="235" width="126.13333333333334" height="32" rx="4" fill="#3e83ba" stroke="none"/><text x="283.1333333333333" y="261" font-size="26" fill="#07517c" font-weight="700" text-anchor="start">176</text><text x="150" y="300" font-size="23" fill="#547083" font-weight="400" text-anchor="start">历史估算</text><rect x="22" y="335" width="596" height="223" rx="10" fill="#fff6e6" stroke="none"/><text x="40" y="375" font-size="29" fill="#b77916" font-weight="700" text-anchor="start">2028预测：325—580 TWh</text><rect x="150" y="408" width="232.91666666666666" height="38" rx="4" fill="#d99138" stroke="none"/><rect x="382.91666666666663" y="408" width="182.75" height="38" rx="0" fill="#f1d4a5" stroke="none"/><text x="150" y="483" font-size="25" fill="#b77916" font-weight="700" text-anchor="start">325</text><text x="565.6666666666667" y="483" font-size="25" fill="#b77916" font-weight="700" text-anchor="end">580</text><text x="40" y="531" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">该预测在2024年提出，不是2026年实测。</text><path d="M150,594 L580,594" stroke="#839cae" stroke-width="2" fill="none"/><text x="150.0" y="625" font-size="21" fill="#547083" font-weight="400" text-anchor="middle">0</text><text x="293.33333333333337" y="625" font-size="21" fill="#547083" font-weight="400" text-anchor="middle">200</text><text x="436.6666666666667" y="625" font-size="21" fill="#547083" font-weight="400" text-anchor="middle">400</text><text x="580.0" y="625" font-size="21" fill="#547083" font-weight="400" text-anchor="middle">600</text><text x="22" y="676" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">2023：约占美国总用电量4.4%</text><text x="22" y="713" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">2028预测：约占6.7%—12%</text><text x="22" y="750" font-size="25" fill="#18364a" font-weight="400" text-anchor="start">年度电量TWh与园区接入功率MW分开看。</text><text x="22" y="813" font-size="16" fill="#547083" font-weight="400" text-anchor="start">来源：LBNL 2024报告，PDF第6—7页；柱长从零起算</text></g></svg>