<svg xmlns="http://www.w3.org/2000/svg" width="640" height="997" viewBox="0 0 640 997"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="38" font-size="28" fill="#0B1F3A" font-weight="700">03  申请怎样变成真实负荷</text><text x="24" y="72" font-size="18" fill="#19354c" font-weight="400">证据门槛示意｜没有虚构项目数量与通过率</text><rect x="24" y="112" width="592" height="98" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="146" font-size="25" fill="#0B1F3A" font-weight="700">01  位置与接入意向</text><text x="42" y="185" font-size="21" fill="#19354c" font-weight="400">位置、规模、申请主体；仍可能变化</text><path d="M310,215 L310,234" stroke="#3987e5" stroke-width="3" fill="none"/><rect x="24" y="239" width="592" height="98" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="273" font-size="25" fill="#0B1F3A" font-weight="700">02  系统研究与供电条件</text><text x="42" y="312" font-size="21" fill="#19354c" font-weight="400">接入点、网络影响、扩建范围</text><path d="M310,342 L310,361" stroke="#3987e5" stroke-width="3" fill="none"/><rect x="24" y="366" width="592" height="98" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="400" font-size="25" fill="#0B1F3A" font-weight="700">03  具有约束力的合同</text><text x="42" y="439" font-size="21" fill="#19354c" font-weight="400">期限、最低付款、担保、分期容量</text><path d="M310,469 L310,488" stroke="#3987e5" stroke-width="3" fill="none"/><rect x="24" y="493" width="592" height="98" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="527" font-size="25" fill="#0B1F3A" font-weight="700">04  工程与设备</text><text x="42" y="566" font-size="21" fill="#19354c" font-weight="400">许可、订单、施工、调试里程碑</text><path d="M310,596 L310,615" stroke="#3987e5" stroke-width="3" fill="none"/><rect x="24" y="620" width="592" height="98" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="654" font-size="25" fill="#0B1F3A" font-weight="700">05  送电与真实负荷</text><text x="42" y="693" font-size="21" fill="#19354c" font-weight="400">首期送电、实际峰值、后续爬坡</text><rect x="24" y="775" width="592" height="117" rx="12" fill="#fff7e6" stroke="#ead4a5"/><text x="42" y="812" font-size="24" fill="#19354c" font-weight="400">申请MW ≠ 合同MW ≠ 投运MW</text><text x="42" y="846" font-size="24" fill="#19354c" font-weight="400">设施总功率与IT功率分别登记</text><text x="24" y="930" font-size="16" fill="#19354c" font-weight="400">来源：PJM 2026负荷报告PDF第6页；ERCOT</text><text x="24" y="956" font-size="16" fill="#19354c" font-weight="400">2026-06-18公告。作者整理，非统一法定流程。</text></g></svg>