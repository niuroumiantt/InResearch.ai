<svg xmlns="http://www.w3.org/2000/svg" width="640" height="825" viewBox="0 0 640 825"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#07517c"/></marker></defs><rect width="640" height="825" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="22" y="42" font-size="31" fill="#07517c" font-weight="700" text-anchor="start">三大互联之下，谁管哪件事</text><text x="22" y="82" font-size="23" fill="#547083" font-weight="400" text-anchor="start">数据中心接电，要找对三个不同层次</text><rect x="22" y="125" width="596" height="158" rx="10" fill="#f1f6f8" stroke="none"/><rect x="22" y="125" width="8" height="158" rx="0" fill="#07517c" stroke="none"/><text x="43" y="162" font-size="28" fill="#07517c" font-weight="700" text-anchor="start">物理互联</text><text x="43" y="199" font-size="25" fill="#18364a" font-weight="700" text-anchor="start">东部 / 西部 / ERCOT</text><text x="43" y="235" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">规定电力能在什么网络中流动</text><text x="43" y="266" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">跨系统交换受联络设备限制</text><path d="M320,289 L320,303" stroke="#07517c" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="22" y="310" width="596" height="158" rx="10" fill="#f1f6f8" stroke="none"/><rect x="22" y="310" width="8" height="158" rx="0" fill="#0d8074" stroke="none"/><text x="43" y="347" font-size="28" fill="#0d8074" font-weight="700" text-anchor="start">区域调度与市场</text><text x="43" y="384" font-size="25" fill="#18364a" font-weight="700" text-anchor="start">七家RTO/ISO</text><text x="43" y="420" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">PJM、MISO、SPP、CAISO</text><text x="43" y="451" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">NYISO、ISO-NE、ERCOT</text><path d="M320,474 L320,488" stroke="#07517c" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="22" y="505" width="596" height="158" rx="10" fill="#f1f6f8" stroke="none"/><rect x="22" y="505" width="8" height="158" rx="0" fill="#b77916" stroke="none"/><text x="43" y="542" font-size="28" fill="#b77916" font-weight="700" text-anchor="start">客户供电合同</text><text x="43" y="579" font-size="25" fill="#18364a" font-weight="700" text-anchor="start">电力公司 ↔ 数据中心</text><text x="43" y="615" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">接入点、扩建工程、交付日期</text><text x="43" y="646" font-size="23" fill="#18364a" font-weight="400" text-anchor="start">最低付款、服务等级、信用担保</text><text x="22" y="710" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">RTO/ISO负责调度或市场，不是七家包办</text><text x="22" y="744" font-size="24" fill="#18364a" font-weight="400" text-anchor="start">发电、输电、配电、零售的垄断电力公司。</text><text x="22" y="797" font-size="16" fill="#547083" font-weight="400" text-anchor="start">来源：EIA；FERC RTO/ISO介绍与大负荷改革资料</text></g></svg>