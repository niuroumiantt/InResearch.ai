<svg xmlns="http://www.w3.org/2000/svg" width="640" height="945" viewBox="0 0 640 945"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="38" font-size="28" fill="#0B1F3A" font-weight="700">供电路线，要看补哪一段缺口</text><text x="24" y="72" font-size="18" fill="#19354c" font-weight="400">合同、电量、接入、备用分别判断</text><rect x="24" y="116" width="592" height="117" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="150" font-size="26" fill="#0B1F3A" font-weight="700">公共电网</text><text x="42" y="188" font-size="22" fill="#19354c" font-weight="400">共享电源和备用</text><text x="42" y="219" font-size="20" fill="#19354c" font-weight="400">仍要落实本地接入与服务</text><rect x="24" y="256" width="592" height="117" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="290" font-size="26" fill="#0B1F3A" font-weight="700">既有核电PPA</text><text x="42" y="328" font-size="22" fill="#19354c" font-weight="400">安排长期电能与容量</text><text x="42" y="359" font-size="20" fill="#19354c" font-weight="400">合同规模不等于新增电厂</text><rect x="24" y="396" width="592" height="117" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="430" font-size="26" fill="#0B1F3A" font-weight="700">停运核电重启</text><text x="42" y="468" font-size="22" fill="#19354c" font-weight="400">有机会增加实际供给</text><text x="42" y="499" font-size="20" fill="#19354c" font-weight="400">恢复、监管与投运分阶段</text><rect x="24" y="536" width="592" height="117" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="570" font-size="26" fill="#0B1F3A" font-weight="700">现场燃气发电</text><text x="42" y="608" font-size="22" fill="#19354c" font-weight="400">改变园区供电路径</text><text x="42" y="639" font-size="20" fill="#19354c" font-weight="400">设备、燃料、冗余与许可</text><rect x="24" y="676" width="592" height="117" rx="12" fill="#eef5fc" stroke="#cfdeec"/><text x="42" y="710" font-size="26" fill="#0B1F3A" font-weight="700">风光 + 储能</text><text x="42" y="748" font-size="22" fill="#19354c" font-weight="400">增加电量与部分时段资源</text><text x="42" y="779" font-size="20" fill="#19354c" font-weight="400">年度匹配不等于全天可靠</text><text x="24" y="855" font-size="16" fill="#19354c" font-weight="400">来源：IEA 2026报告第6—7章；Talen交易材料</text><text x="24" y="881" font-size="16" fill="#19354c" font-weight="400">第4页；Constellation 2025-09-23公告。</text><text x="24" y="907" font-size="16" fill="#19354c" font-weight="400">工程机制对照，未给出通用造价或施工周期。</text></g></svg>