<svg xmlns="http://www.w3.org/2000/svg" width="640" height="659" viewBox="0 0 640 659" font-family='"Noto Sans SC","WenQuanYi Zen Hei",sans-serif'>
<rect width="640" height="659" fill="#0B1F3A"/>
<rect x="24" y="26" width="5" height="78" fill="#E0B45C"/>
<text x="42" y="52" font-size="28" font-weight="700" fill="#F4F6FA">3.21万亿美元从哪里来</text>
<text x="42" y="78" font-size="18" fill="#9FB3CC">摩根士丹利估算2026–2028年数据中心资本开支需求的资金来源，亿</text><text x="42" y="100" font-size="18" fill="#9FB3CC">美元</text>
<text x="24" y="160" font-size="18" fill="#F4F6FA">合计 <tspan font-weight="700">32,100</tspan> 亿美元（约3.21万亿）</text>
<rect x="24.0" y="170" width="269.3" height="34" fill="#E0B45C"/>
<text x="158.6" y="193" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">股权资本 14,600</text>
<rect x="293.3" y="170" width="322.7" height="34" fill="#3987e5"/>
<text x="454.6" y="193" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">信贷市场 17,500</text>
<text x="24" y="238" font-size="18" fill="#F4F6FA">信贷市场 17,500 亿美元的构成</text>
<text x="162" y="271" font-size="18" fill="#F4F6FA" text-anchor="end">私募信贷</text>
<rect x="174" y="252" width="337.1" height="24" rx="3" fill="#3987e5"/>
<text x="519.1" y="270" font-size="19" font-weight="700" fill="#F4F6FA">7,000</text>
<text x="174" y="292" font-size="15" fill="#9FB3CC">其中资产支持融资约5,000、投资级私募约2,000</text>
<text x="162" y="326" font-size="18" fill="#F4F6FA" text-anchor="end">投资级公司债</text>
<rect x="174" y="307" width="313.0" height="24" rx="3" fill="#3987e5"/>
<text x="495.0" y="325" font-size="19" font-weight="700" fill="#F4F6FA">6,500</text>
<text x="174" y="347" font-size="15" fill="#9FB3CC">超大规模厂商约6,000、非超大规模约500</text>
<text x="162" y="381" font-size="18" fill="#F4F6FA" text-anchor="end">ABS／CMBS</text>
<rect x="174" y="362" width="96.3" height="24" rx="3" fill="#3987e5"/>
<text x="278.3" y="380" font-size="19" font-weight="700" fill="#F4F6FA">2,000</text>
<text x="162" y="417" font-size="18" fill="#F4F6FA" text-anchor="end">高收益债</text>
<rect x="174" y="398" width="72.2" height="24" rx="3" fill="#3987e5"/>
<text x="254.2" y="416" font-size="19" font-weight="700" fill="#F4F6FA">1,500</text>
<text x="162" y="453" font-size="18" fill="#F4F6FA" text-anchor="end">银行贷款</text>
<rect x="174" y="434" width="24.1" height="24" rx="3" fill="#3987e5"/>
<text x="206.1" y="452" font-size="19" font-weight="700" fill="#F4F6FA">500</text>
<text x="24" y="492" font-size="16" fill="#9FB3CC">对照：四大超大规模厂商经营现金流 2026／2027／2028 年为 7,390／9,820／</text>
<text x="24" y="513" font-size="16" fill="#9FB3CC">12,310 亿美元，同期新增举债 2,380／2,000／900 亿美元（摩根士丹利估</text>
<text x="24" y="534" font-size="16" fill="#9FB3CC">算）。</text>
<text x="24" y="561" font-size="16" fill="#9FB3CC">高盛投行（2026年6月）：2025年AI相关债券发行约1,210亿美元，占美国投资级市</text>
<text x="24" y="582" font-size="16" fill="#9FB3CC">场6.6%，2026年或升至20%；私募信贷管理资产超过2.1万亿美元。</text>
<line x1="24" y1="589" x2="616" y2="589" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="611" font-size="16" fill="#9FB3CC">摩根士丹利2026年9月《AI指南》第55、60页（原始单位十亿美元）；高盛投行</text><text x="24" y="631" font-size="16" fill="#9FB3CC">2026年6月报告第24页；均为预测估算</text>
<text x="616" y="611" font-size="16" fill="#9FB3CC" text-anchor="end"></text>
