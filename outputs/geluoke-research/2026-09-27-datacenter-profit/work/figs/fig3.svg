<text x="40" y="178" font-size="21" font-weight="700" fill="#F4F6FA">TeraWulf–Anthropic · 肯塔基 · 401MW/20年</text>
<text x="40" y="211" font-size="18" fill="#F4F6FA">合同约190亿美元 → 约237万美元/MW·年</text>
<text x="40" y="237" font-size="18" fill="#F4F6FA">承租人 Anthropic，另有两个5年续约选项；2026-07-06公告</text>
<rect x="24" y="272.65" width="592" height="140" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="286.65" width="5" height="26" fill="#3987e5"/>
<text x="40" y="307" font-size="21" font-weight="700" fill="#F4F6FA">Riot–前沿AI实验室 · Rockdale · 191MW/20年</text>
<text x="40" y="340" font-size="18" fill="#F4F6FA">合同约91亿美元 → 约238万美元/MW·年</text>
<text x="40" y="365" font-size="18" fill="#F4F6FA">租户未具名（彭博称Anthropic）；公司预期NOI利润率80–90%；</text>
<text x="40" y="390" font-size="18" fill="#F4F6FA">2026-08-10</text>
