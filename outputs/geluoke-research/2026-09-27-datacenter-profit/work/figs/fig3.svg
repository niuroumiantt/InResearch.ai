<rect x="24" y="440.5" width="5" height="26" fill="#199e70"/>
<text x="40" y="460" font-size="21" font-weight="700" fill="#F4F6FA">TeraWulf–Fluidstack合资 · Abernathy · 168MW/25年</text>
