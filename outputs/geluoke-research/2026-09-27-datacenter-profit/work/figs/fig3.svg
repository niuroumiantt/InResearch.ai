<text x="42" y="78" font-size="18" fill="#9FB3CC">按关键IT负载换算的年租金（作者说明性计算：合同总额÷年限÷MW，名</text><text x="42" y="100" font-size="18" fill="#9FB3CC">义值未折现，未剔除递增与分期交付）</text>
