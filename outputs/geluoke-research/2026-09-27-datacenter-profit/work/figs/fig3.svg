<text x="40" y="776" font-size="18" fill="#F4F6FA">合同约98亿美元 → 约186万美元/MW·年</text>
<text x="40" y="802" font-size="18" fill="#F4F6FA">每份98亿美元、年递增3%；公司预期稳定后年均NOI 6.55亿；租户未</text>
<text x="40" y="827" font-size="18" fill="#F4F6FA">具名；2026-05-06、07-20公告</text>
<rect x="24" y="862.85" width="592" height="115" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="876.85" width="5" height="26" fill="#199e70"/>
<text x="40" y="897" font-size="21" font-weight="700" fill="#F4F6FA">Hut 8–Fluidstack · River Bend · 245MW/15年</text>
<text x="40" y="930" font-size="18" fill="#F4F6FA">合同约70亿美元 → 约190万美元/MW·年</text>
<text x="40" y="955" font-size="18" fill="#F4F6FA">Anthropic为最终用户；谷歌backstop金额未披露；2025-10-01</text>
<rect x="24" y="991.5" width="592" height="140" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="1005.5" width="5" height="26" fill="#d95926"/>
<text x="40" y="1025" font-size="21" font-weight="700" fill="#F4F6FA">Cipher–AWS · Black Pearl · 216MW/15年</text>
<text x="40" y="1059" font-size="18" fill="#F4F6FA">合同约55亿美元 → 约170万美元/MW·年</text>
<text x="40" y="1084" font-size="18" fill="#F4F6FA">亚马逊母公司无条件担保；开发成本上限950万美元/IT MW；2026年</text>
<text x="40" y="1109" font-size="18" fill="#F4F6FA">8月起租</text>
<rect x="24" y="1145.35" width="592" height="140" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="1159.35" width="5" height="26" fill="#d95926"/>
<text x="40" y="1179" font-size="21" font-weight="700" fill="#F4F6FA">Core Scientific–CoreWeave · 多站点 · 590MW/12年</text>
<text x="40" y="1213" font-size="18" fill="#F4F6FA">合同约102亿美元 → 约144万美元/MW·年</text>
<text x="40" y="1238" font-size="18" fill="#F4F6FA">合同102亿美元；承租人CoreWeave（新云）；出租人只建带电核心与</text>
<text x="40" y="1263" font-size="18" fill="#F4F6FA">外壳，其余资本开支由租户承担</text>
<text x="24" y="1319" font-size="17" fill="#9FB3CC">对照：摩根士丹利2026年9月按“15年租期、15%资本开支收益率、每瓦15美元</text>
<text x="24" y="1341" font-size="17" fill="#9FB3CC">权益价值”框架为壳层公司估值（预测估算）；Digital Realty在建项目预期</text>
<text x="24" y="1363" font-size="17" fill="#9FB3CC">稳定现金收益率11.5%（2026Q2披露）。</text>
<line x1="24" y1="1381.1999999999998" x2="616" y2="1381.1999999999998" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="1403.1999999999998" font-size="16" fill="#9FB3CC">各公司新闻稿与SEC 8-K（2024-06至2026-09），站点均在美国；颜色：蓝=AI实</text><text x="24" y="1423.1999999999998" font-size="16" fill="#9FB3CC">验室直租，绿=Fluidstack转租+谷歌backstop，橙=超大规模云/新云直租，黄=租</text><text x="24" y="1443.1999999999998" font-size="16" fill="#9FB3CC">户未具名</text>
