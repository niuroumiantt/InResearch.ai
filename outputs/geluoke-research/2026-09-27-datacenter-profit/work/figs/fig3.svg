<text x="40" y="519" font-size="18" fill="#F4F6FA">谷歌为Fluidstack租约提供13亿美元backstop；2025-10-28</text>
<rect x="24" y="555.15" width="592" height="140" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="569.15" width="5" height="26" fill="#199e70"/>
<text x="40" y="589" font-size="21" font-weight="700" fill="#F4F6FA">Cipher–Fluidstack · Barber Lake · 207MW/20年</text>
<text x="40" y="622" font-size="18" fill="#F4F6FA">合同约90亿美元 → 约217万美元/MW·年</text>
<text x="40" y="648" font-size="18" fill="#F4F6FA">10年38亿→2026-09-25延至20年、90亿美元以上（MW未重述）；谷歌</text>
<text x="40" y="673" font-size="18" fill="#F4F6FA">backstop 17.3亿针对原10年租约</text>
<rect x="24" y="709.0" width="592" height="140" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="723.0" width="5" height="26" fill="#c98500"/>
