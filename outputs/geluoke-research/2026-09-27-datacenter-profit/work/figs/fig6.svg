<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1355" viewBox="0 0 640 1355" font-family='"Noto Sans SC","WenQuanYi Zen Hei",sans-serif'>
<rect width="640" height="1355" fill="#0B1F3A"/>
<rect x="24" y="26" width="5" height="78" fill="#E0B45C"/>
<text x="42" y="52" font-size="28" font-weight="700" fill="#F4F6FA">同一张账本，两组参数：美国与中国</text>
<text x="42" y="78" font-size="18" fill="#9FB3CC">单位经济对照，以2026年二季度为主，含2024–2025年披露值；各格标</text><text x="42" y="100" font-size="18" fill="#9FB3CC">注口径，金额未做汇率换算</text>
<text x="284.5" y="162" font-size="20" font-weight="700" fill="#3987e5" text-anchor="middle">美国（海外）</text>
<text x="515.5" y="162" font-size="20" font-weight="700" fill="#d95926" text-anchor="middle">中国</text>
<line x1="24" y1="174" x2="616" y2="174" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="206" font-size="18" font-weight="700" fill="#F4F6FA">每MW造价（壳+</text>
<text x="24" y="229" font-size="18" font-weight="700" fill="#F4F6FA">机电）</text>
<rect x="174" y="182" width="221" height="150" rx="4" fill="rgba(57,135,229,0.10)"/>
<rect x="405" y="182" width="221" height="150" rx="4" fill="rgba(217,89,38,0.10)"/>
<text x="182" y="206" font-size="17" fill="#F4F6FA">950–1,440万美元/MW：</text>
<text x="182" y="229" font-size="17" fill="#F4F6FA">Cipher–AWS开发成本上限</text>
<text x="182" y="252" font-size="17" fill="#F4F6FA">950万；Riot示意</text>
<text x="182" y="275" font-size="17" fill="#F4F6FA">1,100–1,200万；</text>
<text x="182" y="298" font-size="17" fill="#F4F6FA">Digital Realty在建项目</text>
<text x="182" y="321" font-size="17" fill="#F4F6FA">约1,440万（2026Q2）</text>
<text x="413" y="206" font-size="17" fill="#F4F6FA">约2,000万元/MW：万国数</text>
<text x="413" y="229" font-size="17" fill="#F4F6FA">据2026Q2电话会口径，在</text>
<text x="413" y="252" font-size="17" fill="#F4F6FA">建新产能平均资本开支</text>
<text x="174" y="346" font-size="14" fill="#9FB3CC">均不含GPU等IT设备；摩根士丹利含IT的1GW GB300账本为3,900万</text>
<text x="174" y="366" font-size="14" fill="#9FB3CC">美元/MW</text>
<line x1="24" y1="376" x2="616" y2="376" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="408" font-size="18" font-weight="700" fill="#F4F6FA">到户电价</text>
<rect x="174" y="384" width="221" height="150" rx="4" fill="rgba(57,135,229,0.10)"/>
<rect x="405" y="384" width="221" height="150" rx="4" fill="rgba(217,89,38,0.10)"/>
<text x="182" y="408" font-size="17" fill="#F4F6FA">工业电价 得州7.07、弗吉</text>
<text x="182" y="431" font-size="17" fill="#F4F6FA">尼亚10.07、俄亥俄10.95</text>
<text x="182" y="454" font-size="17" fill="#F4F6FA">美分/kWh（EIA 2026年</text>
<text x="182" y="477" font-size="17" fill="#F4F6FA">7月初步值）</text>
<text x="413" y="408" font-size="17" fill="#F4F6FA">西部枢纽0.32–0.36</text>
<text x="413" y="431" font-size="17" fill="#F4F6FA">元/kWh（和林格尔到户交</text>
<text x="413" y="454" font-size="17" fill="#F4F6FA">易价、中卫市政府口径、乌</text>
<text x="413" y="477" font-size="17" fill="#F4F6FA">兰察布企业口述）；华东华</text>
<text x="413" y="500" font-size="17" fill="#F4F6FA">南0.6–0.9元（阿里云高管</text>
<text x="413" y="523" font-size="17" fill="#F4F6FA">口述）</text>
<text x="174" y="548" font-size="14" fill="#9FB3CC">1GW、PUE 1.2下年用电约105亿kWh：每1美分/kWh≈1.05亿美元/年</text>
<text x="174" y="568" font-size="14" fill="#9FB3CC">（作者说明性计算）</text>
<line x1="24" y1="578" x2="616" y2="578" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="610" font-size="18" font-weight="700" fill="#F4F6FA">利用情况</text>
<rect x="174" y="586" width="221" height="104" rx="4" fill="rgba(57,135,229,0.10)"/>
<rect x="405" y="586" width="221" height="104" rx="4" fill="rgba(217,89,38,0.10)"/>
<text x="182" y="610" font-size="17" fill="#F4F6FA">八大市场空置率1.4%，北</text>
<text x="182" y="633" font-size="17" fill="#F4F6FA">弗吉尼亚0.24%（CBRE</text>
<text x="182" y="656" font-size="17" fill="#F4F6FA">2026年上半年）</text>
<text x="413" y="610" font-size="17" fill="#F4F6FA">算力设施整体上架率71.4%</text>
<text x="413" y="633" font-size="17" fill="#F4F6FA">（工信部，2026年6月</text>
<text x="413" y="656" font-size="17" fill="#F4F6FA">底）；仅7省智算中心上架</text>
<text x="413" y="679" font-size="17" fill="#F4F6FA">率超75%（信通院）</text>
<text x="174" y="704" font-size="14" fill="#9FB3CC">空置率与上架率互为镜像但口径不同：前者按可租面积，后者按机架</text>
<line x1="24" y1="714" x2="616" y2="714" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="746" font-size="18" font-weight="700" fill="#F4F6FA">EBITDA利润率</text>
<rect x="174" y="722" width="221" height="104" rx="4" fill="rgba(57,135,229,0.10)"/>
<rect x="405" y="722" width="221" height="104" rx="4" fill="rgba(217,89,38,0.10)"/>
<text x="182" y="746" font-size="17" fill="#F4F6FA">CoreWeave 2026Q2调整后</text>
<text x="182" y="769" font-size="17" fill="#F4F6FA">59%；Equinix 53%；</text>
<text x="182" y="792" font-size="17" fill="#F4F6FA">Digital Realty在建项目</text>
<text x="182" y="815" font-size="17" fill="#F4F6FA">预期稳定现金收益率11.5%</text>
<text x="413" y="746" font-size="17" fill="#F4F6FA">万国数据2026Q2调整后</text>
<text x="413" y="769" font-size="17" fill="#F4F6FA">45.5%（上年47.3%）；世</text>
<text x="413" y="792" font-size="17" fill="#F4F6FA">纪互联33.0%；万国在手订</text>
<text x="413" y="815" font-size="17" fill="#F4F6FA">单每MW EBITDA约220万元</text>
<text x="174" y="840" font-size="14" fill="#9FB3CC">新云与托管/批发的利润率口径不同，只作同层对照</text>
<line x1="24" y1="850" x2="616" y2="850" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="882" font-size="18" font-weight="700" fill="#F4F6FA">合同期限</text>
<rect x="174" y="858" width="221" height="104" rx="4" fill="rgba(57,135,229,0.10)"/>
<rect x="405" y="858" width="221" height="104" rx="4" fill="rgba(217,89,38,0.10)"/>
<text x="182" y="882" font-size="17" fill="#F4F6FA">带电壳租约10–25年，年递</text>
<text x="182" y="905" font-size="17" fill="#F4F6FA">增3%（TeraWulf、</text>
<text x="182" y="928" font-size="17" fill="#F4F6FA">Cipher、Hut 8、Riot披</text>
<text x="182" y="951" font-size="17" fill="#F4F6FA">露）</text>
<text x="413" y="882" font-size="17" fill="#F4F6FA">批发合同期限未在季报中披</text>
<text x="413" y="905" font-size="17" fill="#F4F6FA">露；万国2026Q4 MSR同比</text>
<text x="413" y="928" font-size="17" fill="#F4F6FA">约−3%（定价重置）</text>
<text x="174" y="976" font-size="14" fill="#9FB3CC">期限决定收入可见度与融资能力</text>
<line x1="24" y1="986" x2="616" y2="986" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="1018" font-size="18" font-weight="700" fill="#F4F6FA">资金成本</text>
<rect x="174" y="994" width="221" height="127" rx="4" fill="rgba(57,135,229,0.10)"/>
<rect x="405" y="994" width="221" height="127" rx="4" fill="rgba(217,89,38,0.10)"/>
<text x="182" y="1018" font-size="17" fill="#F4F6FA">超大规模IG利差比指数宽</text>
<text x="182" y="1041" font-size="17" fill="#F4F6FA">7bp（MS）；壳层票据</text>
<text x="182" y="1064" font-size="17" fill="#F4F6FA">6.75–9.25%；新云加权平</text>
<text x="182" y="1087" font-size="17" fill="#F4F6FA">均利率8.3%（C</text>
<text x="182" y="1110" font-size="17" fill="#F4F6FA">oreWeave）</text>
<text x="413" y="1018" font-size="17" fill="#F4F6FA">IDC公募REIT预测分派率</text>
<text x="413" y="1041" font-size="17" fill="#F4F6FA">5.2%（南方万国）、5.3%</text>
<text x="413" y="1064" font-size="17" fill="#F4F6FA">（南方润泽），按发售价</text>
<text x="174" y="1135" font-size="14" fill="#9FB3CC">美国为债务票息或加权利率；REIT分派率是权益投资者要求的现金收</text>
<text x="174" y="1155" font-size="14" fill="#9FB3CC">益，不等于债务利率</text>
<line x1="24" y1="1165" x2="616" y2="1165" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="1190" font-size="15" fill="#9FB3CC">汇率未换算：按万国数据2026Q2公告隐含汇率6.79元/美元粗略换算，2,000万</text>
<text x="24" y="1210" font-size="15" fill="#9FB3CC">元/MW≈295万美元/MW，0.32–0.36元/kWh≈4.7–5.3美分/kWh（作者说明性换算，仅供</text>
<text x="24" y="1230" font-size="15" fill="#9FB3CC">量级参考）。</text>
<line x1="24" y1="1265" x2="616" y2="1265" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="1287" font-size="16" fill="#9FB3CC">摩根士丹利2026年9月《AI指南》；各公司公告与季报；EIA；CBRE；工信部与信通</text><text x="24" y="1307" font-size="16" fill="#9FB3CC">院；REIT发售公告。属性：公司披露为已披露事实，机构估算为预测估算，标注者</text><text x="24" y="1327" font-size="16" fill="#9FB3CC">为作者说明性计算</text>
<text x="616" y="1287" font-size="16" fill="#9FB3CC" text-anchor="end"></text>
</svg>