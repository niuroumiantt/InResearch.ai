<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1185.8" viewBox="0 0 640 1185.8" font-family='"Noto Sans SC","WenQuanYi Zen Hei",sans-serif'>
<rect width="640" height="1185.8" fill="#0B1F3A"/>
<rect x="24" y="26" width="5" height="56" fill="#E0B45C"/>
<text x="42" y="52" font-size="28" font-weight="700" fill="#F4F6FA">南亚与东南亚：土地、许可、电力与水条件</text>
<text x="42" y="78" font-size="18" fill="#9FB3CC">按已披露事实归纳；阶段以各地政府与公司口径为准</text>
<rect x="24" y="122" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="136" width="5" height="28" fill="#3987e5"/>
<text x="40" y="157" font-size="22" font-weight="700" fill="#F4F6FA">印度 · 奥里萨邦</text>
<text x="40" y="192" font-size="19" fill="#F4F6FA">阿达尼子公司1GW园区提案获邦级HLCA批准；投资约1.04万亿</text>
<text x="40" y="218" font-size="19" fill="#F4F6FA">卢比，Naraj划定约250英亩</text>
<text x="40" y="245" font-size="19" fill="#F4F6FA">电力、水源、分期与客户未披露</text>
<rect x="24" y="281.3" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="295.3" width="5" height="28" fill="#3987e5"/>
<text x="40" y="316" font-size="22" font-weight="700" fill="#F4F6FA">印度 · 特伦甘纳邦</text>
<text x="40" y="351" font-size="19" fill="#F4F6FA">微软海得拉巴云区域启用（三可用区）；全邦已运营约300MW、在</text>
<text x="40" y="377" font-size="19" fill="#F4F6FA">建约2GW</text>
<text x="40" y="404" font-size="19" fill="#F4F6FA">目标2029年达5GW（政策目标）</text>
<rect x="24" y="440.6" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="454.6" width="5" height="28" fill="#3987e5"/>
<text x="40" y="476" font-size="22" font-weight="700" fill="#F4F6FA">印度 · 安得拉邦</text>
<text x="40" y="510" font-size="19" fill="#F4F6FA">部长口径：数据中心用电≥70%可再生；维沙卡帕特南用水由</text>
<text x="40" y="537" font-size="19" fill="#F4F6FA">Polavaram左岸干渠调配</text>
<text x="40" y="563" font-size="19" fill="#F4F6FA">尚无正式政府令</text>
<rect x="24" y="599.9000000000001" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="613.9000000000001" width="5" height="28" fill="#199e70"/>
<text x="40" y="635" font-size="22" font-weight="700" fill="#F4F6FA">泰国</text>
<text x="40" y="669" font-size="19" fill="#F4F6FA">0.5MW及以上须向数字经济部登记（原则通过）；≥100MW超大规模</text>
<text x="40" y="696" font-size="19" fill="#F4F6FA">拟须进工业区</text>
<text x="40" y="723" font-size="19" fill="#F4F6FA">标准拟10月中旬生效 · 166个项目暂停中</text>
<rect x="24" y="759.2" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="773.2" width="5" height="28" fill="#199e70"/>
<text x="40" y="794" font-size="22" font-weight="700" fill="#F4F6FA">马来西亚 · 森美兰</text>
<text x="40" y="829" font-size="19" fill="#F4F6FA">Tera Data Centers有条件购入221.665英亩，总价约10.13亿</text>
<text x="40" y="855" font-size="19" fill="#F4F6FA">令吉（绿盛世合资EBP7）</text>
<text x="40" y="882" font-size="19" fill="#F4F6FA">交易条件与项目容量未披露</text>
<rect x="24" y="918.5" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="932.5" width="5" height="28" fill="#199e70"/>
<text x="40" y="953" font-size="22" font-weight="700" fill="#F4F6FA">印尼 · 巴淡岛</text>
<text x="40" y="988" font-size="19" fill="#F4F6FA">管理局要求数据中心自建海水淡化；预计2–3年内新增产水</text>
<text x="40" y="1015" font-size="19" fill="#F4F6FA">750→1000升/秒</text>
<text x="40" y="1041" font-size="19" fill="#F4F6FA">居民因断水多次抗议</text>
<text x="24" y="1098" font-size="17" fill="#9FB3CC">蓝色：印度各邦　绿色：东南亚　数字均为披露口径，非本刊测算</text>
<line x1="24" y1="1115.8" x2="616" y2="1115.8" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="1137.8" font-size="16" fill="#9FB3CC">来源：Business Standard、Telangana Today、PTI、The Nation、</text><text x="24" y="1157.8" font-size="16" fill="#9FB3CC">Kaohoon、The Star、Antara、detik</text>
<text x="616" y="1137.8" font-size="16" fill="#9FB3CC" text-anchor="end"></text>
</svg>