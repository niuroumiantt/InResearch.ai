<svg xmlns="http://www.w3.org/2000/svg" width="640" height="776" viewBox="0 0 640 776" font-family='"Noto Sans SC","WenQuanYi Zen Hei",sans-serif'>
<rect width="640" height="776" fill="#0B1F3A"/>
<rect x="24" y="26" width="5" height="56" fill="#E0B45C"/>
<text x="42" y="52" font-size="28" font-weight="700" fill="#F4F6FA">甲骨文木星园区：供电链条上的时间点</text>
<text x="42" y="78" font-size="18" fill="#9FB3CC">新墨西哥州多纳安娜县 · 阶段与日期以彭博、路透及州政府文件为准</text>
<line x1="150" y1="116" x2="150" y2="660" stroke="rgba(244,246,250,0.14)" stroke-width="2"/>
<circle cx="150" cy="131" r="10" fill="#3987e5" stroke="#3987e5" stroke-width="2"/>
<text x="132" y="137" font-size="16" fill="#9FB3CC" text-anchor="end">2025-09-19</text>
<text x="172" y="138" font-size="20" font-weight="700" fill="#F4F6FA">规划与地方许可</text>
<text x="172" y="164" font-size="18" fill="#F4F6FA" opacity="0.92">多纳安娜县批准最高1650亿美元工业收益债券；园区规</text>
<text x="172" y="188" font-size="18" fill="#F4F6FA" opacity="0.92">划2.45GW，目标2028年投运</text>
<circle cx="150" cy="219" r="10" fill="#3987e5" stroke="#3987e5" stroke-width="2"/>
<text x="132" y="225" font-size="16" fill="#9FB3CC" text-anchor="end">2026-04-27</text>
<text x="172" y="226" font-size="20" font-weight="700" fill="#F4F6FA">供电方案改为场内燃料电池</text>
<text x="172" y="252" font-size="18" fill="#F4F6FA" opacity="0.92">甲骨文放弃燃气轮机，改用Bloom Energy燃料电池；</text>
<text x="172" y="276" font-size="18" fill="#F4F6FA" opacity="0.92">燃料依赖Energy Transfer约18英里天然气管道</text>
<circle cx="150" cy="307" r="10" fill="#E0B45C" stroke="#E0B45C" stroke-width="2"/>
<text x="132" y="313" font-size="16" fill="#9FB3CC" text-anchor="end">2026-03／07</text>
<text x="172" y="314" font-size="20" font-weight="700" fill="#F4F6FA">管道路权两次被州土地办公室拒批</text>
<text x="172" y="340" font-size="18" fill="#F4F6FA" opacity="0.92">FERC文件显示管道投运由2026年8月推迟至2027年2月</text>
<text x="172" y="364" font-size="18" fill="#F4F6FA" opacity="0.92">1日；燃料电池空气许可待裁决</text>
<circle cx="150" cy="395" r="10" fill="#E0B45C" stroke="#E0B45C" stroke-width="2"/>
<text x="132" y="401" font-size="16" fill="#9FB3CC" text-anchor="end">2026-09-24</text>
<text x="172" y="402" font-size="20" font-weight="700" fill="#F4F6FA">甲骨文向STACK发出不可抗力通知</text>
<text x="172" y="428" font-size="18" fill="#F4F6FA" opacity="0.92">路透：合同规定供电由甲骨文负责、租约不得终止；通</text>
<text x="172" y="452" font-size="18" fill="#F4F6FA" opacity="0.92">知意在未按期投运时推迟付款，并非退出</text>
<circle cx="150" cy="483" r="10" fill="#E0B45C" stroke="#E0B45C" stroke-width="2"/>
<text x="132" y="489" font-size="16" fill="#9FB3CC" text-anchor="end">2026-09-25</text>
<text x="172" y="490" font-size="20" font-weight="700" fill="#F4F6FA">资金侧反应</text>
<text x="172" y="516" font-size="18" fill="#F4F6FA" opacity="0.92">Bloom转述甲骨文重申2.4GW合同；180亿美元银团贷款</text>
<text x="172" y="540" font-size="18" fill="#F4F6FA" opacity="0.92">二级市场价低于面值90%；彭博：摩根士丹利称将拖累</text>
<text x="172" y="564" font-size="18" fill="#F4F6FA" opacity="0.92">数据中心债务</text>
<circle cx="150" cy="595" r="10" fill="#0B1F3A" stroke="#9FB3CC" stroke-width="2"/>
<text x="132" y="601" font-size="16" fill="#9FB3CC" text-anchor="end">2026-11-23</text>
<text x="172" y="602" font-size="20" font-weight="700" fill="#F4F6FA">下一个可验证节点</text>
<text x="172" y="628" font-size="18" fill="#F4F6FA" opacity="0.92">新墨西哥州环境部对燃料电池空气许可的裁决截止日；</text>
<text x="172" y="652" font-size="18" fill="#F4F6FA" opacity="0.92">管道投运目标2027年2月1日</text>
<text x="24" y="688" font-size="17" fill="#9FB3CC">蓝点：已完成　金点：进行中／本期新增　空心点：待定</text>
<line x1="24" y1="706" x2="616" y2="706" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="728" font-size="16" fill="#9FB3CC">来源：Bloomberg、Reuters、Albuquerque Journal、El Paso Matters；不可</text><text x="24" y="748" font-size="16" fill="#9FB3CC">抗力条款为匿名信源转述</text>
<text x="616" y="728" font-size="16" fill="#9FB3CC" text-anchor="end"></text>
</svg>