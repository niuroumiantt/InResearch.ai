<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1212.3999999999999" viewBox="0 0 640 1212.3999999999999" font-family='"Noto Sans SC","WenQuanYi Zen Hei",sans-serif'>
<rect width="640" height="1212.3999999999999" fill="#0B1F3A"/>
<rect x="24" y="26" width="5" height="56" fill="#E0B45C"/>
<text x="42" y="52" font-size="28" font-weight="700" fill="#F4F6FA">美国：供电成本与时间正在转给数据中心</text>
<text x="42" y="78" font-size="18" fill="#9FB3CC">黄色：得州／TVA／埃尔帕索（本期）　蓝色：联邦资金　橙色：背景</text>
<rect x="24" y="122" width="592" height="172" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="136" width="5" height="28" fill="#c98500"/>
<text x="40" y="157" font-size="22" font-weight="700" fill="#F4F6FA">得州 · 州长／TCEQ／ERCOT／总检察长</text>
<text x="40" y="192" font-size="19" fill="#F4F6FA">9月21日起暂停数据中心相关许可，待ERCOT审计（报告目标12月</text>
<text x="40" y="218" font-size="19" fill="#F4F6FA">10日）</text>
<text x="40" y="245" font-size="19" fill="#F4F6FA">≥75MW通电审批自8月3日暂停；9月24日起调查未申报用水项目，</text>
<text x="40" y="271" font-size="19" fill="#F4F6FA">初步涉及18个县</text>
<rect x="24" y="307.9" width="592" height="172" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="321.9" width="5" height="28" fill="#c98500"/>
<text x="40" y="343" font-size="22" font-weight="700" fill="#F4F6FA">TVA（七州） · 数据中心专属费率10月1日生效</text>
<text x="40" y="377" font-size="19" fill="#F4F6FA">电费平均上调约10%；≥5MW新建或扩建负荷缴容量承诺费，约</text>
<text x="40" y="404" font-size="19" fill="#F4F6FA">150万美元/MW（区域媒体口径，分3–5年）</text>
<text x="40" y="431" font-size="19" fill="#F4F6FA">现有数据中心三个财年过渡；亨茨维尔市议会9月24日审议合同修</text>
<text x="40" y="457" font-size="19" fill="#F4F6FA">正案</text>
<rect x="24" y="493.79999999999995" width="592" height="119" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="507.79999999999995" width="5" height="28" fill="#c98500"/>
<text x="40" y="529" font-size="22" font-weight="700" fill="#F4F6FA">El Paso Electric／Meta埃尔帕索 · 366MW电厂</text>
<text x="40" y="563" font-size="19" fill="#F4F6FA">行政法官9月23日建议：客户免担资本与运营成本方可批准CCN</text>
<text x="40" y="590" font-size="19" fill="#F4F6FA">前5年专供Meta 1GW园区；PUCT表决未排期</text>
<rect x="24" y="626.5" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="640.5" width="5" height="28" fill="#3987e5"/>
<text x="40" y="661" font-size="22" font-weight="700" fill="#F4F6FA">美国能源部 SPARK · 9月24日入选名单</text>
<text x="40" y="696" font-size="19" fill="#F4F6FA">19亿美元联邦资金，26州31个输电项目，总投资52.5亿美元，称</text>
<text x="40" y="723" font-size="19" fill="#F4F6FA">释放逾23GW并网容量</text>
<text x="40" y="749" font-size="19" fill="#F4F6FA">仅为入选，正式资助协议未签</text>
<rect x="24" y="785.8" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="799.8" width="5" height="28" fill="#d95926"/>
<text x="40" y="821" font-size="22" font-weight="700" fill="#F4F6FA">俄勒冈 Pacific Power（背景：9月16日和解协议）</text>
<text x="40" y="855" font-size="19" fill="#F4F6FA">≥20MW新建设施自付新增电源与线路成本；&gt;100MW另缴1美</text>
<text x="40" y="882" font-size="19" fill="#F4F6FA">分/kWh；合同最短10年</text>
<text x="40" y="909" font-size="19" fill="#F4F6FA">OPUC尚未批准，目标11月13日裁定</text>
<rect x="24" y="945.0999999999999" width="592" height="145" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(244,246,250,0.14)"/>
<rect x="24" y="959.0999999999999" width="5" height="28" fill="#d95926"/>
<text x="40" y="980" font-size="22" font-weight="700" fill="#F4F6FA">加州（背景：9月21日签署7项法案）</text>
<text x="40" y="1015" font-size="19" fill="#F4F6FA">SB 886：输电升级费由数据中心承担，适用2027年1月1日起新签</text>
<text x="40" y="1041" font-size="19" fill="#F4F6FA">接入协议</text>
<text x="40" y="1068" font-size="19" fill="#F4F6FA">AB 2619：申领营业执照前须向供水方提交用水估算</text>
<text x="24" y="1124" font-size="17" fill="#9FB3CC">容量承诺费数值来自区域媒体转述，TVA正式费率表未公开</text>
<line x1="24" y1="1142.3999999999999" x2="616" y2="1142.3999999999999" stroke="rgba(244,246,250,0.14)"/>
<text x="24" y="1164.3999999999999" font-size="16" fill="#9FB3CC">来源：得州州长办公室、得州总检察长、ERCOT、WAFF／256 Today、Inside</text><text x="24" y="1184.3999999999999" font-size="16" fill="#9FB3CC">Climate News、美国能源部、俄勒冈PUC、加州州长办公室</text>
<text x="616" y="1164.3999999999999" font-size="16" fill="#9FB3CC" text-anchor="end"></text>
</svg>