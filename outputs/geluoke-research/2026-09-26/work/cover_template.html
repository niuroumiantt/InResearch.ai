<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/user/InResearch.ai/web/assets/fonts/fonts.css">
<style>
:root{--navy:#0B1F3A;--navy2:#102B4E;--ink:#F4F6FA;--gold:#E0B45C;--cyan:#7FD3FF;--mute:#9FB3CC;--line:rgba(244,246,250,0.22);}
*{box-sizing:border-box}
body{margin:0;width:1200px;height:1800px;background:var(--navy);color:var(--ink);font-family:"Noto Sans SC","WenQuanYi Zen Hei",sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(127,211,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(127,211,255,0.06) 1px,transparent 1px);background-size:60px 60px}
.sheet{position:absolute;inset:0;padding:44px 56px 40px;display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--gold);padding-bottom:12px}
.brand .l{font-size:30px;font-weight:700;letter-spacing:2px}
.brand .r{font-size:22px;color:var(--mute);letter-spacing:1px}
h1{margin:22px 0 10px;font-size:44px;line-height:1.3;font-weight:700;color:#fff}
h1 em{font-style:normal;color:var(--gold)}
.sub{font-size:30px;line-height:1.5;color:var(--cyan);margin:0 0 6px}
.claim{font-size:25px;line-height:1.5;color:var(--mute);margin:0}
.band{margin:18px 0 6px;border:1px solid var(--line);border-radius:6px;padding:10px 12px 6px;position:relative}
.band .tag{position:absolute;top:-14px;left:16px;background:var(--navy);padding:0 10px;font-size:20px;color:var(--gold);letter-spacing:2px}
.band img{display:block;width:auto;max-width:100%;max-height:520px;height:auto;margin:0 auto}
.mods{margin-top:14px}
.mod{display:flex;align-items:flex-start;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.mod:last-child{border-bottom:1px solid var(--line)}
.mod .n{flex:0 0 46px;height:46px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font-size:25px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mod .k{flex:0 0 276px;font-size:28px;font-weight:700;line-height:1.3;padding-top:3px}
.mod .k small{display:block;font-size:19px;font-weight:400;color:var(--mute);margin-top:1px}
.mod .v{flex:1;font-size:30px;line-height:1.38;color:var(--ink);padding-top:4px}
.mod .v b{color:var(--gold);font-weight:700}
.regions{display:flex;gap:12px;margin-top:14px}
.reg{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.reg .h{font-size:24px;font-weight:700;color:var(--cyan);margin-bottom:6px;letter-spacing:1px}
.reg .t{font-size:23px;line-height:1.38;color:var(--ink)}
.foot{margin-top:auto;display:flex;align-items:flex-end;gap:24px;padding-top:12px;border-top:2px solid var(--gold)}
.foot .c{flex:1}
.foot .concl{font-size:29px;line-height:1.45;font-weight:700;color:#fff;margin:0 0 10px}
.foot .sig{font-size:22px;color:var(--mute)}
.qr{flex:0 0 170px;height:170px;background:transparent;border:1px dashed rgba(244,246,250,0.35);border-radius:4px;display:flex;align-items:center;justify-content:center}
.qr img{width:100%;height:100%;display:block;background:#fff}
</style></head><body>
<div class="grid"></div>
<div class="sheet">
  <div class="brand"><div class="l">格洛可数据中心日报｜{{DATE}}</div><div class="r">{{EDITION}}</div></div>
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
  <p class="claim">{{CLAIM}}</p>
  <div class="band"><span class="tag">{{BAND_TAG}}</span><img src="{{XSEC}}"></div>
  <div class="mods">
    {{MODULES}}
  </div>
  <div class="regions">
    {{REGIONS}}
  </div>
  <div class="foot">
    <div class="c"><p class="concl">{{CONCLUSION}}</p><div class="sig">{{SIGNATURE}}</div></div>
    <div class="qr">{{QR}}</div>
  </div>
</div>
</body></html>
