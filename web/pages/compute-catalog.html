<!doctype html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计算芯片目录 · inresearch.ai</title>
<script src="/assets/theme-state.js"></script><script src="/assets/site-skin.js"></script><script type="module" src="/assets/site-shell.js"></script><link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css">
<style>main{max-width:1240px;margin:2rem auto;padding:0 1rem}.filters{display:flex;flex-wrap:wrap;gap:1rem;margin:1.5rem 0}.filters label{display:flex;gap:.4rem;align-items:center}input,select,button{padding:.5rem;max-width:100%}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:.7rem;border-bottom:1px solid var(--ui-line);vertical-align:top}td small{display:block;margin-top:.35rem;opacity:.7}p{line-height:1.7}.pager{display:flex;gap:1rem;margin:1rem 0}#gaps{overflow-wrap:anywhere}a{color:var(--ui-accent)}@media(max-width:600px){main{margin:1rem auto}.filters{flex-direction:column;align-items:start}}</style></head>
<body><inresearch-shell data-section="bom"></inresearch-shell><main><nav><a href="/product-catalog.html">规格库 · 原厂目录</a> / 计算芯片</nav><h1>计算芯片目录</h1><p>按具体产品浏览 CPU、GPU、其他计算加速器。芯片、板卡、整机和系列分开计数；原厂分类与原文规格保留在各厂商目录中。未知参数留空，官网列出不代表已确认在售。</p>
<div class="filters"><label>类型 <select id="compute-category"><option value="">全部计算产品</option value="cpu">CPU</option><option value="gpu">GPU</option><option value="accelerator">其他计算加速器</option><option value="unknown">待核验</option></select></label><label>厂商地区 <select id="compute-region"><option value="">全部</option><option value="CN">中国厂商</option></select></label><label>厂商 <select id="compute-company"><option value="">全部厂商</option></select></label><label>形态 <select id="compute-form"><option value="">全部形态</option><option value="chip">芯片</option><option value="board">板卡 / 模组</option><option value="system">整机 / 平台</option><option value="series">系列 / 目录</option><option value="unknown">形态待核验</option></select></label><label>搜索 <input id="compute-query" type="search" placeholder="型号、厂商"></label><label><input id="compute-specs" type="checkbox">有原文规格</label><button id="compute-export">导出当前清单 CSV</button><button id="compute-retry">重新读取</button></div>
<p id="compute-status" role="status" aria-live="polite">正在读取已交付目录…</p><p id="compute-counts"></p><div class="table-wrap"><table><thead><tr><th>产品</th><th>厂商 / 产品线</th><th>类型 / 形态</th><th>架构原文</th><th>规格 / 获取时间</th></tr></thead><tbody id="compute-products"></tbody></table></div><div class="pager"><button id="compute-prev">上一页</button><button id="compute-next">下一页</button></div><details open><summary>目录交付与缺口</summary><ul id="gaps"></ul></details><p>海光 DCU 逐型号核验架构，不从公司名或软件兼容性推断。ARM IP、网络与配套芯片不计入成品 CPU/GPU；系列和候选入口不计作已交付型号。</p></main><script src="/assets/compute-catalog.js"></script></body></html>
