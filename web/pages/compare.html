<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head>
<script src="/assets/theme-state.js"></script>
<script src="/assets/site-skin.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型选型对比台 — inresearch.ai</title>
<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font:13.5px/1.6 -apple-system,"PingFang SC",sans-serif}
  .topbar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:4px;padding:0 18px;height:46px;z-index:20}
  .topbar b{font-size:15px;margin-right:14px}
  .tab{padding:12px 14px;color:var(--muted);text-decoration:none}
  .tab.on{color:var(--accent);font-weight:600}
  .wrap{max-width:1400px;margin:20px auto;padding:0 16px}
  h1{font-size:22px}
  .sub{color:var(--muted);font-size:12.5px;margin:4px 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius: var(--ui-radius);overflow:hidden}
  .card canvas{display:block;width:100%;height:230px;background:var(--ui-scene);cursor:grab}
  .meta{padding:10px 14px}
  .meta b{font-size:13.5px;overflow-wrap:anywhere} .meta p{color:var(--muted);font-size:12px;margin:5px 0}
  .kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
    padding:3px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border:none}
  .kv i{max-width:65%;overflow-wrap:anywhere;font-style:normal;color:var(--text);font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius: var(--ui-radius)}
</style>
<link rel="stylesheet" href="/assets/site-skin.css">
</head>
<body>
<inresearch-shell data-section="admin"></inresearch-shell>
<div class="topbar">
  <a class="tab" href="bom3d.html">爆炸图 3D</a>
  <a class="tab" href="rack3d.html">机柜拆解台</a>
  <a class="tab on" href="compare.html">模型选型</a>
</div>
<div class="wrap">
  <h1>3D 资产检查</h1>
  <div class="sub">候选、已采用与未采用模型分开列示。仅已采用模型进入研究场景；这里的网格统计只帮助检查结构，不证明物理部件正确或可逐件拆解。</div>
  <div class="grid" id="grid"><div class="empty">加载中…</div></div>
</div>

<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
import {createModelLoad, loadModel} from "/assets/model-assets.js";
import {createViewport, visibleBounds, fitPerspective} from "/assets/scene-view.js";
import {loadSceneData} from "/assets/scene-data.js";

const grid = document.getElementById("grid");
const [manifest] = await loadSceneData([{url:"/api/model-assets",collection:"models",schemaVersion:1}], {controls:[grid]});
const requested = [...new Set((new URLSearchParams(location.search).get("f") || "").split(",").map(s => s.trim()).filter(Boolean))];
const entries = requested.length ? requested.map(file => manifest.models.find(m => m.file === file) || {file}) : manifest.models;
grid.replaceChildren();
if (!entries.length) {
  const empty = document.createElement("div"); empty.className="empty";
  empty.textContent="尚无已登记模型。候选通过审阅后才会进入研究场景。"; grid.append(empty);
}
const previews = [];
window.addEventListener('pagehide', event => {if (!event.persisted) previews.forEach(dispose => dispose());});

const env = (() => {                       // 简易影棚环境，保证材质有反射
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x39445c })));
  const p = (w, h, x, y, z, c, i, ry = 0, rx = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c }));
    m.material.color.multiplyScalar(i); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); s.add(m);
  };
  p(20, 12, 0, 18, 0, 0xffffff, 5, 0, Math.PI / 2);
  p(20, 10, -18, 6, 0, 0xbfd6ff, 2.5, Math.PI / 2);
  p(20, 10, 18, 5, 0, 0xffe0b8, 2, -Math.PI / 2);
  return s;
})();

const PART = /server|node|sled|tray|blade|door|panel|rail|psu|power|fan|switch|shelf|drive|disk|cover|side|frame|post|unit|module|rack/i;

for (const entry of entries) {
  const {file} = entry;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<canvas></canvas><div class="meta"><b></b><div class="rows">读取中…</div></div>`;
  card.querySelector("b").textContent = file;
  grid.appendChild(card);
  const identity = document.createElement('p');
  identity.textContent = ({candidate:'候选 · 待审阅',adopted:'已采用',rejected:'未采用'})[entry.status] || '未登记，不能预览';
  card.querySelector('.meta').prepend(identity);
  if (!entry.status) {card.querySelector('canvas').remove();card.querySelector('.rows').textContent='请从已登记的模型中选择。';continue;}
  const decision = document.createElement('p');decision.textContent=entry.decision || '下载只建立候选，不授予采用状态。';
  card.querySelector('.meta').append(decision);
  const credit = document.createElement('a');credit.href=entry.source;credit.textContent=entry.license;credit.rel='noopener';credit.target='_blank';card.querySelector('.meta').append(credit);
  const cv = card.querySelector("canvas");

  const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  ren.setPixelRatio(Math.min(devicePixelRatio, 2));
  ren.outputColorSpace = THREE.SRGBColorSpace;
  ren.toneMapping = THREE.ACESFilmicToneMapping;
  ren.toneMappingExposure = 1.05;
  const sc = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(ren);
  const environment = pm.fromScene(env, 0.04);
  sc.environment = environment.texture; pm.dispose();
  sc.add(new THREE.HemisphereLight(0x9db4d8, 0x141a26, .8));
  const dl = new THREE.DirectionalLight(0xfff2e0, 1.8); dl.position.set(3, 5, 4); sc.add(dl);
  const cam = new THREE.PerspectiveCamera(34, 1, .01, 200);
  const pivot = new THREE.Group(); sc.add(pivot);

  let bounds;
  const fit = () => {if (bounds) fitPerspective({camera:cam, bounds, direction:new THREE.Vector3(0, .35, 2.9)});};
  const viewport = createViewport({canvas:cv, camera:cam, resize:(w,h)=>ren.setSize(w,h,false), onResize:fit});
  let rotX = -.3, rotY = .7, spin = !matchMedia('(prefers-reduced-motion: reduce)').matches, drag = null;
  cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; spin = false; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if (!drag) return;
    rotY += (e.clientX - drag[0]) * .012;
    rotX = Math.max(-1.3, Math.min(1.3, rotX + (e.clientY - drag[1]) * .012));
    drag = [e.clientX, e.clientY];
  });
  cv.addEventListener("pointerup", () => drag = null);

  const slot = createModelLoad({host:card.querySelector('.meta'), label:'模型',
    load:signal => loadModel(entry, signal), commit:model => {
    const o = model.root;
    pivot.rotation.set(0, 0, 0);
    pivot.add(o);
    let tris = 0, meshes = 0, mats = new Set(), named = [];
    o.traverse(x => {
      if (x.isMesh) {
        meshes++;
        const idx = x.geometry.index;
        tris += (idx ? idx.count : x.geometry.attributes.position.count) / 3;
        (Array.isArray(x.material) ? x.material : [x.material]).forEach(m => mats.add(m.uuid));
      }
      if (PART.test(x.name || "")) named.push(x.name);
    });
    bounds = visibleBounds([o]);
    const sz = bounds.getSize(new THREE.Vector3()), center = bounds.getCenter(new THREE.Vector3());
    o.position.sub(center); bounds.translate(center.negate());
    viewport.sync(); fit();

    const rows = card.querySelector('.rows'); rows.replaceChildren();
    const values = [
      ['结构检查', '网格与名称仅作线索，拆解关系待核对'],
      ['网格 / 材质', `${meshes} / ${mats.size}`],
      ['三角面', Math.round(tris).toLocaleString()],
      ['尺寸比例 宽×高×深', `${sz.x.toFixed(1)} × ${sz.y.toFixed(1)} × ${sz.z.toFixed(1)}`],
      ['部件名线索', named.length ? named.slice(0, 2).join('、').slice(0, 60) : '无'],
    ];
    for (const [key,value] of values) {
      const row=document.createElement('div'), label=document.createElement('span'), text=document.createElement('i');
      row.className='kv';label.textContent=key;text.textContent=value;row.append(label,text);rows.append(row);
    }
  }});


  let frame;
  (function loop() {
    frame = requestAnimationFrame(loop);
    if (spin) rotY += .005;
    pivot.rotation.set(rotX, rotY, 0);
    ren.render(sc, cam);
  })();
  previews.push(() => {cancelAnimationFrame(frame);viewport.dispose();slot.dispose();environment.dispose();ren.dispose();});
}
env.traverse(object => {object.geometry?.dispose();object.material?.dispose();});
</script>
</body>
</html>
