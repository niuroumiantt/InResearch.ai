<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head>
<script src="/assets/theme-state.js"></script>
<script src="/assets/site-skin.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据中心节点 — inresearch.ai</title>
<style>
  /* 一棵树、五列、四问：每一屏是树上一个节点，横轴五类变量，纵向四个面板（四段倒序）。页面只读快照，不做聚合。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.6 var(--ui-font); padding-bottom: 60px; }
  a { color: var(--accent); text-decoration: none; }
  .topbar { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 4px; padding: 0 18px; height: 46px; z-index: 20; }
  .topbar b { font-size: 15px; margin-right: 14px; }
  .tab { padding: 12px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .topbar .sp { flex: 1; }
  .wrap { max-width: 1360px; margin: 18px auto 0; padding: 0 16px; }
  #crumbs a { margin-right: 6px; } #crumbs a::after { content: " ›"; color: var(--muted); } #crumbs a:last-child::after { content: ""; }
  #crumbs a[aria-current] { color: var(--text); font-weight: 600; }
  .head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 14px; }
  .head h1 { font-size: 24px; letter-spacing: .3px; }
  .head h1 em { font-style: normal; color: var(--accent); }
  .head .kind { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: var(--ui-radius); font-size: 11px; color: #fff; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 14px 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 15px; margin-bottom: 4px; }
  .panel h2 small { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 8px; }
  .panel .q { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .account { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .acct { border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 10px 12px; }
  .acct .l { color: var(--muted); font-size: 12px; } .acct .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .acct .u, .acct .n { color: var(--muted); font-size: 11px; }
  .five { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .col { border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 8px 10px; min-width: 0; }
  .col.hl { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .col h3 { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .col h3 .num { background: var(--accent); color: #fff; border-radius: var(--ui-radius); font-size: 10px; padding: 0 5px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; border-top: 1px dashed var(--line); padding: 4px 0; font-size: 12.5px; }
  .kv:first-of-type { border-top: none; }
  .kv span { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv b { white-space: nowrap; font-variant-numeric: tabular-nums; } .kv b small { color: var(--muted); font-weight: 400; margin-left: 3px; }
  .empty { color: var(--muted); font-size: 12px; }
  .cov { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .cov i { display: inline-block; width: 8px; height: 8px; border-radius: var(--ui-radius); margin: 0 3px 0 6px; vertical-align: -1px; }
  .inst { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 1px 8px; font-size: 11.5px; color: var(--text); background: var(--bg); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  #matrix td.cell { cursor: pointer; padding: 0; }
  #matrix td.cell a { display: block; padding: 8px; color: var(--text); border-left: 3px solid transparent; min-height: 44px; }
  #matrix td.cell a:hover { background: var(--bg); }
  #matrix td.cell.sourced a { border-left-color: var(--green); }
  #matrix td.cell.assumed a { border-left-color: var(--yellow); }
  #matrix td.cell.needed a { border-left-color: var(--gray); color: var(--muted); }
  #matrix td.cell.hl a { background: var(--bg); }
  #matrix .v { font-weight: 600; } #matrix .u { color: var(--muted); font-size: 11px; margin-left: 3px; }
  #matrix .c { display: block; font-size: 10.5px; color: var(--muted); }
  #matrix tr.row-child { display: none; } #matrix.it-open tr.row-child { display: table-row; }
  #matrix tr.row-child th { padding-left: 22px; font-weight: 400; } .child-mark { color: var(--muted); }
  .it-toggle { font: inherit; background: none; border: 1px solid var(--line); border-radius: var(--ui-radius); color: var(--accent); cursor: pointer; padding: 0 5px; }
  tr.chain-row th { background: var(--bg); color: var(--text); font-weight: 600; font-size: 12px; border-left: 3px solid var(--accent); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: var(--ui-radius); margin-right: 3px; vertical-align: -1px; }
  .st-sourced { background: var(--green); } .st-assumed { background: var(--yellow); } .st-needed { background: var(--gray); }
  .sup-tight { background: var(--red); } .sup-transition { background: var(--yellow); } .sup-mature { background: var(--green); } .sup-emerging { background: var(--purple); }
  .links a { margin-right: 12px; font-size: 12.5px; }
  .factor { border-top: 1px dashed var(--line); padding: 6px 0; }
  .factor b { font-size: 13px; } .factor code { font-family: var(--ui-mono); font-size: 11.5px; color: var(--muted); }
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .team { border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 6px 10px; font-size: 12px; }
  .team b { display: block; }
  .changes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 12px; }
  /* 派工面板（自首页迁入）：工单 = 声明 − 现状，不手写 */
  #grid { margin-top: 12px; }
  .board { background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 12px 14px; overflow: hidden; }
  .board .bh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .board .bh h3 { font-size: 13px; } .board .go { font-size: 12px; }
  .board .big { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 8px; }
  .board .big b { font-size: 20px; } .board .big span { font-size: 11px; color: var(--muted); }
  .board .line { font-size: 11px; color: var(--muted); padding: 2px 0; }
  .chip-sm { display: inline-block; border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 0 6px; font-size: 11px; margin-right: 4px; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin: 10px 0 6px; }
  .dc-news { margin-top: 12px; }
  .err { color: var(--red); background: var(--card); border: 1px solid var(--red); border-radius: var(--ui-radius); padding: 14px; margin-top: 16px; }
  @media (max-width: 900px) { .five { grid-template-columns: repeat(2, minmax(0, 1fr)); } .topbar { height: auto; flex-wrap: wrap; padding: 4px 10px; } .topbar .sp { display: none; } }
  .tscroll { overflow-x: auto; max-width: 100%; }
  @media (max-width: 600px) { .five { grid-template-columns: 1fr; } #matrix .c { display: none; } }
</style>

<body>
<inresearch-shell data-section="overview"></inresearch-shell>
<div class="topbar">
  <b>一棵树 · 五列 · 四问</b>
  <nav id="crumbs" aria-label="节点路径"></nav>
  <span class="sp"></span>
  <a class="tab" href="bom.html">爆炸图</a>
  <a class="tab" href="bom3d.html">园区 3D</a>
  <a class="tab" href="ledger.html">账本</a>
  <a class="tab" href="supply.html">供应中心</a>
  <a class="tab" href="doc.html?f=docs/reviews/2026-09-28/dashboard/PROPOSAL.md">为什么这样排 ↗</a>
</div>

<main class="wrap">
  <header class="head" id="head"><h1>加载中…</h1></header>
  <section class="panel" id="p1"><h2>它值多少<small>事实 · 五类变量的现值与时点</small></h2><div class="q" id="q1"></div><div id="account"></div><div class="five" id="five"></div></section>
  <section class="panel" id="p2"><h2 id="h2">它由什么组成<small>树 · 子节点</small></h2><div class="q" id="q2"></div><div id="children"></div></section>
  <section class="panel" id="p3"><h2>它怎么影响账<small>规则 · 因子树</small></h2><div class="q" id="q3"></div><div id="factors"></div></section>
  <section class="panel" id="p4"><h2>数据从哪来，缺什么<small>采集 · 目标清单与六队</small></h2><div class="q" id="q4"></div>
    <div id="grid"></div>
    <div class="changes" id="changes"></div>
    <section class="dc-news" data-datacenter-news aria-label="数据中心新闻" id="news"></section>
    <div id="targets"></div>
  </section>
  <div id="error"></div>
</main>

<script>
async function get(p) {
  const r = await fetch(p + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(p + " → " + r.status);
  return r.json();
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUS = { sourced: "已有数据", assumed: "模型假设", needed: "缺" };
const SUP = { tight: "紧缺", transition: "技术切换中", mature: "成熟", emerging: "新兴" };
const q = new URLSearchParams(location.search);
const NODE = q.get("id") || "root";
const COL = q.get("col") || "";
const byId = id => document.getElementById(id);

function fmt(v, unit) {
  if (v == null) return '<span class="empty">缺</span>';
  if (typeof v === "number") {
    const s = Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (Number.isInteger(v) ? String(v) : v.toLocaleString(undefined, { maximumFractionDigits: 2 }));
    return s + (unit ? `<small>${esc(unit)}</small>` : "");
  }
  return esc(v) + (unit ? `<small>${esc(unit)}</small>` : "");
}
const pct = v => v == null ? "缺" : (v * 100).toFixed(1) + "%";
function nodeHref(id, col) { return "node.html?" + new URLSearchParams(col ? { id, col } : { id }); }
function covLine(c) {
  if (!c) return "";
  return `<div class="cov">目标：<i class="st-sourced"></i>${c.sourced} <i class="st-assumed"></i>${c.assumed} <i class="st-needed"></i>${c.needed}</div>`;
}

function fiveColumns(cells, columns) {
  return Object.entries(columns).map(([n, name]) => {
    const c = cells[n] || { items: [] };
    const rows = c.items.map(i => `<div class="kv" title="${esc((i.source?.type || "") + " " + (i.source?.key || ""))}"><span>${esc(i.label)}</span><b>${fmt(i.value, i.unit)}${i.as_of ? `<small>${esc(String(i.as_of).slice(0, 7))}</small>` : ""}</b></div>`).join("");
    const inst = (c.instances || []).length ? `<div class="inst">${c.instances.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : "";
    return `<div class="col ${COL === n ? "hl" : ""}" id="col-${n}"><h3><span class="num">${n}</span>${esc(name)} <span class="dot st-${c.status || "needed"}" title="${STATUS[c.status] || ""}"></span></h3>${rows || '<div class="empty">缺——没有登记来源，不显示估计值</div>'}${inst}${covLine(c.coverage)}</div>`;
  }).join("");
}

function matrix(d) {
  const cols = Object.entries(d.columns);
  // 一个骨架：第一层五个系统（IT 作为父级可展开成四个子系统），第九行站点权利
  const parents = d.parent_systems || [];
  const rows = [];
  const leaves = d.ecosystems;
  const topOrder = Object.entries(d.systems || {}).filter(([, x]) => !x.parent).sort((a, b) => a[1].order - b[1].order).map(([id]) => id);
  for (const sid of topOrder) {
    const parent = parents.find(x => x.id === sid);
    if (parent) { rows.push({ ...parent, kind: "parent" }); leaves.filter(e => e.parent === sid).forEach(e => rows.push({ ...e, kind: "child" })); }
    else { const e = leaves.find(x => x.id === sid); if (e) rows.push({ ...e, kind: "top" }); }
  }
  rows.push({ ...d.site, kind: "top" });
  const open = new URLSearchParams(location.search).get("it") === "1";
  return `<div class="tscroll"><table id="matrix" class="${open ? "it-open" : ""}"><thead><tr><th>系统 × 五类变量</th>${cols.map(([n, name]) => `<th class="${COL === n ? "hl" : ""}">${n} ${esc(name)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => {
    const id = r.id === "site" ? "site" : "ecosystem:" + r.id;
    const label = r.kind === "parent" ? `<button type="button" class="it-toggle" aria-expanded="${open}" title="展开 / 收起 IT 的四个子系统">${open ? "▾" : "▸"}</button> <a href="${nodeHref(id)}">${esc(r.name)}</a>` : r.kind === "child" ? `<span class="child-mark">└</span> <a href="${nodeHref(id)}">${esc(r.name.replace("IT · ", ""))}</a>` : `<a href="${nodeHref(id)}">${esc(r.name)}</a>`;
    return `<tr class="row-${r.kind}"><th>${label}</th>${cols.map(([n]) => {
      const c = r.cells[n]; const i = c.items[0];
      return `<td class="cell ${c.status} ${COL === n ? "hl" : ""}"><a href="${nodeHref(id, n)}" title="${esc(i ? i.label : "缺")} · 目标 ${c.coverage.sourced}/${c.coverage.assumed}/${c.coverage.needed}">${i ? `<span class="v">${fmt(i.value, i.unit)}</span>` : '<span class="v">缺</span>'}<span class="c">${esc(i ? i.label : "无来源")}</span></a></td>`;
    }).join("")}</tr>`;
  }).join("")}</tbody></table></div>
  <div class="cov" style="margin-top:8px">左侧色条：<i class="st-sourced"></i>已有数据 <i class="st-assumed"></i>模型假设或部分目标已有 <i class="st-needed"></i>缺。每格点开进入系统节点并停在那一列；IT 一行可展开四个子系统；灰格就是采集任务书。</div>`;
}

function partsTable(parts, snapshot) {
  let last = null;
  return `<div class="tscroll"><table><thead><tr><th>部件（按链路，能量流顺序）</th><th>尺度</th><th>供应</th><th>构成</th><th>运行</th><th>价格</th><th>时间</th><th>主体</th></tr></thead><tbody>${parts.map(p => {
    const cells = snapshot.parts[p.id]?.cells || {};
    const head = p.chain && p.chain !== last ? `<tr class="chain-row"><th colspan="8">${esc(p.chain)}</th></tr>` : "";
    last = p.chain;
    return `${head}<tr><td><a href="${nodeHref("part:" + p.id)}">${esc(p.name)}</a></td><td>${esc(p.layer || p.kind)}</td><td><span class="dot sup-${p.supply_status}"></span>${SUP[p.supply_status] || ""}</td>${["1", "2", "3", "4", "5"].map(n => {
      const c = cells[n]; const i = c?.items?.[0];
      return `<td><span class="dot st-${c?.status || "needed"}"></span>${i ? fmt(i.value, i.unit) : '<span class="empty">缺</span>'}</td>`;
    }).join("")}</tr>`;
  }).join("")}</tbody></table></div>`;
}

function factorList(factors, pred, formulas) {
  const rows = factors.filter(pred);
  const f = formulas ? `<div class="factor"><b>收入</b> <code>${esc(formulas.revenue)}</code></div><div class="factor"><b>成本</b> <code>${esc(formulas.cost)}</code></div>` : "";
  if (!rows.length && !f) return '<div class="empty">没有因子挂到这个节点——它不进账，只进研究。</div>';
  return f + rows.map(x => `<div class="factor"><b>${esc(x.label)}</b> <span class="chip">${esc(x.side)}</span> <span class="chip">${esc(x.id)}</span>${x.unit ? ` <span class="chip">${esc(x.unit)}</span>` : ""}${x.formula ? `<br><code>${esc(x.formula)}</code>` : ""}${x.model_inputs?.length ? `<br><span class="empty">模型输入：${x.model_inputs.map(esc).join("、")}</span>` : ""}${x.bom_parts?.length ? `<br><span class="empty">汇总部件 ${x.bom_parts.length} 个${x.site_rights?.length ? "，权利 " + x.site_rights.length + " 条" : ""}</span>` : ""}</div>`).join("");
}

function targetPanel(rows, teams) {
  if (!rows.length) return '<div class="empty">没有目标行指向这个节点。</div>';
  const byTeam = {};
  rows.forEach(t => { const b = byTeam[t.team] ||= { sourced: 0, assumed: 0, needed: 0 }; b[t.status]++; });
  const cards = Object.entries(byTeam).map(([team, b]) => `<div class="team"><b>${esc(teams[team]?.name || team)}</b><i class="dot st-sourced"></i>${b.sourced} <i class="dot st-assumed"></i>${b.assumed} <i class="dot st-needed"></i>${b.needed}</div>`).join("");
  const table = `<div class="tscroll"><table><thead><tr><th>目标</th><th>类</th><th>数据类别</th><th>披露类型 × 出版方</th><th>队 / 主机</th><th>状态</th><th>到期</th></tr></thead><tbody>${rows.map(t =>
    `<tr><td><code>${esc(t.id)}</code></td><td>${t.variable_class}</td><td>${esc(t.data_class)}</td><td>${esc(t.disclosure_type)} × ${esc(t.publisher_category)}</td><td>${esc(t.team)} / ${esc(t.host)}</td><td><span class="dot st-${t.status}"></span>${STATUS[t.status]}</td><td>${esc(t.next_due)}</td></tr>`).join("")}</tbody></table></div>`;
  return `<div class="teams">${cards}</div>${table}`;
}

/* 派工面板：事实层与工单（自首页迁入）。机制看不见就等于不存在。 */
async function deliveryBoard() {
  const [facts, mets, taskBoard, blind] = await Promise.all([
    get("data/facts.json").catch(() => null), get("framework/metrics.json").catch(() => null),
    get("api/tasks").catch(() => null), get("reports/blindspot.json").catch(() => null)]);
  const orders = taskBoard?.orders || [];
  const p1 = orders.filter(o => o.pri === "P1").length;
  const kinds = Object.entries(orders.reduce((a, o) => (a[o.kind] = (a[o.kind] || 0) + 1, a), {})).sort((x, y) => y[1] - x[1]).slice(0, 4);
  const alarms = blind ? (blind.modules || []).filter(m => m.alarm) : [];
  const nf = facts ? facts.records.length : null, nm = mets ? mets.metrics.length : null;
  const filled = facts ? new Set(facts.records.map(f => f.metric_id)).size : null;
  return `<div class="board"><div class="bh"><h3>派工 · 事实层与工单</h3><a class="go" href="team.html">团队看板 →</a></div>
    <div class="big">
      <div><b>${taskBoard ? orders.length : "—"}</b> <span>张工单 ｜ P1 <b style="font-size:13px;color:${p1 ? "var(--yellow)" : "var(--green)"}">${p1}</b></span></div>
      <div><b>${nf ?? "—"}</b> <span>条事实${nm != null ? `（${filled}/${nm} 个指标已有数）` : ""}</span></div>
      <div><b style="color:${alarms.length ? "var(--yellow)" : "var(--green)"}">${alarms.length}</b> <span>模块盲区报警</span></div>
    </div>
    <div class="line">缺口：${kinds.map(([k, v]) => `${esc(k)} ${v}`).join(" ｜ ") || "—"}</div>
    <div class="line">盲区：${alarms.map(m => `<a class="chip-sm" href="doc.html?f=reports/blindspot.md">${esc(m.mid)} ${esc(m.ratio)}×</a>`).join(" ") || "无"}</div>
    <div class="line">工单 = 声明 − 现状，不手写；采集需求在目标清单，研究缺口在工单，两者都从这里派出。</div></div>`;
}

function changes(d) {
  const pts = d.changes.series_points.map(p => `<div class="kv"><span>${esc(p.series_id)}</span><b>${fmt(p.value, p.unit)}<small>${esc(p.as_of)}</small></b></div>`).join("");
  const due = d.changes.due_targets.slice(0, 12).map(t => `<div class="kv"><span>${esc(t.id)}</span><b>${esc(t.team)}<small>${esc(t.next_due)}</small></b></div>`).join("");
  return `<div class="col"><h3>价格库最新点</h3>${pts || '<div class="empty">无</div>'}</div><div class="col"><h3>30 天内到期且仍缺的目标 <span class="empty">共 ${d.changes.due_total}</span></h3>${due || '<div class="empty">无</div>'}</div>`;
}

(async () => {
  const [d, targetsDoc] = await Promise.all([get("data/dashboard.json"), get("data/tco_targets.json")]);
  const T = targetsDoc.targets, TEAMS = targetsDoc.teams;
  const crumbs = [["root", "数据中心"]];
  let title, kind, cells, children, factorPred, rows, sup = "", desc = "";
  const [type, key] = NODE.includes(":") ? NODE.split(/:(.*)/s) : [NODE, ""];
  const parentSys = type === "ecosystem" ? (d.parent_systems || []).find(e => e.id === key) : null;
  const eco = type === "ecosystem" ? d.ecosystems.find(e => e.id === key) : null;
  const part = type === "part" ? d.parts[key] : null;
  const right = type === "site" && key ? d.rights[key] : null;
  if (NODE === "root") {
    title = `一座 <em>AI 数据中心</em>`; kind = "根节点 · 三级账在上，五列在下，八生态与站点权利是第一层分叉";
    cells = d.root.cells; factorPred = f => f.parent === null;
    rows = T.filter(t => t.origin === "factor");
    byId("account").innerHTML = `<div class="account">${d.root.account.rows.map(r => `<div class="acct"><div class="l">${esc(r.label)}</div><div class="v">${r.key === "roic" ? pct(r.value) : fmt(r.value, "")}</div><div class="u">${esc(r.unit)} · ${esc(d.root.account.scenario)}</div><div class="n">${esc(r.note)}</div></div>`).join("")}</div>
      <div class="links">${d.root.account.links.map(([l, h]) => `<a href="${h}">${esc(l)} ↗</a>`).join("")}<span class="empty">三级由经济模型基准情景计算；回报是账的输出，不是一列。账本先对齐三个模型共用的假设，再各看各的。</span></div>`;
    byId("q1").textContent = "五类变量在根节点：构成是规模与代际，运行是效率与利用率，价格是资本开支与年成本，时间是寿命与周期，主体是持有与融资方式。";
    byId("h2").innerHTML = `它由什么组成<small>树 · 八个生态 × 五类变量，第九行是站点权利</small>`;
    children = matrix(d);
    byId("q3").textContent = "因子树从公式往下推：每个因子汇总它的部件与权利，再喂经济模型的输入。";
    byId("q4").textContent = `目标清单 ${T.length} 行：sourced ${d.root.targets.sourced}、assumed ${d.root.targets.assumed}、needed ${d.root.targets.needed}。采集需求、研究工单、价格库新点与新闻事件都从这里出发；因子级目标折叠在下，部件级目标在各生态与部件节点。`;
    byId("changes").innerHTML = changes(d);
    deliveryBoard().then(html => { byId("grid").innerHTML = html; }).catch(() => {});
  } else if (parentSys) {
    crumbs.push([NODE, parentSys.name]);
    title = `<em>${esc(parentSys.name)}</em> 系统`; kind = `第一层节点 · 展开为 ${parentSys.children.length} 个子系统`;
    cells = parentSys.cells; const kidIds = new Set(parentSys.children);
    const kidParts = new Set(d.ecosystems.filter(e => kidIds.has(e.id)).flatMap(e => e.parts.map(p => p.id)));
    factorPred = f => (f.bom_parts || []).some(p => kidParts.has(p));
    rows = T.filter(t => t.part_id && kidParts.has(t.part_id));
    byId("q1").textContent = "IT 是五个系统之一，再分计算、内存、存储、网络；本行是四个子系统的汇总。";
    byId("h2").innerHTML = `它由什么组成<small>树 · 四个子系统</small>`;
    children = `<div class="tscroll"><table><thead><tr><th>子系统</th><th>构成</th><th>运行</th><th>价格</th><th>时间</th><th>主体</th></tr></thead><tbody>${d.ecosystems.filter(e => kidIds.has(e.id)).map(e => `<tr><td><a href="${nodeHref("ecosystem:" + e.id)}">${esc(e.name.replace("IT · ", ""))}</a></td>${["1", "2", "3", "4", "5"].map(n => { const c = e.cells[n]; const i = c.items[0]; return `<td><span class="dot st-${c.status}"></span>${i ? fmt(i.value, i.unit) : '<span class="empty">缺</span>'}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
    byId("q3").textContent = "挂到 IT 任一部件的因子。";
    byId("q4").textContent = "四个子系统全部部件的目标行，按队汇总。";
  } else if (eco) {
    if (eco.parent) crumbs.push(["ecosystem:" + eco.parent, d.systems?.[eco.parent]?.name || eco.parent]);
    crumbs.push([NODE, eco.name]);
    title = `<em>${esc(eco.name)}</em> 系统`; kind = `${eco.parent ? "IT 的子系统" : "第一层节点"} · ${eco.parts.length} 个条目 · 链路：${(eco.chains || []).join(" → ") || "—"} · 研究入口 ${esc(eco.graph_name || "")}`;
    cells = eco.cells; const ids = new Set(eco.parts.map(p => p.id));
    factorPred = f => (f.bom_parts || []).some(p => ids.has(p));
    rows = T.filter(t => t.part_id && ids.has(t.part_id));
    byId("q1").textContent = "生态的五列由部件聚合：部件数、系统效率、每 MW 造价（因子树分线 × 份额）、关键路径交期（部件交期取最大）、供应商数与单一来源部件。";
    byId("h2").innerHTML = `它由什么组成<small>树 · 部件按链路分段，每行五个状态点</small>`;
    children = partsTable(eco.parts, d);
    byId("q3").textContent = "挂到这个生态任一部件的因子。";
    byId("q4").textContent = "这个生态全部部件的目标行，按队汇总。";
  } else if (part) {
    crumbs.push(["ecosystem:" + part.system, d.ecosystems.find(e => e.id === part.system)?.name || part.system], [NODE, part.name]);
    title = `<em>${esc(part.name)}</em>`; kind = `${d.systems?.[part.system]?.name || part.system}${part.chain ? " · 链路「" + esc(part.chain) + "」第 " + part.chain_order + " 位" : ""} · ${part.kind === "part" ? "尺度 " + part.layer : part.kind === "software" ? "软件条目" : "设施基型"} · 模块 ${esc(part.module)}`;
    sup = `<span class="badge sup-${part.supply_status}">${SUP[part.supply_status] || part.supply_status}</span>`; desc = part.desc;
    cells = part.cells; factorPred = f => (f.bom_parts || []).includes(part.id);
    rows = T.filter(t => t.part_id === part.id);
    byId("q1").textContent = "部件的五列就是重切规则的条件：自己的规格、运行指标、价格、交期、供应商名单。";
    byId("h2").innerHTML = `它由什么组成 / 属于什么<small>树 · 装配与研究入口</small>`;
    children = `<div class="links"><a href="${nodeHref("ecosystem:" + part.system)}">← 回到生态</a><a href="bom.html#${encodeURIComponent(part.id)}">爆炸图档案</a>${part.kind === "part" ? `<a href="bom3d.html?${new URLSearchParams({ p: part.id, node: "part:" + part.id })}">园区 3D 定位</a>` : ""}${["S4", "S5"].includes(part.layer) ? `<a href="rack3d.html?x=100&node=${encodeURIComponent("part:" + part.id)}">机柜拆解</a>` : ""}<a href="research.html?node=${encodeURIComponent("part:" + part.id)}&view=P&tab=overview">研究工作台（九主题）</a></div><div class="empty" style="margin-top:6px">装配关系与空间位置在研究图谱与 3D 场景里登记；本页不复制第二份。</div>`;
    byId("q3").textContent = "这个部件汇到哪些因子，因子的公式与它喂的模型输入。";
    byId("q4").textContent = "这个部件的目标行：规格、价格、交期各一行，非成熟部件另有新闻事件行。";
  } else if (type === "site") {
    if (right) {
      crumbs.push(["site", "站点权利"], [NODE, right.name]);
      title = `<em>${esc(right.name)}</em>`; kind = `站点权利 · 尺度 ${esc(right.scale)} · 模块 ${esc(right.module)}`;
      sup = `<span class="badge sup-${right.supply_status}">${SUP[right.supply_status] || right.supply_status}</span>`; desc = right.desc;
      cells = right.cells; factorPred = f => (f.site_rights || []).includes(right.id);
      rows = T.filter(t => t.site_right_id === right.id);
      byId("q1").textContent = "权利不可采购，只有价格、时间、主体三列有登记来源。";
      children = `<div class="links"><a href="${nodeHref("site")}">← 全部站点权利</a><a href="bom3d.html?${new URLSearchParams({ p: right.id })}">园区 3D 定位</a></div>`;
      byId("q3").textContent = "这条权利汇到哪些因子。";
      byId("q4").textContent = "这条权利按登记的变量类各有一行目标。";
    } else {
      crumbs.push(["site", "站点权利"]);
      title = `<em>站点权利</em>`; kind = "矩阵第九行 · 不是部件：土地、水权、电力配额与并网、天然气接入、网络接入、许可";
      cells = d.site.cells; const ids = new Set(d.site.rights.map(r => r.id));
      factorPred = f => (f.site_rights || []).some(r => ids.has(r));
      rows = T.filter(t => t.site_right_id);
      byId("q1").textContent = "权利只有价格、时间、主体三列有来源；构成列是条目数。";
      byId("h2").innerHTML = `它由什么组成<small>树 · 六条权利</small>`;
      children = `<div class="tscroll"><table><thead><tr><th>权利</th><th>状态</th><th>变量类</th><th>价格</th><th>时间</th><th>主体</th></tr></thead><tbody>${d.site.rights.map(r => { const c = d.rights[r.id].cells; return `<tr><td><a href="${nodeHref("site:" + r.id)}">${esc(r.name)}</a></td><td><span class="dot sup-${r.supply_status}"></span>${SUP[r.supply_status] || ""}</td><td>${r.variable_classes.join("、")}</td>${["3", "4", "5"].map(n => `<td><span class="dot st-${c[n]?.status || "needed"}"></span>${c[n]?.items?.[0] ? fmt(c[n].items[0].value, c[n].items[0].unit) : '<span class="empty">缺</span>'}</td>`).join("")}</tr>`; }).join("")}</tbody></table></div>`;
      byId("q3").textContent = "挂到任一权利的因子。";
      byId("q4").textContent = "六条权利的目标行。";
    }
  } else {
    throw new Error("未知节点：" + NODE);
  }
  byId("crumbs").innerHTML = crumbs.map(([id, name], i) => `<a href="${nodeHref(id)}" ${i === crumbs.length - 1 ? 'aria-current="page"' : ""}>${esc(name)}</a>`).join("");
  byId("head").innerHTML = `<h1>${title}</h1><span class="kind">${kind}</span>${sup}${desc ? `<div class="kind" style="flex-basis:100%">${esc(desc)}</div>` : ""}`;
  byId("five").innerHTML = fiveColumns(cells, d.columns);
  byId("children").innerHTML = children;
  byId("factors").innerHTML = factorList(d.factors, factorPred, NODE === "root" ? d.formulas : null);
  byId("targets").innerHTML = NODE === "root" ? `<details><summary>因子级目标 ${rows.length} 行（按队汇总与明细）</summary>${targetPanel(rows, TEAMS)}</details>` : targetPanel(rows, TEAMS);
  byId("news").style.display = NODE === "root" ? "" : "none";
  document.title = (NODE === "root" ? "一座 AI 数据中心" : byId("head").querySelector("h1").textContent) + " — inresearch.ai";
  document.querySelector(".it-toggle")?.addEventListener("click", () => {
    const u = new URL(location.href); if (u.searchParams.get("it") === "1") u.searchParams.delete("it"); else u.searchParams.set("it", "1");
    history.replaceState(null, "", u); byId("children").innerHTML = matrix(d); byId("children").querySelector(".it-toggle")?.addEventListener("click", () => location.reload());
  });
  if (COL) byId("col-" + COL)?.scrollIntoView({ block: "nearest" });
})().catch(e => { byId("error").innerHTML = `<div class="err">加载失败：${esc(e.message)}</div>`; byId("head").innerHTML = "<h1>节点</h1>"; });
</script>
</body>
</html>
