<form data-auth-form action="/api/passwd" method="post">
  <h1>修改密码</h1>
  <label for="old">当前密码</label><input id="old" name="old_password" type="password" autocomplete="current-password" autofocus>
  <label for="n1">新密码（至少 8 位）</label><input id="n1" name="new_password" type="password" autocomplete="new-password">
  <label for="n2">再输一遍</label><input id="n2" name="confirm_password" type="password" autocomplete="new-password">
  <button>确认修改</button>
  <div class="msg" id="msg" role="status"></div>
  <a href="/">← 返回首页</a>
</form>
