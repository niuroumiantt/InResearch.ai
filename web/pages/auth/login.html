<form data-auth-form action="/api/login" method="post">
  <h1>inresearch.ai</h1>
  <p class="sub">数据中心研究 · 内部系统</p>
  <label for="u">用户名</label><input id="u" name="username" autocomplete="username" autofocus>
  <label for="p">密码</label><input id="p" name="password" type="password" autocomplete="current-password">
  <button>登录</button>
  <div class="err" id="err" role="status"></div>
  <div class="note">账号由管理员分配，本系统不提供注册</div>
</form>
