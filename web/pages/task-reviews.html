<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>作业审批 · inresearch.ai</title>
  <script src="/assets/theme-state.js"></script><script src="/assets/site-skin.js"></script>
  <link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css"><link rel="stylesheet" href="/assets/task-reviews.css">
  <script src="/assets/task-reviews.js" defer></script>
</head>
<body><inresearch-shell data-section="admin"></inresearch-shell>
<main class="review-workspace">
  <nav class="review-breadcrumb" aria-label="当前位置"><a href="/workspace.html?section=production&view=tasks">研究生产</a><span aria-hidden="true">/</span><span>作业审批</span></nav>
  <header class="review-header"><div><p class="review-eyebrow">材料接收 / 管理员工作台</p><h1>作业审批</h1><p>核对原件后确认分析；合格条目自动上线。进度、报告和修改任务都在对应文件中。</p></div><div class="review-header-actions"><a href="/tasks.html#upload">查看员工上传页 ↗</a><button type="button" id="review-refresh">刷新列表</button></div></header>
  <div id="review-message" class="review-message" role="status" aria-live="polite"></div>
  <section class="review-overview" aria-label="作业概况"><div><strong id="review-count-pending">—</strong><span>待确认</span></div><div><strong id="review-count-working">—</strong><span>分析中</span></div><div><strong id="review-count-done">—</strong><span>已有反馈</span></div><div><strong id="review-count-rejected">—</strong><span>已退回</span></div></section>
  <div class="review-layout"><section class="review-queue" aria-labelledby="review-queue-title"><div class="review-queue-head"><div><p class="review-eyebrow">提交记录</p><h2 id="review-queue-title">文件列表</h2></div><span id="review-visible-count" class="review-visible-count"></span></div><label class="review-search-label">查找文件或提交人<input id="review-search" type="search" placeholder="文件名、提交人、编号" autocomplete="off"></label><div id="review-filters" class="review-filters" role="group" aria-label="按状态筛选"><button type="button" data-filter="pending" aria-pressed="true">待处理</button><button type="button" data-filter="working" aria-pressed="false">分析中</button><button type="button" data-filter="done" aria-pressed="false">已有反馈</button><button type="button" data-filter="all" aria-pressed="false">全部</button></div><div id="review-queue-list" class="review-queue-list"></div></section>
  <section class="review-detail" aria-labelledby="review-detail-title"><div id="review-detail-content"><div class="review-empty"><h2 id="review-detail-title">正在读取文件</h2><p>请稍候。</p></div></div></section></div>
</main>
</body></html>
