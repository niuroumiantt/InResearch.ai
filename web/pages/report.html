<script>
const REPO = "https://github.com/niuroumiantt/InResearch.ai/blob/main/";
const CN = ["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五"];

async function get(path) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(path + " → HTTP " + r.status);
  return path.endsWith(".json") || path.startsWith("/api/") ? r.json() : r.text();
}
const {escape: esc, inline} = window.ResearchMarkdown;

function bulletsToHtml(items) {
  // items: [{depth, text}] → nested ul
  let html = "", depth = 0;
  for (const it of items) {
    while (depth < it.depth) { html += "<ul>"; depth++; }
    while (depth > it.depth) { html += "</ul>"; depth--; }
    html += "<li>" + inline(it.text) + "</li>";
  }
  while (depth > 0) { html += "</ul>"; depth--; }
  return html;
}

function parseFields(bodyLines) {
  // 顶层 "- **字段**：..." 分组；子弹与续行归入当前字段
  const fields = {}; let cur = null; const notes = [];
  for (const raw of bodyLines) {
    const top = raw.match(/^-\s+\*\*([^*]+)\*\*：?\s*(.*)$/);
    if (top) {
      cur = top[1].trim();
      fields[cur] = { text: top[2] || "", items: [] };
      continue;
    }
    const sub = raw.match(/^(\s+)-\s+(.*)$/);
    if (sub && cur) { fields[cur].items.push({ depth: Math.max(1, Math.floor(sub[1].length / 2)), text: sub[2] }); continue; }
    if (raw.trim() && cur) { fields[cur].text += (fields[cur].text ? " " : "") + raw.trim(); continue; }
    if (raw.trim()) notes.push(raw.trim());
  }
  return { fields, notes };
}

function renderFinding(f, num) {
  const stCls = f.status === "current" ? "b-cur" : (f.status === "needs-review" ? "b-rev" : "b-sta");
  const { fields, notes } = parseFields(f.body);
  let h = `<div class="finding${f.status !== "current" ? " review-note" : ""}" id="${esc(f.id)}" style="${f.status !== "current" ? "padding-left:14px" : ""}">`;
  h += `<h3>${num} ${inline(f.title)}</h3>`;
  h += `<div class="fmeta"><span class="badge ${stCls}">${esc(f.status)}</span>`;
  if (f.qtags) h += `<span class="badge b-q">${esc(f.qtags)}</span>`;
  h += ` 修订 ${esc(f.revised || "—")} · ${esc(f.id)}</div>`;
  if (notes.length) h += `<div class="fmeta">${inline(notes.join(" "))}</div>`;
  if (fields["结论"]) h += `<p class="lead"><b class="lbl">结论：</b>${inline(fields["结论"].text)}${bulletsToHtml(fields["结论"].items)}</p>`;
  if (fields["论证"]) {
    h += fields["论证"].text ? `<p class="lead"><b class="lbl">论证：</b>${inline(fields["论证"].text)}</p>` : "";
    h += `<ul class="arg">${bulletsToHtml(fields["论证"].items).replace(/^<ul>|<\/ul>$/g, "")}</ul>`;
  }
  if (fields["口径提醒"]) h += `<div class="cav"><b class="lbl">⚖ 口径提醒：</b>${inline(fields["口径提醒"].text)}${bulletsToHtml(fields["口径提醒"].items)}</div>`;
  if (fields["证据"]) h += `<details><summary>证据（${(fields["证据"].items.length || 1)} 条，含来源链接）</summary>${bulletsToHtml(fields["证据"].items) || "<p>" + inline(fields["证据"].text) + "</p>"}</details>`;
  if (fields["待办"]) h += `<details><summary>内部待办</summary>${bulletsToHtml(fields["待办"].items) || "<ul><li>" + inline(fields["待办"].text) + "</li></ul>"}</details>`;
  h += `</div>`;
  return h;
}

function renderGenericBlock(header, lines) {
  let h = header ? `<div class="open-q"><h3>${inline(header)}</h3>` : "<div>";
  let items = [], para = [];
  const flush = () => {
    if (items.length) { h += "<ul class='arg'>" + bulletsToHtml(items).replace(/^<ul>|<\/ul>$/g, "") + "</ul>"; items = []; }
    if (para.length) { h += "<p class='lead'>" + inline(para.join(" ")) + "</p>"; para = []; }
  };
  for (const raw of lines) {
    const li = raw.match(/^(\s*)-\s+(.*)$/);
    const ol = raw.match(/^(\d+)\.\s+(.*)$/);
    if (li) { if (para.length) flush(); items.push({ depth: Math.max(1, Math.floor(li[1].length / 2) + 1) - 1 || 1, text: li[2] }); }
    else if (ol) { if (para.length || items.length) flush(); h += `<li value="${ol[1]}" style="margin:10px 0 10px 30px;text-align:justify">${inline(ol[2])}</li>`; }
    else if (raw.startsWith("> ")) { flush(); h += `<blockquote>${inline(raw.slice(2))}</blockquote>`; }
    else if (!raw.trim()) flush();
    else para.push(raw.trim());
  }
  flush();
  return h + "</div>";
}

document.getElementById("print-report").addEventListener("click", () => window.print());
const LEGACY = new URLSearchParams(location.search).get("legacy") === "1";
const STATUS = { sourced: "已有", assumed: "假设", delivered: "已交付", registered: "登记数", needed: "缺" };
const fmt = (v, u) => v == null ? "缺" : (typeof v === "number" ? (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (Number.isInteger(v) ? String(v) : v.toLocaleString(undefined, { maximumFractionDigits: 3 }))) : esc(String(v))) + (u ? ` <small>${esc(u)}</small>` : "");

/* Delivered snapshot: the three research chapters are selected by stable ID.
   Operational dispatch remains in the authorized API/backstage, not this document. */
async function renderSnapshot() {
  const r = await get("/api/report");
  const b = r.boundary, chapters = new Map(r.chapters.map(chapter => [chapter.id, chapter])), toc = [];
  const q1 = chapters.get("q1"), q2 = chapters.get("q2"), q3 = chapters.get("q3");
  if (!q1 || !q2 || !q3) throw new Error("报告缺少必要研究章节");
  const st = s => `<span class="badge b-${s === "sourced" ? "cur" : s === "needed" ? "sta" : "rev"}">${STATUS[s] || esc(s)}</span>`;
  let html = `<section class="page-doc cover-page" id="cover"><div class="cover"><h1>${esc(r.title)}</h1>
    <div class="meta">数据时点 ${esc(r.as_of)} ｜ 源数据版本 ${esc(r.data_revision.slice(0, 12))} ｜ 模型口径 ${esc(b.registries.model || "未登记")}<br>
    分类版本 ${esc(b.registries.bom || "未登记")} · 研究数据版本 ${esc(b.registries.dashboard || "未登记")}<br>
    <b>可信边界</b>：模型输入 ${b.model_inputs.total} 个（已有 ${b.model_inputs.sourced} · 假设 ${b.model_inputs.assumed} · 用户给定 ${b.model_inputs.input}）。基准情景：${esc(b.scenario)}。<br>
    缺失不填零；来源记载、研究采用与模型情景分别表达。生成日期不代表来源核验日期。</div>
    <p class="chapter-sub">源数据版本用于识别当前快照，不是完整历史版本库。本页尚未提供完整报告版本归档；可使用上方打印保存当前阅读内容。</p></div></section>`;
  // 一、它值多少
  toc.push({ id: "q1", label: "一、它值多少" });
  html += `<section class="page-doc chapter" id="q1"><h2 class="chapter">一、它值多少</h2><div class="chapter-sub">三级账来自唯一的统一经济模型（基准情景）；回报是账的输出，不是一列。</div>
    <table><tr><th>级</th><th>值</th><th>单位</th><th>说明</th><th>输入的证据</th></tr>${q1.account.map(a => `<tr><td><b>${esc(a.label)}</b></td><td>${a.key === "roic" ? (a.value * 100).toFixed(1) + "%" : fmt(a.value)}</td><td>${esc(a.unit)}</td><td>${esc(a.note)}</td><td>${a.evidence ? `${a.evidence.inputs} 个：已有 ${a.evidence.sourced} · 假设 ${a.evidence.assumed} · 用户给定 ${a.evidence.input}` : ""}</td></tr>`).join("")}</table>
    <h3>五列的根节点现值</h3><table><tr><th>列</th><th>状态</th><th>值</th></tr>${Object.entries(q1.columns).map(([col, c]) => `<tr><td>${col} ${esc(c.name)}</td><td>${st(c.status)}</td><td>${c.items.filter(i => i.value != null).map(i => `${esc(i.label)} ${fmt(i.value, i.unit)}${i.as_of ? ` <small>${esc(String(i.as_of).slice(0, 7))}</small>` : ""}`).join("；") || "缺"}</td></tr>`).join("")}</table>
    ${q1.calibration.length ? `<h3>校准锚</h3><table><tr><th>锚</th><th>登记值</th><th>来源</th></tr>${q1.calibration.map(c => `<tr><td>${esc(c.label || c.preset)}</td><td>${Object.entries(c.anchors).map(([k, v]) => `${esc(k)} ${fmt(v)}`).join("；")}</td><td>${esc(c.source || "")}</td></tr>`).join("")}</table>` : ""}
    <div class="chapter-src">读法入口：${(q1.readings || []).map(x => `<a href="${esc(x.href)}">${esc(x.label)}</a>`).join(" · ")} · 账本 <a href="ledger.html">四个视图</a></div></section>`;
  // 二、它由什么组成
  toc.push({ id: "q2", label: "二、它由什么组成" });
  const rowsOf = list => list.map(e => `<tr><td>${e.parent ? "└ " : ""}<a href="node.html?id=system:${esc(e.id)}">${esc(e.name)}</a></td><td>${e.parts ?? e.children?.length ?? ""}</td><td>${esc((e.chains || []).join(" → "))}</td>${["1", "2", "3", "4", "5"].map(c => `<td>${st(e.cells[c])}</td>`).join("")}</tr>`).join("");
  html += `<section class="page-doc chapter" id="q2"><h2 class="chapter">二、它由什么组成</h2><div class="chapter-sub">一个骨架：五个系统（IT 展开计算、存储、网络，存储再分内存与持久存储）× 能量流链路 ${q2.counts.chains} 条 × 部件 ${q2.counts.parts} 个（软件 ${q2.counts.software}、基型 ${q2.counts.archetype}）；站点权利 ${q2.counts.rights} 条并列。</div>
    <table><tr><th>系统</th><th>部件</th><th>链路</th><th>构成</th><th>运行</th><th>价格</th><th>时间</th><th>主体</th></tr>${rowsOf(q2.systems.filter(e => !e.parent))}${rowsOf(q2.parent_systems)}${rowsOf(q2.systems.filter(e => e.parent))}<tr><td><a href="node.html?id=site">站点权利</a></td><td>${q2.site.rights.length}</td><td>不可采购，与五个系统并列</td>${["1", "2", "3", "4", "5"].map(c => `<td>${st(q2.site.cells[c])}</td>`).join("")}</tr></table>
    <h3>它怎么建：六段建设阶段</h3><table><tr><th>段</th><th>部件</th><th>权利</th></tr>${q2.stages.map(s => `<tr><td>${s.order} ${esc(s.name)}</td><td>${s.parts.length}</td><td>${s.rights.length}</td></tr>`).join("")}</table>
    <div class="chapter-src">视觉形式：<a href="bom.html">爆炸图</a> · <a href="bom3d.html">3D</a> · 时间线 <a href="node.html?col=4">node.html?col=4</a></div></section>`;
  // 三、它怎么影响账
  toc.push({ id: "q3", label: "三、它怎么影响账" });
  html += `<section class="page-doc chapter" id="q3"><h2 class="chapter">三、它怎么影响账</h2><div class="chapter-sub">规则：因子树从公式往下推，每个因子汇总它的部件与权利，再喂模型输入。</div>
    ${Object.entries(q3.formulas).map(([k, v]) => `<p class="lead"><b class="lbl">${esc(k)}：</b><code>${esc(v)}</code></p>`).join("")}
    <table><tr><th>因子</th><th>侧</th><th>公式</th><th>模型输入</th><th>部件</th><th>权利</th></tr>${q3.factors.map(f => `<tr><td>${f.parent ? "└ " : "<b>"}${esc(f.label)}${f.parent ? "" : "</b>"}</td><td>${esc(f.side)}</td><td><code>${esc(f.formula || "")}</code></td><td>${f.model_inputs}</td><td>${f.bom_parts}</td><td>${f.site_rights}</td></tr>`).join("")}</table></section>`;
  // 四、读者口径与来源说明；不读取内部q4派工字段。
  toc.push({ id: "q4", label: "四、口径与来源" });
  html += `<section class="page-doc chapter" id="q4"><h2 class="chapter">四、口径与来源</h2>
    <p>模型输入区分已有来源、作者假设与用户给定。分类、公式与结果共用当前正式数据；有来源的记录不自动证明适用于每个项目或情景。</p>
    <p>具体来源、信息日期、统计范围与不确定性随对应内容展示。历史补录不会变成今天发生的事件，报告生成时间也不会刷新原始来源日期。</p>
    <div class="chapter-src"><a href="/guide.html?view=method">数据口径与方法</a> · <a href="/guide.html?view=sources">来源与引用</a></div></section>`;
  document.getElementById("docroot").innerHTML = html;
  document.getElementById("toc").innerHTML = toc.map(t => `<a href="#${t.id}" id="toc-${t.id}">${t.label}</a>`).join("");
  document.getElementById("report-mode").textContent = "研究报告 · 当前快照";
  document.title = r.title + " — inresearch.ai";
  const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (target) target.scrollIntoView();
}

(async () => {
  try {
    if (!LEGACY) { await renderSnapshot(); return; }
    document.getElementById("report-mode").textContent = "内部兼容研究结论";
    const contextLink = document.getElementById("report-context-link");
    contextLink.href = "/workspace.html?section=production&view=adoption"; contextLink.textContent = "返回研究审核与采用";
    const report = await get("/api/report?legacy=1");
    const chapters = report.chapters;
    const summaryMd = report.summary;
    const totalFindings = report.finding_count;
    const reviewCount = report.review_count;
    const sources = new Set(report.sources);
    const reg = {version: report.framework_version};
    const mods = chapters.map(ch => ch.module);

    const today = new Date().toISOString().slice(0, 10);
    let html = `<section class="page-doc cover-page"><div class="cover"><h1>全球数据中心研究</h1>
      <div class="meta">兼容研究结论 ｜ 生成日期 ${today} ｜ 内容版本 ${esc(report.data_revision.slice(0,12))} ｜ ${mods.length} 章 · ${totalFindings} 条研究结论 · ${sources.size} 个来源
      ${reviewCount ? `｜ <span style="color:var(--yellow)">⚠️ ${reviewCount} 条待复核</span>` : ""}<br>
      生成日期不代表来源核验日期；既有 Finding 未自动取得对象证据的 C3 采用资格。历史记录为结论修订，不是完整报告版本库。<br>
      框架 v${reg.version} · 口径规则见<a href="doc.html?f=framework/01_data_standards.md">《口径与核验规则手册》</a> · 证据分级 S1 监管文件 / S2 公司披露 / S3 权威第三方 / S4 媒体 / S5 推算</div></div>`;

    const toc = [];
    if (summaryMd) {
      html += `<h2 class="chapter" id="ch-summary">执行摘要 — 十大核心判断</h2>`;
      const summaryLines = summaryMd.split("\n").filter(l => !l.startsWith("#"));
      html += `<ol class="summary-list">` + renderGenericBlock(null, summaryLines.filter(l => !l.startsWith(">"))).replace(/^<div>|<\/div>$/g, "") + `</ol>`;
      html += `<div class="chapter-src">源文件 <code>research/SUMMARY.md</code> · <a href="doc.html?f=research/SUMMARY.md">原文</a> · <a href="${REPO}research/SUMMARY.md" target="_blank">GitHub</a></div>`;
      toc.push({ id: "ch-summary", label: "执行摘要" });
    }
    html += `</section>`;

    chapters.forEach((ch, i) => {
      const m = ch.module;
      const cid = "ch-" + m.id;
      toc.push({ id: cid, label: `第${CN[i]}章 ${m.name}` });
      html += `<section class="page-doc"><h2 class="chapter" id="${cid}">第${CN[i]}章 ${m.name}</h2>`;
      html += `<div class="chapter-sub">${m.id} · ${m.en} · 溯源 ${(m.source_questions || []).join(" ") || "新增研究"} · 更新节奏 ${m.update_freq}</div>`;
      if (ch.position) html += `<blockquote>${inline(ch.position.replaceAll("\n", " "))}</blockquote>`;
      ch.findings.forEach((finding, n) => { html += renderFinding(finding, `${i + 1}.${n + 1}`); });
      html += `<div class="chapter-src">本章源文件 <code>${ch.source}</code>（<a href="doc.html?f=${ch.source}">原文</a> · <a href="${REPO}${ch.source}" target="_blank">GitHub</a>）
        · 模块定义 <code>framework/${ch.definition}</code>（<a href="doc.html?f=framework/${ch.definition}">原文</a>）
        · 依赖数据表 ${(m.tables || []).map(t => `<a href="${REPO}data/${t}.json" target="_blank">${t}</a>`).join(" / ")}</div></section>`;
    });

    if (report.history.length) {
      html += `<section class="page-doc"><h2>历史记录</h2>` + report.history.map(f =>
        `<p id="${esc(f.id)}">${esc(f.id)} · ${esc(f.status)} · <a href="doc.html?f=${encodeURIComponent(f.source)}">查看历史原文</a></p>`).join("") + `</section>`;
    }
    document.getElementById("docroot").innerHTML = html;
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) target.scrollIntoView();
    document.getElementById("toc").innerHTML = toc.map(t => `<a href="#${t.id}" id="toc-${t.id}">${t.label}</a>`).join("");

    // 滚动高亮
    const heads = toc.map(t => document.getElementById(t.id));
    addEventListener("scroll", () => {
      let on = heads[0];
      for (const h of heads) if (h && h.getBoundingClientRect().top < 120) on = h;
      document.querySelectorAll("nav.toc a").forEach(a => a.classList.remove("on"));
      const link = document.getElementById("toc-" + on?.id);
      if (link) link.classList.add("on");
    }, { passive: true });
  } catch (e) {
    const error = document.createElement("div");
    error.className = "err";
    error.textContent = e.message;
    document.getElementById("docroot").replaceChildren(error);
  }
})();
</script>
</body>
</html>
