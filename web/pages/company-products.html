<!doctype html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>超微 · 产品分类与规格</title>
<script src="/assets/theme-state.js"></script><script src="/assets/site-skin.js"></script>
<script type="module" src="/assets/site-shell.js"></script>
<link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css">
<link rel="stylesheet" href="/assets/company-browser.css">
</head><body><inresearch-shell data-section="bom" data-audience="reader"></inresearch-shell>
<main id="company-browser">
<nav id="browser-breadcrumbs" aria-label="当前位置"><a href="/product-catalog.html?c=supermicro">公司首页</a><span>产品分类</span></nav>
<header class="browser-header"><div><p class="browser-eyebrow">Supermicro / 产品与技术资料</p><h1 id="catalog-title">超微产品分类</h1></div><p id="browser-summary">正在读取已收录资料…</p></header>
<form id="browser-search"><label for="query">搜索</label><input id="query" type="search" placeholder="型号、CPU、GPU 或规格，如 B200" autocomplete="off"><button type="submit">搜索</button><label for="kind" class="sr-label">条目类型</label><select id="kind"><option value="">全部条目</option><option value="named_product">具体型号</option><option value="family_or_directory">系列 / 目录</option><option value="software_service">软件 / 服务</option></select><label class="spec-filter"><input id="with-specs" type="checkbox">有规格</label></form>
<nav class="browser-tools" aria-label="产品资料入口"><a href="/product-catalog.html?c=supermicro">公司首页</a><a href="/product-catalog.html?c=supermicro&view=categories">全部分类</a><a href="/product-catalog.html?c=supermicro&view=materials">手册与附件</a><a href="/product-catalog.html?c=supermicro&view=research#relationships">部件关系</a><span id="comparison-tools" hidden><button id="open-comparison" type="button">对比</button><button id="clear-comparison" type="button">清空</button></span></nav>
<p id="status" role="status" aria-live="polite">正在读取产品分类…</p>
<div class="browser-layout" id="browse-body"><aside><h2>产品分类</h2><nav id="category-tree" aria-label="公司产品分类"></nav><p class="browser-basis">按官方路径与明确原表字段整理浏览分类；保留原厂分类原文。</p></aside>
<section class="browser-results"><header class="results-heading"><h2 id="category-title">产品分类</h2><span id="matches"></span></header><nav id="category-children" aria-label="子分类"></nav>
<div class="results-actions"><span id="result-context"></span><details><summary>导出</summary><a id="export-products">产品清单 CSV</a><a id="export-specs">官方参数 CSV</a></details><button id="retry" type="button">刷新</button></div>
<div class="browser-table-wrap"><table class="browse-models"><thead><tr><th>对比</th><th>型号 / 系列</th><th>GPU / CPU</th><th>内存 / 存储</th><th>浏览分类</th><th>规格</th></tr></thead><tbody id="browse-rows"></tbody></table></div>
<nav class="browser-pager" aria-label="产品分页"><button id="previous" type="button">上一页</button><span id="page-caption"></span><button id="next" type="button">下一页</button></nav></section></div>
<section id="detail" hidden aria-label="产品规格"></section>
<section id="browser-comparison" hidden aria-label="产品参数对比"></section>
</main><script src="/assets/company-browser.js" defer></script></body></html>
