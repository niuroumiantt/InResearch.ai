<script type="module">
import * as THREE from "three";
import {createScenePicking} from "/assets/scene-picking.js";
import {createSceneMotion} from "/assets/scene-motion.js";
import {createPartDossier, dossierNode} from "/assets/part-dossier.js";
import {createPartInspector} from "/assets/part-inspector.js";
import {escapeHtml as esc} from "/assets/series-summary.js";
import { bindResearchMeshNodes, installStageControl, safeURL } from "./assets/research-graph.js";
import { OrbitControls } from "./assets/vendor/OrbitControls.js";
import { EffectComposer } from "./assets/vendor/EffectComposer.js";
import { RenderPass } from "./assets/vendor/RenderPass.js";
import { UnrealBloomPass } from "./assets/vendor/UnrealBloomPass.js";
import { OutputPass } from "./assets/vendor/OutputPass.js";
import { EXRLoader } from "./assets/vendor/EXRLoader.js";
import {mountSceneView} from "/assets/scene-view.js";
import {mountSceneModels} from "/assets/model-assets.js";
import {createSceneEnvironment, createTexturePool} from "/assets/scene-resources.js";

import {loadSceneData} from "/assets/scene-data.js";
const [BOM, companies, prices, inds, reg, products, siteRights] = await loadSceneData([
  {url:"framework/bom.json", collection:"parts"},
  {url:"data/companies.json", collection:"records"},
  {url:"data/prices.json", collection:"records"},
  {url:"framework/indicators.json", collection:"indicators"},
  {url:"framework/modules.json", collection:"modules"},
  {url:"data/products.json", collection:"records"},
  {url:"framework/site_rights.json", collection:"rights"},
], {controls:[document.querySelector(".hud")]});
const CN = {}; companies.records.forEach(c => CN[c.company_id] = c.name_cn || c.name);
const INDS = {}; inds.indicators.forEach(i => INDS[i.id] = i);
const MODNAME = {}; reg.modules.forEach(m => MODNAME[m.id] = m.name);
const PART = {}; BOM.parts.forEach(p => PART[p.id] = p);
/* 站点权利（土地、水权、并网、燃气接入、网络接入）不是部件，但园区场景里有它们的位置：
   按重切前的旧部件 ID 挂进 PART，档案与研究节点沿用 part:<旧 ID>。 */
const RIGHTS = (siteRights.rights || []).map(r => ({ ...r, id: r.from_bom_part || r.id, layer: r.scale, kind: "site_right" }));
RIGHTS.forEach(r => { PART[r.id] ||= r; });
/* 被拆分的旧部件 ID（bom.aliases：substation → transformer 等）解析到去处，场景造型不必随重切改名 */
const ALIAS = {};
Object.entries(BOM.aliases || {}).forEach(([old, to]) => {
  const target = to.startsWith("site:") ? RIGHTS.find(r => r.id === old || r.id === to.slice(5)) : PART[to];
  if (target && !PART[old]) PART[old] = target;
  if (target) ALIAS[old] = target.id;
});
const PRODCOUNT = {}; (products.records || []).forEach(r => (r.bom_parts || []).forEach(bp => PRODCOUNT[bp] = (PRODCOUNT[bp] || 0) + 1));
/* 数据覆盖四维：公司/产品/价格序列/已录值指标——覆盖度热图与档案卡共用同一套口径 */
const COVC = ["#ef4444", "#f59e0b", "#eab308", "#84cc16", "#22c55e"];
const covDims = p => [
  ["公司", (p.companies || []).length],
  ["产品", PRODCOUNT[p.id] || 0],
  ["序列", (p.series || []).length],
  ["指标", (p.indicators || []).filter(i => INDS[i] && INDS[i].value != null).length],
];
const covScore = p => covDims(p).filter(d => d[1] > 0).length;
const SN = { tight: "紧缺", transition: "技术切换中", mature: "成熟", emerging: "新兴" };
const SBADGE = { tight: "#ef4444", transition: "#f59e0b", mature: "#22c55e", emerging: "#a78bfa" };

/* ─────────── 渲染器：PBR 管线 ─────────── */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const texturePool = createTexturePool({THREE});

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(0x0b0e14, 110, 260);
// Appearance changes preserve the current camera, selected object and materials.
function syncSceneAppearance() {
  scene.background = new THREE.Color(window.InresearchUI.scenePalette().background);
  if (scene.fog) scene.fog.color.copy(scene.background);
}
window.addEventListener('inresearch:appearance', syncSceneAppearance);
syncSceneAppearance();

let sceneView;
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 600);
camera.position.set(46, 30, 52);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 6, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches; controls.autoRotateSpeed = 0.5;
canvas.addEventListener("pointerdown", () => controls.autoRotate = false, { once: true });

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.25, 0.6, 0.9));
composer.addPass(new OutputPass());

/* 环境光照：真 HDR（Poly Haven CC0，assets/hdri/warehouse.exr）；加载失败回退程序化摄影棚 */
function proceduralEnv() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(60, 60, 60),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x30394a })));
  const panel = (w, h, x, y, z, c, i, ry = 0, rx = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c }));
    m.material.color.multiplyScalar(i);
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0); env.add(m);
  };
  panel(24, 14, 0, 28, 0, 0xffffff, 9, 0, Math.PI / 2);          // 顶部大柔光
  panel(30, 10, -28, 12, 0, 0xbfd6ff, 3, Math.PI / 2);           // 左冷光
  panel(30, 10, 28, 8, 0, 0xffe0b8, 2, -Math.PI / 2);            // 右暖光
  panel(40, 8, 0, 10, -28, 0x9db8e8, 2.2, 0);                    // 背部补光
  return env;
}
const sceneEnvironment = createSceneEnvironment({THREE, EXRLoader, renderer, scene,
  url:"assets/hdri/warehouse.exr", fallback:proceduralEnv});

scene.add(new THREE.HemisphereLight(0x8fa8cc, 0x0e131c, 0.55));
const dl = new THREE.DirectionalLight(0xfff2e0, 2.2);
dl.position.set(38, 55, 26);
dl.castShadow = true;
dl.shadow.mapSize.set(2048, 2048);
dl.shadow.camera.left = -70; dl.shadow.camera.right = 70;
dl.shadow.camera.top = 60; dl.shadow.camera.bottom = -60;
dl.shadow.camera.far = 160; dl.shadow.bias = -0.0006; dl.shadow.radius = 4;
scene.add(dl);
const rim = new THREE.DirectionalLight(0x6f9fff, 0.7); rim.position.set(-40, 26, -34); scene.add(rim);

/* ─────────── 程序化纹理（零二进制：全部 canvas 现画）─────────── */
const ctex = texturePool.canvas;
const rnd = (() => { let s = 42; return () => (s = s * 16807 % 2147483647) / 2147483647; })();

const TEX = {
  rackFront: hero => ctex(128, 256, (g, w, h) => {
    g.fillStyle = hero ? "#182234" : "#12161f"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#0a0d13"; g.fillRect(0, 0, 8, h); g.fillRect(w - 8, 0, 8, h);   // 立柱
    for (let y = 10; y < h - 8; y += 13) {                                          // 1U 槽位
      g.fillStyle = "#1d2635"; g.fillRect(11, y, w - 22, 10);
      g.fillStyle = "#2c3850"; g.fillRect(13, y + 1, 3, 8); g.fillRect(w - 16, y + 1, 3, 8);
      for (let x = 20; x < w - 24; x += 4) { g.fillStyle = "#0d1119"; g.fillRect(x, y + 3, 2, 5); }  // 进风孔
      const on = rnd();
      g.fillStyle = on > .5 ? "#22c55e" : (on > .25 ? "#3b82f6" : "#1a2333");
      g.fillRect(w - 22, y + 3, 3, 3);
    }
  }),
  rackSide: ctex(64, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, "#171d29"); gr.addColorStop(.5, "#1f2735"); gr.addColorStop(1, "#151b26");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,.05)"; g.strokeRect(4, 4, w - 8, h - 8);
  }),
  sled: ctex(128, 32, (g, w, h) => {
    g.fillStyle = "#232c3d"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#161d2a"; g.fillRect(4, 6, 26, h - 12); g.fillRect(34, 6, 26, h - 12);   // 盘位
    for (let x = 68; x < w - 14; x += 6) { g.fillStyle = "#10151f"; g.fillRect(x, 8, 3, h - 16); }
    g.fillStyle = "#22c55e"; g.fillRect(w - 9, 8, 3, 3);
    g.fillStyle = "#f59e0b"; g.fillRect(w - 9, 16, 3, 3);
  }),
  ports: ctex(128, 32, (g, w, h) => {
    g.fillStyle = "#101828"; g.fillRect(0, 0, w, h);
    for (let x = 6; x < w - 10; x += 9) {
      g.fillStyle = "#1e293b"; g.fillRect(x, 8, 7, 7); g.fillRect(x, 18, 7, 7);
      if (rnd() > .4) { g.fillStyle = "#38bdf8"; g.fillRect(x + 2, 10, 3, 3); }
      if (rnd() > .5) { g.fillStyle = "#22c55e"; g.fillRect(x + 2, 20, 3, 3); }
    }
  }),
  perf: ctex(64, 64, (g, w, h) => {
    g.fillStyle = "#232a36"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#141922";
    for (let y = 4; y < h; y += 8) for (let x = 4 + (y % 16 ? 4 : 0); x < w; x += 8) {
      g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill();
    }
  }, 3, 2),
  fins: ctex(128, 64, (g, w, h) => {
    g.fillStyle = "#39404d"; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 7) {
      g.fillStyle = "#4c5665"; g.fillRect(x, 2, 3, h - 4);
      g.fillStyle = "#20242d"; g.fillRect(x + 3, 2, 2, h - 4);
    }
  }, 2, 1),
  copperFins: ctex(128, 64, (g, w, h) => {
    g.fillStyle = "#8a5a2e"; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 6) {
      g.fillStyle = "#c98a4b"; g.fillRect(x, 1, 3, h - 2);
      g.fillStyle = "#5e3c1e"; g.fillRect(x + 3, 1, 2, h - 2);
    }
  }, 2, 1),
  pcb: ctex(128, 128, (g, w, h) => {
    g.fillStyle = "#0f3d2a"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(212,255,222,.28)"; g.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      g.beginPath();
      let x = rnd() * w, y = rnd() * h;
      g.moveTo(x, y);
      for (let k = 0; k < 3; k++) { rnd() > .5 ? x = rnd() * w : y = rnd() * h; g.lineTo(x, y); }
      g.stroke();
    }
    g.fillStyle = "#c9a227";
    for (let i = 0; i < 40; i++) g.fillRect(rnd() * w, rnd() * h, 2, 2);
  }),
  die: ctex(64, 64, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, "#3d2f6b"); gr.addColorStop(.4, "#2d6b5a"); gr.addColorStop(.7, "#6b3d5e"); gr.addColorStop(1, "#2f3d6b");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,.18)";
    for (let i = 8; i < w; i += 8) { g.strokeRect(i, 0, .5, h); g.strokeRect(0, i, w, .5); }
  }),
  fan: ctex(128, 128, (g, w, h) => {
    g.fillStyle = "#2a313d"; g.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    g.fillStyle = "#12161e"; g.beginPath(); g.arc(cx, cy, 56, 0, 7); g.fill();
    g.fillStyle = "#39404d";
    for (let i = 0; i < 7; i++) {
      g.save(); g.translate(cx, cy); g.rotate(i / 7 * Math.PI * 2);
      g.beginPath(); g.ellipse(28, 0, 26, 10, .5, 0, 7); g.fill(); g.restore();
    }
    g.fillStyle = "#59627a"; g.beginPath(); g.arc(cx, cy, 12, 0, 7); g.fill();
    g.strokeStyle = "#454d5e"; g.lineWidth = 4; g.beginPath(); g.arc(cx, cy, 56, 0, 7); g.stroke();
  }),
  louvre: ctex(64, 64, (g, w, h) => {
    g.fillStyle = "#8a93a2"; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 8) {

  }, 3, 2),
  glass: ctex(256, 128, (g, w, h) => {
    g.fillStyle = "rgba(130,170,220,.30)"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(220,235,255,.55)"; g.lineWidth = 2;
    for (let x = 0; x <= w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    g.beginPath(); g.moveTo(0, h * .45); g.lineTo(w, h * .45); g.stroke();
    g.strokeRect(1, 1, w - 2, h - 2);
  }),
  roof: ctex(256, 192, (g, w, h) => {
    g.fillStyle = "#79879c"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(0,0,0,.18)";
    for (let x = 0; x < w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.fillStyle = "rgba(255,255,255,.07)";
    for (let i = 0; i < 300; i++) g.fillRect(rnd() * w, rnd() * h, 2, 2);
  }),
  ground: ctex(512, 384, (g, w, h) => {
    g.fillStyle = "#11161f"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = `rgba(255,255,255,${rnd() * .035})`;
      g.fillRect(rnd() * w, rnd() * h, 1.6, 1.6);
    }
    g.strokeStyle = "rgba(140,165,200,.10)"; g.lineWidth = 1;
    for (let x = 0; x <= w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  }),
  concrete: ctex(128, 128, (g, w, h) => {
    g.fillStyle = "#2b3240"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 500; i++) {

  cab: ctex(96, 128, (g, w, h) => {

      g.fillStyle = "#22c55e"; g.fillRect(x + 4, h - 20, 4, 4);
      g.fillStyle = "#38bdf8"; g.fillRect(x + 12, h - 20, 4, 4);

/* ─────────── 造物助手 ─────────── */
const pickables = [];
const decor = [];
const animated = [];
function matsOf(o) { return Array.isArray(o.material) ? o.material : [o.material]; }
function M(color, opt = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.18, envMapIntensity: 0.8, ...opt });
}
function tag(obj, partId) {
  obj.traverse(m => {
    if (m.isMesh) {
      m.castShadow = true; m.receiveShadow = true;
      if (partId) { m.userData.part = partId; pickables.push(m); }
    }
  });
  return obj;
}
function box(w, h, d, color, x, y, z, partId, opt = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color, opt));
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function texbox(w, h, d, x, y, z, partId, faceMats) {
  // faceMats: {px,nx,py,ny,pz,nz,all} —— 未给的面用 all
  const all = faceMats.all || M(0x39445a);
  const order = ["px", "nx", "py", "ny", "pz", "nz"].map(k => faceMats[k] || all);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), order);
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function rboxGeo(w, h, d, r = 0.12) {
  const hw = Math.max(0.01, w / 2 - r), hd = Math.max(0.01, d / 2 - r);
  const s = new THREE.Shape();
  s.absarc(hw, hd, r, 0, Math.PI / 2);
  s.absarc(-hw, hd, r, Math.PI / 2, Math.PI);
  s.absarc(-hw, -hd, r, Math.PI, Math.PI * 1.5);
  s.absarc(hw, -hd, r, Math.PI * 1.5, Math.PI * 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.01, h - 2 * r), bevelEnabled: true, bevelSegments: 2, bevelSize: r * 0.9, bevelThickness: r });
  g.center();
  g.rotateX(-Math.PI / 2);
  return g;
}
function rbox(w, h, d, color, x, y, z, partId, opt = {}, r = 0.12) {
  const m = new THREE.Mesh(rboxGeo(w, h, d, r), M(color, opt));
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function cyl(r, h, color, x, y, z, partId, opt = {}, seg = 28) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), M(color, opt));
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function group(x, y, z, partId) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.userData.partId = partId;
  scene.add(g);
  return g;
}
function put(parent, mesh) { scene.remove(mesh); parent.add(mesh); return mesh; }
function explode(obj, dx, dy, dz, t0 = 0, t1 = 1) {
  animated.push({ obj, home: obj.position.clone(), off: new THREE.Vector3(dx, dy, dz), t0, t1 });
}
/* 标注牌：编号圆点 + 文字的 pill，高分屏渲染 */
function label(text, x, y, z, size = 1, color = "#9fb4d8", num = null) {
  const S = 2;
  const cv = document.createElement("canvas"), mx = cv.getContext("2d");
  mx.font = `600 ${26 * S}px Inter, "Noto Sans SC", sans-serif`;
  const tw = mx.measureText(text).width;
  const numW = num ? 40 * S : 0;
  cv.width = tw + 40 * S + numW; cv.height = 52 * S;
  const g = cv.getContext("2d");
  const W = cv.width, H = cv.height, R = 22 * S;
  g.beginPath(); g.roundRect(2 * S, 4 * S, W - 4 * S, H - 8 * S, R);
  g.fillStyle = "rgba(13,18,28,.86)"; g.fill();
  g.lineWidth = 2 * S; g.strokeStyle = color; g.globalAlpha = .65; g.stroke(); g.globalAlpha = 1;
  if (num) {
    g.beginPath(); g.arc(22 * S, H / 2, 13 * S, 0, 7);
    g.fillStyle = color; g.fill();
    g.fillStyle = "#0b0e14"; g.font = `800 ${19 * S}px -apple-system`;
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(num, 22 * S, H / 2 + S);
    g.textAlign = "left";
  }
  g.font = `600 ${26 * S}px Inter, "Noto Sans SC", sans-serif`;
  g.fillStyle = "#e8eef8"; g.textBaseline = "middle";
  g.fillText(text, (num ? 42 : 18) * S, H / 2 + S);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  sp.scale.set(W / (34 * S) * size, H / (34 * S) * size, 1);
  sp.position.set(x, y, z);
  scene.add(sp);
  return sp;
}

const slider = document.getElementById("explode");
function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function apply() {
  const t = slider.value / 100;
  const poses = new Map();
  animated.forEach(a => {
    if (!poses.has(a.obj)) poses.set(a.obj, a.home.clone());
    const k = a.t1 <= a.t0 ? 1 : Math.min(1, Math.max(0, (t - a.t0) / (a.t1 - a.t0)));
    poses.get(a.obj).addScaledVector(a.off, ease(k));
    if (a.showAfter !== undefined) a.obj.visible = t >= a.showAfter;
  });
  poses.forEach((position, obj) => obj.position.copy(position));
  let s = STAGES[0][1];
  STAGES.forEach(([th, txt]) => { if (t >= th) s = txt; });
  stageEl.textContent = s;
  syncStageControl();
}
const sliderMotion = createSceneMotion();
slider.addEventListener("input", () => { sliderMotion.cancel(); apply(); });

let covOn = false;

  document.getElementById("covLegend").style.display = covOn ? "flex" : "none";
  if (covOn && activeDomain) clearDomain();

      if (!m.userData.covMat) {
        const c = COVC[covScore(PART[m.userData.part] || {})];
        // land/shell 是整场级大件，实色会把全屏染成一种颜色——降透明度当背景，小部件才读得出来
        const bg = m.userData.part === "land" || m.userData.part === "shell";
        m.userData.covMat = new THREE.MeshStandardMaterial({ color: c, roughness: .55, metalness: .1, emissive: new THREE.Color(c), emissiveIntensity: .18, transparent: bg, opacity: bg ? 0.22 : 1 });
      }
      if (!m.userData.covPrev) { m.userData.covPrev = m.material; m.material = m.userData.covMat; }
    } else if (m.userData.covPrev) { m.material = m.userData.covPrev; delete m.userData.covPrev; }
  });
}

/* 领域视角 = 八个叶子系统，从 bom.json 的 systems 生成，不再手写；镜头与爆炸程度按系统登记，链路顺序来自部件的 chain / chain_order。 */
const CAMERA = {
  power:   { icon: "⚡", t: 45,  cam: [72, 28, 14],  tgt: [30, 3, 3] },
  thermal: { icon: "❄️", t: 45,  cam: [-70, 26, 10], tgt: [-28, 3, 0] },
  compute: { icon: "🧠", t: 100, cam: [13, 11, 40],  tgt: [0, 5, 20] },
  memory:  { icon: "🧩", t: 100, cam: [13, 11, 40],  tgt: [0, 5, 20] },
  storage: { icon: "💾", t: 100, cam: [13, 11, 40],  tgt: [0, 5, 20] },
  network: { icon: "🔗", t: 100, cam: [15, 17, 38],  tgt: [0, 10, 20] },
  facility:{ icon: "🏗️", t: 32,  cam: [58, 44, 64],  tgt: [0, 4, 0] },
  control: { icon: "🖥️", t: 55,  cam: [-42, 20, 26], tgt: [-22, 7, 4] },
};
const SYSTEMS = BOM.systems || {};
const leafSystems = Object.entries(SYSTEMS).filter(([id]) => !Object.values(SYSTEMS).some(x => x.parent === id))
  .sort((a, b) => ((a[1].parent ? SYSTEMS[a[1].parent].order : a[1].order) - (b[1].parent ? SYSTEMS[b[1].parent].order : b[1].order)) || ((a[1].parent ? a[1].order : 0) - (b[1].parent ? b[1].order : 0)));
const chainKey = p => { const chains = SYSTEMS[p.system]?.chains || []; return [chains.indexOf(p.chain), p.chain_order || 0]; };
const DOMAINS = leafSystems.map(([key, sdef]) => ({
  key, name: sdef.name.replace("IT · ", ""), chains: sdef.chains, ...(CAMERA[key] || { icon: "•", t: 60, cam: [46, 30, 52], tgt: [0, 6, 0] }),
  parts: BOM.parts.filter(p => p.system === key).sort((a, b) => { const x = chainKey(a), y = chainKey(b); return x[0] - y[0] || x[1] - y[1]; }),
}));
// 站点权利在园区场景里跟设施视角走
DOMAINS.find(d => d.key === "facility")?.parts.push(...RIGHTS);
const DOMAIN_ALIAS = { cooling: "thermal", campus: "facility", dcim: "control" };  // 旧的 ?d= 深链

const cameraMotion = createSceneMotion();
function flyTo(cam, tgt, duration = 1100) {
  sceneView?.takeControl();
  controls.autoRotate = false;
  const fromCamera = camera.position.clone(), fromTarget = controls.target.clone();
  const toCamera = new THREE.Vector3(...cam), toTarget = new THREE.Vector3(...tgt);
  cameraMotion.run(duration, progress => {
    camera.position.lerpVectors(fromCamera, toCamera, ease(progress));
    controls.target.lerpVectors(fromTarget, toTarget, ease(progress));
  });
}
canvas.addEventListener("pointerdown", cameraMotion.cancel);

let activeDomain = null;
const dimmed = new Map();
function setDim(mesh, dim) {
  if (dim && !dimmed.has(mesh)) {
    const original = mesh.material;
    const copies = matsOf(mesh).map(material => {
      const copy = material.clone(); copy.transparent = true; copy.opacity = Math.min(material.opacity, 0.10);
      if ('emissiveIntensity' in copy) copy.emissiveIntensity = 0;
      return copy;
    });
    dimmed.set(mesh, {original, copies});
    mesh.material = Array.isArray(original) ? copies : copies[0];
  } else if (!dim && dimmed.has(mesh)) {
    const {original, copies} = dimmed.get(mesh);
    mesh.material = original; copies.forEach(material => material.dispose()); dimmed.delete(mesh);
  }
}
function clearDomain() {
  sliderMotion.cancel();
  clearTimeout(walkTimer);
  activeDomain = null;
  pickables.forEach(m => setDim(m, false));
  decor.forEach(m => m.material && setDim(m, false));
  document.querySelectorAll(".dchip").forEach(el => el.classList.remove("on"));
  document.getElementById("domainParts").innerHTML = "";
}
function enterDomain(d) {
  if (covOn) covToggle();   // 热图与领域高亮不叠加：材质状态互斥，先退热图
  if (activeDomain === d.key) { clearDomain(); flyTo([46, 30, 52], [0, 6, 0]); return; }
  clearDomain();
  activeDomain = d.key;
  document.getElementById(`dchip-${d.key}`).classList.add("on");
  const ids = new Set(d.parts.map(p => p.id));
  pickables.forEach(m => setDim(m, !ids.has(m.userData.part)));
  decor.forEach(m => m.material && setDim(m, true));
  animateSlider(d.t);
  flyTo(d.cam, d.tgt);
  const grouped = []; let last = null;
  for (const p of d.parts) { if (p.chain !== last) { grouped.push(`<div class="chainh">${esc(p.chain || (p.kind === "site_right" ? "站点权利" : ""))}</div>`); last = p.chain; } grouped.push(p); }
  document.getElementById("domainParts").innerHTML = grouped.map(p => typeof p === "string" ? p :
    `<div class="pitem" data-part="${p.id}"><span class="dot" style="background:${SBADGE[p.status]}"></span>${esc(p.name)}<span class="covb" style="background:${COVC[covScore(p)]}" title="数据覆盖 ${covScore(p)}/4（公司/产品/序列/指标）">${covScore(p)}/4</span>${PARTMESH[p.id] ? "" : '<span class="nm" title="场景中尚无 3D 造型——点击直接看档案">未建模</span>'}<span class="lay">${p.layer || (BOM.kinds?.[p.kind] ? p.kind : "")}</span></div>`).join("");
  document.querySelectorAll("#domainParts .pitem").forEach(el => el.onclick = () => {
    const p = PART[el.dataset.part];
    showDossier(p);
    const meshes = PARTMESH[p.id];
    if (meshes?.length) {
      const wp = new THREE.Vector3(); meshes[0].getWorldPosition(wp);
      flyTo([wp.x + 9, wp.y + 6, wp.z + 9], [wp.x, wp.y, wp.z], 900);
    }
  });
  if (d.chains.length > 1) {  // 镜头走链路是显式动作：不抢用户或页面框架对镜头的所有权
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "walkbtn"; btn.id = "walkBtn";
    btn.textContent = "▶ 沿链路走一遍：" + d.chains.join(" → ");
    btn.onclick = () => walkChain(d);
    document.getElementById("domainParts").prepend(btn);
  }
}
/* 镜头按链路走：点击「沿链路走一遍」后，沿能量流依次飞到有造型的部件（电网 → 变电 → 发电与储能 → UPS → 配电 → 板级供电），
   这条路线就是该系统的研究提纲。用户操作或切换视角即停止；不自动开始，镜头所有权仍归用户与页面框架。 */
let walkTimer = null;
function walkChain(d) {
  clearTimeout(walkTimer);
  const stops = d.parts.filter(p => PARTMESH[p.id]?.length);
  let i = 0;
  const step = () => {
    if (activeDomain !== d.key || i >= stops.length) return;
    const p = stops[i++];
    document.querySelectorAll("#domainParts .pitem").forEach(el => el.classList.toggle("walk", el.dataset.part === p.id));
    const wp = new THREE.Vector3(); PARTMESH[p.id][0].getWorldPosition(wp);
    flyTo([wp.x + 12, wp.y + 8, wp.z + 12], [wp.x, wp.y, wp.z], 900);
    walkTimer = setTimeout(step, 1500);
  };
  step();
}
canvas.addEventListener("pointerdown", () => clearTimeout(walkTimer));

domrow.innerHTML = DOMAINS.map(d => `<div class="dchip" id="dchip-${d.key}">${d.icon} ${d.name}</div>`).join("");
DOMAINS.forEach(d => document.getElementById(`dchip-${d.key}`).onclick = () => enterDomain(d));

  if (i >= 0 && DOMAINS[i]) enterDomain(DOMAINS[i]);
  if (e.key === "0" || e.key === "Escape") { clearDomain(); flyTo([46, 30, 52], [0, 6, 0]); }

const inspector = createPartInspector({THREE, environment: () => scene.environment, meshesFor: pid => PARTMESH[pid],
  materialFor: mesh => dimmed.get(mesh)?.original || mesh.userData.covPrev || mesh.material});
const showDossier = createPartDossier({el: document.getElementById('dossier'), view: 'campus',
  BOM, moduleNames: MODNAME, companies: CN, prices, indicators: INDS,
  statusNames: SN, statusColors: SBADGE, inspector});
createScenePicking({THREE, canvas, camera, pickables, tip,
  describe: object => {
    const part = PART[object.userData.part];
    return part ? `${part.name}（${SN[part.status]}）· 点击看档案` : '';
  },
  select: object => showDossier(PART[object.userData.part])});

// sparkline 悬停读数（事件委托，一次绑定）
const dossierEl = document.getElementById("dossier");
dossierEl.addEventListener("pointermove", e => {
  const c = e.target.closest("circle[data-v]");
  if (c) {
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 200) + "px";
    tip.style.top = (e.clientY + 12) + "px";
    tip.textContent = `${c.dataset.d} ｜ ${c.dataset.v}`;
  } else if (tip.textContent.includes("｜")) tip.style.display = "none";
});
dossierEl.addEventListener("pointerleave", () => { if (tip.textContent.includes("｜")) tip.style.display = "none"; });

// The published adoption registry owns optional model selection.
const sceneModels = mountSceneModels({scene, page:"bom3d", defaultHeight:4.6});
const framingObjects = () => [...pickables.filter(mesh => mesh.userData.part !== "land"), ...sceneModels.objects()];
sceneView = mountSceneView({canvas, camera, controls, fog:scene.fog,
  objects:framingObjects,
  headers:[document.getElementById("ui-skinbar"), document.querySelector(".topbar")],
  button:document.getElementById("fit-view"),
  resize:(width, height) => {renderer.setSize(width, height, false);composer.setSize(width, height);},
  beforeFit:() => cameraMotion.cancel(),
});
sceneModels.ready.then(() => sceneView.refresh());
let animationFrame = 0;
let pageDisposed = false;
function disposePage() {
  if (pageDisposed) return;
  pageDisposed = true;
  cancelAnimationFrame(animationFrame);
  window.removeEventListener('inresearch:appearance', syncSceneAppearance);
  sceneView.dispose(); sceneModels.dispose(); inspector.dispose();
  sceneEnvironment.dispose(); texturePool.dispose(); composer.dispose(); renderer.dispose();
}
window.addEventListener("pagehide", event => {if (!event.persisted) disposePage();}, {once:true});
(function loop() { animationFrame = requestAnimationFrame(loop); controls.update(); composer.render(); inspector.tick(); })();

// ?d=<domain> / ?p=<part> 深链：其他页面可直接链进领域视角或部件档案（放最后：依赖上面全部初始化完成）
{ const q = new URLSearchParams(location.search);
  const dkey = DOMAIN_ALIAS[q.get("d")] || q.get("d");
  const d = DOMAINS.find(x => x.key === dkey);
  if (d) { controls.autoRotate = false; enterDomain(d); }
  const nodePart = (q.get("node") || "").replace(/^part:/, "");
  const p = PART[q.get("p") || nodePart];
  if (p) { controls.autoRotate = false; showDossier(p); }
  if (q.get("cov") === "1" && !covOn) { controls.autoRotate = false; covToggle(); } }



/* ── 下钻链条：一份配置驱动，加设备只需改 assets/levels.json ── */
fetch("assets/levels.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(cfg => {
  if (!cfg?.levels) return;
  const here = location.pathname.split("/").pop() || "index.html";
  const bar = document.createElement("div");
  bar.className = "drill";
  cfg.levels.forEach((L, i) => {
    if (i) bar.appendChild(dossierNode("span", "›", "sep"));
    const cur = String(L.page || "").split("?")[0] === here && L.id !== "server";
    const active = L.status !== "planned" && L.page && safeURL(L.page);
    const node = dossierNode(active ? "a" : "span", (L.icon || "") + " " + L.name, active ? (cur ? "on" : "") : "soon");
    node.title = L.name + " · " + (L.desc || "") + (L.status === "planned" ? "（规划中）" : "");
    if (active) node.href = safeURL(L.page);
    bar.appendChild(node);
  });
  document.body.appendChild(bar);
}).catch(() => {});
