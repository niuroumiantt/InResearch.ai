<style>


  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 15px/1.75 var(--ui-font); padding: 24px 16px 80px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .crumb { font-size: 13px; margin-bottom: 16px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  .crumb span { color: var(--muted); }
  article { overflow-wrap: anywhere; background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 28px 32px; }
  article h1 { font-size: 22px; margin: 0 0 16px; line-height: 1.4; }
  article h2 { font-size: 17px; margin: 28px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); line-height: 1.5; }
  article h3 { font-size: 15px; margin: 18px 0 8px; }
  article p { margin: 10px 0; }
  article ul { margin: 8px 0 8px 22px; }
  article ul ul { margin: 2px 0 2px 20px; }
  article li { margin: 4px 0; }
  article blockquote { border-left: 3px solid var(--accent); padding: 6px 14px; margin: 12px 0; color: var(--muted); background: color-mix(in srgb, var(--card) 70%, var(--bg)); border-radius: var(--ui-radius); }
  article blockquote p { margin: 4px 0; }
  article code { overflow-wrap: anywhere; background: color-mix(in srgb, var(--card) 55%, var(--bg)); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 1px 5px; font-size: 13px; font-family: var(--ui-mono); }
  article pre { background: color-mix(in srgb, var(--card) 55%, var(--bg)); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 12px 14px; overflow-x: auto; margin: 12px 0; }
  article pre code { background: none; border: none; padding: 0; }
  article a { color: var(--accent); text-decoration: none; word-break: break-all; }
  article a:hover { text-decoration: underline; }
  article hr { border: none; border-top: 1px solid var(--line); margin: 20px 0; }
  .tablewrap { overflow-x: auto; margin: 12px 0; }
  article table { border-collapse: collapse; width: 100%; font-size: 13px; }
  article th, article td { overflow-wrap: anywhere; border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  article th { background: color-mix(in srgb, var(--card) 60%, var(--bg)); font-weight: 500; color: var(--muted); }
  .qtag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: var(--ui-radius); padding: 0 8px; margin-left: 8px; vertical-align: 2px; }
  .st { display: inline-block; font-size: 11px; font-weight: 600; color: #fff; border-radius: var(--ui-radius); padding: 0 8px; }
  .st-current { background: var(--green); } .st-needs-review { background: var(--yellow); }
  .st-stale { background: var(--red); } .st-superseded { background: var(--muted); }
  .err { color: var(--red); background: var(--card); border: 1px solid var(--red); border-radius: var(--ui-radius); padding: 14px; }
  .toc { font-size: 13px; margin: 0 0 18px; padding: 12px 16px; background: color-mix(in srgb, var(--card) 70%, var(--bg)); border: 1px solid var(--line); border-radius: var(--ui-radius); }
  .toc a { display: block; color: var(--accent); text-decoration: none; padding: 2px 0; }
  /* ── CSV 表格浏览器（打分表等） ── */
  body.wide .wrap { max-width: 1240px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .ctl input, .ctl select { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--ui-radius); background: var(--card); color: var(--text); }
  .ctl input[type=search] { flex: 1 1 240px; min-width: 180px; }
  .ctl .count { font-size: 13px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .sc { display: inline-block; min-width: 30px; text-align: center; font-weight: 600; font-size: 12px; color: #fff; border-radius: var(--ui-radius); padding: 1px 6px; }
  .sc9, .sc8 { background: var(--red); } .sc7 { background: var(--yellow); }
  .sc6, .sc5 { background: var(--green); } .sc4, .sc3, .sc2, .sc1 { background: var(--muted); }
  .dp { display: inline-block; font-size: 11px; border-radius: var(--ui-radius); padding: 0 7px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .dp-精读, .dp-据实生成 { color: var(--green); border-color: var(--green); }
  .dp-半自动 { color: var(--yellow); border-color: var(--yellow); }
  .dp-目录级 { color: var(--muted); }
  .fname { font-weight: 500; word-break: break-all; }
  .fpath { font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 2px; }
  .sum { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .sum.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .pg { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 16px; font-size: 13px; }
  .pg button { font: inherit; font-size: 13px; padding: 5px 14px; border: 1px solid var(--line); border-radius: var(--ui-radius); background: var(--card); color: var(--accent); cursor: pointer; }
  .pg button:disabled { color: var(--muted); cursor: default; }
  .note { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.7; }
</style>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/noto-sans-sc-1.woff2"><link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css">

<body style="--ui-page-inset:24px">
<inresearch-shell data-section="datacenter"></inresearch-shell>
<div class="wrap">
  <div class="crumb"><a href="index.html">← 数据中心</a> <span id="path"></span> · <a href="doc.html?f=framework/CURRENT.md">现行基准</a></div>
  <div class="toc" id="identity" role="status">正在核对文档身份…</div>
  <div class="toc" id="toc" style="display:none"></div>
  <article id="content">加载中…</article>
</div>

<script src="/assets/markdown-inline.js"></script>
<script>
const {escape: esc, inline} = window.ResearchMarkdown;

function render(md) {
  const lines = md.split("\n");
  const out = [];
  let i = 0, listStack = 0, para = [], quote = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushQuote = () => { if (quote.length) { out.push("<blockquote>" + quote.map(q => "<p>" + inline(q) + "</p>").join("") + "</blockquote>"); quote = []; } };
  const closeLists = (to) => { while (listStack > to) { out.push("</ul>"); listStack--; } };

  while (i < lines.length) {
    let raw = lines[i];

    if (/^```/.test(raw)) {
      flushPara(); flushQuote(); closeLists(0);
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(esc(lines[i])); i++; }
      out.push("<pre><code>" + buf.join("\n") + "</code></pre>"); i++; continue;
    }
    if (/^\|/.test(raw)) {
      flushPara(); flushQuote(); closeLists(0);
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = '<div class="tablewrap"><table><tr>' + cells(rows[0]).map(c => "<th>" + c + "</th>").join("") + "</tr>";
      for (let r = 1; r < rows.length; r++) {
        if (/^\|[\s:\-|]+\|$/.test(rows[r].replace(/\s/g, ""))) continue;
        html += "<tr>" + cells(rows[r]).map(c => "<td>" + c + "</td>").join("") + "</tr>";
      }
      out.push(html + "</table></div>"); continue;
    }
    const h = raw.match(/^(#{1,3})\s+(.*)/);
    if (h) {
      flushPara(); flushQuote(); closeLists(0);
      const lvl = h[1].length;
      const id = "h" + i;
      out.push(`<h${lvl} id="${id}">` + inline(h[2]) + `</h${lvl}>`);
      i++; continue;
    }
    if (/^>\s?/.test(raw)) { flushPara(); closeLists(0); quote.push(raw.replace(/^>\s?/, "")); i++; continue; }
    const li = raw.match(/^(\s*)-\s+(.*)/);
    if (li) {
      flushPara(); flushQuote();
      const depth = li[1].length >= 2 ? 2 : 1;
      if (listStack < depth) { while (listStack < depth) { out.push("<ul>"); listStack++; } }
      else closeLists(depth);
      out.push("<li>" + inline(li[2]) + "</li>"); i++; continue;
    }
    if (/^---+\s*$/.test(raw)) { flushPara(); flushQuote(); closeLists(0); out.push("<hr>"); i++; continue; }
    if (raw.trim() === "") { flushPara(); flushQuote(); closeLists(0); i++; continue; }
    closeLists(0); flushQuote(); para.push(raw); i++;
  }
  flushPara(); flushQuote(); closeLists(0);
  return out.join("\n");
}

/* ── CSV：打分表这类大表用可筛选表格渲染，不能当 markdown 塞进 <p> ── */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const PAGE = 50;

function renderCSV(text, f) {
  const rows = parseCSV(text);
  const head = rows.shift() || [];
  const idx = Object.fromEntries(head.map((h, i) => [h, i]));
  const has = k => idx[k] !== undefined;
  const get = (r, k) => (has(k) ? (r[idx[k]] || "") : "");
  const recs = rows.filter(r => r.length > 1);

  // 打分表专用视图；其它 CSV 走通用表格
  const scored = has("new_path") && has("importance");
  const uniq = k => [...new Set(recs.map(r => get(r, k)).filter(Boolean))].sort();

  document.body.classList.add("wide");
  const art = document.getElementById("content");
  const depths = has("depth") ? uniq("depth") : [];
  const mods = scored ? [...new Set(recs.flatMap(r => get(r, "module").split("/")).map(s => s.trim()).filter(s => s && s !== "—"))].sort() : [];

  art.innerHTML =
    `<h1>${esc(f.split("/").pop())}</h1>` +
    (has("depth")
      ? `<div class="note"><b>depth = 阅读深度</b>，与分数正交：分数管「值不值钱」，depth 管「我们到底读没读过」。
         阅读标签不代表证据已被采用；引用仍须具备原文定位、适用范围并通过 C3 审核。<b>目录级</b>只作检索索引，局部阅读不能冒充全文精读。
         <a href="doc.html?f=framework/04_reading_scoring_standard.md">查看现行阅读标准</a>。</div>`
      : "") +
    `<div class="ctl">
       <input type="search" id="q" placeholder="搜索文件名／机构／摘要…">
       ${scored ? `<select id="minimp">
         <option value="0">全部分数</option><option value="9">仅 9 分（镇库）</option>
         <option value="8">≥8（支柱）</option><option value="7">≥7（重要）</option>
         <option value="5">≥5（有用及以上）</option></select>` : ""}
       ${depths.length ? `<select id="fdepth"><option value="">全部深度</option>${depths.map(d => `<option>${esc(d)}</option>`).join("")}</select>` : ""}
       ${mods.length ? `<select id="fmod"><option value="">全部模块</option>${mods.map(m => `<option>${esc(m)}</option>`).join("")}</select>` : ""}
       <span class="count" id="cnt"></span>
     </div>
     <div class="tablewrap"><table id="tb"></table></div>
     <div class="pg"><button id="prev">← 上一页</button><span id="pgn"></span><button id="next">下一页 →</button></div>`;

  let page = 0, view = recs;

  const draw = () => {
    const total = Math.max(1, Math.ceil(view.length / PAGE));
    page = Math.min(page, total - 1);
    const slice = view.slice(page * PAGE, page * PAGE + PAGE);
    const tb = document.getElementById("tb");
    if (scored) {
      tb.innerHTML =
        `<tr><th style="width:52px">分</th><th style="width:34%">材料</th>` +
        (has("depth") ? `<th style="width:72px">深度</th>` : "") +
        `<th style="width:96px">模块</th><th style="width:110px">机构／年</th><th>摘要</th></tr>` +
        slice.map(r => {
          const imp = get(r, "importance"), p = get(r, "new_path");
          return `<tr>
            <td><span class="sc sc${esc(imp)}">${esc(imp + get(r, "confidence"))}</span></td>
            <td><div class="fname">${esc(p.split("/").pop())}</div><div class="fpath">${esc(p)}</div></td>` +
            (has("depth") ? `<td><span class="dp dp-${esc(get(r, "depth"))}">${esc(get(r, "depth"))}</span></td>` : "") +
            `<td>${esc(get(r, "module"))}</td>
            <td>${esc(get(r, "org"))}<div class="fpath">${esc(get(r, "year"))}</div></td>
            <td><div class="sum clip" onclick="this.classList.toggle('clip')">${esc(get(r, "summary"))}</div></td>
          </tr>`;
        }).join("");
    } else {
      tb.innerHTML = `<tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>` +
        slice.map(r => `<tr>${head.map((_, i) => `<td>${esc(r[i] || "")}</td>`).join("")}</tr>`).join("");
    }
    document.getElementById("cnt").textContent = `${view.length} / ${recs.length} 条`;
    document.getElementById("pgn").textContent = `第 ${page + 1} / ${total} 页`;
    document.getElementById("prev").disabled = page === 0;
    document.getElementById("next").disabled = page >= total - 1;
  };

  const apply = () => {
    const q = (document.getElementById("q").value || "").trim().toLowerCase();
    const mi = scored ? +(document.getElementById("minimp").value) : 0;
    const dp = depths.length ? document.getElementById("fdepth").value : "";
    const md = mods.length ? document.getElementById("fmod").value : "";
    view = recs.filter(r => {
      if (mi === 9 ? +get(r, "importance") !== 9 : mi && +get(r, "importance") < mi) return false;
      if (dp && get(r, "depth") !== dp) return false;
      if (md && !get(r, "module").split("/").map(s => s.trim()).includes(md)) return false;
      if (q && !r.join(" ").toLowerCase().includes(q)) return false;
      return true;
    });
    if (scored) view.sort((a, b) => (+get(b, "importance")) - (+get(a, "importance")) || get(a, "confidence").localeCompare(get(b, "confidence")));
    page = 0; draw();
  };

  document.getElementById("q").oninput = apply;
  if (scored) document.getElementById("minimp").onchange = apply;
  if (depths.length) document.getElementById("fdepth").onchange = apply;
  if (mods.length) document.getElementById("fmod").onchange = apply;
  document.getElementById("prev").onclick = () => { page--; draw(); scrollTo(0, 0); };
  document.getElementById("next").onclick = () => { page++; draw(); scrollTo(0, 0); };
  apply();
  document.title = f.split("/").pop() + " — inresearch.ai";
}

function documentLink(href, source, base = location.href) {
  if (href.startsWith("#")) return href;
  const url = new URL(href, new URL(source, base));
  if (!["http:", "https:"].includes(url.protocol)) return null;
  if (url.origin === new URL(base).origin && /\.(md|csv)$/.test(url.pathname)) {
    return new URL("doc.html?f=" + encodeURIComponent(decodeURIComponent(url.pathname.replace(/^\//, ""))), base).href;
  }
  return url.href;
}

async function showIdentity(f) {
  const box = document.getElementById("identity");
  const labels = {
    normative: "现行规范", entrypoint: "现行入口", historical: "历史快照 · 不作为当前执行指令",
    retired_entrypoint: "已退役入口 · 请使用现行基准", design_reference: "已采用设计依据 · 后续执行以现行基准为准",
    candidate: "候选与外部输入 · 尚未采用", research_record: "兼容研究记录 · 引用前核对证据与状态",
    source_record: "在册数据或索引 · 不代表已核验", supporting_document: "配套说明 · 以现行规范为准",
    generated: "生成清单或报告"
  };
  try {
    const response = await fetch("framework/repository_manifest.json", {cache: "no-store"});
    if (!response.ok) throw new Error("manifest unavailable");
    const manifest = await response.json();
    const row = manifest.files.find(item => item.path === f);
    box.textContent = (row ? (labels[row.role] || "在册文件") : "未在清单中登记 · 身份未核对") + " · 基准 " + manifest.version + " · ";
  } catch (_) { box.textContent = "清单加载失败 · 文档身份未核对 · "; }
  const link = document.createElement("a");
  link.href = "doc.html?f=docs/REPOSITORY_REGISTER.md";
  link.textContent = "查看在册源码与记录";
  box.append(link);
}

(async () => {
  const f = new URLSearchParams(location.search).get("f") || "framework/03_bom_and_collaboration.md";
  if (!/^[\w\-/\u4e00-\u9fff.]+\.(md|csv)$/.test(f) || f.includes("..")) {
    document.getElementById("content").innerHTML = '<div class="err">非法路径</div>'; return;
  }
  document.getElementById("path").textContent = " / " + f;
  await showIdentity(f);
  try {
    const r = await fetch(f + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const md = await r.text();
    if (f.endsWith(".csv")) { renderCSV(md, f); return; }
    const html = render(md);
    document.getElementById("content").innerHTML = html;
    document.querySelectorAll("article a").forEach(link => {
      try {
        const href = documentLink(link.getAttribute("href"), f);
        if (href) { link.href = href; link.removeAttribute("target"); }
        else link.removeAttribute("href");
      } catch (_) { link.removeAttribute("href"); }
    });
    document.title = (md.match(/^#\s+(.*)$/m) || [, f])[1] + " — inresearch.ai";
    const hs = [...document.querySelectorAll("article h2")];
    if (hs.length >= 3) {
      const toc = document.getElementById("toc");
      toc.innerHTML = hs.map(h => `<a href="#${h.id}">${esc(h.textContent)}</a>`).join("");
      toc.style.display = "";
    }
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="err">加载失败：${e.message}<br>请用 <code>python3 manage.py serve</code> 启动后访问。</div>`;
  }
})();
</script>
