<script type="module">
import * as THREE from "three";
import {createScenePicking} from "/assets/scene-picking.js";
import {createSceneMotion} from "/assets/scene-motion.js";
import {createPartDossier, dossierNode} from "/assets/part-dossier.js";

import { EffectComposer } from "./assets/vendor/EffectComposer.js";
import { RenderPass } from "./assets/vendor/RenderPass.js";

import {loadSceneData} from "/assets/scene-data.js";
const [BOM, companies, prices, inds, reg] = await loadSceneData([
  {url:"framework/bom.json", collection:"parts"},
  {url:"data/companies.json", collection:"records"},
  {url:"data/prices.json", collection:"records"},

], {controls:[document.querySelector(".hud")]});
const CN = {}; companies.records.forEach(c => CN[c.company_id] = c.name_cn || c.name);
const INDS = {}; inds.indicators.forEach(i => INDS[i.id] = i);
const MODNAME = {}; reg.modules.forEach(m => MODNAME[m.id] = m.name);
const PART = {}; BOM.parts.forEach(p => PART[p.id] = p);
const SN = { tight: "紧缺", transition: "技术切换中", mature: "成熟", emerging: "新兴" };
const SBADGE = { tight: "#ef4444", transition: "#f59e0b", mature: "#22c55e", emerging: "#a78bfa" };

/* ─────────── 渲染器：PBR + Bloom ─────────── */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// Appearance changes preserve the current camera, selected object and materials.
function syncSceneAppearance() {
  scene.background = new THREE.Color(window.InresearchUI.scenePalette().background);
  if (scene.fog) scene.fog.color.copy(scene.background);
}
window.addEventListener('inresearch:appearance', syncSceneAppearance);
syncSceneAppearance();

let sceneView;
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 300);
camera.position.set(13, 8.5, 16);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 4.6, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05;
controls.minDistance = 4; controls.maxDistance = 60;
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches; controls.autoRotateSpeed = 0.4;
canvas.addEventListener("pointerdown", () => controls.autoRotate = false, { once: true });

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.22, 0.55, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* 环境光照：真 HDR（Poly Haven CC0，assets/hdri/studio.exr）；加载失败回退程序化摄影棚 */
function proceduralEnv() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(60, 60, 60),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x2a3242 })));
  const panel = (w, h, x, y, z, c, i, ry = 0, rx = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c }));
    m.material.color.multiplyScalar(i);
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0); env.add(m);
  };
  panel(26, 16, 0, 28, 0, 0xffffff, 6, 0, Math.PI / 2);
  panel(30, 12, -28, 12, 0, 0xbfd6ff, 3.2, Math.PI / 2);
  panel(30, 12, 28, 9, 0, 0xffe0b8, 2.4, -Math.PI / 2);
  panel(40, 10, 0, 11, -28, 0x9db8e8, 2.4, 0);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
}
new EXRLoader().load("assets/hdri/studio.exr", tex => {
  tex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
}, undefined, () => proceduralEnv());
// Background is supplied by the shared appearance palette; lighting remains physical.

scene.add(new THREE.HemisphereLight(0x8fa8cc, 0x0a0e15, 0.7));
const dl = new THREE.DirectionalLight(0xfff2e0, 2.4);
dl.position.set(14, 22, 12);
dl.castShadow = true;
dl.shadow.mapSize.set(2048, 2048);
dl.shadow.camera.left = -14; dl.shadow.camera.right = 14;
dl.shadow.camera.top = 18; dl.shadow.camera.bottom = -6;
dl.shadow.camera.far = 70; dl.shadow.bias = -0.0004; dl.shadow.radius = 5;
scene.add(dl);
const rim = new THREE.DirectionalLight(0x6f9fff, 0.9); rim.position.set(-16, 12, -14); scene.add(rim);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.55); fill.position.set(6, 6, 18); scene.add(fill);

/* ─────────── 程序化纹理 ─────────── */
function ctex(w, h, draw, repX = 1, repY = 1) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repX !== 1 || repY !== 1) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY); }
  return t;
}
const rnd = (() => { let s = 7; return () => (s = s * 16807 % 2147483647) / 2147483647; })();
const TEX = {
  post: ctex(32, 256, (g, w, h) => {           // 机柜立柱：EIA 孔带
    g.fillStyle = "#10141c"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#05070b";
    for (let y = 5; y < h; y += 10) { g.fillRect(7, y, 6, 6); g.fillRect(19, y, 6, 6); }
  }, 1, 4),
  doorPerf: ctex(128, 256, (g, w, h) => {      // 前后门：六角穿孔网
    g.fillStyle = "#171d29"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#060a10";
    for (let y = 5; y < h; y += 9) for (let x = 5 + ((y / 9 | 0) % 2 ? 4 : 0); x < w; x += 9) {
      g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill();
    }
    g.strokeStyle = "#2c3850";
    g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
  }, 1, 2),
  sledFace: hero => ctex(256, 48, (g, w, h) => {   // 服务器前脸：把手+盘位+LED
    g.fillStyle = hero ? "#1c2739" : "#161d2a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#39445c"; g.fillRect(2, 4, 10, h - 8); g.fillRect(w - 12, 4, 10, h - 8); // 把手
    for (let x = 20; x < w - 70; x += 24) {   // 盘位
      g.fillStyle = "#0d1119"; g.fillRect(x, 6, 20, h - 12);
      g.fillStyle = "#22303f"; g.fillRect(x + 2, 8, 16, 5);
      g.fillStyle = rnd() > .3 ? "#22c55e" : "#1a2333"; g.fillRect(x + 15, h - 13, 3, 3);
    }
    for (let x = w - 66; x < w - 18; x += 7) {  // 进风孔
      g.fillStyle = "#0a0e15"; g.fillRect(x, 8, 4, h - 16);
    }
    g.fillStyle = "#3b82f6"; g.fillRect(w - 16, 6, 3, 3);
    g.fillStyle = "#f59e0b"; g.fillRect(w - 16, 12, 3, 3);
  }),
  ports: ctex(256, 32, (g, w, h) => {
    g.fillStyle = "#0f1626"; g.fillRect(0, 0, w, h);
    for (let x = 6; x < w - 12; x += 10) {
      g.fillStyle = "#1e293b"; g.fillRect(x, 6, 8, 8); g.fillRect(x, 18, 8, 8);
      if (rnd() > .35) { g.fillStyle = "#38bdf8"; g.fillRect(x + 2, 8, 4, 4); }
      if (rnd() > .5) { g.fillStyle = "#22c55e"; g.fillRect(x + 2, 20, 4, 4); }
    }
  }),
  perf: ctex(64, 64, (g, w, h) => {
    g.fillStyle = "#222936"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#0d1119";
    for (let y = 4; y < h; y += 8) for (let x = 4 + (y % 16 ? 4 : 0); x < w; x += 8) {
      g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill();
    }
  }, 2, 2),
  pcb: ctex(256, 256, (g, w, h) => {
    g.fillStyle = "#0e3a28"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(210,255,225,.26)"; g.lineWidth = 1.2;
    for (let i = 0; i < 60; i++) {
      g.beginPath();
      let x = rnd() * w, y = rnd() * h;
      g.moveTo(x, y);
      for (let k = 0; k < 3; k++) { rnd() > .5 ? x = rnd() * w : y = rnd() * h; g.lineTo(x, y); }
      g.stroke();
    }
    g.fillStyle = "#c9a227";
    for (let i = 0; i < 90; i++) g.fillRect(rnd() * w, rnd() * h, 2.5, 2.5);
    g.fillStyle = "#12161f";
    for (let i = 0; i < 16; i++) g.fillRect(rnd() * (w - 22), rnd() * (h - 14), 22, 14);
  }),
  die: ctex(128, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, "#4a3a86"); gr.addColorStop(.35, "#2d7a63"); gr.addColorStop(.65, "#86436b"); gr.addColorStop(1, "#37477e");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,.2)";
    for (let i = 10; i < w; i += 10) { g.strokeRect(i, 0, .5, h); g.strokeRect(0, i, w, .5); }
    g.strokeStyle = "rgba(255,255,255,.5)"; g.strokeRect(w * .3, h * .3, w * .4, h * .4);
  }),
  copperFins: ctex(128, 64, (g, w, h) => {
    g.fillStyle = "#7c4f27"; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 5) {
      g.fillStyle = "#cf8f4e"; g.fillRect(x, 1, 2.5, h - 2);
      g.fillStyle = "#4e3018"; g.fillRect(x + 2.5, 1, 1.8, h - 2);
    }
  }, 2, 1),
  dimm: ctex(128, 24, (g, w, h) => {
    g.fillStyle = "#0f3d2a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#12161f";
    for (let x = 4; x < w - 10; x += 15) g.fillRect(x, 4, 11, h - 10);
    g.fillStyle = "#c9a227"; g.fillRect(0, h - 4, w, 3);
  }),
  floorTx: ctex(512, 512, (g, w, h) => {
    g.fillStyle = "#10141c"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2200; i++) {
      g.fillStyle = `rgba(255,255,255,${rnd() * .03})`;
      g.fillRect(rnd() * w, rnd() * h, 1.6, 1.6);
    }
    g.strokeStyle = "rgba(120,150,190,.14)"; g.lineWidth = 2;
    for (let x = 0; x <= w; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  }),
  fanFrame: ctex(64, 64, (g, w, h) => {
    g.fillStyle = "#141922"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#2c3850"; g.lineWidth = 3; g.strokeRect(2, 2, w - 4, h - 4);
    g.fillStyle = "#0a0d13"; g.beginPath(); g.arc(w / 2, h / 2, 26, 0, 7); g.fill();
  }),
};

/* ─────────── 造物助手 ─────────── */
const pickables = [];
const animated = [];
const spinners = [];   // 旋转风扇叶
const pulsers = [];    // 呼吸 LED
/* 真实设备面板贴图（NetBox devicetype-library，CC0；来源见 assets/panels/README.md）
   加载失败自动退回程序化面板，不阻塞渲染 */
const texLoader = new THREE.TextureLoader();
function panel(name, fallback) {
  const t = texLoader.load(`assets/panels/${name}.png`, undefined, undefined,
    () => console.warn(`[面板] ${name}.png 缺失，用程序化面板兜底`));
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const PANEL = {
  server: panel("server_nvme"), hero: panel("server_gpu"),
  storage: panel("server_storage"), tor: panel("switch_tor"), ib: panel("switch_ib"),
};

function M(color, opt = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.25, envMapIntensity: 0.9, ...opt });
}
function tag(obj, partId) {
  obj.traverse(m => {
    if (m.isMesh) {
      m.castShadow = true; m.receiveShadow = true;
      if (partId) { m.userData.part = partId; pickables.push(m); }
    }
  });
  return obj;
}
function rboxGeo(w, h, d, r = 0.04) {
  const hw = Math.max(0.005, w / 2 - r), hd = Math.max(0.005, d / 2 - r);
  const s = new THREE.Shape();
  s.absarc(hw, hd, r, 0, Math.PI / 2);
  s.absarc(-hw, hd, r, Math.PI / 2, Math.PI);
  s.absarc(-hw, -hd, r, Math.PI, Math.PI * 1.5);
  s.absarc(hw, -hd, r, Math.PI * 1.5, Math.PI * 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.005, h - 2 * r), bevelEnabled: true, bevelSegments: 2, bevelSize: r * 0.9, bevelThickness: r });
  g.center(); g.rotateX(-Math.PI / 2);
  return g;
}
function mk(parent, geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function explode(obj, dx, dy, dz, t0, t1) {

function label(text, x, y, z, size = 1, color = "#9fb4d8", num = null, showAfter) {
  const S = 2;
  const cv = document.createElement("canvas"), mx = cv.getContext("2d");
  mx.font = `600 ${26 * S}px -apple-system, PingFang SC`;
  const tw = mx.measureText(text).width;
  const numW = num ? 40 * S : 0;
  cv.width = tw + 40 * S + numW; cv.height = 52 * S;
  const g = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  g.beginPath(); g.roundRect(2 * S, 4 * S, W - 4 * S, H - 8 * S, 22 * S);
  g.fillStyle = "rgba(13,18,28,.88)"; g.fill();
  g.lineWidth = 2 * S; g.strokeStyle = color; g.globalAlpha = .7; g.stroke(); g.globalAlpha = 1;
  if (num) {
    g.beginPath(); g.arc(22 * S, H / 2, 13 * S, 0, 7);
    g.fillStyle = color; g.fill();
    g.fillStyle = "#0b0e14"; g.font = `800 ${19 * S}px -apple-system`;
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(num, 22 * S, H / 2 + S);
    g.textAlign = "left";
  }
  g.font = `600 ${26 * S}px -apple-system, PingFang SC`;
  g.fillStyle = "#e8eef8"; g.textBaseline = "middle";
  g.fillText(text, (num ? 42 : 18) * S, H / 2 + S);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  sp.scale.set(W / (118 * S) * size, H / (118 * S) * size, 1);
  sp.position.set(x, y, z);
  if (showAfter !== undefined) { sp.userData.showAfter = showAfter; sp.visible = false; }
  scene.add(sp);
  return sp;
}

function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function apply() {
  const t = slider.value / 100;
  const poses = new Map();
  animated.forEach(a => {
    if (!poses.has(a.obj)) poses.set(a.obj, a.home.clone());
    const k = a.t1 <= a.t0 ? 1 : Math.min(1, Math.max(0, (t - a.t0) / (a.t1 - a.t0)));
    poses.get(a.obj).addScaledVector(a.off, ease(k));
  });
  poses.forEach((position, obj) => obj.position.copy(position));
  scene.traverse(o => { if (o.isSprite && o.userData.showAfter !== undefined) o.visible = t >= o.userData.showAfter; });
  let s = STAGES[0][1];
  STAGES.forEach(([th, txt]) => { if (t >= th) s = txt; });
  stageEl.textContent = s;
  syncStageControl();
}

  const from = +slider.value;

  statusNames: SN, statusColors: SBADGE, inspector});
createScenePicking({THREE, canvas, camera, pickables, tip,
  describe: object => {
    const part = PART[object.userData.part];
    return part ? `${part.name}（${SN[part.status]}）· 点击看档案` : '';
  },
  select: object => showDossier(PART[object.userData.part])});

/* ─────────── 主循环：渲染 + 风扇旋转 + LED 呼吸 ─────────── */
// The published adoption registry owns optional model selection.
const sceneModels = mountSceneModels({scene, page:"rack3d", defaultHeight:RH + 0.7, replacement:rack});
const framingObjects = () => [...pickables, ...sceneModels.objects()];
sceneView = mountSceneView({canvas, camera, controls,
  objects:framingObjects,
  headers:[document.getElementById("ui-skinbar"), document.querySelector(".topbar")],
  button:document.getElementById("fit-view"),
  resize:(width, height) => {renderer.setSize(width, height, false);composer.setSize(width, height);},
});
sceneModels.ready.then(() => sceneView.refresh());
window.addEventListener("pagehide", event => {if (!event.persisted) {sceneView.dispose();sceneModels.dispose();inspector.dispose();}});
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  spinners.forEach(r => r.rotation.z += dt * 9);
  pulsers.forEach(({ m, ph }) => m.material.emissiveIntensity = 1.1 + Math.sin(t * 2.4 + ph) * 0.7);
  controls.update();
  composer.render();
  inspector.tick();
})();

// #<part-id> 深链：bom3d 档案里的"上拆解台看结构"落点（放最后：依赖上面全部初始化完成）
{ const q = new URLSearchParams(location.search);
  const pid = (q.get("node") || "").replace(/^part:/, "") || location.hash.slice(1);
  if (PART[pid]) { controls.autoRotate = false; showDossier(PART[pid]); } }



/* ── 下钻链条：一份配置驱动，加设备只需改 assets/levels.json ── */
fetch("assets/levels.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(cfg => {
  if (!cfg?.levels) return;
  const here = location.pathname.split("/").pop() || "index.html";
  const bar = document.createElement("div");
  bar.className = "drill";
  cfg.levels.forEach((L, i) => {
    if (i) bar.appendChild(dossierNode("span", "›", "sep"));
    const cur = String(L.page || "").split("?")[0] === here && L.id !== "server";
    const active = L.status !== "planned" && L.page && safeURL(L.page);
    const node = dossierNode(active ? "a" : "span", (L.icon || "") + " " + L.name, active ? (cur ? "on" : "") : "soon");
    node.title = L.name + " · " + (L.desc || "") + (L.status === "planned" ? "（规划中）" : "");
    if (active) node.href = safeURL(L.page);
    bar.appendChild(node);
  });
  document.body.appendChild(bar);
}).catch(() => {});
