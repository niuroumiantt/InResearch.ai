<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目成员与授权 · inresearch.ai</title>
<script src="/assets/theme-state.js"></script><script src="/assets/site-skin.js"></script>
<link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css"><link rel="stylesheet" href="/assets/project-access.css"><script src="/assets/project-access.js" defer></script></head>
<body><inresearch-shell data-section="admin"></inresearch-shell><main class="project-access-page">
<a href="/tasks.html">← 项目工作台</a><h1>项目成员与授权</h1><p>每人独立账号。分别设置项目访问、提交和审批范围；审批权限不包含系统管理。</p>
<form id="project-create" class="project-create"><h2>添加协作者</h2><label>登录账号<input type="text" name="username" pattern="[a-z0-9][a-z0-9_.-]{1,30}" minlength="2" maxlength="31" required autocomplete="off" placeholder="例如 chen.lin"></label><button type="submit">创建账号</button><p id="project-created" role="status" aria-live="polite"></p></form>
<form id="project-grant" class="project-access-form" hidden><h2>设置授权</h2><div class="project-fields"><label>协作者<select id="project-user" required></select></label><label>姓名<input type="text" name="display_name" required maxlength="120"></label></div><p id="project-name"></p>
<label><input type="checkbox" name="disabled"> 停用此账号</label>
<fieldset><legend>项目可见范围</legend><p><label><input type="checkbox" name="enabled"> 可进入本项目，查看团队进展与个人工作</label></p><p><label><input type="checkbox" name="frontend"> 可查看园区前台：名录、地图、地区及园区详情</label></p><label>有效至（北京时间，留空长期有效）<input type="date" name="expires"></label></fieldset>
<fieldset><legend>工作包权限</legend><p>提交权限用于本人负责的工作；审批权限仅适用于相应工作包，不能审批自己的提交。</p><div id="project-package-grants"></div></fieldset>
<button type="submit">保存授权</button><button type="button" id="project-reload">重新读取</button><p id="project-save-status" role="status" aria-live="polite"></p></form>
<p id="project-access-status" role="status" aria-live="polite"></p>
</main></body></html>
