<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head>
<script src="/assets/theme-state.js"></script>
<script src="/assets/site-skin.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品登记覆盖 — inresearch.ai</title>
<script>if (new URLSearchParams(location.search).get("embedded") === "1") document.documentElement.dataset.embedded = "1";</script>
<style>
  html[data-embedded="1"] #ui-skinbar, html[data-embedded="1"] .topbar { display: none !important; }
  html[data-embedded="1"] body { padding-top: 0 !important; }
  /* 视觉规范统一由 assets/site-skin.css 提供。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 13px/1.55 var(--ui-font); padding-bottom: 60px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topbar { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 4px; padding: 0 18px; height: 46px; z-index: 20; overflow-x: auto; }
  .tab { padding: 12px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .wrap { max-width: 1100px; margin: 18px auto 0; padding: 0 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .lead { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; max-width: 80ch; }
  .kpis { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 10px 0 14px; }
  .kpis div { font-size: 12px; color: var(--muted); }
  .kpis b { display: block; font-size: 20px; color: var(--text); font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .filters input, .filters select { background: var(--card); color: var(--text); border: 1px solid var(--line); padding: 5px 9px; font-size: 12.5px; }
  .filters input { flex: 1; min-width: 200px; }
  #exactFilter { font-size: 12px; margin-bottom: 6px; }
  #exactFilter a { margin-left: 8px; }
  #resultCount { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  section.seg { margin-bottom: 18px; }
  section.seg > h2 { font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  section.seg > h2 span { font-size: 11.5px; color: var(--muted); font-weight: normal; }
  .line { display: grid; grid-template-columns: 160px 1fr auto; gap: 4px 14px; padding: 9px 0; border-bottom: 1px dashed var(--line); align-items: start; }
  .line .who b { font-size: 13px; }
  .line .who a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .line .who small { display: block; color: var(--muted); font-size: 11.5px; }
  .prio { font-size: 10.5px; padding: 0 5px; margin-left: 4px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
  .prio.P0 { border-color: var(--ink); color: var(--text); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  a.tag.ok { background: var(--green-bg); border-color: transparent; color: var(--green); }
  a.tag.thin { background: var(--yellow-bg); border-color: transparent; color: var(--yellow); }
  a.tag.miss { border-style: dashed; color: var(--red); }
  .go { font-size: 12px; white-space: nowrap; text-align: right; }
  .go span { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }
  .legend .tag { font-size: 11px; }
  .err { background: var(--red-bg); color: var(--red); padding: 14px 18px; margin: 20px 0; }
  @media (max-width: 720px) {
    .line { grid-template-columns: 1fr; }
    .go { text-align: left; }
  }
</style>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/noto-sans-sc-1.woff2"><link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css">
</head>
<body>
<inresearch-shell data-section="bom"></inresearch-shell>
<div class="topbar">
  <a class="tab" href="/bom.html">爆炸图 2D</a>
  <a class="tab" href="/bom3d.html">爆炸图 3D</a>
  <a class="tab" href="/node.html">数据中心</a>
  <a class="tab" href="/node.html?id=system%3Astorage">存储系统</a>
  <a class="tab on" href="/admin/product/">登记覆盖</a>
  <a class="tab" href="/product-catalog.html">规格库</a>
</div>
<div class="wrap">
  <h1>产品登记覆盖</h1>
  <p class="lead">从产品线进入：每条产品线的代表型号，在本站规格库里能不能找到。公司名进公司首页，型号进规格库对应条目。
    「找到」只表示规格库收录了同名条目，不代表研究已采用。</p>
  <div id="app">加载中…</div>
</div>
<script>
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
// 搜索：中文与型号分开规范化，避免中文被 ASCII 规则吃成空查询。
const searchNorm = s => String(s ?? "").normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");
const searchTokens = s => String(s ?? "").normalize("NFKC").toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
function productMatchesQuery(p, query){
  if(!String(query ?? "").trim()) return true;
  const terms=searchTokens(query);
  if(!terms.length) return false;
  const text=searchNorm([p.company_en,p.company_cn,p.product_line,p.category,p.representative_models].filter(Boolean).join(" "));
  return terms.every(term=>text.includes(term));
}
// end of tested search helpers
const catalogLink = (company, params) => "/product-catalog.html?" + new URLSearchParams({c: company, ...params});
function lineState(p){
  if(!p.catalog.available) return "none";
  return p.covered===p.tags.length && p.tags.length ? "full" : (p.covered ? "part" : "zero");
}
function tagHTML(p, t){
  const label=escapeHTML(t.tag);
  if(t.product_id){
    const cls=t.with_tables?"ok":"thin";
    const title=t.with_tables?`规格库：${t.product_name}（有官方参数表）`:`规格库：${t.product_name}（暂无参数表）`;
    return `<a class="tag ${cls}" title="${escapeHTML(title)}" href="${escapeHTML(catalogLink(p.catalog.company,{product_id:t.product_id}))}">${label}</a>`;
  }
  if(p.catalog.available)
    return `<a class="tag miss" title="规格库里没有同名条目，点击在该公司规格库中搜索" href="${escapeHTML(catalogLink(p.catalog.company,{q:t.tag}))}">${label}</a>`;
  return `<span class="tag">${label}</span>`;
}
async function main(){
  const app=document.getElementById("app");
  let data, companies=new Set();
  try{
    const response=await fetch("/api/admin/product-coverage",{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    data=await response.json();
  }catch(e){
    app.innerHTML=`<div class="err">登记覆盖读取失败：${escapeHTML(e.message)}。需要管理员登录。</div>`;
    return;
  }
  try{ (await (await fetch("/data/companies.json")).json()).records.forEach(c=>companies.add(c.company_id)); }catch(e){}
  const lines=data.lines, T=data.totals;
  const params=new URLSearchParams(location.search);
  const exactCompany=params.get("company")||"", exactLine=params.get("line")||"";
  app.innerHTML=`
    <div class="kpis">
      <div><b>${T.lines}</b>条产品线</div>
      <div><b>${T.lines_with_catalog}</b>条已有规格库（${T.catalog_companies.length} 家公司）</div>
      <div><b>${T.tags_covered} / ${T.tags_in_catalog_lines}</b>型号在规格库找到</div>
    </div>
    <div class="filters">
      <input id="fQ" placeholder="搜公司 / 产品线 / 型号…">
      <select id="fPri"><option value="">全部优先级</option><option>P0</option><option>P1</option><option>P2</option></select>
      <select id="fSt"><option value="">全部状态</option><option value="full">型号全部找到</option><option value="part">部分找到</option><option value="zero">有规格库但未找到</option><option value="none">公司暂无规格库</option></select>
    </div>
    <div class="legend">
      <span><span class="tag" style="background:var(--green-bg);color:var(--green);border-color:transparent">型号</span> 规格库有，含参数表</span>
      <span><span class="tag" style="background:var(--yellow-bg);color:var(--yellow);border-color:transparent">型号</span> 规格库有，暂无参数表</span>
      <span><span class="tag" style="border-style:dashed;color:var(--red)">型号</span> 规格库没找到（点击去搜）</span>
      <span><span class="tag">型号</span> 公司暂无规格库</span>
    </div>
    <div id="exactFilter"></div><p id="resultCount"></p><div id="list"></div>`;
  document.getElementById("fQ").value=params.get("q")||"";
  if(exactCompany||exactLine){
    const banner=document.getElementById("exactFilter"), label=document.createElement("span"), clear=document.createElement("a");
    label.textContent="精确筛选："+[exactCompany,exactLine].filter(Boolean).join(" · ");
    clear.href="/admin/product/";clear.textContent="清除，查看全部";banner.append(label,clear);
  }
  const segs=[...new Set(lines.map(p=>p.sheet))];
  function render(){
    const q=fQ.value, pri=fPri.value, st=fSt.value;
    const keep=p=>(!pri||p.priority===pri)&&(!st||lineState(p)===st)
      &&(!exactCompany||p.company_id===exactCompany)&&(!exactLine||p.product_line===exactLine)
      &&productMatchesQuery(p,q);
    const matched=lines.filter(keep);
    document.getElementById("resultCount").textContent="当前显示 "+matched.length+" / "+lines.length+" 条产品线";
    const list=document.getElementById("list");
    list.innerHTML=matched.length?"":"<p>没有匹配的产品线，请调整筛选。</p>";
    for(const s of segs){
      const rows=matched.filter(p=>p.sheet===s);
      if(!rows.length) continue;
      const withCatalog=rows.filter(p=>p.catalog.available);
      const el=document.createElement("section"); el.className="seg";
      el.innerHTML=`<h2>${escapeHTML(s)}<span>${rows.length} 条 · 有规格库 ${withCatalog.length} 条</span></h2>`+rows.map(p=>{
        const name=escapeHTML(p.company_cn||p.company_en||p.company_id);
        const who=companies.has(p.company_id)?`<a href="/company.html?c=${encodeURIComponent(p.company_id)}">${name}</a>`:name;
        const go=p.catalog.available
          ?`<a href="${escapeHTML(catalogLink(p.catalog.company,{}))}">规格库 →</a><br><span>${p.covered} / ${p.tags.length} 型号找到</span>`
          :`<span>${p.catalog.registered?"规格库待首次交付":"暂无规格库"}</span>`;
        return `<div class="line"><div class="who"><b>${who}</b><span class="prio ${escapeHTML(p.priority)}">${escapeHTML(p.priority)}</span>
            <small>${escapeHTML(p.product_line)} · ${escapeHTML(p.category)}</small></div>
          <div class="tags">${p.tags.map(t=>tagHTML(p,t)).join("")||`<span style="color:var(--muted)">${escapeHTML(p.representative_models||"未登记代表型号")}</span>`}</div>
          <div class="go">${go}</div></div>`;
      }).join("");
      list.appendChild(el);
    }
  }
  ["fQ","fPri","fSt"].forEach(id=>document.getElementById(id).oninput=render);
  render();
}
main();
</script>
</body>
</html>
