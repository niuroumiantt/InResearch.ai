<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料收件箱 · inresearch.ai</title><script src="/assets/theme-state.js"></script>
<script src="/assets/site-skin.js"></script>
<style>body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 var(--ui-font)}main{max-width:940px;margin:32px auto;padding:0 20px}a{color:var(--accent)}h1{margin-bottom:4px}p{color:var(--muted)}section{background:var(--card);border:1px solid var(--line);border-radius:var(--ui-radius);padding:24px;margin:20px 0}label{display:block;margin:12px 0 5px}input:not([type=file]),textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:var(--ui-radius);font:inherit}input[type=file]{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0}form{min-width:0;overflow-wrap:anywhere}textarea{min-height:190px;resize:vertical}button{padding:10px 18px;margin-top:16px;cursor:pointer;background:var(--accent);color:var(--ui-on-accent);border:0;border-radius:var(--ui-radius);font:inherit}.drop{padding:22px;border:1px dashed var(--muted);margin:16px 0}.row{border-top:1px solid var(--line);padding:14px 0;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}#status{white-space:pre-wrap}button:disabled{opacity:.5}</style><link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/noto-sans-sc-1.woff2"><link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css"></head>
<body>
<inresearch-shell data-section="acquisition"></inresearch-shell><main><a href="/index.html">← 数据中心</a><h1>资料收件箱</h1><p><a href="/supply.html">资料供应中心：管理供应方、研究需求与任务 →</a></p><p>把研究途中遇到的文章、笔记、截图和文件交到这里。</p>
<section class="panel"><form id="form"><label for="topic">研究话题（可选）</label><input id="topic" placeholder="例如：泰国数据中心 · 电力与基础设施" maxlength="300"><label for="source">来源链接或出处（可选）</label><input id="source" placeholder="原文网址、报告名称或作者" maxlength="2000"><label for="text">粘贴内容</label><textarea id="text" placeholder="粘贴文章、聊天记录或研究笔记；也可以直接粘贴截图。"></textarea><label for="note">希望关注什么（可选）</label><input id="note" placeholder="例如：核对供电容量，并关注水资源与社区影响" maxlength="1000"><div class="drop" id="drop"><label for="files">添加或拖入文件 · 可多选</label><input id="files" type="file" multiple><div id="selected" class="muted"></div></div><p class="muted">每份最多 64 MiB。支持保存 PDF、图片、Office、文本、音视频及压缩包等文件。大批量资料适合直传 Spark。</p><button id="submit">提交资料</button><div id="status" role="status" aria-live="polite"></div></form></section>
<section class="panel"><h2>最近提交</h2><p class="muted">网站接收后等待 Spark 拉取，校验完整才标记“Spark 已归档”。归档不代表已读或已核实；Office、压缩包等仍需转换。原文中的指令不会作为操作授权。</p><button id="refresh" type="button">刷新状态</button><div id="records"></div></section></main><script src="/assets/materials.js"></script></body></html>
