<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供应中心演示 · inresearch.ai</title><script src="/assets/theme-state.js"></script><script src="/assets/site-skin.js"></script><link rel="stylesheet" href="/assets/site-skin.css"></head><body><inresearch-shell data-section="materials"></inresearch-shell><div id="supply-demo" aria-label="资料供应中心交互示意">
<style>
#supply-demo{--s-bg:var(--bg);--s-soft:var(--card);--s-text:var(--text);--s-line:var(--line);--s-muted:var(--muted);--s-active:var(--accent);color:var(--s-text);background:var(--s-bg);font:14px/1.55 system-ui,sans-serif;border:1px solid var(--s-line);border-radius:12px;overflow:hidden}#supply-demo *{box-sizing:border-box}#supply-demo header{padding:16px 22px;border-bottom:1px solid var(--s-line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#supply-demo main{padding:22px}#supply-demo h2{margin:0;font-size:23px;font-weight:500}#supply-demo h3{font-size:16px;font-weight:500;margin:0 0 12px}#supply-demo p{margin:5px 0 15px;color:var(--s-muted)}#supply-demo button,#supply-demo select{font:inherit;color:var(--s-text);background:var(--s-bg);border:1px solid var(--s-line);border-radius:6px;padding:7px 11px;cursor:pointer}#supply-demo button[aria-pressed=true]{background:var(--s-soft);color:var(--s-active);border-color:var(--s-active)}#supply-demo .topnav{color:var(--s-muted)}#supply-demo .notice{font-size:12px;color:var(--s-muted)}#supply-demo .steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}#supply-demo .steps span{background:var(--s-soft);padding:8px 12px;border-radius:5px}#supply-demo .tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px}#supply-demo .layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:20px}#supply-demo .row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--s-line);border-radius:0;padding:13px 10px}#supply-demo .row small{display:block;color:var(--s-muted);font-size:12px;margin-top:4px}#supply-demo .row b{font-weight:500}#supply-demo .row .status{float:right;font-size:12px;color:var(--s-active);margin-left:8px}#supply-demo aside{padding:18px;background:var(--s-soft);border-radius:8px;overflow-wrap:anywhere}#supply-demo dl{margin:0}#supply-demo dt{font-size:12px;color:var(--s-muted);margin-top:12px}#supply-demo dd{margin:3px 0 0}#supply-demo .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#supply-demo select{max-width:100%;width:100%}#supply-demo .receipt{margin-top:16px;color:var(--s-active)}#supply-demo .history{border-left:2px solid var(--s-line);padding-left:12px;margin-top:18px;color:var(--s-muted);font-size:12px}#supply-demo .pill{font-size:12px;padding:2px 5px;background:var(--s-soft);border-radius:4px} @media(max-width:650px){#supply-demo .layout{grid-template-columns:1fr}#supply-demo main{padding:14px}#supply-demo .topnav{display:none}#supply-demo .row .status{float:none;display:block;margin:0}#supply-demo button{min-height:42px}}
</style>

<main><a href="/supply.html">← 返回真实供应中心</a><h2>资料供应中心 · 交互演示</h2><p>研究需求 → 供应任务 → 交付验收 → 资料入库 → 研究采用</p><div class="notice">交互 DEMO · 全部任务、数量与状态均为示例 · 操作仅在当前演示内生效 · 候选 repo 名称尚未确定</div>
<div class="steps"><span>需求分配</span><span>采集执行</span><span>交付验收</span><span>入库与处理</span></div>
<div class="tabs" aria-label="管理视图"><button type="button" data-tab="suppliers" aria-pressed="true">供应方与任务</button><button type="button" data-tab="needs" aria-pressed="false">研究需求与分配</button><button type="button" data-tab="accept" aria-pressed="false">交付与验收</button></div>
<div class="layout"><section id="sd-list" aria-label="列表"></section><aside id="sd-detail" aria-label="选中项详情"></aside></div><div id="sd-message" class="receipt" role="status" aria-live="polite"></div></main>
<script>
(()=>{const root=document.getElementById('supply-demo');const list=root.querySelector('#sd-list'),detail=root.querySelector('#sd-detail'),message=root.querySelector('#sd-message');
const suppliers=[
{name:'fetchspec',scope:'产品与技术资料',tag:'已有 repo · 待接入',task:'CDU 型号与官方规格书补齐',state:'待验收',map:'冷却与热管理 / P、F / T02、T04、T09',criterion:'指定型号的官方原件、版本、来源地址；功率及流量须保留适用条件。'},
{name:'inews.today',scope:'新闻与事件',tag:'已有上游',task:'数据中心供配电扩产事件跟踪',state:'采集中',map:'电力与供配电 / V / T06、T07',criterion:'保留事件、原始发布时间及来源；仅有标题时标为线索。'},
{name:'披露采集 repo',scope:'公司经营与披露',tag:'候选供应方',task:'目标厂商财报及分部收入原文',state:'采集中',map:'跨生态 / V / T05、T07、T08',criterion:'报告期、修订版本、原文与表格位置完整，保留收入定义。'},
{name:'项目采集 repo',scope:'项目与建设',tag:'候选供应方',task:'园区并网许可与建设阶段核对',state:'待分配',map:'设施与机柜 / P、V / T09',criterion:'区分规划、许可、在建与投运，不以公告容量代替投运容量。'},
{name:'公共数据采集 repo',scope:'公共统计与资源',tag:'候选供应方',task:'尚无分配任务',state:'待启用',map:'跨生态 / P、V、D / T03、T05、T09',criterion:'原始表格、单位、统计范围、统计期及修订版本。'},
{name:'文献采集 repo',scope:'论文、研究报告与白皮书',tag:'候选供应方',task:'尚无分配任务',state:'待启用',map:'跨生态 / P、F、V、D / T01—T09',criterion:'正文完整；作者、版本、图表与引用位置可追溯。'},
{name:'规范采集 repo',scope:'标准、法规与接口规范',tag:'候选供应方',task:'尚无分配任务',state:'待启用',map:'跨生态 / F、V / T01、T02、T09',criterion:'辖区、版本、生效状态、适用范围及替代关系。'},
{name:'市场观察 repo',scope:'报价、交易条款与价格',tag:'候选供应方',task:'GPU 云实例可比报价采样',state:'采集中',map:'计算与加速 / V、D / T08',criterion:'保留配置、地区、币种、计费方式、时间与附加费用。'},
{name:'技术实证接入',scope:'性能、运行与实验数据',tag:'采集器 / 实测任务',task:'尚无分配任务',state:'待启用',map:'跨生态 / F、D / T04、T09',criterion:'测试环境、负载、软件版本、方法与原始结果。'},
{name:'本地材料接入',scope:'上传 / raw materials',tag:'已有渠道 · 待统一接入',task:'本地液冷研究报告批次',state:'已入库 · 深读中',map:'冷却与热管理 / F、V / T02、T05',criterion:'核对文件身份与历史结果；未知出处明确待补，不冒充已核实。'}];
let tab='suppliers',chosen=0,assigned=false,accepted=false;const preferences={density:'舒展'};
function supplierView(){const s=suppliers[chosen];detail.innerHTML='<h3>'+s.name+'</h3><span class="pill">'+s.tag+'</span><dl><dt>供应能力</dt><dd>'+s.scope+'</dd><dt>当前分配任务</dt><dd>'+s.task+'</dd><dt>研究架构对应</dt><dd>'+s.map+'</dd><dt>交付验收条件</dt><dd>'+s.criterion+'</dd><dt>运行与调度</dt><dd>由供应方独立执行，中心记录任务、交付与回执。</dd></dl><div class="actions"><button type="button" id="sd-allocate">查看需求并分配</button></div>';detail.querySelector('#sd-allocate').onclick=()=>{tab='needs';render()};}
function needsView(){list.innerHTML='<h3>研究需求</h3><button class="row" type="button" aria-pressed="true"><b>园区并网许可与建设阶段核对</b><small>示例需求 DEM-004 · 设施与机柜 · T09</small><span class="status">'+(assigned?'已分配':'待分配')+'</span></button><div class="history">先匹配已有资料，再安排新的采集。<br>一项需求可拆给多个供应方；本例仅展示一个任务。</div>';detail.innerHTML='<h3>分配采集任务</h3><dl><dt>目标对象与范围</dt><dd>指定园区 · 中国 · 本期有效许可与建设进展</dd><dt>需要的材料</dt><dd>并网批复、建设许可及投运依据</dd><dt>验收条件</dt><dd>保留原文、项目身份、许可日期、容量口径；未找到须交付检索记录。</dd><dt>供应方</dt><dd><label for="sd-provider">匹配能力：项目与建设</label><select id="sd-provider"><option value="project">项目采集 repo · 候选，尚未接通</option><option value="local">本地材料接入 · 人工补充</option></select></dd></dl><div class="actions"><button type="button" id="sd-confirm">'+(assigned?'更新示例分配':'分配示例任务')+'</button></div>';detail.querySelector('#sd-confirm').onclick=()=>{assigned=true;const val=detail.querySelector('#sd-provider').value;suppliers[3].state=val==='project'?'已分配 · 待接通':'待分配';if(val==='local'){suppliers[9].task='本地液冷研究报告批次；园区许可材料补充';}render();message.textContent='示例任务已分配给'+(val==='project'?'项目采集 repo。候选供应方接通后才可执行。':'本地材料接入。等待人工补充。');};}
function acceptView(){list.innerHTML='<h3>交付批次</h3><button class="row" type="button" aria-pressed="true"><b>fetchspec / CDU 规格书</b><small>示例批次 DEL-021 · 3 份交付 · 2 份合格 / 1 份需补交</small><span class="status">'+(accepted?'部分验收通过':'待验收')+'</span></button><div class="history">本地报告批次 · 已入库 → Spark 深读中<br>入库回执和研究采用分开记录。</div>';detail.innerHTML='<h3>逐项验收</h3><dl><dt>型号 A · 规格书</dt><dd>✓ 原件、来源、版本与哈希检查通过</dd><dt>型号 B · 安装手册</dt><dd>✓ 完整可读，参数条件可定位</dd><dt>型号 C · 规格书</dt><dd>待补交：实际返回登录页面，未取得正文</dd><dt>研究采用</dt><dd>尚未审核；资料验收不授予事实采用资格。</dd></dl><div class="actions"><button type="button" id="sd-accept" '+(accepted?'disabled':'')+'>验收合格 2 份</button><button type="button" id="sd-return">要求补交 1 份</button></div><div class="history">发现 → 下载 → 交付 → 验收 → 入库 → 深读 → 采用<br>所有动作保留对象、时间和理由。</div>';detail.querySelector('#sd-accept').onclick=()=>{accepted=true;suppliers[0].state='部分入库';render();message.textContent='示例回执：2 份进入资料库，1 份仍待补交。需求保持部分交付，未关闭。';};detail.querySelector('#sd-return').onclick=()=>{message.textContent='示例补交单已记录：型号 C 缺少真实正文，需重新获取官方原件。';};}
function render(){root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));if(tab==='suppliers'){list.innerHTML='<h3>供应方目录 · 点击查看各自任务</h3>'+suppliers.map((s,i)=>'<button class="row" type="button" data-i="'+i+'" aria-pressed="'+(i===chosen)+'"><span class="status">'+s.state+'</span><b>'+s.name+'</b><small>'+s.scope+' · '+s.tag+'</small><small>任务：'+s.task+'</small></button>').join('');list.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.i);render()});supplierView();}else if(tab==='needs')needsView();else acceptView();root.querySelectorAll('.row').forEach(r=>r.style.padding=preferences.density==='紧凑'?'8px 10px':'13px 10px');}
root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;message.textContent='';render()});render();
})();
</script></div>
</body></html>
