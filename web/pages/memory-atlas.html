<body><inresearch-shell data-section="bom"></inresearch-shell><main><nav><a href="/bom3d.html?d=memory">内存领域与三类档案</a> / <a href="/bom.html#system-memory">内存类别图</a> / <a href="/rack3d.html?view=chip&amp;x=90&amp;node=part:hbm">独立封装三维示例</a> / <a href="/compute-atlas.html">计算角色</a></nav><h1>IT · 内存领域图</h1><p class="intro">HBM是封装内逻辑裸片旁的堆叠DRAM；项目dram类别专指服务器内存模组，CXL是内存接入/扩展方式。三种访问关系分别表达，不能HBM→DIMM→CXL串联。主板图只示RDIMM，CPU作为compute上下文；封闭CXL模组不凭外观认证协议或内部介质。园区三类均未建模，独立封装/主板及三维示例不证明八柜已安装。</p><div id="memory-domain"></div><p>功能依据：<a href="https://news.skhynix.com/en/hbm2e-opens-the-era-of-ultra-speed-memory-semiconductors/">SK hynix HBM/DRAM堆叠解释</a>、<a href="https://www.micron.com/products/memory/dram-modules/rdimm">Micron RDIMM定义</a>、<a href="https://computeexpresslink.org/wp-content/uploads/2024/02/CXL-1.1-Specification.pdf">CXL联盟Type3内存扩展定义</a>。只取功能关系，不据外形推定具体型号、性能或现场安装。</p></main><script type="module">import{mountTechnicalAtlas}from'/assets/technical-atlas.js';mountTechnicalAtlas(document.querySelector('#memory-domain'),'memory-domain',{view:'domain'});</script></body></html>
