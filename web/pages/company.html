<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head>
<script src="/assets/theme-state.js"></script>
<script src="/assets/site-skin.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司档案 — inresearch.ai</title>
<style>


  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.6 var(--ui-font); padding-bottom: 50px; }
  a { color: var(--accent); text-decoration: none; }
  .topbar { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 4px; padding: 0 18px; height: 46px; z-index: 20; }
  .topbar b { font-size: 15px; margin-right: 14px; }
  .tab { padding: 12px 14px; color: var(--muted); }
  .topbar .sp { flex: 1; }
  .switcher { font-size: 12px; }
  .wrap { max-width: 1240px; margin: 16px auto 0; padding: 0 16px; }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .head h1 { font-size: 24px; }
  .chip { font-size: 11px; border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 1px 9px; color: var(--muted); }
  .profile { color: var(--muted); font-size: 13px; max-width: 900px; margin-bottom: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 11px 14px; }
  .kpi .v { font-size: 21px; font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 11.5px; }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
  .board { min-width:0; background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 14px 16px; }
  .b12 { grid-column: span 12; } .b6 { grid-column: span 6; }
  @media (max-width: 980px) { .b6 { grid-column: span 12; } }
  .bh { display: flex; align-items: baseline; flex-wrap:wrap; gap:8px; margin-bottom: 8px; }
  .bh h2 { font-size: 14px; }
  .bh .go { margin-left: auto; font-size: 11.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 7px; border-radius: var(--ui-radius); color: #fff; }
  .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .sig { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .sig:last-child { border-bottom: none; }
  .sig a { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tip { position: fixed; background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius);
    box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px 12px; font-size: 12px; max-width: 280px;
    pointer-events: none; z-index: 50; display: none; line-height: 1.7; }
  .err { color: var(--red); padding: 20px; }
  .cat-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 8px; }
  .cat-group { border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 9px 11px; }
  .cat-group h3 { font-size: 13px; margin-bottom: 4px; }
  .cat-group .n { color: var(--muted); font-size: 11px; }
  .fam { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 2px 0; border-top: 1px dashed var(--line); }
  .fam span:last-child { color: var(--muted); white-space: nowrap; }
  .cover { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; margin: 4px 0 6px; }
  .cover b { font-size: 15px; }
  .st-delivered { color: var(--accent); font-weight: 600; } .st-needed { color: var(--muted); } .st-sourced { color: var(--green); font-weight: 600; }
</style>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/noto-sans-sc-1.woff2"><link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/site-skin.css">
</head>
<body>
<inresearch-shell data-section="bom"></inresearch-shell>
<div class="topbar">
   <a class="tab" href="bom.html">爆炸图</a>
  <span class="sp"></span>
  <select class="switcher" id="switcher" onchange="location='company.html?c='+this.value"></select>
</div>
<div class="wrap" id="root">加载中…</div>

<script>
async function get(p) {
  const r = await fetch(p + (p.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(p + " → HTTP " + r.status);
  return r.json();
}
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const fmtMW = n => n >= 10000 ? (n / 1000).toFixed(1) + " GW" : Math.round(n).toLocaleString() + " MW";
function capBuckets(p) {
  let op = 0, bu = 0, pl = 0;
  const put = (l, v) => { const n = +l.slice(1); if (n >= 8) op += v; else if (n >= 6) bu += v; else pl += v; };
  if (p.capacity_it_mw) put(p.status, p.capacity_it_mw);
  for (const [k, v] of Object.entries(p.capacity_it_mw_by_status || {})) put(k, v);
  return [op, bu, pl];
}
const SC = l => +l.slice(1) >= 8 ? "var(--green)" : +l.slice(1) >= 6 ? "var(--yellow)" : "var(--gray)";
const SUP = { tight: "紧缺", transition: "技术切换中", mature: "成熟", emerging: "新兴" };

/* 已登记产品：Git 内事件卡（data/event_cards.json）里属于这家公司的交付。Fetchspec 的产品 ID 是「公司-20位哈希」，
   两家的公司 ID 与公司表不同名，在此对照。一张卡是一条目标行；同一来源页面交付到多行时合成一个产品。 */
const FETCHSPEC_COMPANY = { asteralabs: "astera-labs", delta: "delta-electronics" };
function cardCompanies(card) {
  const ids = (card.parameters || []).map(p => p.product_id);
  const m = /products ([^;]+)/.exec(card.note || "");
  if (m) ids.push(...m[1].split(","));
  return new Set(ids.map(id => String(id).trim().replace(/-[0-9a-f]{20}$/, "")).map(co => FETCHSPEC_COMPANY[co] || co));
}
function registeredProducts(cards, cid) {
  const byPage = new Map();
  for (const c of cards) {
    if (c.team !== "fetchspec" || !cardCompanies(c).has(cid)) continue;
    const p = byPage.get(c.origin_pointer) || { url: c.origin_pointer, kind: c.pointer_kind, at: c.delivered_at, targets: [], parameters: [] };
    p.targets.push(c.target_id);
    for (const v of c.parameters || []) p.parameters.push({ ...v, target_id: c.target_id });
    if ((c.delivered_at || "") > (p.at || "")) p.at = c.delivered_at;
    byPage.set(c.origin_pointer, p);
  }
  return [...byPage.values()].sort((a, b) => a.targets[0].localeCompare(b.targets[0]));
}
function productHtml(p) {
  let host = p.url, label = p.url;
  try { const u = new URL(p.url); host = u.hostname.replace(/^www\./, ""); label = decodeURIComponent(u.pathname.split("/").filter(Boolean).pop() || host); } catch (e) {}
  const link = p.kind === "url" ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>` : `<code>${esc(p.url)}</code>`;
  const many = p.targets.length > 1;   // name the row only when one page delivers to several
  const rows = p.parameters.map(v => `<tr><td><code>${esc(v.parameter_name)}</code>${many ? `<div style="font-size:10.5px;color:var(--gray)">${esc(v.target_id)}</div>` : ""}</td>
      <td>${esc(v.value)}${v.unit ? ` <span style="color:var(--muted)">[${esc(v.unit)}]</span>` : ""}${v.condition ? `<div style="font-size:11px;color:var(--muted)">${esc(v.condition)}</div>` : ""}</td></tr>`).join("");
  return `<div class="sec registered-product" style="margin-bottom:14px"><h3>${link} <span style="font-size:11px;color:var(--muted)">${esc(host)} · ${esc(p.at || "")}</span></h3>
    <div>${p.targets.map(t => `<a class="chip" href="supply.html?q=${encodeURIComponent(t)}#targets">${esc(t)}</a>`).join("")}</div>
    ${rows ? `<div class="ui-table-scroll" tabindex="0" role="region" aria-label="Table"><table><tr><th>参数</th><th>原文值 [单位] · 条件</th></tr>${rows}</table></div>` : '<div class="note">这次交付只登记了原件指针，没有随附参数。</div>'}</div>`;
}

/* 产品目录：/api/product-catalog/<公司>?view=summary（与规格库同一份数据）；没建目录的公司返回 404，这里如实说明。 */
const STATUS_LABEL = { delivered: "已交付", needed: "缺", sourced: "已有", assumed: "假设" };
/* 厂商分类名的中文对照（与 product-catalog.js 同一份），原文始终并列显示。 */
const VENDOR_ZH = { micron: {
  memory: "内存", storage: "存储", "multichip-packages": "多芯片封装",
  "dram-components": "DRAM 颗粒", "dram-modules": "DRAM 内存条", "lpddr-components": "LPDDR 颗粒", "lpddr-modules": "LPDDR 模组",
  hbm: "高带宽内存 HBM", "graphics-memory": "显存 GDDR", ssd: "固态硬盘 SSD", "nand-flash": "NAND 闪存", "nor-flash": "NOR 闪存",
  "managed-nand": "嵌入式存储", "memory-cards": "存储卡", "emmc-based-mcp": "e.MMC 多芯片封装", "nand-based-mcp": "NAND 多芯片封装", "ufs-based-mcp": "UFS 多芯片封装" } };
const vendorLabel = (cid, id, label) => (VENDOR_ZH[cid] || {})[id] ? `${VENDOR_ZH[cid][id]} · ${label}` : label;
function catalogHtml(cat, c) {
  const head = `<div class="bh"><h2>产品目录（官网爬取）</h2>${cat && cat.available ? `<a class="go" href="product-catalog.html?c=${encodeURIComponent(c.company_id)}">打开 ${esc(c.name)} 产品规格库 →</a>` : ""}</div>`;
  if (!cat || !cat.available) return head + `<div class="note">还没有为 ${esc(c.name)} 建立产品目录。目录按 NVIDIA 打样标准做：先从原厂官网建全量产品清单，再逐个产品取官方规格，原生参数原样入库。</div>`;
  const s = cat.summary || {}, cov = s.specification_coverage || {}, named = cov.current_named_products || cov.named_products || {};
  const listing = s.by_listing || {}, status = s.by_official_status || {};
  const all = (s.by_group || []).filter(g => g.id && !/obsolete/i.test(g.id));
  const groups = all.filter(g => g.entities > 1 || g.with_tables), single = all.filter(g => !(g.entities > 1 || g.with_tables));
  const obsoleteGroup = (s.by_group || []).find(g => /obsolete/i.test(g.id || ""));
  return head + `<div class="cover">
      <span><b>${esc(named.with_tables ?? "—")}</b> / ${esc(named.total ?? "—")} ${cov.current_named_products ? "在售" : ""}具体型号有官方规格${(s.by_extraction_status || {}).family_brief_table_extracted ? `（其中 ${esc(s.by_extraction_status.family_brief_table_extracted)} 个是系列产品简介的规格总表，非逐型号）` : ""}</span>
      <span><b>${esc(cov.all_entities?.with_tables ?? "—")}</b> / ${esc(cov.all_entities?.total ?? s.entities ?? "—")} 全部目录实体有规格表</span>
      ${cov.obsolete_listed ? `<span><b>${esc(cov.obsolete_listed)}</b> 个停产型号只登记不抓规格</span>` : ""}
      ${listing.directory ? `<span><b>${esc(listing.directory)}</b> 个分类 / 系列页</span>` : ""}
      <span class="note" style="margin:0">生成于 ${esc((cat.generated_at || "").slice(0, 10))}</span></div>
    <div class="cat-groups">${groups.map(g => `<div class="cat-group"><h3>${esc(vendorLabel(c.company_id, g.id, g.label || g.id))}</h3><div class="n">${esc(g.entities)} 条 · ${esc(g.with_tables)} 有规格表</div>
      ${(g.families || []).filter(f => f.id).sort((a, b) => b.entities - a.entities).slice(0, 8).map(f => `<div class="fam"><a href="product-catalog.html?${new URLSearchParams({ c: c.company_id, group: g.id, family: f.id })}">${esc(vendorLabel(c.company_id, f.id, f.label || f.id))}</a><span>${esc(f.with_tables)} / ${esc(f.entities)}</span></div>`).join("")}
      ${(g.families || []).filter(f => f.id).length > 8 ? `<div class="n">另有 ${(g.families || []).filter(f => f.id).length - 8} 个系列</div>` : ""}</div>`).join("")}</div>
    ${Object.keys(status).length ? `<div class="note">官网状态（厂商原文，不等于已核实在售）：${Object.entries(status).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k === "unspecified" ? "未标注" : k)} ${esc(v)}`).join(" · ")}</div>` : ""}
    ${single.length ? `<div class="note">其他官网分类页（只有页面、没有型号）：${single.map(g => esc(g.label || g.id)).join(" · ")}</div>` : ""}
    ${obsoleteGroup ? `<div class="note">${esc(obsoleteGroup.label)}：${esc(obsoleteGroup.entities)} 条，只登记身份。</div>` : ""}
    <div class="note">分类就是 ${esc(c.name)} 官网自己的产品分类，本站不重新归类；规格是官方表格原文，未映射通用字段，是候选资料，正式采用另走研究流程。
      <a href="api/product-catalog/${encodeURIComponent(c.company_id)}?export=products">产品清单 CSV</a> · <a href="api/product-catalog/${encodeURIComponent(c.company_id)}?export=specs">原始参数 CSV</a></div>`;
}
/* 需求：目标表里实例点名这家公司的 Fetchspec 行（有目录时用接口算好的对照，否则在本页按名称匹配）。 */
function demandRows(targets, c, cat, registered) {
  const names = [c.name.split("/")[0].trim(), c.company_id].map(s => s.toLowerCase()).filter(s => s.length >= 3);
  const byId = Object.fromEntries(targets.map(t => [t.id, t]));
  const ids = cat && cat.research_alignment ? cat.research_alignment.target_ids
    : targets.filter(t => t.team === "fetchspec" && (t.instances || []).some(i => names.some(n => String(i).toLowerCase().includes(n)))).map(t => t.id);
  return ids.filter(id => byId[id]).map(id => ({ row: byId[id], products: registered.filter(p => p.targets.includes(id)) }));
}
function demandRow(d) {
  const r = d.row, products = d.products.map(p => {
    let label = p.url; try { label = decodeURIComponent(new URL(p.url).pathname.split("/").filter(Boolean).pop()); } catch (e) {}
    const n = p.parameters.filter(v => v.target_id === r.id).length;
    return `<a href="#registered">${esc(label)}</a>${n ? ` <span class="note">${n} 个参数</span>` : ""}`; }).join("<br>");
  return `<tr><td><a href="supply.html?q=${encodeURIComponent(r.id)}#targets"><code>${esc(r.id)}</code></a><div class="note" style="margin:0">${esc(r.notes || "")}</div></td>
    <td class="st-${esc(r.status)}">${esc(STATUS_LABEL[r.status] || r.status)}</td><td>${products || '<span class="note">—</span>'}</td></tr>`;
}

/* 主体页（第五类变量）：一家公司供应哪些部件、持有哪条权利、有哪些产品线；园区与合同作附表。从节点页第五列进入。 */
(async () => {
try {
  const cid = new URLSearchParams(location.search).get("c") || "microsoft";
  const [companies, bom, rights, products, projectsDoc, contracts, cardsDoc] = await Promise.all([
    get("data/companies.json"), get("framework/bom.json"), get("framework/site_rights.json").catch(() => ({ rights: [] })),
    get("data/products.json").catch(() => ({ records: [] })), get("data/projects.json").catch(() => ({ records: [] })), get("data/contracts.json").catch(() => ({ records: [] })),
    get("data/event_cards.json").catch(() => ({ records: [] }))]);
  const [catalog, targetsDoc] = await Promise.all([
    get("api/product-catalog/" + encodeURIComponent(cid) + "?view=summary").catch(() => null),
    get("framework/tco_targets.json").catch(() => ({ targets: [] }))]);
  const c = companies.records.find(x => x.company_id === cid);
  if (!c) throw new Error("公司不存在: " + cid);
  document.title = c.name + " — 主体 — inresearch.ai";
  const cname = Object.fromEntries(companies.records.map(x => [x.company_id, x.name_cn || x.name]));
  const pri = r => r.includes("hyperscaler") ? 0 : r.includes("ai-lab") ? 1 : r.includes("neocloud") ? 2 : r.includes("colo") ? 3 : 4;
  document.getElementById("switcher").innerHTML = companies.records
    .slice().sort((a, b) => pri(a.roles) - pri(b.roles) || a.name.localeCompare(b.name))
    .map(x => `<option value="${esc(x.company_id)}" ${x.company_id === cid ? "selected" : ""}>${esc(x.name_cn || x.name)}</option>`).join("");

  const systems = bom.systems;
  const sysName = sid => { const s = systems[sid] || {}; const top = s.parent ? systems[s.parent] : s; return (top.name || sid) + (s.parent ? " · " + String(s.name || sid).replace("IT · ", "") : ""); };
  const supplied = bom.parts.filter(p => (p.companies || []).includes(cid));
  const bySystem = {};
  supplied.forEach(p => (bySystem[p.system] ||= []).push(p));
  const held = (rights.rights || []).filter(r => (r.companies || []).includes(cid));
  const lines = (products.records || []).filter(r => r.company_id === cid);
  const mine = projectsDoc.records.filter(p => (p.developer || []).includes(cid) || (p.tenant || []).includes(cid));
  const myContracts = contracts.records.filter(x => (x.parties || []).includes(cid));
  const registered = registeredProducts(cardsDoc.records || [], cid);
  const demand = demandRows(targetsDoc.targets || [], c, catalog, registered);

  const supplyHtml = Object.keys(bySystem).length ? Object.entries(bySystem).map(([sid, parts]) => `<div class="sec"><h3>${esc(sysName(sid))}</h3>${parts.sort((a, b) => (a.chain_order || 0) - (b.chain_order || 0)).map(p =>
      `<a class="chip" href="node.html?id=part:${encodeURIComponent(p.id)}&col=5" title="${esc(p.chain || "")} 第 ${p.chain_order || "?"} 位 · ${SUP[p.status] || p.status}">${esc(p.name)}</a>`).join("")}</div>`).join("")
    : '<div class="note">骨架里没有登记这家公司供应的部件（登记数，不代表现场供应商）。</div>';
  const rightsHtml = held.length ? held.map(r => `<a class="chip" href="node.html?id=site:${encodeURIComponent(r.id)}&col=5">${esc(r.name)}</a>`).join("") : '<div class="note">没有登记持有的站点权利。</div>';
  const linesHtml = lines.length ? `<div class="ui-table-scroll" tabindex="0" role="region" aria-label="Table"><table><tr><th>产品线</th><th>部件</th><th>系统 · 链路</th><th>状态</th><th>资料</th></tr>${lines.map(l =>
      `<tr><td>${esc(l.product_line)}<div style="font-size:10.5px;color:var(--gray)">${esc(l.representative_models || "")}</div></td><td>${(l.bom_parts || []).map(pid => `<a href="node.html?id=part:${encodeURIComponent(pid)}">${esc(pid)}</a>`).join("、")}</td><td>${esc(l.system ? sysName(l.system) : "")}${l.chain ? " · " + esc(l.chain) : ""}</td><td>${esc(SUP[l.status] || l.status || "")}</td><td>${l.library_path ? `<a href="product-catalog.html">规格库</a>` : ""}</td></tr>`).join("")}</table></div>`
    : '<div class="note">产品库没有这家公司的产品线。</div>';
  const projRows = mine.sort((a, b) => { const ca = capBuckets(a), cb = capBuckets(b); return (cb[0] + cb[1] + cb[2]) - (ca[0] + ca[1] + ca[2]); }).map(p => {
    const [o, b, l] = capBuckets(p), tot = o + b + l;
    return `<tr><td>${esc(p.name)}<div style="font-size:10.5px;color:var(--gray)">${esc(p.location || "")}</div></td>
      <td><span class="badge" style="background:${SC(p.status)}">${esc(p.status)}</span></td>
      <td>${tot ? fmtMW(tot) : "<span style='color:var(--gray)'>未披露</span>"}</td>
      <td>${(p.developer || []).includes(cid) ? "自建/开发" : "租户"}</td>
      <td style="font-size:11px">${esc(p.verified_date || "")}</td>
      <td>${(p.sources || [])[0] ? `<a href="${esc(p.sources[0].url)}" target="_blank" rel="noopener">源</a>` : ""}</td></tr>`;
  }).join("");

  document.getElementById("root").innerHTML = `
    <div class="head"><h1>${esc(c.name)}</h1><span style="color:var(--muted)">${esc(c.name_cn || "")}</span>
      <span class="chip">主体 · 第五类变量</span>
      ${(c.roles || []).map(r => `<span class="chip">${esc(r)}</span>`).join("")}
      ${c.ticker ? `<span class="chip">${esc(c.ticker)}</span>` : ""}
      ${c.ir_url ? `<a class="chip" href="${esc(c.ir_url)}" target="_blank" rel="noopener">IR ↗</a>` : ""}
      ${c.cik ? `<a class="chip" href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${encodeURIComponent(c.cik)}" target="_blank" rel="noopener">EDGAR ↗</a>` : ""}</div>
    <div class="profile">${esc(c.profile || "")}${c.website ? ` <a href="${esc(c.website)}" target="_blank" rel="noopener">官网 ↗</a>` : ""}</div>
    <div class="grid">
      <div class="board b12" id="catalog">${catalogHtml(catalog, c)}</div>
      <div class="board b12" id="demand"><div class="bh"><h2>需求与交付对照（${demand.length} 条目标行）</h2><a class="go" href="supply.html#targets">目标表 →</a></div>
        ${demand.length ? `<div class="ui-table-scroll" tabindex="0" role="region" aria-label="Table"><table><tr><th>目标行</th><th>状态</th><th>已交付的产品</th></tr>${demand.map(demandRow).join("")}</table></div>`
          : '<div class="note">目标表里没有点名这家公司的行。</div>'}
        <div class="note">inresearch.ai 的采集需求只来自目标表：这里列出实例点名这家公司的行，及 Fetchspec 已交付到每行的产品与参数原文。</div></div>
      <div class="board b6"><div class="bh"><h2>供应的部件（${supplied.length}）</h2><a class="go" href="bom.html">爆炸图 →</a></div>${supplyHtml}
        <div class="note">来自骨架登记（bom.json 的 companies）：类别关联，不代表现场供应商；点部件进节点页第五列。</div></div>
      <div class="board b6"><div class="bh"><h2>持有的站点权利（${held.length}）</h2><a class="go" href="node.html?id=site">六条权利 →</a></div>${rightsHtml}
        <div class="note">登记数：只说明登记过持有关系，事件卡与合同是证据。</div>
        <div class="bh" style="margin-top:14px"><h2>产品线（${lines.length}）</h2><a class="go" href="product-catalog.html">规格库 →</a></div>${linesHtml}</div>
      <div class="board b12" id="registered"><div class="bh"><h2>已登记产品（Fetchspec 交付 · ${registered.length}）</h2><a class="go" href="supply.html#targets">目标表 →</a></div>
        ${registered.length ? registered.map(productHtml).join("") : '<div class="note">还没有这家公司的 Fetchspec 交付。</div>'}
        <div class="note">厂商官网原文值（不换算），随交付登记到目标行；单位与条件照审阅过的映射。是候选资料，不是序列，正式采用另走研究流程。</div></div>
      <div class="board b12"><div class="bh"><h2>关联园区（附表 · ${mine.length}）</h2></div>
        <div class="ui-table-scroll" tabindex="0" role="region" aria-label="Table"><table><tr><th>园区</th><th>状态</th><th>合计容量</th><th>关系</th><th>核验</th><th>来源</th></tr>${projRows || "<tr><td colspan=6>暂无关联园区</td></tr>"}</table></div>
        <div class="note">容量口径：IT 负载 MW；未披露 ≠ 不存在。</div></div>
      <div class="board b12"><div class="bh"><h2>关联合同（附表 · ${myContracts.length}）</h2></div>
        ${myContracts.length ? `<div class="ui-table-scroll" tabindex="0" role="region" aria-label="Table"><table><tr><th>合同</th><th>类型</th><th>$B</th><th>循环</th></tr>` +
          myContracts.map(x => `<tr><td>${esc(x.contract_id)}<div style="font-size:10px;color:var(--gray)">${(x.parties || []).map(p => esc(cname[p] || p)).join(" ↔ ")}</div></td>
          <td>${esc(x.type)}</td><td>${x.value_usd_b ?? "—"}</td><td>${x.circular_flag ? "⚠️" : "—"}</td></tr>`).join("") + "</table></div>" : '<div class="note">暂无</div>'}</div>
    </div>`;
} catch (e) {
  const error = document.createElement("div");
  error.className = "err";
  error.textContent = `加载失败：${e.message}`;
  document.getElementById("root").replaceChildren(error);
}
})();
</script>
</body>
</html>
