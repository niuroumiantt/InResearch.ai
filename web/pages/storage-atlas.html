<body><inresearch-shell data-section="bom"></inresearch-shell><main><nav><a href="/bom3d.html?d=storage">存储领域与三类档案</a> / <a href="/bom.html#system-storage">存储类别图</a> / <a href="/rack3d.html?node=part:ssd">独立SSD部件示例</a> / <a href="/memory-atlas.html">内存访问关系</a></nav><h1>IT · 存储领域图</h1><p class="intro">存储系统包含设备及控制软件/服务范围，图中机架盒只是选定实体外形；八个外托架不等于八个已装盘或RAID。SSD与HDD是可选整盘介质，本地直连与网络访问分别表达，不按目录把系统→SSD→HDD串联。三类在园区均未建模，独立SSD与HDD剖开不证明八柜已安装。</p><div id="storage-domain"></div><p>功能依据：<a href="https://nvmexpress.org/specifications/">NVM Express 官方传输与访问总览</a>、<a href="https://www.snia.org/education/online-dictionary/term/storage-array">SNIA 存储阵列定义</a>、<a href="https://www.seagate.com/in/en/blog/how-magnetic-storage-devices-are-organized/">Seagate 磁记录存储说明</a>。只取功能关系，不据外形推定具体型号、性能或现场安装。</p></main><script type="module">import{mountTechnicalAtlas}from'/assets/technical-atlas.js';mountTechnicalAtlas(document.querySelector('#storage-domain'),'storage-domain',{view:'domain'});</script></body></html>
