/* ─────────── 程序化纹理 ─────────── */
function ctex(w, h, draw, repX = 1, repY = 1) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repX !== 1 || repY !== 1) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY); }
  return t;
}
const rnd = (() => { let s = 7; return () => (s = s * 16807 % 2147483647) / 2147483647; })();
const TEX = {
  post: ctex(32, 256, (g, w, h) => {           // 机柜立柱：EIA 孔带
    g.fillStyle = "#10141c"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#05070b";
    for (let y = 5; y < h; y += 10) { g.fillRect(7, y, 6, 6); g.fillRect(19, y, 6, 6); }
  }, 1, 4),
  doorPerf: ctex(128, 256, (g, w, h) => {      // 前后门：六角穿孔网

    }
  }, 2, 1),
  dimm: ctex(128, 24, (g, w, h) => {
    g.fillStyle = "#0f3d2a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#12161f";
    for (let x = 4; x < w - 10; x += 15) g.fillRect(x, 4, 11, h - 10);
    g.fillStyle = "#c9a227"; g.fillRect(0, h - 4, w, 3);
  }),
  floorTx: ctex(512, 512, (g, w, h) => {
    g.fillStyle = "#10141c"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2200; i++) {
      g.fillStyle = `rgba(255,255,255,${rnd() * .03})`;
      g.fillRect(rnd() * w, rnd() * h, 1.6, 1.6);

    g.strokeStyle = "rgba(120,150,190,.14)"; g.lineWidth = 2;
    for (let x = 0; x <= w; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  }),
  fanFrame: ctex(64, 64, (g, w, h) => {
    g.fillStyle = "#141922"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#2c3850"; g.lineWidth = 3; g.strokeRect(2, 2, w - 4, h - 4);

const stageEl = document.getElementById("stage");
const slider = document.getElementById("explode");
function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function apply() {
  const t = slider.value / 100;
  animated.forEach(a => {
    const k = a.t1 <= a.t0 ? 1 : Math.min(1, Math.max(0, (t - a.t0) / (a.t1 - a.t0)));
    const e = ease(k);
    a.obj.position.set(a.home.x + a.off.x * e, a.home.y + a.off.y * e, a.home.z + a.off.z * e);
  });
  scene.traverse(o => { if (o.isSprite && o.userData.showAfter !== undefined) o.visible = t >= o.userData.showAfter; });
  let s = STAGES[0][1];
  STAGES.forEach(([th, txt]) => { if (t >= th) s = txt; });
  stageEl.textContent = s;
}
slider.addEventListener("input", apply);
{ const x = new URLSearchParams(location.search).get("x"); if (x !== null) slider.value = Math.max(0, Math.min(100, +x || 0)); }

  (function anim(t) {
    const k = Math.min(1, (t - t0) / dur);
    slider.value = from + (to - from) * k;
    apply();
    if (k < 1) requestAnimationFrame(anim);
  })(t0);
};

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const tip = document.getElementById("tip3d");
let hovered = null;
function setHover(o, on) {
  matsOf(o).forEach(mat => {
    if (on) {
      if (mat.userData._hei === undefined) mat.userData._hei = mat.emissiveIntensity || 0;
      if (!mat.emissive) mat.emissive = new THREE.Color(0xffffff);
      if (mat.emissive.getHex() === 0) mat.emissive.setHex(0x93c5fd);
      mat.emissiveIntensity = Math.max(0.45, mat.userData._hei + 0.3);
    } else if (mat.userData._hei !== undefined) {
      mat.emissiveIntensity = mat.userData._hei;
      delete mat.userData._hei;
    }
  });
}
function pick(e) {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables)[0];
  return hit ? hit.object : null;
}
addEventListener("pointermove", e => {
  const o = pick(e);
  if (hovered && hovered !== o) { setHover(hovered, false); hovered = null; }
  if (o && o.userData.part) {
    if (hovered !== o) { setHover(o, true); hovered = o; }
    const p = PART[o.userData.part];
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 220) + "px";
    tip.style.top = (e.clientY + 12) + "px";
    tip.textContent = p ? `${p.name}（${SN[p.status]}）· 点击看档案` : o.userData.part;
    canvas.style.cursor = "pointer";
  } else { tip.style.display = "none"; canvas.style.cursor = "grab"; }
});
addEventListener("click", e => {
  if (e.target.closest("#dossier") || e.target.closest(".hud") || e.target.closest(".topbar")) return;
  const o = pick(e);
  if (o?.userData.part && PART[o.userData.part]) showDossier(PART[o.userData.part]);
});
function latest(sid) {
  const pts = prices.records.filter(r => r.series_id === sid).sort((a, b) => a.as_of < b.as_of ? 1 : -1);
  return pts[0];
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
function sparkline(sid) {
  const pts = prices.records.filter(r => r.series_id === sid && typeof r.value === "number")
    .sort((a, b) => a.as_of < b.as_of ? -1 : 1);
  if (pts.length < 3) return null;
  const W = 292, H = 56, PX = 3, PY = 6;
  const vs = pts.map(r => r.value);
  const lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const X = i => PX + i / (pts.length - 1) * (W - 2 * PX);
  const Y = v => H - PY - (v - lo) / span * (H - 2 * PY);
  const line = pts.map((r, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(r.value).toFixed(1)}`).join("");
  const last = pts[pts.length - 1];
  return `<div class="spark-wrap">
    <div class="sname"><span>${esc(sid)}</span><b>${last.value.toLocaleString()} ${esc(last.unit)}</b></div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${X(pts.length - 1).toFixed(1)}" cy="${Y(last.value).toFixed(1)}" r="3" fill="var(--accent)"/>
    </svg>
    <div class="sname"><span style="font-size:10px">${pts[0].as_of} → ${last.as_of}</span><span style="font-size:10px">区间 ${lo.toLocaleString()}–${hi.toLocaleString()}</span></div>
  </div>`;
}
/* ── 部件旋转查看器（与 bom3d 同款）── */
const PARTMESH = {};
function rebuildPartMesh() {
  Object.keys(PARTMESH).forEach(k => delete PARTMESH[k]);
  pickables.forEach(m => { (PARTMESH[m.userData.part] ||= []).push(m); });
}
rebuildPartMesh();
const iCv = document.createElement("canvas");
iCv.width = 604; iCv.height = 380;
let iRen = null, iScene, iCam, iPivot, iGroup, iSpin = true, iRotX = -0.35, iRotY = 0.7, iVisible = false;
function initInspector() {
  iRen = new THREE.WebGLRenderer({ canvas: iCv, antialias: true, alpha: true });
  iRen.setPixelRatio(1);
  iRen.outputColorSpace = THREE.SRGBColorSpace;
  iRen.toneMapping = THREE.ACESFilmicToneMapping;
  iRen.toneMappingExposure = 1.25;
  iRen.setSize(604, 380, false);
  iScene = new THREE.Scene();
  iScene.environment = scene.environment;
  iCam = new THREE.PerspectiveCamera(36, 604 / 380, 0.01, 200);
  iScene.add(new THREE.HemisphereLight(0x9db4d8, 0x141a26, 0.8));
  const l1 = new THREE.DirectionalLight(0xfff2e0, 1.9); l1.position.set(3, 5, 4); iScene.add(l1);
  const l2 = new THREE.DirectionalLight(0x6f9fff, 0.8); l2.position.set(-4, 2, -3); iScene.add(l2);
  iPivot = new THREE.Group(); iScene.add(iPivot);
  iGroup = new THREE.Group(); iPivot.add(iGroup);
  let drag = null;
  iCv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; iSpin = false; iCv.setPointerCapture(e.pointerId); });
  iCv.addEventListener("pointermove", e => {
    if (!drag) return;
    iRotY += (e.clientX - drag[0]) * 0.012;
    iRotX = Math.max(-1.3, Math.min(1.3, iRotX + (e.clientY - drag[1]) * 0.012));
    drag = [e.clientX, e.clientY];
  });
  iCv.addEventListener("pointerup", () => drag = null);
}
function cloneMatForInspect(m) {
  const c = m.clone();
  c.userData = {};
  return c;
}
function buildInspector(pid) {
  const meshes = PARTMESH[pid];
  iVisible = false;
  if (!meshes?.length) return false;
  if (!iRen) initInspector();
  while (iGroup.children.length) iGroup.remove(iGroup.children[0]);
  meshes.forEach(src => {
    src.updateWorldMatrix(true, false);
    const mat = Array.isArray(src.material) ? src.material.map(cloneMatForInspect) : cloneMatForInspect(src.material);
    const m = new THREE.Mesh(src.geometry, mat);
    m.applyMatrix4(src.matrixWorld);
    iGroup.add(m);
  });
  const bb = new THREE.Box3().setFromObject(iGroup);
  const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  iGroup.position.set(-c.x, -c.y, -c.z);
  const rad = Math.max(s.x, s.y, s.z, 0.3) * 0.5;
  iCam.position.set(0, rad * 0.45, rad * 2.9);
  iCam.lookAt(0, 0, 0);
  iSpin = true; iRotX = -0.35; iRotY = 0.7;
  iVisible = true;
  return true;
}
function inspectTick() {
  if (!iRen || !iVisible || !iCv.isConnected) return;
  if (iSpin) iRotY += 0.006;
  iPivot.rotation.set(iRotX, iRotY, 0);
  iRen.render(iScene, iCam);
}

function showDossier(p) {
  const el = document.getElementById("dossier");
  let rows = [];
  (p.series || []).forEach(sid => {
    const sp = sparkline(sid);
    if (sp) { rows.push(sp); return; }
    const r = latest(sid); if (r) rows.push(`<div class="kv"><span>${sid}</span><b>${r.value.toLocaleString()} ${r.unit}</b></div>`);
  });
  (p.indicators || []).forEach(iid => { const i = INDS[iid]; if (i) rows.push(`<div class="kv"><span>${i.name}</span><b>${i.value != null ? i.value.toLocaleString() + " " + i.unit : "待录入"}</b></div>`); });
  el.innerHTML = `<span class="close" onclick="this.parentElement.style.display='none'">✕</span>
    <h2>${esc(p.name)}</h2>
    <div class="meta">${p.layer} ${BOM.layers.find(l => l.id === p.layer)?.name || ""} ·
      <span class="badge" style="background:${SBADGE[p.status]}">${SN[p.status]}</span></div>
    <div class="insp" id="inspSlot" style="display:none"><div class="ihint">🔄 拖动旋转 · 单独查看该部件</div></div>
    <div style="font-size:12.5px">${esc(p.desc)}</div>
    <div class="sec"><h3>研究归属</h3><a class="chip" href="report.html#ch-${p.module}">📖 ${p.module} ${MODNAME[p.module] || ""}</a>
      <a class="chip" href="doc.html?f=research/${p.module}.md">原文</a></div>
    ${p.companies?.length ? `<div class="sec"><h3>关联公司</h3>${p.companies.map(c => `<a class="chip" href="company.html?c=${c}">${CN[c] || c}</a>`).join("")}</div>` : ""}
    <div class="sec"><h3>数据与指标</h3>${rows.join("") || '<div style="color:var(--muted);font-size:12px">量化序列待建——下一个采集点</div>'}</div>`;
  if (buildInspector(p.id)) {
    const slot = document.getElementById("inspSlot");
    slot.style.display = "block";
    slot.insertBefore(iCv, slot.firstChild);
  }
  el.style.display = "block";
}

/* ─────────── 主循环：渲染 + 风扇旋转 + LED 呼吸 ─────────── */
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  spinners.forEach(r => r.rotation.z += dt * 9);
  pulsers.forEach(({ m, ph }) => m.material.emissiveIntensity = 1.1 + Math.sin(t * 2.4 + ph) * 0.7);
  controls.update();
  composer.render();
  inspectTick();
})();

// #<part-id> 深链：bom3d 档案里的"上拆解台看结构"落点（放最后：依赖上面全部初始化完成）
{ const pid = location.hash.slice(1);
  if (PART[pid]) { controls.autoRotate = false; showDossier(PART[pid]); } }

/* GLB 模型槽（A3 方案①）：assets/models/manifest.json 登记的模型自动装载
   scale 省略或写 "auto" 时自动适配：按包围盒缩放到 fitHeight（默认整柜高），并落地居中 */
fetch("assets/models/manifest.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(mf => {
  (mf?.models || []).filter(m => m.page === "rack3d" && m.file).forEach(m => {
    new GLTFLoader().load("assets/models/" + m.file, g => {
      const o = g.scene;
      o.traverse(x => { if (x.isMesh) { x.castShadow = x.receiveShadow = true; } });
      o.rotation.y = m.rotationY || 0;
      const auto = (m.scale === undefined || m.scale === null || m.scale === "auto");
      if (auto) {
        // 自动适配：无论模型用米/厘米/英寸建模，都缩到目标高度并坐在地面上
        const bb = new THREE.Box3().setFromObject(o);
        const size = bb.getSize(new THREE.Vector3());
        const target = m.fitHeight || (RH + 0.7);         // 默认与整柜等高
        const k = size.y > 1e-6 ? target / size.y : 1;
        o.scale.setScalar(k);
        const bb2 = new THREE.Box3().setFromObject(o);
        const c2 = bb2.getCenter(new THREE.Vector3());
        o.position.set(-c2.x, -bb2.min.y, -c2.z);          // 居中 + 落地
        if (m.position) o.position.add(new THREE.Vector3(...m.position));
        console.info(`[模型] ${m.file} 自动适配：原高 ${size.y.toFixed(2)} → 缩放 ${k.toFixed(4)}`);
      } else {
        o.scale.setScalar(m.scale);
        o.position.set(...(m.position || [0, 0, 0]));
      }
      scene.add(o);
      if (m.hideRack) rack.visible = false;
    }, undefined, err => console.error(`[模型] ${m.file} 加载失败`, err));
  });
}).catch(() => {});

/* ── 下钻链条：一份配置驱动，加设备只需改 assets/levels.json ── */
fetch("assets/levels.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(cfg => {
  if (!cfg?.levels) return;
  const here = location.pathname.split("/").pop() || "index.html";
  const bar = document.createElement("div");
  bar.className = "drill";
  bar.innerHTML = cfg.levels.map((L, i) => {
    const cur = L.page.split("?")[0] === here && L.id !== "server";
    const sep = i ? '<span class="sep">›</span>' : "";
    const tip = `${L.name} · ${L.desc}` + (L.status === "planned" ? "（规划中）" : "");
    if (L.status === "planned" || !L.page)
      return `${sep}<span class="soon" title="${tip}">${L.icon} ${L.name}</span>`;
    return `${sep}<a href="${L.page}" class="${cur ? "on" : ""}" title="${tip}">${L.icon} ${L.name}</a>`;
  }).join("");
  document.body.appendChild(bar);
}).catch(() => {});
</script>
