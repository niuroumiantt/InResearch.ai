<script type="module">
import * as THREE from "three";
import {buildServerAssembly} from "/assets/server-assembly.js";
import {buildRackAssembly} from "/assets/rack-assembly.js";
import {fitRackExploded} from "/assets/rack-exploded-view.js";
const serverQuery = new URLSearchParams(location.search);
const serverMode = serverQuery.get("view") === "server" || serverQuery.get("x") === "55" || serverQuery.get("node") === "part:server" || location.hash === "#server";
const requestedPart=(serverQuery.get('node')||'').replace(/^part:/,'')||location.hash.slice(1);
const rackExplodedMode=!serverMode && (serverQuery.get('view')==='rack-exploded' || (serverQuery.get('view')!=='legacy' && serverQuery.get('x')==='35'));
const rackOverviewMode=!serverMode && !rackExplodedMode && (serverQuery.get('view')==='rack' || (!requestedPart && (!serverQuery.has('x')||serverQuery.get('x')==='0')));
const rackMode=rackOverviewMode||rackExplodedMode;
let serverAssembly = null;
let rackAssembly = null;
import {createScenePicking} from "/assets/scene-picking.js";
import {createSceneMotion} from "/assets/scene-motion.js";
import {createPartDossier, dossierNode} from "/assets/part-dossier.js?v=20261008.14";
import {createPartInspector} from "/assets/part-inspector.js?v=20261008.14";
import { bindResearchMeshNodes, installStageControl, safeURL } from "./assets/research-graph.js";
import { OrbitControls } from "./assets/vendor/OrbitControls.js";
import { EffectComposer } from "./assets/vendor/EffectComposer.js";
import { RenderPass } from "./assets/vendor/RenderPass.js";
import { OutputPass } from "./assets/vendor/OutputPass.js";
import {mountSceneView} from "/assets/scene-view.js";
import {mountSceneModels} from "/assets/model-assets.js";
import {createSceneEnvironment, createTexturePool} from "/assets/scene-resources.js";
import {configureAtlasRenderer, atlasMaterial, atlasStudio, addAtlasLights, createAtlasDrawing, mountAtlasExport} from "/assets/scene-atlas.js?v=20261008.14";

import {loadSceneData} from "/assets/scene-data.js";
const [BOM, companies, prices, inds, reg] = await loadSceneData([
  {url:"framework/bom.json", collection:"parts"},
  {url:"data/companies.json", collection:"records"},
  {url:"data/prices.json", collection:"records"},
  {url:"framework/indicators.json", collection:"indicators"},
  {url:"framework/modules.json", collection:"modules"},
], {controls:[document.querySelector(".hud")]});
const CN = {}; companies.records.forEach(c => CN[c.company_id] = c.name_cn || c.name);
const INDS = {}; inds.indicators.forEach(i => INDS[i.id] = i);
const MODNAME = {}; reg.modules.forEach(m => MODNAME[m.id] = m.name);
const PART = {}; BOM.parts.forEach(p => PART[p.id] = p);
// 重切前的旧部件 ID（bom.aliases）继续打开去处的档案；指向站点权利的旧 ID 在机柜里没有对象
Object.entries(BOM.aliases || {}).forEach(([old, to]) => { if (!PART[old] && PART[to]) PART[old] = PART[to]; });
const SN = { tight: "紧缺", transition: "技术切换中", mature: "成熟", emerging: "新兴" };
const SBADGE = { tight: "#ef4444", transition: "#f59e0b", mature: "#22c55e", emerging: "#a78bfa" };

/* ─────────── 共享技术图册 WebGL ─────────── */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const texturePool = createTexturePool({THREE});

const scene = new THREE.Scene();
configureAtlasRenderer(THREE, renderer, scene);
const atlasDrawing = createAtlasDrawing({THREE, scene});
// The technical plate stays warm white while the surrounding controls follow appearance.
function syncSceneAppearance() { configureAtlasRenderer(THREE, renderer, scene); }
window.addEventListener('inresearch:appearance', syncSceneAppearance);

let sceneView;
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 300);
camera.position.set(13, 8.5, 16);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 4.6, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05;
controls.minDistance = 4; controls.maxDistance = 60;
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches; controls.autoRotateSpeed = 0.4;
canvas.addEventListener("pointerdown", () => controls.autoRotate = false, { once: true });
if (serverMode) {
  document.title = '服务器整机拆解台 · inresearch.ai';
  document.querySelector('.hud summary').textContent = '服务器整机拆解台 · 通用示意';
  document.querySelector('.hud h1').textContent = '服务器整机拆解台';
  document.querySelector('.rg-concept-note').textContent = '通用风冷 PCIe 示例 · 数量与尺寸非规格 · 虚拟拆解非维修步骤';
  document.querySelector('.topbar .on').textContent = '服务器拆解台';
  camera.position.set(-10, 9, 12); controls.target.set(0, 1.2, 0); controls.autoRotate = false;
}
if (rackMode) {
  document.title='机柜整柜结构图 · inresearch.ai';
  document.querySelector('.hud summary').textContent='机柜整柜 · 通用示意';
  document.querySelector('.hud h1').textContent='机柜整柜结构图';
  document.querySelector('.rg-concept-note').textContent='前门 / 左侧虚拟剖口 · 配置数量与比例为示例 · 可选附件未接线';
  document.querySelector('.topbar .on').textContent='机柜结构图';
  document.getElementById('explode').setAttribute('aria-label','整柜分区观察');
  document.getElementById('play').textContent='▶ 自动查看分区';
  const links=document.createElement('div');links.className='m';
  for(const [text,url] of [['完整标注与双下载','/rack-atlas.html'],['分层拆解图','/rack3d.html?x=35'],['芯片近景','/rack3d.html?x=90']]){
    const a=document.createElement('a');a.textContent=text;a.href=url;links.append(a,document.createTextNode(' · '));
  }
  document.querySelector('.rg-concept-note').after(links);
  const dossierButton=document.createElement('button');dossierButton.id='rack-overview-dossier';dossierButton.type='button';dossierButton.textContent='整柜档案与预览';links.after(dossierButton);
  camera.position.set(-12,9,20);controls.target.set(0,6.0,0);controls.autoRotate=false;
  if(rackExplodedMode){
    document.title='机柜分层拆解图 · inresearch.ai';
    document.querySelector('.hud summary').textContent='机柜分层拆解 · 通用示意';
    const legend=document.createElement('span');legend.className='rack-exploded-legend';legend.textContent='① 门　② 左侧板　③ 顶盖　④ 交换机　⑤ 计算托盘　⑥ 电源架';
    document.querySelector('.hud summary').append(legend);
    const bodyLegend=legend.cloneNode(true);document.querySelector('.rg-concept-note').before(bodyLegend);
    document.querySelector('.hud h1').textContent='机柜分层拆解图';
    document.querySelector('.rg-concept-note').textContent='门/侧板/顶盖虚拟拆出 · 三个代表实例沿共同前轴平移 · 非安装维修步骤';
    document.getElementById('explode').setAttribute('aria-label','虚拟装配展开');
    document.getElementById('play').textContent='▶ 自动展开对应关系';
    links.replaceChildren();
    for(const [text,url] of [['完整标注与双下载','/rack-exploded.html'],['整柜母图','/rack-atlas.html'],['旧历史分层','/rack3d.html?view=legacy&x=35']]){const a=document.createElement('a');a.textContent=text;a.href=url;links.append(a,document.createTextNode(' · '));}
    camera.position.set(22,15,30);controls.target.set(-1,6,5);
  }
}


const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());

/* Neutral atlas studio: stable lighting without the previous colored HDR reflections. */
const sceneEnvironment = createSceneEnvironment({THREE, renderer, scene, proceduralOnly:true,
  fallback:()=>atlasStudio(THREE)});
addAtlasLights(THREE, scene, [14,22,12], {left:-14,right:14,top:18,bottom:-6,far:70});

/* ─────────── 程序化纹理 ─────────── */
const ctex = texturePool.canvas;
const rnd = (() => { let s = 7; return () => (s = s * 16807 % 2147483647) / 2147483647; })();
const TEX = rackMode ? {} : {
  post: ctex(32, 256, (g, w, h) => {           // 机柜立柱：EIA 孔带
    g.fillStyle = "#10141c"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#05070b";
    for (let y = 5; y < h; y += 10) { g.fillRect(7, y, 6, 6); g.fillRect(19, y, 6, 6); }
  }, 1, 4),
  doorPerf: ctex(128, 256, (g, w, h) => {      // 前后门：六角穿孔网
    g.fillStyle = "#171d29"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#060a10";
    for (let y = 5; y < h; y += 9) for (let x = 5 + ((y / 9 | 0) % 2 ? 4 : 0); x < w; x += 9) {
      g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill();
    }
    g.strokeStyle = "#2c3850";
    g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
  }, 1, 2),
  sledFace: hero => ctex(256, 48, (g, w, h) => {   // 服务器前脸：把手+盘位+LED
    g.fillStyle = hero ? "#1c2739" : "#161d2a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#39445c"; g.fillRect(2, 4, 10, h - 8); g.fillRect(w - 12, 4, 10, h - 8); // 把手
    for (let x = 20; x < w - 70; x += 24) {   // 盘位
      g.fillStyle = "#0d1119"; g.fillRect(x, 6, 20, h - 12);
      g.fillStyle = "#22303f"; g.fillRect(x + 2, 8, 16, 5);
      g.fillStyle = rnd() > .3 ? "#22c55e" : "#1a2333"; g.fillRect(x + 15, h - 13, 3, 3);
    }
    for (let x = w - 66; x < w - 18; x += 7) {  // 进风孔
      g.fillStyle = "#0a0e15"; g.fillRect(x, 8, 4, h - 16);
    }
    g.fillStyle = "#3b82f6"; g.fillRect(w - 16, 6, 3, 3);
    g.fillStyle = "#f59e0b"; g.fillRect(w - 16, 12, 3, 3);
  }),
  ports: ctex(256, 32, (g, w, h) => {
    g.fillStyle = "#0f1626"; g.fillRect(0, 0, w, h);
    for (let x = 6; x < w - 12; x += 10) {
      g.fillStyle = "#1e293b"; g.fillRect(x, 6, 8, 8); g.fillRect(x, 18, 8, 8);
      if (rnd() > .35) { g.fillStyle = "#38bdf8"; g.fillRect(x + 2, 8, 4, 4); }
      if (rnd() > .5) { g.fillStyle = "#22c55e"; g.fillRect(x + 2, 20, 4, 4); }
    }
  }),
  perf: ctex(64, 64, (g, w, h) => {
    g.fillStyle = "#222936"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#0d1119";
    for (let y = 4; y < h; y += 8) for (let x = 4 + (y % 16 ? 4 : 0); x < w; x += 8) {
      g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill();
    }
  }, 2, 2),
  pcb: ctex(256, 256, (g, w, h) => {
    g.fillStyle = "#0e3a28"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(210,255,225,.26)"; g.lineWidth = 1.2;
    for (let i = 0; i < 60; i++) {
      g.beginPath();
      let x = rnd() * w, y = rnd() * h;
      g.moveTo(x, y);
      for (let k = 0; k < 3; k++) { rnd() > .5 ? x = rnd() * w : y = rnd() * h; g.lineTo(x, y); }
      g.stroke();
    }
    g.fillStyle = "#c9a227";
    for (let i = 0; i < 90; i++) g.fillRect(rnd() * w, rnd() * h, 2.5, 2.5);
    g.fillStyle = "#12161f";
    for (let i = 0; i < 16; i++) g.fillRect(rnd() * (w - 22), rnd() * (h - 14), 22, 14);
  }),
  die: ctex(128, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, "#777870"); gr.addColorStop(.35, "#999b93"); gr.addColorStop(.65, "#676962"); gr.addColorStop(1, "#898b84");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,.2)";
    for (let i = 10; i < w; i += 10) { g.strokeRect(i, 0, .5, h); g.strokeRect(0, i, w, .5); }
    g.strokeStyle = "rgba(255,255,255,.5)"; g.strokeRect(w * .3, h * .3, w * .4, h * .4);
  }),
  copperFins: ctex(128, 64, (g, w, h) => {
    g.fillStyle = "#7c4f27"; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 5) {
      g.fillStyle = "#cf8f4e"; g.fillRect(x, 1, 2.5, h - 2);
      g.fillStyle = "#4e3018"; g.fillRect(x + 2.5, 1, 1.8, h - 2);
    }
  }, 2, 1),
  dimm: ctex(128, 24, (g, w, h) => {
    g.fillStyle = "#0f3d2a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#12161f";
    for (let x = 4; x < w - 10; x += 15) g.fillRect(x, 4, 11, h - 10);
    g.fillStyle = "#c9a227"; g.fillRect(0, h - 4, w, 3);
  }),
  floorTx: ctex(512, 512, (g, w, h) => {
    g.fillStyle = "#10141c"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2200; i++) {
      g.fillStyle = `rgba(255,255,255,${rnd() * .03})`;
      g.fillRect(rnd() * w, rnd() * h, 1.6, 1.6);
    }
    g.strokeStyle = "rgba(120,150,190,.14)"; g.lineWidth = 2;
    for (let x = 0; x <= w; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  }),
  fanFrame: ctex(64, 64, (g, w, h) => {

    g.strokeStyle = "#2c3850"; g.lineWidth = 3; g.strokeRect(2, 2, w - 4, h - 4);

}
function rboxGeo(w, h, d, r = 0.04) {
  const hw = Math.max(0.005, w / 2 - r), hd = Math.max(0.005, d / 2 - r);
  const s = new THREE.Shape();
  s.absarc(hw, hd, r, 0, Math.PI / 2);
  s.absarc(-hw, hd, r, Math.PI / 2, Math.PI);
  s.absarc(-hw, -hd, r, Math.PI, Math.PI * 1.5);
  s.absarc(hw, -hd, r, Math.PI * 1.5, Math.PI * 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.005, h - 2 * r), bevelEnabled: true, bevelSegments: 2, bevelSize: r * 0.9, bevelThickness: r });
  g.center(); g.rotateX(-Math.PI / 2);
  return g;
}
function mk(parent, geo, mat, x, y, z) {

}

  const t = slider.value / 100;
  const poses = new Map();
  animated.forEach(a => {
    if (!poses.has(a.obj)) poses.set(a.obj, a.home.clone());
    const k = a.t1 <= a.t0 ? 1 : Math.min(1, Math.max(0, (t - a.t0) / (a.t1 - a.t0)));
    poses.get(a.obj).addScaledVector(a.off, ease(k));
  });
  poses.forEach((position, obj) => obj.position.copy(position));
  scene.traverse(o => { if (o.isSprite && o.userData.showAfter !== undefined) o.visible = t >= o.userData.showAfter; });
  if(rackExplodedMode)rackAssembly.explode(t);else rackAssembly?.focus(t);
  let s = STAGES[0][1];
  STAGES.forEach(([th, txt]) => { if (t >= th) s = txt; });
  stageEl.textContent = s;
  syncStageControl();
}
const sliderMotion = createSceneMotion();
slider.addEventListener("input", () => { sliderMotion.cancel(); apply(); });
const syncStageControl = installStageControl(STAGES, slider, apply);
{ const x = rackExplodedMode ? (serverQuery.get("explode")??"100") : serverQuery.get("x"); if (x !== null) slider.value = Math.max(0, Math.min(100, +x || 0)); else if (serverMode) slider.value = 55; }
apply();
function animateSlider(to, duration = 1400) {
  const from = +slider.value;
  sliderMotion.run(duration, progress => { slider.value = from + (to - from) * progress; apply(); });
}
document.getElementById("play").onclick = () => animateSlider(+slider.value > 90 ? 0 : 100, 9000);

/* ─────────── 拾取与档案（与 bom3d 同款）─────────── */
const tip = document.getElementById("tip3d");
/* ── 部件旋转查看器（与 bom3d 同款）── */
const PARTMESH = {};
function rebuildPartMesh() {
  Object.keys(PARTMESH).forEach(k => delete PARTMESH[k]);
  pickables.forEach(m => { (PARTMESH[m.userData.part] ||= []).push(m); });
  // A server dossier inspects the complete assembly while child picks keep their IDs.
  if (serverMode) PARTMESH.server = [...pickables];
}
rebuildPartMesh();
let rackSelectedMeshes=null;
let rackSelectedInstance=null;
const currentPartMeshes=pid=>rackMode&&rackSelectedMeshes?rackSelectedMeshes:PARTMESH[pid];
const inspector = createPartInspector({THREE, environment: () => scene.environment, meshesFor:currentPartMeshes,
  initialRotation: pid => serverMode && pid === 'server' ? {x:0.6, y:0.7} : rackMode ? {x:.2,y:-.55} : null});
const showDossier = createPartDossier({el: document.getElementById('dossier'), view: 'rack',
  BOM, moduleNames: MODNAME, companies: CN, prices, indicators: INDS,
  statusNames: SN, statusColors: SBADGE, inspector,
  atlasViewFor:p=>rackMode&&p.id==='rack-frame'?(rackExplodedMode?'exploded':'overview'):null});
const rackContextPart=()=>({...PART['rack-frame'],name:'机柜与结构 · 整柜上下文',
  desc:'本图是通用整柜结构示意：2交换机、8计算托盘、2电源架为图示选择；侧部铜色长条与灰管未连接。尺寸、U高度、功率、承载及连接回路未知。研究链接仍指向机柜类别，不代表本示例的型号或额定配置。'});
function rackInstancePart(p) {
  const examples={
    server:{name:'计算托盘 · 单个示例',desc:'本次点选一个示例计算托盘，前部8个载盘仅为图示选择。内部处理器/加速器/内存配置、供应者、功率与维修条件未知；研究链接指向服务器类别，不代表本示例型号或适用规格。'},
    'power-shelf':{name:'机柜电源架 · 单个示例',desc:'本次点选一个示例电源架，可见6个前部模块仅为图示选择。电压、AC/DC输入输出、功率、储能、冗余与供应者未知；研究链接指向电源架类别，本示例的具体电气方案待核实。'},
    'network-switch':{name:'交换机 · 单个示例',desc:'本次点选一个示例交换机，端口外观仅作通用表达。端口数量/速率、协议、内部配置、供应者和功率未知；研究链接指向交换机类别，本示例的具体网络方案待核实。'},
  };return {...p,...examples[p.id]};
}
function showRackObject(object) {
  const p=PART[object.userData.part];if(!p)return;
  if(!rackMode){showDossier(p);return;}
  document.getElementById('dossier').classList.toggle('rack-overview-dossier',p.id==='rack-frame');
  if(p.id==='rack-frame'){
    rackSelectedMeshes=[...pickables];rackSelectedInstance=null;showDossier(rackContextPart());return;
  }
  let instance=object;
  while(instance.parent && instance.parent!==rack && !/^(compute-\d+|switch-\d+|power-shelf-\d+|optional-busbar|optional-manifolds)$/.test(instance.name))instance=instance.parent;
  rackSelectedInstance=instance.userData.instanceId||null;
  rackSelectedMeshes=[];instance.traverse(m=>{if(m.isMesh&&m.userData.part===p.id)rackSelectedMeshes.push(m);});
  showDossier(rackInstancePart(p));
}
if(rackMode)document.getElementById('rack-overview-dossier').onclick=()=>{
  document.getElementById('dossier').classList.add('rack-overview-dossier');
  rackSelectedMeshes=[...pickables];rackSelectedInstance=null;showDossier(rackContextPart());
};
const scenePicking = createScenePicking({THREE, canvas, camera, pickables, tip,
  describe: object => {
    if(rackMode&&['unconnected-copper-bar','unconnected-pipe-accessory'].includes(object.name))return '可选服务附件 · 连接未知 · 点击整柜上下文';
    const part = PART[object.userData.part];
    return part ? `${part.name}（${SN[part.status]}）· 点击看档案` : '';
  },
  select: showRackObject});

/* ─────────── 主循环：渲染 + 风扇旋转 + LED 呼吸 ─────────── */
// The published adoption registry owns optional model selection.
// TA-11 owns its procedural server; rack-only optional adopted models do not replace it.
const sceneModels = serverMode || rackMode
  ? {ready:Promise.resolve(), objects:()=>[], reload:()=>Promise.resolve(), dispose(){}}
  : mountSceneModels({scene, page:"rack3d", defaultHeight:RH + 0.7, replacement:rack, onChange:()=>{atlasDrawing.sync();sceneView?.refresh();}});
const framingObjects = () => [...pickables, ...sceneModels.objects()];
sceneView = mountSceneView({canvas, camera, controls,
  objects:framingObjects,
  ...(rackExplodedMode?{fitView:options=>{
    const rect=canvas.getBoundingClientRect(),hud=document.querySelector('.hud'),phone=innerWidth<=700;
    const summary=hud.querySelector('summary').getBoundingClientRect();
    const drill=document.querySelector('.drill')?.getBoundingClientRect();
    return fitRackExploded({...options,objects:framingObjects(),width:rect.width,height:rect.height,
      insets:{left:phone?10:hud.getBoundingClientRect().right+16,right:16,
        top:phone?16:Math.max(16,(drill?.bottom||rect.top)-rect.top+16),
        bottom:phone?summary.height+42:16}});
  }}:{}),
  headers:[document.getElementById("ui-skinbar"), document.querySelector(".topbar")],
  button:document.getElementById("fit-view"),
  resize:(width, height) => {renderer.setSize(width, height, false);composer.setSize(width, height);},
});
sceneModels.ready.then(() => {atlasDrawing.sync(); sceneView.refresh();});
atlasDrawing.sync();
atlasDrawing.attachLabels(canvas,camera);
const atlasExport = mountAtlasExport({THREE, scene, camera, canvas, drawing:atlasDrawing,
  render:()=>composer.render(), button:document.getElementById('atlas-export'),
  filename:serverMode?'server-technical-atlas.svg':'rack3d-technical-atlas.svg', title:serverMode?'通用服务器整机装配图册':rackExplodedMode?'通用机柜分层装配对应图册':rackOverviewMode?'通用机柜整柜结构图册':'机柜结构图册',
  caption:()=>document.getElementById('stage').textContent,
  selected:()=>{const id=document.getElementById('dossier').dataset.partId;
    return id ? {id:rackSelectedInstance||'part:'+id,name:PART[id]?.name || id,meshes:currentPartMeshes(id) || []} : null;}
});
let animationFrame = 0;
let pageDisposed = false;
function disposePage() {
  if (pageDisposed) return;
  pageDisposed = true;
  cancelAnimationFrame(animationFrame); sliderMotion.cancel();
  window.removeEventListener('inresearch:appearance', syncSceneAppearance);
  atlasExport.dispose(); atlasDrawing.dispose();
  sceneView.dispose(); sceneModels.dispose(); scenePicking.dispose(); inspector.dispose(); serverAssembly?.dispose();rackAssembly?.dispose();
  animated.length = 0; pickables.length = 0; controls.dispose();
  sceneEnvironment.dispose(); texturePool.dispose(); composer.dispose(); renderer.dispose();
}
window.addEventListener("pagehide", event => {if (!event.persisted) disposePage();}, {once:true});
const clock = new THREE.Clock();
(function loop() {
  animationFrame = requestAnimationFrame(loop);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  spinners.forEach(r => r.rotation.z += dt * 9);
  pulsers.forEach(({ m, ph }) => m.material.emissiveIntensity = 0.08 + Math.sin(t * 2.4 + ph) * 0.03);
  controls.update();
  atlasDrawing.update();
  composer.render();
  inspector.tick();
})();

// #<part-id> 深链：bom3d 档案里的"上拆解台看结构"落点（放最后：依赖上面全部初始化完成）
{ const q = new URLSearchParams(location.search);
  const pid = (q.get("node") || "").replace(/^part:/, "") || location.hash.slice(1);
  if (PART[pid]) { controls.autoRotate = false;
    if(rackMode && pid==='rack-frame') document.getElementById('rack-overview-dossier').click();
    else showDossier(PART[pid]);
  } }



/* ── 钻取链按骨架生成（bom.json systems / chains）；尺度钻取链 levels.json 已退役（2026-09-28） ── */
fetch("framework/bom.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(bom => {
  if (!bom?.systems) return;
  const here = location.pathname.split("/").pop() || "index.html", q = new URLSearchParams(location.search);
  const top = Object.entries(bom.systems).filter(([, s]) => !s.parent).sort((a, b) => a[1].order - b[1].order);
  const entries = [{ id: "root", name: "🏢 数据中心全景", page: "bom3d.html", current: here === "bom3d.html" && !q.get("d") }];
  for (const [sid, s] of top) {
    if (sid === "it") entries.push({ id: sid, name: "🗄️ IT · 计算链路（机柜拆解）", page: "rack3d.html", current: here === "rack3d.html" && (q.get("x") || "0") < "70" },
                                   { id: "chip", name: "🧠 芯片级（服务器拆到底）", page: "rack3d.html?x=70", current: here === "rack3d.html" && (q.get("x") || "0") >= "70" });
    else if (sid === "control") entries.push({ id: sid, name: "🖥️ " + s.name, page: "", current: false, desc: "软件条目，不进 3D" });
    else entries.push({ id: sid, name: s.name, page: "bom3d.html?d=" + sid, current: here === "bom3d.html" && q.get("d") === sid, desc: (s.chains || []).join(" → ") });
  }
  const bar = document.createElement("div"); bar.className = "drill";
  entries.forEach((L, i) => {
    if (i) bar.appendChild(dossierNode("span", "›", "sep"));
    const active = L.page && safeURL(L.page);
    const node = dossierNode(active ? "a" : "span", L.name, active ? (L.current ? "on" : "") : "soon");
    node.title = L.name + (L.desc ? " · " + L.desc : "");
    if (active) node.href = safeURL(L.page);
    bar.appendChild(node);
  });
  document.body.appendChild(bar);
  if(rackExplodedMode)sceneView.refresh();
}).catch(() => {});
