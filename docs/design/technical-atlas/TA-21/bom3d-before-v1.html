<script type="module">
import * as THREE from "three";
import {buildCampusAssembly,CAMPUS_STAGES} from "/assets/campus-assembly.js";
import {buildCampusExplodedAssembly,CAMPUS_EXPLODED_STAGES,CAMPUS_EXPLODED_MARKS} from "/assets/campus-exploded-assembly.js";
import {fitRackExploded as fitCampusVisible} from "/assets/rack-exploded-view.js";
const campusQuery=new URLSearchParams(location.search);
const campusPhysicalParts=['shell','rack-frame','room-cooling','cdu','ups','cabling','chiller','transformer','backup-power','bess'];
let campusLayeredMode=false;
let campusMode=true; // resolved against the actual BOM/right registry below.
let campusAssembly=null,campusSelectedMeshes=null,campusSelectedInstance=null,campusUiObserver=null;
import {createScenePicking} from "/assets/scene-picking.js";
import {createSceneMotion} from "/assets/scene-motion.js";
import {createPartDossier, dossierNode} from "/assets/part-dossier.js?v=20261008.14";
import {createPartInspector} from "/assets/part-inspector.js?v=20261008.14";
import {escapeHtml as esc} from "/assets/series-summary.js";
import { bindResearchMeshNodes, installStageControl, safeURL } from "./assets/research-graph.js";
import { OrbitControls } from "./assets/vendor/OrbitControls.js";
import { EffectComposer } from "./assets/vendor/EffectComposer.js";
import { RenderPass } from "./assets/vendor/RenderPass.js";
import { OutputPass } from "./assets/vendor/OutputPass.js";
import {mountSceneView} from "/assets/scene-view.js";
import {mountSceneModels} from "/assets/model-assets.js";
import {createSceneEnvironment, createTexturePool} from "/assets/scene-resources.js";
import {configureAtlasRenderer, atlasMaterial, atlasStudio, addAtlasLights, createAtlasDrawing, mountAtlasExport} from "/assets/scene-atlas.js?v=20261008.14";

import {loadSceneData,loadOptionalSceneData} from "/assets/scene-data.js?v=20261008.14";
const [BOM, companies, prices, inds, reg, siteRights] = await loadSceneData([
  {url:"framework/bom.json", collection:"parts"},
  {url:"data/companies.json", collection:"records"},
  {url:"data/prices.json", collection:"records"},
  {url:"framework/indicators.json", collection:"indicators"},
  {url:"framework/modules.json", collection:"modules"},
  {url:"framework/site_rights.json", collection:"rights"},
], {controls:[document.querySelector(".hud")]});
const CN = {}; companies.records.forEach(c => CN[c.company_id] = c.name_cn || c.name);
const INDS = {}; inds.indicators.forEach(i => INDS[i.id] = i);
const MODNAME = {}; reg.modules.forEach(m => MODNAME[m.id] = m.name);
const PART = {}; BOM.parts.forEach(p => PART[p.id] = p);
/* 站点权利（土地、水权、并网、燃气接入、网络接入）不是部件，但园区场景里有它们的位置：
   按重切前的旧部件 ID 挂进 PART，档案与研究节点沿用 part:<旧 ID>。 */
const RIGHTS = (siteRights.rights || []).map(r => ({ ...r, id: r.from_bom_part || r.id, site_right_id:r.id, scale: r.scale, kind: "site_right" }));
RIGHTS.forEach(r => { PART[r.id] ||= r; });
/* 被拆分的旧部件 ID（bom.aliases：substation → transformer 等）解析到去处，场景造型不必随重切改名 */
const ALIAS = {};
Object.entries(BOM.aliases || {}).forEach(([old, to]) => {
  const target = to.startsWith("site:") ? RIGHTS.find(r => r.id === old || r.id === to.slice(5)) : PART[to];
  if (target && !PART[old]) PART[old] = target;
  if (target) ALIAS[old] = target.id;
});
function resolveScenePart(value){let id=String(value||'').replace(/^part:/,'');if(id.startsWith('site:')){id=id.slice(5);return RIGHTS.find(r=>r.site_right_id===id||r.id===id);}return PART[id]||RIGHTS.find(r=>r.site_right_id===id);}
const campusRawPart=campusQuery.get('p')||campusQuery.get('node')||'';
const campusRequestedPart=resolveScenePart(campusRawPart);
// Preserve other old nonzero stages and detailed hardware routes;
// the actual six rights and DCIM always remain independent nonphysical entries.
const campusAllowedPart=!campusRawPart||campusPhysicalParts.includes(campusRequestedPart?.id)||campusRequestedPart?.kind==='site_right'||campusRequestedPart?.id==='dcim';
// Only the original TA19 x70 entry or an explicit exploded view owns these layers.
// TA18 default/x0 and detailed hardware/explicit legacy routes retain their scene.
campusLayeredMode=campusAllowedPart&&(campusQuery.get('view')==='exploded'||(!campusQuery.has('view')&&campusQuery.has('x')&&Number(campusQuery.get('x'))===70));
campusMode=campusLayeredMode||campusQuery.get('view')==='campus'||(campusQuery.get('view')!=='legacy'&&(!campusQuery.has('x')||(+campusQuery.get('x')||0)===0)&&campusAllowedPart);
let PRODCOUNT = null; // Restricted product registry is optional; absent is unknown, never zero.
/* 数据覆盖四维：公司/产品/价格序列/已录值指标——覆盖度热图与档案卡共用同一套口径 */
const COVC = ["#ef4444", "#f59e0b", "#eab308", "#84cc16", "#22c55e"];
const covDims = p => [
  ["公司", (p.companies || []).length],
  ["产品", PRODCOUNT === null ? null : (PRODCOUNT[p.id] || 0)],
  ["序列", (p.series || []).length],
  ["指标", (p.indicators || []).filter(i => INDS[i] && INDS[i].value != null).length],
];
const covScore = p => PRODCOUNT === null ? null : covDims(p).filter(d => d[1] > 0).length;
const SN = { tight: "紧缺", transition: "技术切换中", mature: "成熟", emerging: "新兴" };
const SBADGE = { tight: "#ef4444", transition: "#f59e0b", mature: "#22c55e", emerging: "#a78bfa" };

/* ─────────── 共享技术图册 WebGL ─────────── */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const texturePool = createTexturePool({THREE});

const scene = new THREE.Scene();
configureAtlasRenderer(THREE, renderer, scene);
const atlasDrawing = createAtlasDrawing({THREE, scene});
// The technical plate stays warm white while the surrounding controls follow appearance.
function syncSceneAppearance() { configureAtlasRenderer(THREE, renderer, scene); }
window.addEventListener('inresearch:appearance', syncSceneAppearance);

let sceneView;
let pageDisposed=false;
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 600);
if(campusLayeredMode)camera.position.set(25,66,70);else if(campusMode)camera.position.set(-15,60,70);else camera.position.set(46,30,52);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 6, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.autoRotate = !campusMode && !matchMedia('(prefers-reduced-motion: reduce)').matches; controls.autoRotateSpeed = 0.5;
canvas.addEventListener("pointerdown", () => controls.autoRotate = false, { once: true });

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());

/* Neutral atlas studio: stable lighting without the previous colored HDR reflections. */
const sceneEnvironment = createSceneEnvironment({THREE, renderer, scene, proceduralOnly:true,
  fallback:()=>atlasStudio(THREE)});
addAtlasLights(THREE, scene, [38,55,26], {left:-70,right:70,top:60,bottom:-60,far:160});

/* ─────────── 程序化纹理（零二进制：全部 canvas 现画）─────────── */
const ctex = texturePool.canvas;
const rnd = (() => { let s = 42; return () => (s = s * 16807 % 2147483647) / 2147483647; })();

const TEX = {
  rackFront: hero => ctex(128, 256, (g, w, h) => {
    g.fillStyle = hero ? "#182234" : "#12161f"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#0a0d13"; g.fillRect(0, 0, 8, h); g.fillRect(w - 8, 0, 8, h);   // 立柱
    for (let y = 10; y < h - 8; y += 13) {                                          // 1U 槽位
      g.fillStyle = "#1d2635"; g.fillRect(11, y, w - 22, 10);
      g.fillStyle = "#2c3850"; g.fillRect(13, y + 1, 3, 8); g.fillRect(w - 16, y + 1, 3, 8);
      for (let x = 20; x < w - 24; x += 4) { g.fillStyle = "#0d1119"; g.fillRect(x, y + 3, 2, 5); }  // 进风孔
      const on = rnd();
      g.fillStyle = on > .5 ? "#22c55e" : (on > .25 ? "#3b82f6" : "#1a2333");
      g.fillRect(w - 22, y + 3, 3, 3);
    }
  }),
  rackSide: ctex(64, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, "#171d29"); gr.addColorStop(.5, "#1f2735"); gr.addColorStop(1, "#151b26");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,.05)"; g.strokeRect(4, 4, w - 8, h - 8);
  }),
  sled: ctex(128, 32, (g, w, h) => {
    g.fillStyle = "#232c3d"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#161d2a"; g.fillRect(4, 6, 26, h - 12); g.fillRect(34, 6, 26, h - 12);   // 盘位
    for (let x = 68; x < w - 14; x += 6) { g.fillStyle = "#10151f"; g.fillRect(x, 8, 3, h - 16); }
    g.fillStyle = "#22c55e"; g.fillRect(w - 9, 8, 3, 3);
    g.fillStyle = "#f59e0b"; g.fillRect(w - 9, 16, 3, 3);
  }),
  ports: ctex(128, 32, (g, w, h) => {
    g.fillStyle = "#101828"; g.fillRect(0, 0, w, h);
    for (let x = 6; x < w - 10; x += 9) {
      g.fillStyle = "#1e293b"; g.fillRect(x, 8, 7, 7); g.fillRect(x, 18, 7, 7);
      if (rnd() > .4) { g.fillStyle = "#38bdf8"; g.fillRect(x + 2, 10, 3, 3); }
      if (rnd() > .5) { g.fillStyle = "#22c55e"; g.fillRect(x + 2, 20, 3, 3); }
    }
  }),
  perf: ctex(64, 64, (g, w, h) => {
    g.fillStyle = "#232a36"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#141922";
    for (let y = 4; y < h; y += 8) for (let x = 4 + (y % 16 ? 4 : 0); x < w; x += 8) {
      g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill();
    }
  }, 3, 2),
  fins: ctex(128, 64, (g, w, h) => {
    g.fillStyle = "#39404d"; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 7) {
      g.fillStyle = "#4c5665"; g.fillRect(x, 2, 3, h - 4);
      g.fillStyle = "#20242d"; g.fillRect(x + 3, 2, 2, h - 4);
    }
  }, 2, 1),
  copperFins: ctex(128, 64, (g, w, h) => {
    g.fillStyle = "#8a5a2e"; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 6) {

const pickables = [];
const decor = [];
const animated = [];
function matsOf(o) { return Array.isArray(o.material) ? o.material : [o.material]; }
function M(color, opt = {}) { return atlasMaterial(THREE, color, opt); }
function tag(obj, partId) {
  obj.traverse(m => {
    if (m.isMesh) {
      m.castShadow = true; m.receiveShadow = true;
      if (partId) { m.userData.part = partId; pickables.push(m); }
    }
  });
  return obj;
}
function box(w, h, d, color, x, y, z, partId, opt = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color, opt));
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function texbox(w, h, d, x, y, z, partId, faceMats) {
  // faceMats: {px,nx,py,ny,pz,nz,all} —— 未给的面用 all
  const all = faceMats.all || M(0x39445a);
  const order = ["px", "nx", "py", "ny", "pz", "nz"].map(k => faceMats[k] || all);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), order);
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function rboxGeo(w, h, d, r = 0.12) {
  const hw = Math.max(0.01, w / 2 - r), hd = Math.max(0.01, d / 2 - r);
  const s = new THREE.Shape();
  s.absarc(hw, hd, r, 0, Math.PI / 2);
  s.absarc(-hw, hd, r, Math.PI / 2, Math.PI);
  s.absarc(-hw, -hd, r, Math.PI, Math.PI * 1.5);
  s.absarc(hw, -hd, r, Math.PI * 1.5, Math.PI * 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.01, h - 2 * r), bevelEnabled: true, bevelSegments: 2, bevelSize: r * 0.9, bevelThickness: r });
  g.center();
  g.rotateX(-Math.PI / 2);
  return g;
}
function rbox(w, h, d, color, x, y, z, partId, opt = {}, r = 0.12) {
  const m = new THREE.Mesh(rboxGeo(w, h, d, r), M(color, opt));
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function cyl(r, h, color, x, y, z, partId, opt = {}, seg = 28) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), M(color, opt));
  m.position.set(x, y, z);
  tag(m, partId);
  scene.add(m);
  return m;
}
function group(x, y, z, partId) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.userData.partId = partId;
  scene.add(g);
  return g;
}
function put(parent, mesh) { scene.remove(mesh); parent.add(mesh); return mesh; }
function explode(obj, dx, dy, dz, t0 = 0, t1 = 1) {
  animated.push({ obj, home: obj.position.clone(), off: new THREE.Vector3(dx, dy, dz), t0, t1 });
}

}

  if(!campusMode){animateSlider(d.t);flyTo(d.cam,d.tgt);}
  const grouped = []; let last = null;
  for (const p of d.parts) { if (p.chain !== last) { grouped.push(`<div class="chainh">${esc(p.chain || (p.kind === "site_right" ? "站点权利" : ""))}</div>`); last = p.chain; } grouped.push(p); }
  document.getElementById("domainParts").innerHTML = grouped.map(p => typeof p === "string" ? p :
    `<div class="pitem" data-part="${p.id}"><span class="dot" style="background:${SBADGE[p.status]}"></span>${esc(p.name)}<span class="covb" style="background:${covScore(p)===null ? '#64748b' : COVC[covScore(p)]}" title="${covScore(p)===null ? '产品登记未读取，完整覆盖率未知' : '数据覆盖 '+covScore(p)+'/4（公司/产品/序列/指标）'}">${covScore(p)??'—'}/4</span>${PARTMESH[p.id] ? "" : '<span class="nm" title="场景中尚无 3D 造型——点击直接看档案">未建模</span>'}<span class="lay">${p.scale || (BOM.kinds?.[p.kind] ? p.kind : "")}</span></div>`).join("");
  document.querySelectorAll("#domainParts .pitem").forEach(el => el.onclick = () => {
    const p = PART[el.dataset.part];
    showDossier(p);
    const meshes = PARTMESH[p.id];
    if (meshes?.length) {
      if(campusMode)focusCampus(campusAssembly.objectsFor(p.id));else{const wp = new THREE.Vector3(); meshes[0].getWorldPosition(wp);flyTo([wp.x + 9, wp.y + 6, wp.z + 9], [wp.x, wp.y, wp.z], 900);}
    }
  });
  if (d.chains.length > 1) {  // 镜头走链路是显式动作：不抢用户或页面框架对镜头的所有权
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "walkbtn"; btn.id = "walkBtn";
    btn.textContent = "▶ 沿链路走一遍：" + d.chains.join(" → ");
    btn.onclick = () => walkChain(d);
    document.getElementById("domainParts").prepend(btn);
  }
  if(campusMode)focusCampus(d.parts.flatMap(p=>campusAssembly.objectsFor(p.id)));
}
/* 镜头按链路走：点击「沿链路走一遍」后，沿能量流依次飞到有造型的部件（电网 → 变电 → 发电与储能 → UPS → 配电 → 板级供电），
   这条路线就是该系统的研究提纲。用户操作或切换视角即停止；不自动开始，镜头所有权仍归用户与页面框架。 */
let walkTimer = null;
function walkChain(d) {
  clearTimeout(walkTimer);
  const stops = d.parts.filter(p => PARTMESH[p.id]?.length);
  let i = 0;
  const step = () => {
    if (activeDomain !== d.key || i >= stops.length) return;
    const p = stops[i++];
    document.querySelectorAll("#domainParts .pitem").forEach(el => el.classList.toggle("walk", el.dataset.part === p.id));
    if(campusMode)focusCampus(campusAssembly.objectsFor(p.id));else{const wp = new THREE.Vector3(); PARTMESH[p.id][0].getWorldPosition(wp);flyTo([wp.x + 12, wp.y + 8, wp.z + 12], [wp.x, wp.y, wp.z], 900);}
    walkTimer = setTimeout(step, 1500);
  };
  step();
}
canvas.addEventListener("pointerdown", () => clearTimeout(walkTimer));
const domrow = document.getElementById("domrow");
domrow.innerHTML = DOMAINS.map(d => `<div class="dchip" id="dchip-${d.key}">${d.icon} ${d.name}</div>`).join("");
DOMAINS.forEach(d => document.getElementById(`dchip-${d.key}`).onclick = () => enterDomain(d));
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const i = "12345678".indexOf(e.key);
  if (i >= 0 && DOMAINS[i]) enterDomain(DOMAINS[i]);
  if (e.key === "0" || e.key === "Escape") { clearDomain(); if(campusMode)sceneView.fit();else flyTo([46, 30, 52], [0, 6, 0]); }
});

/* ─────────── 交互与档案 ─────────── */
const tip = document.getElementById("tip3d");
/* ── 部件旋转查看器：档案内单独渲染该部件，可拖动 360° 查看 ── */
const currentPartMeshes=pid=>campusMode&&campusSelectedMeshes?campusSelectedMeshes:PARTMESH[pid];
const inspector = createPartInspector({THREE, environment: () => scene.environment, meshesFor:currentPartMeshes,
  initialRotation:()=>campusMode?{x:.25,y:.25}:null,
  materialFor: mesh => dimmed.get(mesh)?.original || mesh.userData.covPrev || mesh.material});
const rawShowDossier = createPartDossier({el: document.getElementById('dossier'), view: 'campus',
  BOM, moduleNames: MODNAME, companies: CN, prices, indicators: INDS,
  statusNames: SN, statusColors: SBADGE, inspector,
  researchNodeFor:p=>p.kind==='site_right'?'site:'+p.site_right_id:'part:'+p.id});

function campusPart(p,whole=false){
 if(!campusMode)return p;
 if(whole)return {...PART.shell,name:'园区空间示意 · 完整三维预览',desc:'本图是一个通用选定八柜园区：2行×4柜、5室内冷却、3CDU、一组4柜门UPS、3双风扇冷机、2变压器、3备用发电与2储能柜。数量与比例只是绘图选择；前墙/部分屋面虚拟省略。'+(campusLayeredMode?'屋面/围护/桥架/室内设备仅沿各组示意轴平移，灰线对应同实例空原位；室外设备/钢架/基础保持原位。':'')+'内接线、流体去回路、功率/电压/冗余、现场适用与站点权利未知；研究链接归建筑类别，不认证本示例。'};
 const physical=campusAssembly.objectsFor(p.id).length;
 return {...p,desc:physical?'本次三维仅展示选定通用外形；'+(campusSelectedInstance?'点选单个示例实例 '+campusSelectedInstance+'。':'类别含 '+physical+' 个示例实例，预览取第一个。')+' 外形/数量不是型号、额定配置或现场事实，内接线、流体拓扑、尺寸/功率/电压、冗余和适用条件未知。下方研究与公司数据属于类别。'+(p.id==='rack-frame'?'门内载盘密度是程序示例，非TA13整柜或TA11服务器配置。':''):p.kind==='site_right'?'站点权利是独立非物理研究入口，场景不以设备或地面证明权利成立。':p.id==='dcim'?'DCIM是软件入口，不画物理硬件，当前节点内容与现场实施另核。':'本类别在本次园区未造实体；既有类别研究及独立部件图入口保留，不假造位置/实例。'};
}
function showDossier(p){if(!p)return;if(campusMode){const i=campusAssembly.instances.find(i=>i.part===p.id);campusSelectedInstance=i?.id||null;campusSelectedMeshes=[];i?.object.traverse(o=>{if(o.isMesh)campusSelectedMeshes.push(o)});rawShowDossier(campusPart(p));}else rawShowDossier(p)}
function showCampusObject(object){const p=PART[object.userData.part];if(!p)return;if(!campusMode){showDossier(p);return;}const i=campusAssembly.instanceFor(object);if(!i)return;campusSelectedInstance=i.id;campusSelectedMeshes=[];i.object.traverse(o=>{if(o.isMesh)campusSelectedMeshes.push(o)});rawShowDossier(campusPart(p));}
if(campusMode)document.getElementById('campus-whole-dossier').onclick=()=>{campusSelectedMeshes=[...pickables];campusSelectedInstance='campus/whole';rawShowDossier(campusPart(PART.shell,true));};

const scenePicking = createScenePicking({THREE, canvas, camera, pickables, tip,
  describe: object => {
    const part = PART[object.userData.part];
    return part ? campusMode ? `${part.name} · 通用单个示例 · 点击档案` : `${part.name}（${SN[part.status]}）· 点击看档案` : '';
  },
  select: object => showCampusObject(object)});

// sparkline 悬停读数（事件委托，一次绑定）
const dossierEl = document.getElementById("dossier");
dossierEl.addEventListener("pointermove", e => {
  const c = e.target.closest("circle[data-v]");
  if (c) {
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 200) + "px";
    tip.style.top = (e.clientY + 12) + "px";
    tip.textContent = `${c.dataset.d} ｜ ${c.dataset.v}`;
  } else if (tip.textContent.includes("｜")) tip.style.display = "none";
});
dossierEl.addEventListener("pointerleave", () => { if (tip.textContent.includes("｜")) tip.style.display = "none"; });

// The published adoption registry owns optional model selection.
const sceneModels = campusMode ? {ready:Promise.resolve(),objects:()=>[],reload:()=>Promise.resolve(),dispose(){}} : mountSceneModels({scene, page:"bom3d", defaultHeight:4.6, onChange:()=>{atlasDrawing.sync();sceneView?.refresh();}});
const framingObjects = () => [...pickables.filter(mesh => mesh.userData.part !== "land"), ...sceneModels.objects()];
sceneView = mountSceneView({canvas, camera, controls, fog:scene.fog,
  objects:framingObjects,
  headers:[document.getElementById("ui-skinbar"), document.querySelector(".topbar")],
  button:document.getElementById("fit-view"),
  resize:(width, height) => {renderer.setSize(width, height, false);composer.setSize(width, height);},
  beforeFit:() => {cameraMotion.cancel();if(campusMode){sliderMotion.cancel();clearTimeout(walkTimer);controls.autoRotate=false;}},
  ...(campusMode?{fitView:options=>{return fitCampusVisible({...options,objects:framingObjects(),...campusInsets(),padding:1.06});}}:{}),
});
sceneModels.ready.then(() => {if(pageDisposed)return;atlasDrawing.sync(); sceneView.refresh();});
atlasDrawing.sync();
atlasDrawing.attachLabels(canvas,camera);
const atlasExport = mountAtlasExport({THREE, scene, camera, canvas, drawing:atlasDrawing,
  render:()=>composer.render(), button:document.getElementById('atlas-export'),
  filename:'bom3d-technical-atlas.svg', title:'园区结构图册',
  caption:()=>document.getElementById('stage').textContent,
  diagnostics:()=>covOn ? '索引覆盖：红0/4、橙1/4、黄2/4、浅绿3/4、绿4/4（公司、产品、序列、指标登记维度数；非硬件状态）' : null,
  selected:()=>{const id=document.getElementById('dossier').dataset.partId;
    return id ? {id:campusMode&&campusSelectedInstance?campusSelectedInstance:'part:'+id,name:campusMode?(campusSelectedInstance==='campus/whole'?'园区空间示意 · 完整三维预览':'通用园区示例 · '+(PART[id]?.name || id)):PART[id]?.name || id,meshes:currentPartMeshes(id) || []} : null;}
});
const covChip = document.getElementById('covChip');
covChip.setAttribute('aria-disabled','true');
covChip.textContent = '索引覆盖 · 产品登记未读，覆盖率未知';
loadOptionalSceneData({url:'data/products.json',collection:'records'}).then(products=>{
  if(pageDisposed)return;
  if (!products || products.records.some(row=>row.bom_parts!=null && (!Array.isArray(row.bom_parts) || row.bom_parts.some(id=>typeof id!=='string')))) return;
  PRODCOUNT = {};
  products.records.forEach(row=>(row.bom_parts || []).forEach(id=>PRODCOUNT[id]=(PRODCOUNT[id] || 0)+1));
  covChip.setAttribute('aria-disabled','false');covChip.textContent='📊 类别索引热图';
  document.querySelectorAll('#domainParts .pitem').forEach(el=>{
    const badge=el.querySelector('.covb'),part=PART[el.dataset.part];if(!badge || !part)return;
    const score=covScore(part);badge.textContent=score+'/4';badge.style.background=COVC[score];badge.title='数据覆盖 '+score+'/4（公司/产品/序列/指标）';
  });
  if(new URLSearchParams(location.search).get('cov')==='1' && !covOn)covToggle();
});
let animationFrame = 0;

function disposePage() {
  if (pageDisposed) return;
  pageDisposed = true;
  cancelAnimationFrame(animationFrame);
  window.removeEventListener('inresearch:appearance', syncSceneAppearance);
  campusUiObserver?.disconnect();clearTimeout(walkTimer);cameraMotion.cancel();sliderMotion.cancel();scenePicking.dispose();controls.dispose();
  pickables.forEach(m=>{m.userData.covMat?.dispose();if(m.userData.covPrev){m.material=m.userData.covPrev;delete m.userData.covPrev}});dimmed.forEach(({original,copies},mesh)=>{mesh.material=original;copies.forEach(m=>m.dispose())});dimmed.clear();
  atlasExport.dispose(); atlasDrawing.dispose();
  sceneView.dispose(); sceneModels.dispose(); inspector.dispose();
  campusAssembly?.dispose();pickables.length=0;
  // Optional/adopted and factory resources have been removed by their owners.
  const gs=new Set(),ms=new Set();scene.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>ms.add(m))});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose());
  sceneEnvironment.dispose(); texturePool.dispose(); composer.dispose(); renderer.dispose();
}
window.addEventListener("pagehide", event => {if (!event.persisted) disposePage();});
(function loop() { if(pageDisposed)return;animationFrame = requestAnimationFrame(loop); controls.update(); atlasDrawing.update(); composer.render(); inspector.tick(); })();

// ?d=<domain> / ?p=<part> 深链：其他页面可直接链进领域视角或部件档案（放最后：依赖上面全部初始化完成）
{ const q = new URLSearchParams(location.search);
  const dkey = DOMAIN_ALIAS[q.get("d")] || q.get("d");
  const d = DOMAINS.find(x => x.key === dkey);
  if (d) { controls.autoRotate = false; enterDomain(d); }
  const nodePart = (q.get("node") || "").replace(/^part:/, "");
  const p = resolveScenePart(q.get("p") || q.get("node") || nodePart);
  if (p) { controls.autoRotate = false; showDossier(p); }
  if (q.get("cov") === "1" && !covOn) { controls.autoRotate = false; covToggle(); } }



/* ── 钻取链按骨架生成（bom.json systems / chains）；尺度钻取链 levels.json 已退役（2026-09-28） ── */
fetch("framework/bom.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(bom => {
  if (!bom?.systems) return;
  const here = location.pathname.split("/").pop() || "index.html", q = new URLSearchParams(location.search);
  const top = Object.entries(bom.systems).filter(([, s]) => !s.parent).sort((a, b) => a[1].order - b[1].order);
  const entries = [{ id: "root", name: "🏢 数据中心全景", page: "bom3d.html", current: here === "bom3d.html" && !q.get("d") }];
  for (const [sid, s] of top) {
    if (sid === "it") entries.push({ id: sid, name: "🗄️ IT · 计算链路（机柜拆解）", page: "rack3d.html", current: here === "rack3d.html" && (q.get("x") || "0") < "70" },
                                   { id: "chip", name: "🧠 芯片级（服务器拆到底）", page: "rack3d.html?x=70", current: here === "rack3d.html" && (q.get("x") || "0") >= "70" });
    else if (sid === "control") entries.push({ id: sid, name: "🖥️ " + s.name, page: "", current: false, desc: "软件条目，不进 3D" });
    else entries.push({ id: sid, name: s.name, page: "bom3d.html?d=" + sid, current: here === "bom3d.html" && q.get("d") === sid, desc: (s.chains || []).join(" → ") });
  }
  const bar = document.createElement("div"); bar.className = "drill";
  entries.forEach((L, i) => {
    if (i) bar.appendChild(dossierNode("span", "›", "sep"));
    const active = L.page && safeURL(L.page);
    const node = dossierNode(active ? "a" : "span", L.name, active ? (L.current ? "on" : "") : "soon");
    node.title = L.name + (L.desc ? " · " + L.desc : "");
    if (active) node.href = safeURL(L.page);
    bar.appendChild(node);
  });
  document.body.appendChild(bar);
}).catch(() => {});
