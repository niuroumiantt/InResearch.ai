<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.2}
      .soft{fill:#f8fafc;stroke:#94a3b8;stroke-width:1;stroke-dasharray:4 3}
      .t{fill:#0f172a} .m{fill:#64748b;font-size:11.5px} .h{font-weight:600;font-size:14px;fill:#0f172a}
      .lane{fill:#eef2f7;stroke:none} .lanet{font-weight:600;font-size:12px;fill:#334155}
      .flow{fill:none;stroke:#475569;stroke-width:1.4;marker-end:url(#arr)}
      .file{fill:#1d4ed8;font-size:11px} .s{font-size:11.5px}
      .col{fill:#fff;stroke:#0f766e;stroke-width:1.2} .colt{fill:#0f766e;font-weight:600}
    </style>
  </defs>
  <rect width="1400" height="960" fill="#ffffff"/>
  <text x="24" y="34" class="h" font-size="18">inresearch.ai 的底层逻辑与架构（2026-09-28）：一棵树 · 五列 · 四段 · 六队</text>
  <text x="24" y="54" class="m">名词轴：数据中心 → 八生态 + 站点权利 → 部件。描述轴：五类变量。数据轴：采集 → 事实 → 规则 → 视图。每个文件都在图上有位置。</text>

  <!-- 四段 lanes -->
  <rect x="24" y="80" width="330" height="850" class="lane"/><text x="36" y="102" class="lanet">第一段 · 采集（六队，inresearch 本身不爬）</text>
  <rect x="368" y="80" width="330" height="850" class="lane"/><text x="380" y="102" class="lanet">第二段 · 事实（序列、指标、材料）</text>
  <rect x="712" y="80" width="330" height="850" class="lane"/><text x="724" y="102" class="lanet">第三段 · 规则（登记表，不写在 JS 里）</text>
  <rect x="1056" y="80" width="320" height="850" class="lane"/><text x="1068" y="102" class="lanet">第四段 · 视图（一个模板，四问）</text>

  <!-- 采集 -->
  <rect x="40" y="120" width="298" height="132" class="box"/>
  <text x="52" y="140" class="h">六队（按来源机制分，不按层）</text>
  <text x="52" y="160" class="t">fetchspec 厂商规格 · inews.today 新闻事件</text>
  <text x="52" y="178" class="t">fetchstat 统计与费率 · fetchfilings 披露与财报</text>
  <text x="52" y="196" class="t">fetchreports 研报与指数 · fetchquotes 报价</text>
  <text x="52" y="218" class="m">三个仓库：inews.today · fetchspec · fetchdata（四队）</text>
  <text x="52" y="236" class="file">framework/supply_contract.json</text>

  <rect x="40" y="272" width="298" height="150" class="box"/>
  <text x="52" y="292" class="h">目标清单（生成，不手写）287 行</text>
  <text x="52" y="312" class="t">因子抓取条目 50 行（F.因子.slug）</text>
  <text x="52" y="330" class="t">部件 × 数据类别 222 行（P.部件.规格|价格|交期|新闻）</text>
  <text x="52" y="348" class="t">软件 2 · 基型 1 · 权利 × 变量类 12（S.权利.类）</text>
  <text x="52" y="368" class="m">每行：变量类 × 因子 × 模型输入 × 披露类型 × 出版方 × 日历 × 机制 × 队 × 主机 × status</text>
  <text x="52" y="388" class="file">framework/tco_targets.json ← manage.py targets</text>
  <text x="52" y="406" class="file">framework/part_fetch.json（人工登记的来源与日历）</text>

  <rect x="40" y="442" width="298" height="96" class="box"/>
  <text x="52" y="462" class="h">交付与验收</text>
  <text x="52" y="482" class="t">供应中心一个入口，fetchspec 包格式，SHA 去重</text>
  <text x="52" y="500" class="t s">数字进观测数据，规格进参照数据，文本进材料档案</text>
  <text x="52" y="522" class="file">framework/06_acquisition.md · workflow.supply</text>

  <!-- 事实 -->
  <rect x="384" y="120" width="298" height="118" class="box"/>
  <text x="396" y="140" class="h">观测数据（按时点追加）</text>
  <text x="396" y="160" class="t">价格库 266 条序列（series_id + as_of）</text>
  <text x="396" y="178" class="t">指标 44 个（阈值、方向、现值）</text>
  <text x="396" y="200" class="file">data/prices.json · framework/indicators.json</text>
  <text x="396" y="218" class="file">data/facts.json（指标 × 口径 × 时点 × 出处）</text>

  <rect x="384" y="258" width="298" height="96" class="box"/>
  <text x="396" y="278" class="h">参照数据（按版本改）</text>
  <text x="396" y="298" class="t">产品线目录 175 条 · 公司档案 248 家</text>
  <text x="396" y="316" class="t">规格文件索引与本地资料库</text>
  <text x="396" y="338" class="file">data/products.json · data/companies.json</text>

  <rect x="384" y="374" width="298" height="96" class="box"/>
  <text x="396" y="394" class="h">材料档案（Spark 提取后再入事实）</text>
  <text x="396" y="414" class="t">inews 事件卡与原件指针 · 研报深读 · 财报</text>
  <text x="396" y="432" class="t">事件类型 10 × 研究角度 9 × 变量类标签</text>
  <text x="396" y="454" class="file">/api/news · knowledge.news_policy · reader</text>

  <!-- 规则 -->
  <rect x="728" y="120" width="298" height="150" class="box"/>
  <text x="740" y="140" class="h">名词轴：一棵树</text>
  <text x="740" y="160" class="t s">数据中心 → 8 生态（设施 电力 冷却 计算 内存 存储 网络 控制）</text>
  <text x="740" y="178" class="t">→ 61 部件 + 软件 1 + 基型 1（尺度 S1–S5）</text>
  <text x="740" y="196" class="t">+ 站点权利 6（土地 水 电 气 网 许可，不可采购）</text>
  <text x="740" y="214" class="m">切分规则：有自己的价格、供应商、交期才单列</text>
  <text x="740" y="236" class="file">framework/bom.json 2.0 · site_rights.json</text>
  <text x="740" y="254" class="file">framework/research_graph.json（关系与导航）</text>

  <rect x="728" y="290" width="298" height="128" class="box"/>
  <text x="740" y="310" class="h">因子树：从公式往下推（24 因子）</text>
  <text x="740" y="330" class="t">收入 = GPU 数 × 8,760 × 付费利用率 × 单价</text>
  <text x="740" y="348" class="t">成本 = 电费 + 其他运营 + 设施费 + 折旧 + 税</text>
  <text x="740" y="366" class="t s">每因子：bom_parts · site_rights · tco_inputs · fetch</text>
  <text x="740" y="388" class="file">framework/tco_factors.json 1.1</text>
  <text x="740" y="406" class="file">data/datacenter_tco_model.json（47 输入各带变量类）</text>

  <rect x="728" y="438" width="298" height="118" class="box"/>
  <text x="740" y="458" class="h">经济模型：三级账</text>
  <text x="740" y="478" class="t">成本 / 收入 / 回报（ROIC），基准情景</text>
  <text x="740" y="496" class="t s">economics.py 与页面 JS 同一公式，校验值为锚</text>
  <text x="740" y="514" class="m">成本计算、TCO 模型是同一列的另两个视图（账本）</text>
  <text x="740" y="536" class="file">data/datacenter_economics_model.json · economics.py</text>

  <rect x="728" y="576" width="298" height="96" class="box"/>
  <text x="740" y="596" class="h">Dashboard 规则：每级每列取值来源</text>
  <text x="740" y="616" class="t">model_input / model_output / series / indicator</text>
  <text x="740" y="634" class="t">聚合：count · max（关键路径）· sum_share</text>
  <text x="740" y="656" class="file">framework/dashboard_rules.json → data/dashboard.json</text>

  <!-- 视图 -->
  <rect x="1072" y="120" width="290" height="230" class="box"/>
  <text x="1084" y="140" class="h">节点页 node.html（一个模板）</text>
  <text x="1084" y="160" class="t">根：三级账 + 9 × 5 矩阵 + 最近变化</text>
  <text x="1084" y="178" class="t">生态：五列聚合 + 部件表</text>
  <text x="1084" y="196" class="t">部件：五列 + 九主题深读入口</text>
  <text x="1084" y="214" class="t">权利：价格 时间 主体三列</text>
  <text x="1084" y="240" class="h" font-size="12.5">四问 = 四段倒序</text>
  <text x="1084" y="258" class="t">① 它值多少 ← 事实</text>
  <text x="1084" y="276" class="t">② 它由什么组成 ← 树</text>
  <text x="1084" y="294" class="t">③ 它怎么影响账 ← 因子</text>
  <text x="1084" y="312" class="t s">④ 数据从哪来缺什么 ← 目标表·派工·新闻</text>
  <text x="1084" y="336" class="file">/ 与 /index.html → node.html</text>

  <rect x="1072" y="370" width="290" height="110" class="box"/>
  <text x="1084" y="390" class="h">归位的旧页面</text>
  <text x="1084" y="410" class="t">账本 ledger.html：三个计算器的一个展开</text>
  <text x="1084" y="428" class="t">爆炸图 / 3D：②的视觉形式</text>
  <text x="1084" y="446" class="t">研究工作台：①的深读 · 供应中心：④的全局</text>
  <text x="1084" y="464" class="t">公司档案：主体列的展开</text>

  <!-- 五列 strip -->
  <rect x="40" y="700" width="1322" height="112" class="soft"/>
  <text x="52" y="722" class="h">描述轴：五类变量（正交，无先后，一条数据只属一类）——每一级节点、每一行目标、每个模型输入都按此打标</text>
  <g>
    <rect x="52" y="736" width="250" height="60" class="col"/><text x="64" y="756" class="colt">1 构成</text><text x="64" y="774" class="m">规模、代际、规格、每柜数量、装在哪个尺度</text>
    <rect x="316" y="736" width="250" height="60" class="col"/><text x="328" y="756" class="colt">2 运行</text><text x="328" y="774" class="m">PUE、负载率、利用率、效率、维护</text>
    <rect x="580" y="736" width="250" height="60" class="col"/><text x="592" y="756" class="colt">3 价格</text><text x="592" y="774" class="m">单价、造价、租金、序列、报价</text>
    <rect x="844" y="736" width="250" height="60" class="col"/><text x="856" y="756" class="colt">4 时间</text><text x="856" y="774" class="m">交期、寿命、建设周期、排队年限、涨幅</text>
    <rect x="1108" y="736" width="240" height="60" class="col"/><text x="1120" y="756" class="colt">5 主体</text><text x="1120" y="774" class="m">供应商、持有方、融资方、税率、许可</text>
  </g>

  <!-- 治理 strip -->
  <rect x="40" y="828" width="1322" height="92" class="soft"/>
  <text x="52" y="850" class="h">治理：规范只在 framework/CURRENT.md 进入；生成物由命令重建并被 --check 与单元测试守住</text>
  <text x="52" y="872" class="t">manage.py targets · dashboard · governance · validate --strict · 浏览器套件 core（含 dashboard、ui_skin）</text>
  <text x="52" y="892" class="m">在册评审文件（规范、界面清单、验收测试）改动后由评审者更新 verification_contract.json 的摘要；生成物不进评审，规则表进评审。</text>

  <!-- flows -->
  <path d="M338,340 C360,340 362,180 384,180" class="flow"/>
  <path d="M682,180 C705,180 706,340 728,340" class="flow"/>
  <path d="M682,300 C705,300 706,200 728,200" class="flow"/>
  <path d="M1026,340 C1049,340 1050,230 1072,230" class="flow"/>
  <path d="M1026,620 C1049,620 1050,300 1072,300" class="flow"/>
  <path d="M1026,500 C1049,500 1050,160 1072,160" class="flow"/>
  <path d="M877,270 L877,290" class="flow"/>
  <path d="M877,418 L877,438" class="flow"/>
  <path d="M877,556 L877,576" class="flow"/>
  <path d="M189,252 L189,272" class="flow"/>
  <path d="M189,422 L189,442" class="flow"/>
  <path d="M1217,350 L1217,370" class="flow"/>
  <!-- 目标表由规则生成：从规则回到采集 -->
  <path d="M728,380 C600,380 520,600 338,600 L338,600" class="flow" stroke-dasharray="5 4"/>
  <text x="400" y="588" class="m">目标表由规则层生成，回写采集需求（虚线）</text>
  <path d="M338,600 C300,600 260,560 240,430" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
