<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="13">
  <title>inresearch.ai 架构（2026-09-28）：一棵树 · 三级账 · 四问四段 · 五类变量 · 六队 · 一个模板</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.2}
      .soft{fill:#f5f4ef;stroke:#333;stroke-width:1.2}
      .gen{fill:#eaf2fb;stroke:#2b5fa8;stroke-width:1.2}
      .page{fill:#eef8ee;stroke:#2f7a3a;stroke-width:1.2}
      .t{fill:#111}.m{fill:#555;font-size:11px}.h{font-weight:700;font-size:14px}
      .arrow{stroke:#555;stroke-width:1.2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="20" y="28" class="h" font-size="18">inresearch.ai · 一座数据中心，可以被追问到底（2026-09-28 唯一逻辑）</text>
  <text x="20" y="48" class="m">名词轴：一棵树；描述轴：五类变量；数据轴：四段 → 四问；组织轴：目录六项 = 四问的全局视图。每个框都写了对应文件；生成物由命令重建并被 --check 与单元测试守住。</text>

  <!-- 目录六项 -->
  <rect x="20" y="66" width="1140" height="86" class="soft"/>
  <text x="32" y="86" class="h">目录（web/components/site-shell.js · interface_manifest.json sections / public_pages）</text>
  <g>
    <rect x="32" y="96" width="170" height="44" class="page"/><text x="42" y="114" class="t">数据中心 · node.html</text><text x="42" y="130" class="m">树本身：四问五列，三级账在上</text>
    <rect x="216" y="96" width="170" height="44" class="page"/><text x="226" y="114" class="t">账本 · ledger.html</text><text x="226" y="130" class="m">价格列的展开 + 三级账（四视图）</text>
    <rect x="400" y="96" width="170" height="44" class="page"/><text x="410" y="114" class="t">爆炸图 · bom.html / bom3d</text><text x="410" y="130" class="m">构成列的视觉形式，共用部件档案</text>
    <rect x="584" y="96" width="170" height="44" class="page"/><text x="594" y="114" class="t">采集 · supply.html</text><text x="594" y="130" class="m">目标表是唯一任务书；派工按行 ID</text>
    <rect x="768" y="96" width="170" height="44" class="page"/><text x="778" y="114" class="t">成果 · report.html</text><text x="778" y="130" class="m">四章即四问的可发布快照</text>
    <rect x="952" y="96" width="196" height="44" class="page"/><text x="962" y="114" class="t">管理 · ops.html（admin）</text><text x="962" y="130" class="m">用户、管线、录价、新鲜度、工具</text>
  </g>
  <text x="32" y="150" class="m">角色：admin 六项 · member 五项 · intern 采集（自己的行）· reader 公开只读（数据中心、账本基准、爆炸图、成果；interfaces/public.py 服务端过滤）</text>

  <!-- 一棵树 + 五类 -->
  <rect x="20" y="176" width="560" height="220" class="box"/>
  <text x="32" y="196" class="h">一棵树（framework/bom.json · site_rights.json）</text>
  <text x="32" y="216" class="t">数据中心 → 设施 · 电力 · 冷却 · IT（计算 / 内存 / 存储 / 网络）· 控制与软件</text>
  <text x="32" y="234" class="t">系统内按能量流链路（chain, chain_order）→ 61 部件 + 软件 + 基型；六条站点权利并列</text>
  <text x="32" y="252" class="m">部件属性：尺度 S1–S5、建设阶段 stage（权利与审批 → 并网与外线 → 土建与壳 → 机电 → IT 进场 → 调试与上架）、legacy_module</text>
  <text x="32" y="278" class="h">五类变量（正交、无先后）</text>
  <g>
    <rect x="32" y="288" width="100" height="30" class="soft"/><text x="42" y="308" class="t">1 构成</text>
    <rect x="140" y="288" width="100" height="30" class="soft"/><text x="150" y="308" class="t">2 运行</text>
    <rect x="248" y="288" width="100" height="30" class="soft"/><text x="258" y="308" class="t">3 价格</text>
    <rect x="356" y="288" width="100" height="30" class="soft"/><text x="366" y="308" class="t">4 时间</text>
    <rect x="464" y="288" width="100" height="30" class="soft"/><text x="474" y="308" class="t">5 主体</text>
  </g>
  <text x="32" y="338" class="m">每个模型输入、每条目标行、每条登记（node + variable_class，knowledge/nodes.py 派生）都打这五类之一</text>
  <text x="32" y="356" class="h">研究图谱 3.0（knowledge/graph.py 生成）</text>
  <text x="32" y="374" class="m">对象只有六种：根、系统、链路、部件、权利、主体；问题表 ID 不变，每条挂节点与变量类；旧 ID 按别名折算</text>

  <!-- 三级账 -->
  <rect x="600" y="176" width="560" height="220" class="box"/>
  <text x="612" y="196" class="h">三级账（data/datacenter_model.json · knowledge/economics.py · web/components/datacenter-model.js）</text>
  <text x="612" y="216" class="t">成本 → 收入 → 回报（回报是账的输出，不是一列）；一个账本页，四个视图，三种问法</text>
  <text x="612" y="234" class="m">正算 · 反算 · 情景网格；三个校准锚（MS / GS / 2026-09-14）；reader 只见基准预设与校准锚</text>
  <text x="612" y="262" class="h">四问 = 四段倒序（dashboard_rules.json → data/dashboard.json → node.html）</text>
  <g>
    <rect x="612" y="272" width="126" height="56" class="soft"/><text x="620" y="290" class="t">① 它值多少</text><text x="620" y="306" class="m">事实 · 五类现值</text><text x="620" y="320" class="m">+ 研究面板</text>
    <rect x="750" y="272" width="126" height="56" class="soft"/><text x="758" y="290" class="t">② 由什么组成</text><text x="758" y="306" class="m">树 · 子节点</text><text x="758" y="320" class="m">矩阵 / 时间线</text>
    <rect x="888" y="272" width="126" height="56" class="soft"/><text x="896" y="290" class="t">③ 怎么影响账</text><text x="896" y="306" class="m">规则 · 因子树</text><text x="896" y="320" class="m">tco_factors.json</text>
    <rect x="1026" y="272" width="122" height="56" class="soft"/><text x="1034" y="290" class="t">④ 数据从哪来</text><text x="1034" y="306" class="m">采集 · 目标表</text><text x="1034" y="320" class="m">四态 + 六队</text>
  </g>
  <text x="612" y="352" class="h">四个读法（五列的横向展开，不是新轴）</text>
  <text x="612" y="372" class="m">建（时间列 + 主体列，按建设阶段）· 拆（构成列 + 价格列，爆炸图）· 运（运行列，运营支出在账本）· 账（价格列 + 三级账）</text>

  <!-- 四段：采集 → 事实 → 规则 → 视图 -->
  <text x="20" y="428" class="h">数据轴（四段）：采集 → 事实 → 规则 → 视图；回路：目标表由规则层生成，回写采集需求，灰格就是任务书</text>
  <g>
    <rect x="20" y="440" width="270" height="150" class="gen"/>
    <text x="32" y="460" class="h">采集（六队）</text>
    <text x="32" y="480" class="t">fetchspec · inews · fetchstat · fetchfilings</text>
    <text x="32" y="496" class="t">fetchreports · fetchquotes（四队待建）</text>
    <text x="32" y="516" class="m">supply_contract.json；目标表 tco_targets.json</text>
    <text x="32" y="532" class="m">= 因子树 + 部件表 + 权利表 + part_fetch 生成</text>
    <text x="32" y="548" class="m">状态四态：sourced / assumed / delivered / needed</text>
    <text x="32" y="564" class="m">派工 workflow/dispatch.py（/api/targets, /api/deliver）</text>

    <rect x="310" y="440" width="270" height="150" class="gen"/>
    <text x="322" y="460" class="h">事实（登记表，每条带 node + variable_class）</text>
    <text x="322" y="480" class="t">data/prices.json · facts.json · products.json</text>
    <text x="322" y="496" class="t">companies.json · framework/indicators.json · metrics.json</text>
    <text x="322" y="516" class="m">Git 内载体决定 delivered：资料计划 doc_id /</text>
    <text x="322" y="532" class="m">source_url、带 origin_pointer 的事件卡、带 target_id 的价格</text>
    <text x="322" y="548" class="m">运行库（快照、派工、收件箱）不进 Git，页面标"运行库有 / Git 无"</text>
    <text x="322" y="564" class="m">manage.py nodes --refresh / --check</text>

    <rect x="600" y="440" width="270" height="150" class="gen"/>
    <text x="612" y="460" class="h">规则（进评审）</text>
    <text x="612" y="480" class="t">bom.json · site_rights.json · tco_factors.json</text>
    <text x="612" y="496" class="t">datacenter_model.json · dashboard_rules.json</text>
    <text x="612" y="512" class="t">part_fetch.json · supply_contract.json</text>
    <text x="612" y="532" class="m">生成器：targets.py · dashboard.py · graph.py · nodes.py</text>
    <text x="612" y="548" class="m">经济模型：economics.py（唯一参考实现）+ JS 镜像</text>
    <text x="612" y="564" class="m">治理：current_state.json · verification_contract.json</text>

    <rect x="890" y="440" width="270" height="150" class="gen"/>
    <text x="902" y="460" class="h">视图（一个模板 + 五页）</text>
    <text x="902" y="480" class="t">node.html（任一节点 × 五列 × 四问）</text>
    <text x="902" y="496" class="t">ledger · bom / bom3d / rack3d · supply · report · ops</text>
    <text x="902" y="516" class="m">主体页 company.html 从第五列进入；规格库 product-catalog</text>
    <text x="902" y="532" class="m">格级诚实：视图层不填估值；登记数只标"登记数"</text>
    <text x="902" y="548" class="m">研究面板：/api/research-summary?node=（骨架过滤）</text>
    <text x="902" y="564" class="m">成果：/api/report（四问快照）· export（md / json / 打印）</text>
  </g>
  <path d="M290 515 L310 515" class="arrow"/>
  <path d="M580 515 L600 515" class="arrow"/>
  <path d="M870 515 L890 515" class="arrow"/>
  <path d="M735 590 C735 640 155 640 155 590" class="arrow"/>
  <text x="330" y="628" class="m">回路：规则层生成目标表 → 采集需求（各队不自定抓什么）；节点页灰格 ↔ 采集页目标行双向链接</text>

  <!-- 退役 -->
  <rect x="20" y="660" width="1140" height="80" class="soft"/>
  <text x="32" y="680" class="h">2026-09-28 起退役的词汇与轴（只在"退役什么"或历史快照里出现）</text>
  <text x="32" y="700" class="m">五视角 P/F/V/D/R · 八生态 / 主生态 · 九主题 T01–T09 · 按尺度分组的浏览目录 · 五层 · 三个计算器 · 首页 / 仪表盘 / 看板 / KPI 拼盘 · "工单 = 模块声明 − 仓库现状"</text>
  <text x="32" y="718" class="m">旧模块 M01–M15 降为兼容属性 legacy_module；研究页、团队看板、资料收件箱页、NVIDIA 打样页、演示页、海报页并入或删除；旧地址 302 到新落点</text>
  <text x="32" y="736" class="m">Spark / M4：拉同一提交后重导出一次；问题 ID 不变，旧对象 ID 由接收端折算并在 registry_lag 标出</text>
</svg>
