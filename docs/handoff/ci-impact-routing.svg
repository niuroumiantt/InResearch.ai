<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img" aria-labelledby="title desc">
  <title id="title">CI checks selected by change impact</title>
  <desc id="desc">Content uses validation only, bounded page changes add related browser suites, and code or unknown changes add full browser and storage regression. One required gate checks the selected results.</desc>
  <rect width="760" height="228" rx="16" fill="#f6f8fa"/>
  <g font-family="sans-serif" font-size="15" fill="#1f2328">
    <text x="28" y="32" font-size="19" font-weight="bold">Change impact determines CI scope</text>
    <g stroke="#b8c1cc" fill="white">
      <rect x="28" y="54" width="300" height="40" rx="8"/>
      <rect x="28" y="106" width="300" height="40" rx="8"/>
      <rect x="28" y="158" width="300" height="40" rx="8"/>
      <rect x="396" y="92" width="332" height="68" rx="8" fill="#e9f5ed" stroke="#2da44e"/>
    </g>
    <text x="44" y="79">Docs / images: content validation</text>
    <text x="44" y="131">Mapped page: related browser suites</text>
    <text x="44" y="183">Code / unknown: full regression</text>
    <path d="M328 74 H360 V178 H328 M360 126 H396" fill="none" stroke="#57606a" stroke-width="2"/>
    <text x="414" y="119" font-weight="bold">Required: validate + browser (core)</text>
    <text x="414" y="143">Every selected check must succeed</text>
  </g>
</svg>
