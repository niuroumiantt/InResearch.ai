<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-label="全球已安装容量 2025年"><title>全球已安装容量 2025年</title><rect width="720" height="730" fill="#fff"/><g font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif"><text x="28" y="44" font-size="32" fill="#14283f" font-weight="700">全球已安装容量 2025年</text><text x="28" y="88" font-size="24" fill="#52677a">单位：GW。IT与设施总容量分别记录；设施总容量包含IT。</text><rect x="28" y="135" width="16" height="16" fill="#3987e5"/><text x="51" y="152" font-size="24" fill="#14283f">IT设备</text><rect x="241" y="135" width="16" height="16" fill="#c89b3c"/><text x="264" y="152" font-size="24" fill="#14283f">设施总容量</text><text x="28" y="190" font-size="27" fill="#14283f" font-weight="700">美国</text><rect x="28" y="210" width="535" height="20" fill="#edf2f6"/><rect x="28" y="210" width="347.7500" height="20" fill="#3987e5"/><text x="690" y="230" text-anchor="end" font-size="25" fill="#14283f">39.0</text><rect x="28" y="246" width="535" height="20" fill="#edf2f6"/><rect x="28" y="246" width="463.6667" height="20" fill="#c89b3c"/><text x="690" y="266" text-anchor="end" font-size="25" fill="#14283f">52.0</text><text x="28" y="316" font-size="27" fill="#14283f" font-weight="700">中国（含香港）</text><rect x="28" y="336" width="535" height="20" fill="#edf2f6"/><rect x="28" y="336" width="169.4167" height="20" fill="#3987e5"/><text x="690" y="356" text-anchor="end" font-size="25" fill="#14283f">19.0</text><rect x="28" y="372" width="535" height="20" fill="#edf2f6"/><rect x="28" y="372" width="249.6667" height="20" fill="#c89b3c"/><text x="690" y="392" text-anchor="end" font-size="25" fill="#14283f">28.0</text><text x="28" y="442" font-size="27" fill="#14283f" font-weight="700">其他地区</text><rect x="28" y="462" width="535" height="20" fill="#edf2f6"/><rect x="28" y="462" width="214.0000" height="20" fill="#3987e5"/><text x="690" y="482" text-anchor="end" font-size="25" fill="#14283f">24.0</text><rect x="28" y="498" width="535" height="20" fill="#edf2f6"/><rect x="28" y="498" width="303.1667" height="20" fill="#c89b3c"/><text x="690" y="518" text-anchor="end" font-size="25" fill="#14283f">34.0</text><text x="28" y="568" font-size="24" fill="#14283f">全球合计：82GW IT、114GW设施总容量。年度设备模型，不</text><text x="28" y="602" font-size="24" fill="#14283f">是2026年实时清点。</text><text x="28" y="690" font-size="22" fill="#52677a">来源：IEA2026报告表A.2；其他地区为全球减去美国与中国。</text></g></svg>
