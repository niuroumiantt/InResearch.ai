<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1157" viewBox="0 0 720 1157" role="img" aria-label="从讨论到实际使用"><title>从讨论到实际使用</title><rect width="720" height="1157" fill="#fff"/><g font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif"><text x="28" y="44" font-size="32" fill="#14283f" font-weight="700">从讨论到实际使用</text><text x="28" y="88" font-size="24" fill="#52677a">每一阶段都有不同证据。园区可同时存在已投运一期和规划后续期</text><text x="28" y="121" font-size="24" fill="#52677a">。</text><rect x="24" y="168" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="196" r="17" fill="#0b1f3a"/><text x="49" y="204" text-anchor="middle" fill="#fff" font-size="23">1</text><text x="78" y="205" font-size="28" fill="#14283f" font-weight="700">讨论 意向</text><text x="78" y="233" font-size="25" fill="#14283f">投资意向、谅解备忘录、寻址或电力申请。容量边界可</text><text x="78" y="269" font-size="25" fill="#14283f">能仍在变动。</text><rect x="24" y="351" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="379" r="17" fill="#0b1f3a"/><text x="49" y="387" text-anchor="middle" fill="#fff" font-size="23">2</text><text x="78" y="388" font-size="28" fill="#14283f" font-weight="700">规划 批准</text><text x="78" y="416" font-size="25" fill="#14283f">取得土地、公布方案、申请或获得许可；未必已完成融</text><text x="78" y="452" font-size="25" fill="#14283f">资和开工。</text><rect x="24" y="534" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="562" r="17" fill="#0b1f3a"/><text x="49" y="570" text-anchor="middle" fill="#fff" font-size="23">3</text><text x="78" y="571" font-size="28" fill="#14283f" font-weight="700">在建</text><text x="78" y="599" font-size="25" fill="#14283f">施工已启动。只记录本期容量，后续园区上限仍属于规</text><text x="78" y="635" font-size="25" fill="#14283f">划。</text><rect x="24" y="717" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="745" r="17" fill="#0b1f3a"/><text x="49" y="753" text-anchor="middle" fill="#fff" font-size="23">4</text><text x="78" y="754" font-size="28" fill="#14283f" font-weight="700">交付 投运</text><text x="78" y="782" font-size="25" fill="#14283f">机房可提供服务或已装设备；两种口径分别记录，避免</text><text x="78" y="818" font-size="25" fill="#14283f">混用。</text><rect x="24" y="900" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="928" r="17" fill="#0b1f3a"/><text x="49" y="936" text-anchor="middle" fill="#fff" font-size="23">5</text><text x="78" y="937" font-size="28" fill="#14283f" font-weight="700">客户实际使用</text><text x="78" y="965" font-size="25" fill="#14283f">客户使用容量、计费或上架率。已运营不表示客户已经</text><text x="78" y="1001" font-size="25" fill="#14283f">用满。</text><text x="28" y="1117" font-size="22" fill="#52677a">阶段划分为本文研究规则；对应证据见三地项目台账</text></g></svg>
