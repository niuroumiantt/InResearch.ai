<svg xmlns="http://www.w3.org/2000/svg" width="720" height="717" viewBox="0 0 720 717" role="img" aria-label="美国数字 要连着范围读"><title>美国数字 要连着范围读</title><rect width="720" height="717" fill="#fff"/><g font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif"><text x="28" y="44" font-size="32" fill="#14283f" font-weight="700">美国数字 要连着范围读</text><text x="28" y="88" font-size="24" fill="#52677a">这些数覆盖不同对象与时间，不能画成同一组市场份额。</text><rect x="28" y="135" width="322" height="170" rx="12" fill="#f2f6fa"/><text x="42" y="181" font-size="37" font-weight="700" fill="#0b1f3a">39 GW</text><text x="42" y="218" font-size="24" fill="#14283f">2025年已安装IT容量IE</text><text x="42" y="251" font-size="24" fill="#14283f">A设备存量模型</text><rect x="364" y="135" width="322" height="170" rx="12" fill="#f2f6fa"/><text x="378" y="181" font-size="37" font-weight="700" fill="#0b1f3a">10.903 GW</text><text x="378" y="218" font-size="24" fill="#14283f">H1 2026批发市场库存C</text><text x="378" y="251" font-size="24" fill="#14283f">BRE八大主市场</text><rect x="28" y="320" width="322" height="170" rx="12" fill="#f2f6fa"/><text x="42" y="366" font-size="37" font-weight="700" fill="#0b1f3a">7.4811 GW</text><text x="42" y="403" font-size="24" fill="#14283f">H1 2026在建同一CBRE</text><text x="42" y="436" font-size="24" fill="#14283f">八市场口径</text><rect x="364" y="320" width="322" height="170" rx="12" fill="#f2f6fa"/><text x="378" y="366" font-size="37" font-weight="700" fill="#0b1f3a">331 GW</text><text x="378" y="403" font-size="24" fill="#14283f">Q1 2026累计披露管线W</text><text x="378" y="436" font-size="24" fill="#14283f">ood Mackenzie；约四</text><text x="378" y="469" font-size="24" fill="#14283f">成积极推进</text><text x="28" y="525" font-size="24" fill="#14283f">“积极推进”包含多个开发阶段，不等于全容量已施工。没有</text><text x="28" y="559" font-size="24" fill="#14283f">披露实施分期的远期上限留在规划栏。</text><text x="28" y="647" font-size="22" fill="#52677a">来源：IEA2026；CBRE North America Data Center Trends</text><text x="28" y="677" font-size="22" fill="#52677a"> H1 2026；Wood Mackenzie 2026-07-30</text></g></svg>
