<svg xmlns="http://www.w3.org/2000/svg" width="720" height="712" viewBox="0 0 720 712" role="img" aria-label="中国企业披露的容量观察点"><title>中国企业披露的容量观察点</title><rect width="720" height="712" fill="#fff"/><g font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif"><text x="28" y="44" font-size="32" fill="#14283f" font-weight="700">中国企业披露的容量观察点</text><text x="28" y="88" font-size="24" fill="#52677a">单位：GW。报告期和容量定义不同；样本不等于全国总量。</text><rect x="28" y="135" width="16" height="16" fill="#3987e5"/><text x="51" y="152" font-size="24" fill="#14283f">投运或交付</text><text x="28" y="190" font-size="27" fill="#14283f" font-weight="700">世纪互联批发 2026-06</text><rect x="28" y="210" width="535" height="20" fill="#edf2f6"/><rect x="28" y="210" width="448.9542" height="20" fill="#3987e5"/><text x="690" y="230" text-anchor="end" font-size="25" fill="#14283f">1.007</text><text x="28" y="280" font-size="27" fill="#14283f" font-weight="700">秦淮 2026Q3官网规模</text><rect x="28" y="300" width="535" height="20" fill="#edf2f6"/><rect x="28" y="300" width="383.4167" height="20" fill="#3987e5"/><text x="690" y="320" text-anchor="end" font-size="25" fill="#14283f">0.860</text><text x="28" y="370" font-size="27" fill="#14283f" font-weight="700">润泽 2026-06交付</text><rect x="28" y="390" width="535" height="20" fill="#edf2f6"/><rect x="28" y="390" width="334.3750" height="20" fill="#3987e5"/><text x="690" y="410" text-anchor="end" font-size="25" fill="#14283f">0.750</text><text x="28" y="460" font-size="27" fill="#14283f" font-weight="700">数据港 2026-06</text><rect x="28" y="480" width="535" height="20" fill="#edf2f6"/><rect x="28" y="480" width="178.7792" height="20" fill="#3987e5"/><text x="690" y="500" text-anchor="end" font-size="25" fill="#14283f">0.401</text><text x="28" y="550" font-size="24" fill="#14283f">在建另列：世纪互联0.585GW、秦淮0.660GW。其他企业未在</text><text x="28" y="584" font-size="24" fill="#14283f">本图填在建值，不表示零。公司合计与园区不能重复累加。</text><text x="28" y="672" font-size="22" fill="#52677a">来源：世纪互联Q2业绩、秦淮官网、润泽及数据港半年报。</text></g></svg>
