<svg xmlns="http://www.w3.org/2000/svg" width="720" height="941" viewBox="0 0 720 941" role="img" aria-label="一座园区 可以有多层合作角色"><title>一座园区 可以有多层合作角色</title><rect width="720" height="941" fill="#fff"/><g font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif"><text x="28" y="44" font-size="32" fill="#14283f" font-weight="700">一座园区 可以有多层合作角色</text><text x="28" y="88" font-size="24" fill="#52677a">阿比林Stargate园区的角色示意；与微软新园区分开。</text><rect x="24" y="135" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="163" r="17" fill="#0b1f3a"/><text x="49" y="171" text-anchor="middle" fill="#fff" font-size="23">1</text><text x="78" y="172" font-size="28" fill="#14283f" font-weight="700">园区开发建设</text><text x="78" y="200" font-size="25" fill="#14283f">Crusoe及项目合作方组织建设；土地开发与机房交付</text><text x="78" y="236" font-size="25" fill="#14283f">属于项目层。</text><rect x="24" y="318" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="346" r="17" fill="#0b1f3a"/><text x="49" y="354" text-anchor="middle" fill="#fff" font-size="23">2</text><text x="78" y="355" font-size="28" fill="#14283f" font-weight="700">算力基础设施与云服务</text><text x="78" y="383" font-size="25" fill="#14283f">Oracle在园区部署云基础设施，向客户提供计算服务</text><text x="78" y="419" font-size="25" fill="#14283f">。</text><rect x="24" y="501" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="529" r="17" fill="#0b1f3a"/><text x="49" y="537" text-anchor="middle" fill="#fff" font-size="23">3</text><text x="78" y="538" font-size="28" fill="#14283f" font-weight="700">已披露使用方</text><text x="78" y="566" font-size="25" fill="#14283f">OpenAI使用Oracle提供的基础设施；客户容量与整</text><text x="78" y="602" font-size="25" fill="#14283f">个园区容量分开。</text><rect x="24" y="684" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="712" r="17" fill="#0b1f3a"/><text x="49" y="720" text-anchor="middle" fill="#fff" font-size="23">4</text><text x="78" y="721" font-size="28" fill="#14283f" font-weight="700">工程施工与供电</text><text x="78" y="749" font-size="25" fill="#14283f">总包、机电承包、供电企业逐项核实；项目业主不自动</text><text x="78" y="785" font-size="25" fill="#14283f">等于施工承包商。</text><text x="28" y="901" font-size="22" fill="#52677a">据OpenAI/Oracle/Crusoe公开项目公告；实际合同边界以公告为准</text></g></svg>
