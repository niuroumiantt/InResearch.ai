<svg xmlns="http://www.w3.org/2000/svg" width="720" height="974" viewBox="0 0 720 974" role="img" aria-label="同一个GW 要先看它数什么"><title>同一个GW 要先看它数什么</title><rect width="720" height="974" fill="#fff"/><g font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif"><text x="28" y="44" font-size="32" fill="#14283f" font-weight="700">同一个GW 要先看它数什么</text><text x="28" y="88" font-size="24" fill="#52677a">不同口径分开记录。示例为通用示意，不表示某座园区的实际配置</text><text x="28" y="121" font-size="24" fill="#52677a">。</text><rect x="24" y="168" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="196" r="17" fill="#0b1f3a"/><text x="49" y="204" text-anchor="middle" fill="#fff" font-size="23">1</text><text x="78" y="205" font-size="28" fill="#14283f" font-weight="700">IT容量</text><text x="78" y="233" font-size="25" fill="#14283f">服务器、存储、网络设备使用的额定功率，区分已安装</text><text x="78" y="269" font-size="25" fill="#14283f">与机房设计容量。</text><rect x="24" y="351" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="379" r="17" fill="#0b1f3a"/><text x="49" y="387" text-anchor="middle" fill="#fff" font-size="23">2</text><text x="78" y="388" font-size="28" fill="#14283f" font-weight="700">设施总功率</text><text x="78" y="416" font-size="25" fill="#14283f">IT负荷加冷却、供配电及其他辅助设备；包括IT部分</text><text x="78" y="452" font-size="25" fill="#14283f">。</text><rect x="24" y="534" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="562" r="17" fill="#0b1f3a"/><text x="49" y="570" text-anchor="middle" fill="#fff" font-size="23">3</text><text x="78" y="571" font-size="28" fill="#14283f" font-weight="700">发电或电力接入</text><text x="78" y="599" font-size="25" fill="#14283f">电厂装机、电网合同、接入申请各有边界；不能代替机</text><text x="78" y="635" font-size="25" fill="#14283f">房IT容量。</text><rect x="24" y="717" width="672" height="164" rx="10" fill="#f2f6fa"/><circle cx="49" cy="745" r="17" fill="#0b1f3a"/><text x="49" y="753" text-anchor="middle" fill="#fff" font-size="23">4</text><text x="78" y="754" font-size="28" fill="#14283f" font-weight="700">全年平均负荷</text><text x="78" y="782" font-size="25" fill="#14283f">年电量TWh ÷ 8.76 = 年平均GW。平均功率不等于装</text><text x="78" y="818" font-size="25" fill="#14283f">机。</text><text x="28" y="934" font-size="22" fill="#52677a">定义据IEA2026报告方法与术语；电量换算为作者说明性计算</text></g></svg>
