<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head>
<script src="/assets/site-skin.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队看板 — Datacenter Hub</title>
<style>


  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 15px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 24px 16px 80px; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .crumb { font-size: 13px; margin-bottom: 14px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .banner { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--yellow); border-radius: var(--ui-radius); padding: 10px 14px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .tot { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .tot div { background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 10px 16px; }
  .tot b { display: block; font-size: 21px; line-height: 1.3; }
  .tot span { font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .mod { background: var(--card); border: 1px solid var(--line); border-radius: var(--ui-radius); padding: 10px 12px; cursor: pointer; }
  .mod:hover { border-color: var(--accent); }
  .mod.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .mod h3 { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .mod .kv { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .mod .kv b { color: var(--text); font-weight: 600; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .ctl input, .ctl select { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--ui-radius); background: var(--card); color: var(--text); }
  .ctl input[type=search] { flex: 1 1 220px; }
  .ctl .cnt { margin-left: auto; font-size: 13px; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: color-mix(in srgb, var(--card) 60%, var(--bg)); font-weight: 500; color: var(--muted); position: sticky; top: 0; }
  .wid { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: nowrap; }
  .pri { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; border-radius: var(--ui-radius); padding: 1px 7px; }
  .P1 { background: var(--red); } .P2 { background: var(--yellow); } .P3 { background: var(--muted); }
  .st { display: inline-block; font-size: 11px; border-radius: var(--ui-radius); padding: 0 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .st-已派 { color: var(--accent); border-color: var(--accent); }
  .st-进行中 { color: var(--yellow); border-color: var(--yellow); }
  .st-已交付, .st-已合并 { color: var(--green); border-color: var(--green); }
  .st-已放弃 { color: var(--muted); text-decoration: line-through; }
  .gap { color: var(--muted); font-size: 12px; }
  .brief { white-space: pre-line; line-height: 1.75; margin-bottom: 6px; }
  .brief b { color: var(--text); }
  tr.internal { opacity: .5; }
  .badge-int { display:inline-block; font-size:10px; border:1px solid var(--line); border-radius: var(--ui-radius); padding:0 6px; color:var(--muted); }
  details.raw { margin-top: 4px; }
  details.raw summary { font-size: 11px; color: var(--muted); cursor: pointer; }
  button { font: inherit; font-size: 12px; padding: 4px 11px; border: 1px solid var(--line); border-radius: var(--ui-radius); background: var(--card); color: var(--accent); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  dialog { border: 1px solid var(--line); border-radius: var(--ui-radius); background: var(--card); color: var(--text); padding: 20px 22px; max-width: 460px; width: 92%; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { font-size: 16px; margin-bottom: 4px; }
  dialog .g { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  dialog input, dialog select { width: 100%; font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--ui-radius); background: var(--bg); color: var(--text); }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .msg { font-size: 12px; margin-top: 10px; }
  .msg.ok { color: var(--green); } .msg.no { color: var(--red); }
</style>
<link rel="stylesheet" href="/assets/site-skin.css">
</head>
<body style="--ui-page-inset:24px">
<div class="wrap">
  <div class="crumb"><a href="index.html">← 仪表盘</a> <span>/ 团队看板</span></div>
  <h1>团队看板</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="banner" id="banner" style="display:none"></div>

  <div class="tot" id="tot"></div>
  <details class="ui-mobile-overview" open><summary>模块概览与筛选</summary><div class="grid" id="grid"></div></details>

  <div class="ctl">
    <input type="search" id="q" placeholder="搜索缺口／工单号／负责人…">
    <select id="fpri"><option value="">全部优先级</option><option>P1</option><option>P2</option><option>P3</option></select>
    <select id="fscope">
      <option value="assignable">只看可派给实习生的</option>
      <option value="">全部（含内部任务）</option>
    </select>
    <select id="fst"><option value="">全部状态</option><option value="未派">未派</option></select>
    <select id="fwho"><option value="">全部负责人</option></select>
    <span class="cnt" id="cnt"></span>
  </div>
  <table id="tb" class="ui-task-table"></table>
</div>

<dialog id="dlg">
  <h3 id="d-wid"></h3>
  <div class="g" id="d-gap"></div>
  <label>负责人</label><input id="d-who" placeholder="成员标识">
  <label>状态</label>
  <select id="d-st"><option>已派</option><option>进行中</option><option>已交付</option><option>已合并</option><option>已放弃</option></select>
  <label>截止日（可空）</label><input id="d-due" placeholder="2026-08-24">
  <label>备注（标「已放弃」时必填）</label><input id="d-note">
  <div class="msg" id="d-msg"></div>
  <div class="row"><button id="d-cancel">取消</button><button id="d-ok">保存</button></div>
</dialog>

<script>
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let ORDERS = [], STATS = {}, ASSIGN = {}, modFilter = "", canWrite = false;

async function load() {
  const [wo, as] = await Promise.all([
    fetch("reports/workorders.json?t=" + Date.now()).then(r => r.json()),
    fetch("data/assignments.json?t=" + Date.now()).then(r => r.json()).catch(() => ({records: []})),
  ]);
  ORDERS = wo.orders; STATS = wo.module_stats || {};
  ASSIGN = Object.fromEntries((as.records || []).map(r => [r.workorder_id, r]));
  document.getElementById("sub").textContent =
    `工单 ${ORDERS.length} 张 ｜ 队列生成于 ${wo.generated} ｜ 工单 = 模块声明 − 仓库现状，不手写`;

  // 服务器在，派工才写得回去；直接开文件时只读
  canWrite = await fetch("/api/status").then(r => r.ok).catch(() => false);
  if (!canWrite) {
    const b = document.getElementById("banner");
    b.style.display = "";
    b.innerHTML = "只读模式：没连上本地服务器，派工无法写回。"
      + "跑 <code>python3 pipeline/serve.py</code> 后从 http://localhost:8000/team.html 打开即可派工。";
  }
  const whos = [...new Set(Object.values(ASSIGN).map(a => a.assignee).filter(Boolean))].sort();
  document.getElementById("fwho").innerHTML =
    '<option value="">全部负责人</option>' + whos.map(w => `<option>${esc(w)}</option>`).join("");
  const sts = [...new Set(Object.values(ASSIGN).map(a => a.status).filter(Boolean))].sort();
  document.getElementById("fst").innerHTML =
    '<option value="">全部状态</option><option value="未派">未派</option>' + sts.map(s => `<option>${esc(s)}</option>`).join("");
  draw();
}

function drawTotals() {
  const assigned = ORDERS.filter(o => ASSIGN[o.wid]).length;
  const done = ORDERS.filter(o => ["已交付", "已合并"].includes(ASSIGN[o.wid]?.status)).length;
  const p1 = ORDERS.filter(o => o.pri === "P1").length;
  document.getElementById("tot").innerHTML = [
    ["工单总数", ORDERS.length], ["P1 待办", p1],
    ["已派", assigned], ["未派", ORDERS.length - assigned], ["已交付/合并", done],
  ].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join("");

  document.getElementById("grid").innerHTML = Object.keys(STATS).sort().map(m => {
    const s = STATS[m], n = ORDERS.filter(o => o.mid === m).length;
    const nm = (ORDERS.find(o => o.mid === m) || {}).name || "";
    return `<div class="mod ${modFilter === m ? "on" : ""}" data-m="${m}">
      <h3>${m} ${esc(nm)}</h3>
      <div class="kv"><span>Finding</span><b>${s.findings}</b></div>
      <div class="kv"><span>弹药 / ≥7分</span><b>${s.ammo} / ${s.high}</b></div>
      <div class="kv"><span>消化积压</span><b>${s.backlog}</b></div>
      <div class="kv"><span>工单</span><b>${n}</b></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".mod").forEach(el => el.onclick = () => {
    modFilter = modFilter === el.dataset.m ? "" : el.dataset.m; draw();
  });
}

function draw() {
  drawTotals();
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fp = document.getElementById("fpri").value;
  const fs = document.getElementById("fst").value;
  const fw = document.getElementById("fwho").value;
  const rank = {P1: 0, P2: 1, P3: 2};

  const view = ORDERS.filter(o => {
    const a = ASSIGN[o.wid];
    if (document.getElementById("fscope").value === "assignable"
        && (o.brief || "").startsWith("【这条不派给实习生】")) return false;
    if (modFilter && o.mid !== modFilter) return false;
    if (fp && o.pri !== fp) return false;
    if (fs === "未派" ? a : fs && a?.status !== fs) return false;
    if (fw && a?.assignee !== fw) return false;
    if (q && !(o.wid + o.gap + o.kind + (a?.assignee || "")).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => rank[a.pri] - rank[b.pri] || a.mid.localeCompare(b.mid));

  document.getElementById("cnt").textContent = `${view.length} / ${ORDERS.length} 张`;
  document.getElementById("tb").innerHTML =
    `<tr><th style="width:88px">工单号</th><th style="width:38px">级</th><th style="width:132px">类型</th>
     <th>任务说明</th><th style="width:96px">负责人</th><th style="width:74px">状态</th><th style="width:60px"></th></tr>` +
    view.map(o => {
      const a = ASSIGN[o.wid] || {};
      const internal = (o.brief || "").startsWith("【这条不派给实习生】");
      return `<tr class="${internal ? "internal" : ""}">
        <td class="wid">${o.wid}${internal ? '<div class="badge-int">内部</div>' : ""}</td>
        <td><span class="pri ${o.pri}">${o.pri}</span></td>
        <td>${esc(o.kind)}</td>
        <td>${o.brief
              ? `<div class="brief">${esc(o.brief).replace(/【(.+?)】/g, "<b>【$1】</b>")}</div>`
              : `<div class="gap">${esc(o.gap)}</div>`}
            <details class="raw"><summary>内部口径描述</summary><div class="gap">${esc(o.gap)}</div></details></td>
        <td>${esc(a.assignee || "")}</td>
        <td>${a.status ? `<span class="st st-${esc(a.status)}">${esc(a.status)}</span>` : ""}</td>
        <td><button data-w="${o.wid}">派工</button></td>
      </tr>`;
    }).join("");
  document.querySelectorAll("#tb button").forEach(b => b.onclick = () => openDlg(b.dataset.w));
}

const dlg = document.getElementById("dlg");
let curWid = null;
function openDlg(wid) {
  curWid = wid;
  const o = ORDERS.find(x => x.wid === wid), a = ASSIGN[wid] || {};
  document.getElementById("d-wid").textContent = `${wid}　${o.mid} ${o.name}`;
  document.getElementById("d-gap").innerHTML = o.brief
    ? `<div class="brief">${esc(o.brief).replace(/【(.+?)】/g, "<b>【$1】</b>")}</div>`
    : esc(o.gap);
  document.getElementById("d-who").value = a.assignee || "";
  document.getElementById("d-st").value = a.status || "已派";
  document.getElementById("d-due").value = a.due || "";
  document.getElementById("d-note").value = a.note || "";
  const msg = document.getElementById("d-msg");
  msg.className = "msg"; msg.textContent = canWrite ? "" : "只读模式：保存会失败，请先启动本地服务器。";
  dlg.showModal();
}
document.getElementById("d-cancel").onclick = () => dlg.close();
document.getElementById("d-ok").onclick = async () => {
  const msg = document.getElementById("d-msg");
  const body = {
    workorder_id: curWid,
    assignee: document.getElementById("d-who").value.trim(),
    status: document.getElementById("d-st").value,
    due: document.getElementById("d-due").value.trim(),
    note: document.getElementById("d-note").value.trim(),
  };
  try {
    const r = await fetch("/api/assign", {method: "POST", body: JSON.stringify(body)}).then(r => r.json());
    msg.className = "msg " + (r.ok ? "ok" : "no");
    msg.textContent = r.ok ? r.msg : r.error;
    if (r.ok) { ASSIGN[curWid] = {...(ASSIGN[curWid] || {}), ...body}; draw(); setTimeout(() => dlg.close(), 700); }
  } catch (e) {
    msg.className = "msg no";
    msg.textContent = "写入失败（没连上本地服务器？）：" + e.message;
  }
};
["q", "fpri", "fst", "fwho", "fscope"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(id === "q" ? "input" : "change", draw);
});
load().catch(e => document.getElementById("sub").textContent =
  "加载失败：" + e.message + "（先跑 python3 pipeline/workorder.py 生成队列，再用 python3 -m http.server 或 pipeline/serve.py 打开）");
</script>
</body>
</html>
