<style>
  :root {

    --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --purple: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.6 -apple-system, "PingFang SC", sans-serif; overflow: hidden; }

  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 46px; background: rgba(21,26,35,.9);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center;
    gap: 4px; padding: 0 18px; z-index: 30; }

  .topbar .sp { flex: 1; }
  #c { position: fixed; inset: 0; }
  .hud { position: fixed; left: 18px; bottom: 18px; z-index: 20; background: rgba(21,26,35,.88);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; width: 300px; }
  .hud h1 { font-size: 15px; margin-bottom: 2px; }
  .hud .m { color: var(--muted); font-size: 11.5px; }
  .hud input[type=range] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  .hud .stage { font-size: 11.5px; color: var(--accent); min-height: 18px; margin-top: 2px; }
  .hud button { margin-top: 8px; width: 100%; padding: 7px; border: none; border-radius: 8px;
    background: var(--accent); color: #0b0e14; font: inherit; font-weight: 700; cursor: pointer; }
  .domrow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }

  .dchip:hover { border-color: var(--accent); color: var(--accent); }
  .dchip.on { background: var(--accent); color: #0b0e14; font-weight: 700; border-color: var(--accent); }
  #domainParts { margin-top: 8px; max-height: 30vh; overflow-y: auto; }
  #domainParts .pitem { display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 7px;
    font-size: 12px; cursor: pointer; }
  #domainParts .pitem:hover { background: rgba(96,165,250,.12); color: var(--accent); }
  #domainParts .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  #domainParts .lay { margin-left: auto; font-size: 10px; color: var(--muted); }
  .spark-wrap { margin-top: 6px; }
  .spark-wrap .sname { font-size: 10.5px; color: var(--muted); display: flex; justify-content: space-between; }
  .spark-wrap .sname b { color: var(--text); }
  #dossier { position: fixed; right: 18px; top: 62px; bottom: 18px; width: 340px; z-index: 20;
    background: rgba(21,26,35,.93); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    overflow-y: auto; display: none; }
  #dossier h2 { font-size: 16px; margin-bottom: 2px; }
  #dossier .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 9px; border-radius: 9px; color: #fff; }
  .sec { margin-top: 12px; }
  .sec h3 { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-bottom: 5px; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 14px; padding: 2px 10px;
    font-size: 11.5px; margin: 0 4px 6px 0; color: var(--text); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .kv { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .kv:last-child { border-bottom: none; }
  #tip3d { position: fixed; pointer-events: none; z-index: 40; background: rgba(21,26,35,.95);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: none; }
  .close { float: right; cursor: pointer; color: var(--muted); font-size: 16px; }
</style>

<div class="topbar">

<script type="importmap">{"imports": {"three": "./assets/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./assets/vendor/OrbitControls.js";

const get = async p => (await fetch(p + "?t=" + Date.now())).json();
const [BOM, companies, prices, inds, reg] = await Promise.all([
  get("framework/bom.json"), get("data/companies.json"), get("data/prices.json"),
  get("framework/indicators.json"), get("framework/modules.json")]);
const CN = {}; companies.records.forEach(c => CN[c.company_id] = c.name_cn || c.name);
const INDS = {}; inds.indicators.forEach(i => INDS[i.id] = i);
const MODNAME = {}; reg.modules.forEach(m => MODNAME[m.id] = m.name);
const PART = {}; BOM.parts.forEach(p => PART[p.id] = p);
const SN = { tight: "紧缺", transition: "技术切换中", mature: "成熟", emerging: "新兴" };
const SBADGE = { tight: "#ef4444", transition: "#f59e0b", mature: "#22c55e", emerging: "#a78bfa" };

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 90, 220);
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 600);
camera.position.set(46, 30, 52);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 6, 0);
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
canvas.addEventListener("pointerdown", () => controls.autoRotate = false, { once: true });

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(30, 50, 20); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x88aaff, 0.4); dl2.position.set(-30, 20, -30); scene.add(dl2);
scene.add(new THREE.GridHelper(160, 32, 0x233048, 0x141b29));

const pickables = [];
const decor = [];     // 无档案的装饰网格（LED 灯条等），领域模式下需要一同压暗
const animated = [];  // {obj, home:Vector3, off:Vector3, t0, t1} —— slider 在 [t0,t1] 区间内驱动该位移
function M(color, opt = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.15, ...opt }); }
function box(w, h, d, color, x, y, z, partId, opt = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color, opt));
  m.position.set(x, y, z);
  if (partId) { m.userData.part = partId; pickables.push(m); }
  scene.add(m);
  return m;
}
function cyl(r, h, color, x, y, z, partId) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), M(color));
  m.position.set(x, y, z);
  if (partId) { m.userData.part = partId; pickables.push(m); }
  scene.add(m);
  return m;
}
function explode(obj, dx, dy, dz, t0 = 0, t1 = 1) {
  animated.push({ obj, home: obj.position.clone(), off: new THREE.Vector3(dx, dy, dz), t0, t1 });
}
function label(text, x, y, z, size = 1, color = "#9fb4d8") {
  const cv = document.createElement("canvas"), cx = cv.getContext("2d");
  cx.font = "600 30px -apple-system, PingFang SC";
  cv.width = cx.measureText(text).width + 24; cv.height = 44;
  const c2 = cv.getContext("2d");
  c2.font = "600 29px -apple-system, PingFang SC"; c2.fillStyle = color; c2.textBaseline = "middle";
  c2.fillText(text, 12, 23);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  sp.scale.set(cv.width / 36 * size, cv.height / 36 * size, 1);
  sp.position.set(x, y, z);
  scene.add(sp);
  return sp;
}

/* ─────────── 建筑 ─────────── */
const FW = 36, FD = 24, WH = 9;
box(FW, 0.8, FD, 0x39445a, 0, 0.4, 0, "shell");                     // 底板
const roof = box(FW + 1, 0.7, FD + 1, 0x8fa0b8, 0, WH + 0.35, 0, "shell", { transparent: true, opacity: 0.95 });
explode(roof, 0, 17, 0, 0.02, 0.3);
const wallOpt = { transparent: true, opacity: 0.28, color: 0x9fc2e8, roughness: 0.2, metalness: 0 };
const wN = box(FW, WH, 0.4, 0x9fc2e8, 0, WH / 2 + 0.8, -FD / 2, "shell", wallOpt); explode(wN, 0, 2, -13, 0.08, 0.35);
const wS = box(FW, WH, 0.4, 0x9fc2e8, 0, WH / 2 + 0.8, FD / 2, "shell", wallOpt);  explode(wS, 0, 2, 13, 0.08, 0.35);
const wE = box(0.4, WH, FD, 0x9fc2e8, FW / 2, WH / 2 + 0.8, 0, "shell", wallOpt);  explode(wE, 13, 2, 0, 0.08, 0.35);
const wW = box(0.4, WH, FD, 0x9fc2e8, -FW / 2, WH / 2 + 0.8, 0, "shell", wallOpt); explode(wW, -13, 2, 0, 0.08, 0.35);
label("数据中心 · 拖动滑杆拆解", 0, WH + 4, 0, 1.3, "#cfe0f5");

/* ─────────── 机房内部 ─────────── */
// 机柜列（4 列 × 7 台），最前列中间是"明星机柜"
const rackRows = 4, rackN = 7;
let hero = null;
for (let r = 0; r < rackRows; r++) {
  for (let i = 0; i < rackN; i++) {
    const x = -12 + i * 3.0, z = -7.5 + r * 4.2;
    const isHero = (r === rackRows - 1 && i === 3);
    const rack = box(2.1, 4.6, 1.6, isHero ? 0x2a3950 : 0x1c2431, x, 3.1, z, "rack-frame", { roughness: 0.4 });
    // 正面指示灯条
    const led = box(2.0, 4.3, 0.06, 0x0f172a, x, 3.1, z + 0.84, null, { emissive: 0x22c55e, emissiveIntensity: isHero ? 0.7 : 0.35 });
    decor.push(led);
    // 行间散开
    const rowOff = (r - (rackRows - 1) / 2) * 3.2;
    explode(rack, 0, 0, rowOff, 0.3, 0.55);
    explode(led, 0, 0, rowOff, 0.3, 0.55);
    if (isHero) { hero = { rack, led, x, z, rowOff }; }
  }
}
// 明星机柜：进一步前移 + 抽出服务器
explode(hero.rack, 0, 0, 9, 0.5, 0.68);
explode(hero.led, 0, 0, 9, 0.5, 0.68);
const heroZ = hero.z + hero.rowOff + 9;
const sleds = [];
for (let s = 0; s < 6; s++) {
  const sled = box(1.9, 0.55, 1.45, 0x39445c, hero.x, 1.35 + s * 0.72, hero.z, s === 3 ? null : "server", { roughness: 0.35, metalness: 0.3 });
  explode(sled, 0, 0, hero.rowOff + 9, 0.5, 0.68);                      // 跟随机柜
  explode(sled, 0, s * 1.15, 3 + s * 0.35, 0.68, 0.84);                 // 抽出散开
  sleds.push(sled);
}
// 顶部交换机
const tor = box(1.9, 0.5, 1.45, 0x2563eb, hero.x, 5.05, hero.z, "network-switch", { emissive: 0x2563eb, emissiveIntensity: 0.25 });
explode(tor, 0, 0, hero.rowOff + 9, 0.5, 0.68);
explode(tor, 0, 8.2, 3, 0.68, 0.84);
// 第 4 层服务器再炸成部件（GPU/冷板/HBM/主板/电源）
const heroSled = sleds[3];
const comp = [
  ["coldplate", 0xb87333, "冷板"], ["gpu", 0x16a34a, "GPU/ASIC"], ["hbm", 0xa78bfa, "HBM"],
  ["nic", 0x60a5fa, "NIC/光"], ["psu", 0xf59e0b, "电源"],
];
comp.forEach(([pid, color, nm], k) => {
  const layerMesh = box(1.7, 0.14, 1.3, color, hero.x, 1.35 + 3 * 0.72, hero.z, pid, { emissive: color, emissiveIntensity: 0.25 });
  explode(layerMesh, 0, 0, hero.rowOff + 9, 0.5, 0.68);
  explode(layerMesh, 0, 3 * 1.15, 3 + 3 * 0.35, 0.68, 0.84);
  explode(layerMesh, 2.8, 1.2 + k * 1.05, 1.5, 0.84, 1.0);
  const lb = label(nm, hero.x, 0, hero.z, 0.62, "#dbe6f5");
  lb.visible = false;
  animated.push({ obj: lb, home: new THREE.Vector3(hero.x, 1.35 + 3 * 0.72, hero.z), off: new THREE.Vector3(4.6, 3 * 1.15 + 1.2 + k * 1.05, hero.rowOff + 9 + 3 + 3 * 0.35 + 1.5), t0: 0.84, t1: 1.0, showAfter: 0.86 });
});

// 末端散热：风墙（北墙内侧）+ CDU 排（东侧）
for (let i = 0; i < 5; i++) {
  const fw2 = box(2.6, 3.2, 1.0, 0x8fa3b8, -9 + i * 4.5, 2.4, -FD / 2 + 1.3, "room-cooling");
  explode(fw2, 0, 0, -8, 0.35, 0.55);
}
for (let i = 0; i < 3; i++) {
  const cdu = box(1.8, 3.4, 1.8, 0x2f6db8, FW / 2 - 2.2, 2.5, -5 + i * 5, "cdu", { emissive: 0x2f6db8, emissiveIntensity: 0.2 });
  explode(cdu, 8, 0, 0, 0.35, 0.55);
}
// UPS/配电室（西端）+ 母线
const upsRoom = box(4.5, 4.2, 8, 0x55617a, -FW / 2 + 3, 2.9, 4, "ups");
explode(upsRoom, -9, 0, 0, 0.35, 0.55);
const busway = box(26, 0.35, 0.6, 0xb87333, -1, 6.2, -1.5, "power-dist", { metalness: 0.6, roughness: 0.3 });
explode(busway, 0, 5.5, 0, 0.3, 0.5);
// DCIM 天线（软件层示意）
const dcim = box(1.6, 0.9, 1.2, 0x7c3aed, -FW / 2 + 3, 5.6, 4, "dcim", { emissive: 0x7c3aed, emissiveIntensity: 0.4 });
explode(dcim, -9, 6, 0, 0.35, 0.6);

/* ─────────── 园区（建筑外）─────────── */
// 东侧：变电站（变压器×2）+ 电网塔
for (let i = 0; i < 2; i++) {
  const tx = FW / 2 + 8 + i * 6;
  const t = box(3.4, 3.0, 2.6, 0x9aa7b8, tx, 1.9, -6, "substation", { metalness: 0.35 });
  [ -0.9, 0, 0.9 ].forEach(dx => { const b = cyl(0.16, 1.5, 0xcfd8e3, tx + dx, 4.1, -6, "substation"); explode(b, 5 + i * 2.5, 0, -3, 0.12, 0.4); });
  explode(t, 5 + i * 2.5, 0, -3, 0.12, 0.4);
}
const pylon = cyl(0.25, 9, 0x6e7b8e, FW / 2 + 21, 4.5, -6, "grid");
explode(pylon, 8, 0, -3, 0.12, 0.4);
label("电力 POWER", FW / 2 + 13, 8.5, -6, 1.0, "#f0908a");
// 东南：柴发×3（黄）+ BESS×2（白）
for (let i = 0; i < 3; i++) { const g = box(4.2, 2.4, 1.9, 0xd9a441, FW / 2 + 7 + i * 5, 1.6, 7, "backup-power"); explode(g, 4 + i * 2, 0, 4, 0.15, 0.42); }
for (let i = 0; i < 2; i++) { const b = box(3.4, 2.2, 1.7, 0xe8edf3, FW / 2 + 9 + i * 5, 1.5, 12, "bess"); explode(b, 4 + i * 2, 0, 7, 0.15, 0.42); }
// 燃机（主用电源）：大圆筒
const turbine = cyl(1.5, 7, 0xc4cdd9, FW / 2 + 12, 1.8, 17, "prime-power");
turbine.rotation.z = Math.PI / 2;
explode(turbine, 7, 0, 9, 0.15, 0.42);
// 西侧：冷机×3 + 冷却塔×2 + 干冷器
for (let i = 0; i < 3; i++) {
  const ch = box(3.6, 2.6, 2.4, 0xd4dbe4, -FW / 2 - 8 - i * 5.5, 1.7, -5, "heat-reject");
  const fan = cyl(1.0, 0.4, 0x8898ab, -FW / 2 - 8 - i * 5.5, 3.2, -5, "heat-reject");
  explode(ch, -(4 + i * 2.5), 0, -3, 0.15, 0.42); explode(fan, -(4 + i * 2.5), 0, -3, 0.15, 0.42);
}
for (let i = 0; i < 2; i++) {
  const ct = cyl(1.7, 4.2, 0xbcc7d4, -FW / 2 - 9 - i * 6, 2.5, 6, "heat-reject");
  explode(ct, -(5 + i * 3), 0, 4, 0.15, 0.42);
}
label("散热 COOLING", -FW / 2 - 12, 8, 0, 1.0, "#8fd6a5");
// 南侧：水罐
const wt = cyl(1.4, 3.4, 0x7fb3d8, -8, 2.1, FD / 2 + 7, "water");
explode(wt, 0, 0, 6, 0.15, 0.42);
// 地块外圈示意
const lot = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.4, 4), M(0x39445a));
label("园区 · 土地与电网", 0, 0.6, FD / 2 + 14, 0.85, "#7d8aa3");
box(80, 0.15, 52, 0x121826, 0, 0.05, 0, "land", { roughness: 1 });

/* ─────────── 分解阶段说明 ─────────── */
const STAGES = [
  [0.00, "整机：一座 AI 数据中心"],
  [0.05, "① 掀开屋顶与外墙——看见白空间"],
  [0.30, "② 机电分离：风墙/CDU/UPS/母线各就各位"],
  [0.50, "③ 机柜列拉开，明星机柜出列"],
  [0.68, "④ 抽出服务器与交换机"],
  [0.84, "⑤ 服务器拆到底：冷板/GPU/HBM/NIC/电源"],
];
const stageEl = document.getElementById("stage");
const slider = document.getElementById("explode");
function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function apply() {
  const t = slider.value / 100;
  animated.forEach(a => {
    const k = a.t1 <= a.t0 ? 1 : Math.min(1, Math.max(0, (t - a.t0) / (a.t1 - a.t0)));
    const e = ease(k);
    a.obj.position.set(a.home.x + a.off.x * e, a.home.y + a.off.y * e, a.home.z + a.off.z * e);
    if (a.showAfter !== undefined) a.obj.visible = t >= a.showAfter;
  });
  let s = STAGES[0][1];
  STAGES.forEach(([th, txt]) => { if (t >= th) s = txt; });
  stageEl.textContent = s;
}
slider.addEventListener("input", apply);
apply();
document.getElementById("play").onclick = () => {
  const t0 = performance.now(), from = +slider.value, to = from > 90 ? 0 : 100, dur = 6000;
  (function anim(t) {
    const k = Math.min(1, (t - t0) / dur);
    slider.value = from + (to - from) * k;
    apply();
    if (k < 1) requestAnimationFrame(anim);
  })(t0);
};

/* ─────────── 领域导航：一键飞进想探索的领域 ─────────── */
const PARTMESH = {};
pickables.forEach(m => { (PARTMESH[m.userData.part] ||= []).push(m); });

const DOMAINS = [
  { key: "power",   icon: "⚡", name: "电力",   mods: ["M04", "M09"], t: 45,  cam: [72, 28, 14], tgt: [30, 3, 3] },
  { key: "cooling", icon: "❄️", name: "散热",   mods: ["M08"],        t: 45,  cam: [-70, 26, 10], tgt: [-28, 3, 0] },
  { key: "compute", icon: "🧠", name: "算力",   mods: ["M06"],        t: 100, cam: [13, 11, 40], tgt: [0, 5, 20] },
  { key: "network", icon: "🔗", name: "网络",   mods: ["M07"],        t: 100, cam: [15, 17, 38], tgt: [0, 10, 20] },
  { key: "campus",  icon: "🏗️", name: "园区楼宇", mods: ["M05", "M10"], t: 32, cam: [58, 44, 64], tgt: [0, 4, 0] },
  { key: "dcim",    icon: "🖥️", name: "软件",   mods: ["M13"],        t: 55,  cam: [-42, 20, 26], tgt: [-22, 7, 4] },
];
DOMAINS.forEach(d => d.parts = BOM.parts.filter(p => d.mods.includes(p.module)));

let camAnim = null;
function flyTo(cam, tgt, dur = 1100) {
  controls.autoRotate = false;
  const c0 = camera.position.clone(), t0v = controls.target.clone();
  const c1 = new THREE.Vector3(...cam), t1v = new THREE.Vector3(...tgt);
  const start = performance.now();
  camAnim && cancelAnimationFrame(camAnim.raf);
  camAnim = {};
  (function fly(now) {
    const k = Math.min(1, (now - start) / dur), e = ease(k);
    camera.position.lerpVectors(c0, c1, e);
    controls.target.lerpVectors(t0v, t1v, e);
    if (k < 1) camAnim.raf = requestAnimationFrame(fly); else camAnim = null;
  })(start);
}
canvas.addEventListener("pointerdown", () => { camAnim && cancelAnimationFrame(camAnim.raf); camAnim = null; });

function animSlider(to, dur = 1400) {
  const from = +slider.value, start = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - start) / dur);
    slider.value = from + (to - from) * k;
    apply();
    if (k < 1) requestAnimationFrame(step);
  })(start);
}

let activeDomain = null;
function setDim(mesh, dim) {
  const mat = mesh.material;
  if (!mesh.userData.orig) mesh.userData.orig = { opacity: mat.opacity, transparent: mat.transparent, ei: mat.emissiveIntensity || 0 };
  const o = mesh.userData.orig;
  if (dim) { mat.transparent = true; mat.opacity = Math.min(o.opacity, 0.10); mat.emissiveIntensity = 0; }
  else { mat.transparent = o.transparent; mat.opacity = o.opacity; mat.emissiveIntensity = o.ei; }
}
function clearDomain() {
  activeDomain = null;
  pickables.concat(decor).forEach(m => m.userData.orig && setDim(m, false));
  document.querySelectorAll(".dchip").forEach(el => el.classList.remove("on"));
  document.getElementById("domainParts").innerHTML = "";
}
function enterDomain(d) {
  if (activeDomain === d.key) { clearDomain(); flyTo([46, 30, 52], [0, 6, 0]); return; }
  clearDomain();
  activeDomain = d.key;
  document.getElementById(`dchip-${d.key}`).classList.add("on");
  const ids = new Set(d.parts.map(p => p.id));
  pickables.forEach(m => setDim(m, !ids.has(m.userData.part)));
  decor.forEach(m => setDim(m, !ids.has("rack-frame") && !ids.has("server")));  // LED 随机柜/服务器所属领域
  animSlider(d.t);
  flyTo(d.cam, d.tgt);
  document.getElementById("domainParts").innerHTML = d.parts.map(p =>
    `<div class="pitem" data-part="${p.id}"><span class="dot" style="background:${SBADGE[p.status]}"></span>${esc(p.name)}<span class="lay">${p.layer}</span></div>`).join("");
  document.querySelectorAll("#domainParts .pitem").forEach(el => el.onclick = () => {
    const p = PART[el.dataset.part];
    showDossier(p);
    const meshes = PARTMESH[p.id];
    if (meshes?.length) {
      const wp = new THREE.Vector3(); meshes[0].getWorldPosition(wp);
      flyTo([wp.x + 9, wp.y + 6, wp.z + 9], [wp.x, wp.y, wp.z], 900);
    }
  });
}
const domrow = document.getElementById("domrow");
domrow.innerHTML = DOMAINS.map(d => `<div class="dchip" id="dchip-${d.key}">${d.icon} ${d.name}</div>`).join("");
DOMAINS.forEach(d => document.getElementById(`dchip-${d.key}`).onclick = () => enterDomain(d));
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const i = "123456".indexOf(e.key);
  if (i >= 0) enterDomain(DOMAINS[i]);
  if (e.key === "0" || e.key === "Escape") { clearDomain(); flyTo([46, 30, 52], [0, 6, 0]); }
});

/* ─────────── 交互与档案 ─────────── */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const tip = document.getElementById("tip3d");
let hovered = null;
function pick(e) {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables)[0];
  return hit ? hit.object : null;
}
addEventListener("pointermove", e => {
  const o = pick(e);
  if (hovered && hovered !== o) { hovered.material.emissiveIntensity = hovered.userData._ei || 0; hovered = null; }
  if (o && o.userData.part) {
    if (hovered !== o) { o.userData._ei = o.material.emissiveIntensity || 0; o.material.emissive = o.material.emissive || new THREE.Color(0xffffff); o.material.emissiveIntensity = Math.max(0.5, o.userData._ei + 0.35); hovered = o; }
    const p = PART[o.userData.part];
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 220) + "px";
    tip.style.top = (e.clientY + 12) + "px";
    tip.textContent = p ? `${p.name}（${SN[p.status]}）· 点击看档案` : o.userData.part;
    canvas.style.cursor = "pointer";
  } else { tip.style.display = "none"; canvas.style.cursor = "grab"; }
});
addEventListener("click", e => {
  if (e.target.closest("#dossier") || e.target.closest(".hud") || e.target.closest(".topbar")) return;
  const o = pick(e);
  if (o?.userData.part && PART[o.userData.part]) showDossier(PART[o.userData.part]);
});
function latest(sid) {
  const pts = prices.records.filter(r => r.series_id === sid).sort((a, b) => a.as_of < b.as_of ? 1 : -1);
  return pts[0];
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
function sparkline(sid) {
  const pts = prices.records.filter(r => r.series_id === sid && typeof r.value === "number")
    .sort((a, b) => a.as_of < b.as_of ? -1 : 1);
  if (pts.length < 3) return null;
  const W = 292, H = 56, PX = 3, PY = 6;
  const vs = pts.map(r => r.value);
  const lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const X = i => PX + i / (pts.length - 1) * (W - 2 * PX);
  const Y = v => H - PY - (v - lo) / span * (H - 2 * PY);
  const line = pts.map((r, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(r.value).toFixed(1)}`).join("");
  const last = pts[pts.length - 1];
  const hits = pts.map((r, i) =>
    `<circle cx="${X(i).toFixed(1)}" cy="${Y(r.value).toFixed(1)}" r="9" fill="transparent" data-v="${r.value.toLocaleString()} ${esc(r.unit)}" data-d="${r.as_of}"/>`).join("");
  return `<div class="spark-wrap">
    <div class="sname"><span>${esc(sid)}</span><b>${last.value.toLocaleString()} ${esc(last.unit)}</b></div>
    <svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${X(pts.length - 1).toFixed(1)}" cy="${Y(last.value).toFixed(1)}" r="3" fill="var(--accent)"/>
      ${hits}
    </svg>
    <div class="sname"><span style="font-size:10px">${pts[0].as_of} → ${last.as_of}</span><span style="font-size:10px">区间 ${lo.toLocaleString()}–${hi.toLocaleString()}</span></div>
  </div>`;
}
function showDossier(p) {
  const el = document.getElementById("dossier");
  let rows = [];
  (p.series || []).forEach(sid => {
    const sp = sparkline(sid);
    if (sp) { rows.push(sp); return; }
    const r = latest(sid); if (r) rows.push(`<div class="kv"><span>${sid}</span><b>${r.value.toLocaleString()} ${r.unit}</b></div>`);
  });
  (p.indicators || []).forEach(iid => { const i = INDS[iid]; if (i) rows.push(`<div class="kv"><span>${i.name}</span><b>${i.value != null ? i.value.toLocaleString() + " " + i.unit : "待录入"}</b></div>`); });
  el.innerHTML = `<span class="close" onclick="this.parentElement.style.display='none'">✕</span>
    <h2>${esc(p.name)}</h2>
    <div class="meta">${p.layer} ${BOM.layers.find(l => l.id === p.layer)?.name || ""} ·
      <span class="badge" style="background:${SBADGE[p.status]}">${SN[p.status]}</span></div>
    <div style="font-size:12.5px">${esc(p.desc)}</div>
    <div class="sec"><h3>研究归属</h3><a class="chip" href="report.html#ch-${p.module}">📖 ${p.module} ${MODNAME[p.module] || ""}</a>
      <a class="chip" href="doc.html?f=research/${p.module}.md">原文</a></div>
    ${p.companies?.length ? `<div class="sec"><h3>关联公司</h3>${p.companies.map(c => `<a class="chip" href="company.html?c=${c}">${CN[c] || c}</a>`).join("")}</div>` : ""}
    <div class="sec"><h3>数据与指标</h3>${rows.join("") || '<div style="color:var(--muted);font-size:12px">量化序列待建——下一个采集点</div>'}</div>`;
  el.style.display = "block";
}
// sparkline 悬停读数（事件委托，一次绑定）
const dossierEl = document.getElementById("dossier");
dossierEl.addEventListener("pointermove", e => {
  const c = e.target.closest("circle[data-v]");
  if (c) {
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 200) + "px";
    tip.style.top = (e.clientY + 12) + "px";
    tip.textContent = `${c.dataset.d} ｜ ${c.dataset.v}`;
  } else if (tip.textContent.includes("｜")) tip.style.display = "none";
});
dossierEl.addEventListener("pointerleave", () => { if (tip.textContent.includes("｜")) tip.style.display = "none"; });

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
