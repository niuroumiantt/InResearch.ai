<!DOCTYPE html>
<html lang="zh-CN" data-ui-skin="folk" data-ui-theme="light" data-ui-mode="light">
<head>
<script src="/assets/site-skin.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型选型对比台 — Datacenter Hub</title>
<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font:13.5px/1.6 -apple-system,"PingFang SC",sans-serif}
  .topbar{position:sticky;top:0;background:rgba(21,26,35,.95);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:4px;padding:0 18px;height:46px;z-index:20}
  .topbar b{font-size:15px;margin-right:14px}
  .tab{padding:12px 14px;color:var(--muted);text-decoration:none}
  .tab.on{color:var(--accent);font-weight:600}
  .wrap{max-width:1400px;margin:20px auto;padding:0 16px}
  h1{font-size:22px}
  .sub{color:var(--muted);font-size:12.5px;margin:4px 0 18px}
  .sub code{background:var(--ui-soft);padding:1px 6px;border-radius: var(--ui-radius)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius: var(--ui-radius);overflow:hidden}
  .card canvas{display:block;width:100%;height:230px;background:#0d1119;cursor:grab}
  .meta{padding:10px 14px}
  .meta b{font-size:13.5px}
  .kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
    padding:3px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border:none}
  .kv i{font-style:normal;color:var(--text);font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius: var(--ui-radius);color:#0b0e14}
  .good{background:#22c55e} .mid{background:#f59e0b} .bad{background:#ef4444}
  .empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius: var(--ui-radius)}
</style>
<link rel="stylesheet" href="/assets/site-skin.css">
</head>
<body>
<div class="topbar">
  <b>Datacenter Hub</b>
  <a class="tab" href="index.html">总览</a>
  <a class="tab" href="bom3d.html">爆炸图 3D</a>
  <a class="tab" href="rack3d.html">机柜拆解台</a>
  <a class="tab on" href="compare.html">模型选型</a>
</div>
<div class="wrap">
  <h1>模型选型对比台</h1>
  <div class="sub">把候选 <code>.glb</code> 放进 <code>assets/models/</code>，用
    <code>?f=a.glb,b.glb,c.glb</code> 指定要比的文件（不带参数则比 manifest 里登记的）。
    拖动可旋转；下方数据由页面实时读取模型内部结构。</div>
  <div class="grid" id="grid"><div class="empty">加载中…</div></div>
</div>

<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./assets/vendor/GLTFLoader.js";

const q = new URLSearchParams(location.search);
let files = (q.get("f") || "").split(",").map(s => s.trim()).filter(Boolean);
if (!files.length) {
  try {
    const mf = await (await fetch("assets/models/manifest.json?t=" + Date.now())).json();
    files = (mf.models || []).map(m => m.file);
  } catch (e) { files = []; }
}
const grid = document.getElementById("grid");
if (!files.length) {
  grid.innerHTML = '<div class="empty">没有可比的模型——把 .glb 放进 assets/models/，或用 ?f=文件名 指定</div>';
}
grid.innerHTML = "";

const env = (() => {                       // 简易影棚环境，保证材质有反射
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x39445c })));
  const p = (w, h, x, y, z, c, i, ry = 0, rx = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c }));
    m.material.color.multiplyScalar(i); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); s.add(m);
  };
  p(20, 12, 0, 18, 0, 0xffffff, 5, 0, Math.PI / 2);
  p(20, 10, -18, 6, 0, 0xbfd6ff, 2.5, Math.PI / 2);
  p(20, 10, 18, 5, 0, 0xffe0b8, 2, -Math.PI / 2);
  return s;
})();

const PART = /server|node|sled|tray|blade|door|panel|rail|psu|power|fan|switch|shelf|drive|disk|cover|side|frame|post|unit|module|rack/i;

for (const file of files) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<canvas></canvas><div class="meta"><b></b><div class="rows">读取中…</div></div>`;
  card.querySelector("b").textContent = file;
  grid.appendChild(card);
  const cv = card.querySelector("canvas");

  const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  ren.setPixelRatio(Math.min(devicePixelRatio, 2));
  ren.outputColorSpace = THREE.SRGBColorSpace;
  ren.toneMapping = THREE.ACESFilmicToneMapping;
  ren.toneMappingExposure = 1.05;
  const sc = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(ren);
  sc.environment = pm.fromScene(env, 0.04).texture;
  sc.add(new THREE.HemisphereLight(0x9db4d8, 0x141a26, .8));
  const dl = new THREE.DirectionalLight(0xfff2e0, 1.8); dl.position.set(3, 5, 4); sc.add(dl);
  const cam = new THREE.PerspectiveCamera(34, 1, .01, 200);
  const pivot = new THREE.Group(); sc.add(pivot);

  let rotX = -.3, rotY = .7, spin = true, drag = null;
  cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; spin = false; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if (!drag) return;
    rotY += (e.clientX - drag[0]) * .012;
    rotX = Math.max(-1.3, Math.min(1.3, rotX + (e.clientY - drag[1]) * .012));
    drag = [e.clientX, e.clientY];
  });
  cv.addEventListener("pointerup", () => drag = null);

  new GLTFLoader().load("assets/models/" + file, g => {
    const o = g.scene;
    pivot.add(o);
    let tris = 0, meshes = 0, mats = new Set(), named = [];
    o.traverse(x => {
      if (x.isMesh) {
        meshes++;
        const idx = x.geometry.index;
        tris += (idx ? idx.count : x.geometry.attributes.position.count) / 3;
        (Array.isArray(x.material) ? x.material : [x.material]).forEach(m => mats.add(m.uuid));
      }
      if (PART.test(x.name || "")) named.push(x.name);
    });
    const bb = new THREE.Box3().setFromObject(o), sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
    o.position.sub(c);
    const rad = Math.max(sz.x, sz.y, sz.z) * .5 || 1;
    cam.position.set(0, rad * .35, rad * 2.9); cam.lookAt(0, 0, 0);

    const tear = meshes >= 12 && named.length ? ["good", "优", "可逐件拆"]
      : meshes >= 6 ? ["mid", "中", "能拆几层"] : ["bad", "差", "已合并，只能当外壳"];
    card.querySelector(".rows").innerHTML =
      `<div class="kv"><span>可拆解性</span><i><span class="tag ${tear[0]}">${tear[1]}</span> ${tear[2]}</i></div>
       <div class="kv"><span>网格 / 材质</span><i>${meshes} / ${mats.size}</i></div>
       <div class="kv"><span>三角面</span><i>${Math.round(tris).toLocaleString()}</i></div>
       <div class="kv"><span>尺寸比例 宽×高×深</span><i>${sz.x.toFixed(1)} × ${sz.y.toFixed(1)} × ${sz.z.toFixed(1)}</i></div>
       <div class="kv"><span>部件名</span><i>${named.length ? named.slice(0, 2).join("、").slice(0, 30) : "无"}</i></div>`;
  }, undefined, () => {
    card.querySelector(".rows").innerHTML = '<div class="kv"><span style="color:#ef4444">加载失败——不是有效 GLB？</span></div>';
  });

  function resize() { const w = cv.clientWidth, h = cv.clientHeight; ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  (function loop() {
    requestAnimationFrame(loop);
    if (spin) rotY += .005;
    pivot.rotation.set(rotX, rotY, 0);
    resize(); ren.render(sc, cam);
  })();
}
</script>
</body>
</html>
